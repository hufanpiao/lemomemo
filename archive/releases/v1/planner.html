<title>日程与待办</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* 布局：顶部日期抬头 + 两栏（左日程时间轴，右待办清单），手机上叠成一栏 */
:root{
  --bg:#eef1f4; --paper:#f9fafb; --ink:#1b2430; --muted:#657080; --line:#d6dce3;
  --accent:#2a4fd6; --accent-soft:#e2e8fb; --warn:#b4471f; --warn-soft:#f8e6de; --ok:#2f7d4f;
  --f-display:"Noto Serif SC","Songti SC",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151b; --paper:#181d25; --ink:#e4e8ee; --muted:#8d97a6; --line:#2a313c;
  --accent:#7d9bff; --accent-soft:#1f2a47; --warn:#f08a62; --warn-soft:#3a2219; --ok:#6cc792; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151b; --paper:#181d25; --ink:#e4e8ee; --muted:#8d97a6; --line:#2a313c;
  --accent:#7d9bff; --accent-soft:#1f2a47; --warn:#f08a62; --warn-soft:#3a2219; --ok:#6cc792; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px}
.date-big{display:flex;align-items:baseline;gap:14px}
.date-big .d{font-family:var(--f-display);font-weight:900;font-size:clamp(48px,9vw,76px);line-height:.9;font-variant-numeric:tabular-nums}
.date-big .meta{display:flex;flex-direction:column;gap:2px}
.date-big .ym{font-family:var(--f-mono);font-size:13px;color:var(--muted);letter-spacing:.06em}
.date-big .wk{font-family:var(--f-display);font-weight:600;font-size:20px}
.summary{display:flex;gap:18px;font-size:13px;color:var(--muted)}
.summary b{font-family:var(--f-mono);font-size:20px;color:var(--ink);font-weight:500;display:block;line-height:1.1}
.summary .hot b{color:var(--warn)}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--warn)}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
section{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:20px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2 small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.04em}
form{display:flex;flex-wrap:wrap;gap:8px}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=date],input[type=time]{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-width:0}
input[type=text]{flex:1 1 180px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{background:var(--accent);color:var(--paper);border:0;border-radius:4px;padding:8px 16px;font-weight:500;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
/* 两周日期条 */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:1px solid transparent;background:none;border-radius:4px;padding:6px 0 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.day .w{font-size:11px;color:var(--muted)}
.day .n{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.day .dot{width:5px;height:5px;border-radius:50%;background:transparent}
.day.has .dot{background:var(--accent)}
.day.today .n{color:var(--accent);font-weight:500}
.day.sel{border-color:var(--accent);background:var(--accent-soft)}
.day:hover{background:var(--accent-soft)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13px}
/* 日程列表 */
.agenda{display:flex;flex-direction:column;gap:16px}
.group{display:flex;flex-direction:column;gap:6px}
.group-h{font-size:12px;letter-spacing:.08em;color:var(--muted);display:flex;gap:8px;align-items:center}
.group-h::after{content:"";flex:1;height:1px;background:var(--line)}
.group-h.is-today{color:var(--accent);font-weight:500}
.ev{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:start;padding:6px 0}
.ev .t{font-family:var(--f-mono);font-size:14px;color:var(--accent);font-variant-numeric:tabular-nums;padding-top:1px}
.ev .t.allday{color:var(--muted);font-size:12px;padding-top:3px}
.ev .body{min-width:0}
.ev .title{overflow-wrap:anywhere}
.ev .note{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.ev.past{opacity:.55}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:3px;white-space:nowrap}
.del:hover{color:var(--warn)}
.del.arm{background:var(--warn-soft);color:var(--warn)}
/* 待办 */
.tabs{display:flex;gap:4px;font-size:13px}
.tab{background:none;border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer;color:var(--muted)}
.tab[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.todos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.td{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px dashed var(--line)}
.td:last-child{border-bottom:0}
.td input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.td .body{min-width:0;display:flex;flex-direction:column;gap:2px}
.td .title{overflow-wrap:anywhere}
.td.done .title{text-decoration:line-through;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:0 7px;border-radius:3px;background:var(--bg);color:var(--muted);font-family:var(--f-mono)}
.tag.imp{background:var(--accent-soft);color:var(--accent);font-family:var(--f-body)}
.tag.late{background:var(--warn-soft);color:var(--warn);font-family:var(--f-body)}
.empty{color:var(--muted);font-size:14px;padding:18px 0;text-align:center;border:1px dashed var(--line);border-radius:4px}
.empty strong{display:block;color:var(--ink);font-weight:500;margin-bottom:2px}
footer{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.day,.tab,.del{transition:background .15s,color .15s}}
</style>

<div class="wrap">
  <header>
    <div class="date-big">
      <div class="d" id="hd-day">--</div>
      <div class="meta"><span class="ym" id="hd-ym"></span><span class="wk" id="hd-wk"></span></div>
    </div>
    <div class="summary">
      <div><b id="s-today">0</b>今日日程</div>
      <div><b id="s-open">0</b>未完成待办</div>
      <div class="hot"><b id="s-late">0</b>已逾期</div>
    </div>
  </header>
  <div class="status" id="status">正在连接数据……</div>

  <div class="grid">
    <section aria-labelledby="h-ev">
      <h2 id="h-ev">日程 <small>按日期排列</small></h2>
      <form id="ev-form">
        <input type="text" id="ev-title" placeholder="做什么，例如：和客户开会" required maxlength="120">
        <input type="date" id="ev-date" required aria-label="日期">
        <input type="time" id="ev-time" aria-label="时间（可不填）">
        <input type="text" id="ev-note" placeholder="地点或备注（可不填）" maxlength="200">
        <button class="btn" id="ev-add" type="submit">记下日程</button>
      </form>
      <div class="strip" id="strip" aria-label="未来两周"></div>
      <div class="bar">
        <span id="ev-scope">今天及以后</span>
        <span style="display:flex;gap:14px">
          <button class="linkbtn" id="clear-day" type="button" hidden>看全部</button>
          <label class="chk"><input type="checkbox" id="show-past"> 显示过去的</label>
        </span>
      </div>
      <div class="agenda" id="agenda"></div>
    </section>

    <section aria-labelledby="h-td">
      <h2 id="h-td">待办 <small>勾掉就算完成</small></h2>
      <form id="td-form">
        <input type="text" id="td-title" placeholder="要做的事，例如：交 SignPlex 视频" required maxlength="160">
        <input type="date" id="td-due" aria-label="截止日期（可不填）">
        <label class="chk"><input type="checkbox" id="td-imp"> 重要</label>
        <button class="btn" id="td-add" type="submit">加入待办</button>
      </form>
      <div class="tabs" role="group" aria-label="筛选">
        <button class="tab" type="button" data-f="open" aria-pressed="true">未完成</button>
        <button class="tab" type="button" data-f="done" aria-pressed="false">已完成</button>
        <button class="tab" type="button" data-f="all" aria-pressed="false">全部</button>
      </div>
      <ul class="todos" id="todos"></ul>
    </section>
  </div>
  <footer>也可以直接跟 Claude 说“帮我记一下……”，会出现在这里。</footer>
</div>

<script>
(function(){
  const WK = ["周日","周一","周二","周三","周四","周五","周六"];
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,"0");
  const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
  const today = () => ymd(new Date());

  let events = [], todos = [], db = null;
  let selDay = null, showPast = false, filter = "open";

  // 头部
  function renderHead(){
    const n = new Date();
    $("hd-day").textContent = n.getDate();
    $("hd-ym").textContent = n.getFullYear()+" / "+pad(n.getMonth()+1);
    $("hd-wk").textContent = WK[n.getDay()];
    const t = today();
    $("s-today").textContent = events.filter(e => e.date === t).length;
    const open = todos.filter(x => !x.done);
    $("s-open").textContent = open.length;
    $("s-late").textContent = open.filter(x => x.due && x.due < t).length;
  }

  function relLabel(ds){
    const diff = Math.round((parse(ds) - parse(today()))/86400000);
    const base = (parse(ds).getMonth()+1)+"月"+parse(ds).getDate()+"日 "+WK[parse(ds).getDay()];
    if (diff === 0) return "今天 · "+base;
    if (diff === 1) return "明天 · "+base;
    if (diff === 2) return "后天 · "+base;
    if (diff === -1) return "昨天 · "+base;
    return base;
  }

  function renderStrip(){
    const s = $("strip"); s.textContent = "";
    const has = new Set(events.map(e => e.date));
    const start = parse(today()); start.setDate(start.getDate() - ((start.getDay()+6)%7)); // 本周一
    for (let i=0;i<14;i++){
      const d = new Date(start); d.setDate(start.getDate()+i);
      const k = ymd(d);
      const b = document.createElement("button");
      b.type = "button"; b.className = "day";
      if (has.has(k)) b.classList.add("has");
      if (k === today()) b.classList.add("today");
      if (k === selDay) b.classList.add("sel");
      b.setAttribute("aria-label", relLabel(k));
      b.innerHTML = '<span class="w"></span><span class="n"></span><span class="dot"></span>';
      b.querySelector(".w").textContent = WK[d.getDay()].slice(1);
      b.querySelector(".n").textContent = d.getDate();
      b.onclick = () => { selDay = selDay === k ? null : k; if (selDay) $("ev-date").value = selDay; renderEvents(); };
      s.appendChild(b);
    }
  }

  function armDelete(btn, fn){
    if (btn.classList.contains("arm")) { fn(); return; }
    btn.classList.add("arm"); btn.textContent = "确认删除";
    setTimeout(() => { btn.classList.remove("arm"); btn.textContent = "删除"; }, 3000);
  }

  function renderEvents(){
    renderStrip(); renderHead();
    const t = today();
    $("clear-day").hidden = !selDay;
    $("ev-scope").textContent = selDay ? relLabel(selDay) : (showPast ? "全部日程" : "今天及以后");
    let list = events.slice();
    if (selDay) list = list.filter(e => e.date === selDay);
    else if (!showPast) list = list.filter(e => e.date >= t);
    list.sort((a,b) => (a.date+(a.time||"00:00")).localeCompare(b.date+(b.time||"00:00")));
    const box = $("agenda"); box.textContent = "";
    if (!list.length){
      box.innerHTML = '<div class="empty"><strong></strong></div>';
      box.querySelector("strong").textContent = selDay ? "这一天还没有安排" : "还没有日程";
      box.firstChild.append("在上面填写事情和日期，点“记下日程”。");
      return;
    }
    let cur = null, grp = null;
    const nowHM = pad(new Date().getHours())+":"+pad(new Date().getMinutes());
    for (const e of list){
      if (e.date !== cur){
        cur = e.date; grp = document.createElement("div"); grp.className = "group";
        const h = document.createElement("div"); h.className = "group-h" + (cur === t ? " is-today" : "");
        h.textContent = relLabel(cur); grp.appendChild(h); box.appendChild(grp);
      }
      const row = document.createElement("div"); row.className = "ev";
      if (e.date < t || (e.date === t && e.time && e.time < nowHM)) row.classList.add("past");
      row.innerHTML = '<div class="t"></div><div class="body"><div class="title"></div></div><button class="del" type="button">删除</button>';
      const tt = row.querySelector(".t");
      if (e.time) tt.textContent = e.time; else { tt.textContent = "全天"; tt.classList.add("allday"); }
      row.querySelector(".title").textContent = e.title;
      if (e.note){ const n = document.createElement("div"); n.className = "note"; n.textContent = e.note; row.querySelector(".body").appendChild(n); }
      const del = row.querySelector(".del");
      del.onclick = () => armDelete(del, () => write(db.collection("events").doc(e.id).delete()));
      grp.appendChild(row);
    }
  }

  function renderTodos(){
    renderHead();
    const t = today();
    let list = todos.slice();
    if (filter === "open") list = list.filter(x => !x.done);
    if (filter === "done") list = list.filter(x => x.done);
    list.sort((a,b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (a.done) return (b.doneAt||0) - (a.doneAt||0);
      if (!!a.important !== !!b.important) return a.important ? -1 : 1;
      const da = a.due || "9999", dbb = b.due || "9999";
      return da === dbb ? (a.createdAt||0) - (b.createdAt||0) : da.localeCompare(dbb);
    });
    const ul = $("todos"); ul.textContent = "";
    if (!list.length){
      const li = document.createElement("li"); li.className = "empty";
      li.innerHTML = "<strong></strong>";
      li.querySelector("strong").textContent = filter === "done" ? "还没有完成的事" : "没有待办";
      li.append(filter === "done" ? "勾掉的待办会出现在这里。" : "在上面写下要做的事，点“加入待办”。");
      ul.appendChild(li); return;
    }
    for (const x of list){
      const li = document.createElement("li"); li.className = "td" + (x.done ? " done" : "");
      li.innerHTML = '<input type="checkbox"><div class="body"><span class="title"></span><span class="tags"></span></div><button class="del" type="button">删除</button>';
      const cb = li.querySelector("input"); cb.checked = !!x.done; cb.id = "td-"+x.id;
      cb.setAttribute("aria-label", "完成：" + x.title);
      cb.onchange = () => write(db.collection("todos").doc(x.id).update({done: cb.checked, doneAt: cb.checked ? Date.now() : 0}));
      li.querySelector(".title").textContent = x.title;
      const tags = li.querySelector(".tags");
      const tag = (cls, txt) => { const s = document.createElement("span"); s.className = "tag " + cls; s.textContent = txt; tags.appendChild(s); };
      if (x.important) tag("imp","重要");
      if (x.due){
        if (!x.done && x.due < t) tag("late","逾期 · " + x.due.slice(5).replace("-","/"));
        else tag("", (x.due === t ? "今天截止" : "截止 " + x.due.slice(5).replace("-","/")));
      }
      const del = li.querySelector(".del");
      del.onclick = () => armDelete(del, () => write(db.collection("todos").doc(x.id).delete()));
      ul.appendChild(li);
    }
  }

  function setStatus(msg, err){ const s = $("status"); s.textContent = msg; s.classList.toggle("err", !!err); s.hidden = !msg; }
  async function write(p){
    try { await p; setStatus(""); }
    catch(e){ setStatus(e && e.code === "invalid_argument" ? "你没有修改权限，只能查看。" : "没保存上，请稍后再试。", true); }
  }

  // 表单
  $("ev-date").value = today();
  $("ev-form").addEventListener("submit", async ev => {
    ev.preventDefault(); if (!db) return;
    const title = $("ev-title").value.trim(); const date = $("ev-date").value;
    if (!title || !date) return;
    $("ev-add").disabled = true;
    await write(db.collection("events").add({title, date, time: $("ev-time").value || "", note: $("ev-note").value.trim(), createdAt: Date.now()}));
    $("ev-add").disabled = false;
    $("ev-title").value = ""; $("ev-time").value = ""; $("ev-note").value = ""; $("ev-title").focus();
  });
  $("td-form").addEventListener("submit", async ev => {
    ev.preventDefault(); if (!db) return;
    const title = $("td-title").value.trim(); if (!title) return;
    $("td-add").disabled = true;
    await write(db.collection("todos").add({title, done:false, due: $("td-due").value || "", important: $("td-imp").checked, createdAt: Date.now(), doneAt: 0}));
    $("td-add").disabled = false;
    $("td-title").value = ""; $("td-due").value = ""; $("td-imp").checked = false; $("td-title").focus();
  });
  $("show-past").onchange = e => { showPast = e.target.checked; renderEvents(); };
  $("clear-day").onclick = () => { selDay = null; renderEvents(); };
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
    filter = b.dataset.f;
    document.querySelectorAll(".tab").forEach(o => o.setAttribute("aria-pressed", o === b ? "true" : "false"));
    renderTodos();
  });

  renderEvents(); renderTodos();
  ["ev-add","td-add"].forEach(id => $(id).disabled = true);

  // 数据
  (async () => {
    db = window.claude && window.claude.use ? await window.claude.use("db") : null;
    if (!db){ setStatus("数据未连接：请在 claude.ai 登录后打开此页面。", true); return; }
    setStatus("");
    ["ev-add","td-add"].forEach(id => $(id).disabled = false);
    const snapErr = () => setStatus("数据连接断开了，刷新页面即可恢复。", true);
    db.collection("events").onSnapshot(s => { events = s.docs.map(d => ({id:d.id, ...d.data()})); renderEvents(); }, snapErr);
    db.collection("todos").onSnapshot(s => { todos = s.docs.map(d => ({id:d.id, ...d.data()})); renderTodos(); }, snapErr);
  })();

  // 跨天时刷新“今天”
  let lastDay = today();
  setInterval(() => { if (today() !== lastDay){ lastDay = today(); renderEvents(); renderTodos(); } }, 60000);
})();
</script>
