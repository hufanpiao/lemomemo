# ci：PR、合进 main 时跑的重检查（架构 8.3 “ci.yml” 一行）
#   db 任务：要 Docker 的数据库测试单列一个任务（本地 Supabase：db reset、类型比对、D1 正例、D1 反例和违规样例、RLS、deno test、旧版契约、兼容样例 --sample）
#            本地 Supabase 的配置用标准位置的 supabase/config.toml（后端维护），本文件不另写配置、不传 --workdir
#            同一个任务里起 S3 替身代替 R2（架构 0.32、8.6：node build/objstore.mjs up，LocalStack 按 digest 锁），
#            并真的打它：objstore 的 Vitest 严格模式、seed.mjs、Deno 下同一组（缺环境就失败，不许悄悄跳过）
#   e2e 任务：Playwright（chromium + webkit，wrangler pages dev 带 _headers 的 CSP 和 Pages Functions）
# 不碰任何部署密钥：本文件不引用 secrets。本地 Supabase 的 anon / service key 是 CLI 每次随机生成的测试值，只在 runner 里。
# 预览环境的 E2E（要预览项目的 service key）不在这里，架构 0.30 定为 push 到 main 时在 deploy-preview 之后跑，等前端 B 牵头联调时接上（环境清单第七节第 2 条）。
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 每周一首尔 06:47 跑一遍，确认 main 上的数据库测试没被外部变化（镜像、CLI）弄坏
    - cron: '47 21 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.12'
  FORCE_COLOR: '0'

jobs:
  db:
    name: 数据库测试（Docker：本地 Supabase）
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      # S3 替身（build/objstore.mjs、docker-compose.objstore.yml）：固定的本机测试值，不是密钥；R2 的真地址和令牌只在预览、正式（环境清单第四节）
      OBJSTORE_ENDPOINT: http://127.0.0.1:4566
      OBJSTORE_ACCESS_KEY_ID: test
      OBJSTORE_SECRET_ACCESS_KEY: test
      R2_ENDPOINT: http://127.0.0.1:4566
      R2_BUCKET_PREFIX: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 旧版契约测试要找 compat-baseline 和发布 tag
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # 和本机同一版（架构 8.6：Deno 锁具体版本，本机和 CI 一致；本机 deno --version 为 2.9.8）
          deno-version: 2.9.8

      - name: 安装依赖（不跑任何安装脚本）
        run: |
          npm ci --ignore-scripts
          bash build/ci/rebuild-allowlist.sh

      - name: 安装 Supabase CLI（版本和 SHA-256 见 tools/ci-tools.lock）
        run: bash build/ci/install-tool.sh supabase

      - name: 本地 Supabase 的配置在标准位置（supabase/config.toml，后端维护）
        run: |
          if [ ! -f supabase/config.toml ]; then
            echo "::error::没有 supabase/config.toml：supabase start 要用它（后端维护，标准位置就是这里）"
            exit 1
          fi

      - name: 启动本地 Supabase
        # studio 用不到，不起
        run: supabase start -x studio

      - name: 起 S3 替身（代替 R2：LocalStack 按 digest 锁定，建 4 个桶，验 SigV4 path-style、If-None-Match 412、ListObjectsV2、DeleteObjects）
        # 架构 8.6、0.32 第 4 条；镜像和 digest 见 tools/ci-tools.lock（localstack / oci），docker-compose.objstore.yml 不一致就失败
        # 地址和测试凭据在本任务的 env（OBJSTORE_*、R2_ENDPOINT、R2_BUCKET_PREFIX），都不是密钥。
        # 现在打它的：下面两步（objstore.test.ts 的真替身组走 shared/objstore.ts、seed.mjs 两遍再计数）和 deno task test 里同一组；
        # files-get、objstore-cases、purge-runner 三组 0.33 起改为 skipIf（有替身变量就必须真跑），已加进下面的严格模式；TC-B0-116、117 挪到 B4b-1、B1（B0 QA D-03）
        run: node build/objstore.mjs up

      - name: 打 S3 替身的变量都在（缺了就失败，不许让下面的测试悄悄跳过）
        run: |
          for v in OBJSTORE_ENDPOINT OBJSTORE_ACCESS_KEY_ID OBJSTORE_SECRET_ACCESS_KEY R2_ENDPOINT; do
            if [ -z "${!v}" ]; then echo "::error::$v 是空的：本任务的 env 里要有它"; exit 1; fi
          done

      - name: objstore 打真的 S3 替身（Vitest 严格模式：shared/objstore.ts 对 LocalStack；跳过、占位、没跑到都算失败；B0 代码审查中 2、QA D-04）
        run: >-
          node build/ci/vitest_strict.mjs
          --must '条件写回 exists'
          --must '四个 R2 桶：生成的 count 探针数得对'
          --must '注销 runner：探针打真的 S3 替身'
          --must 'files 打真的 S3 替身'
          --allow-todo 'TC-B0-116 整条链路'
          --allow-todo 'TC-B0-117 整条链路'
          -- tests/shared/objstore.test.ts tests/data-manifest/objstore-cases.test.ts
          tests/data-manifest/purge-runner.test.ts tests/functions/files-get.test.ts

      - name: seed.mjs 往替身放 A、B 的测试对象，跑两遍（第二遍全部“已存在”），再 --check 计数（实测清单 L19）
        # 凭据是替身的固定测试值（seed.mjs 故意不用 R2_FN_* 这个名字，那是九个规定函数专用的）
        env:
          OBJSTORE_TEST_KEY_ID: test
          OBJSTORE_TEST_SECRET: test
        run: |
          first="$(node supabase/tests/objstore/seed.mjs)"; echo "$first"
          second="$(node supabase/tests/objstore/seed.mjs)"; echo "$second"
          n="$(sed -nE 's/^seed：写入 ([0-9]+) 个，已存在 0 个.*/\1/p' <<<"$first")"
          if [ -z "$n" ] || [ "$n" -eq 0 ]; then echo "::error::第一遍应该全部写入、已存在 0 个"; exit 1; fi
          if ! grep -qE "^seed：写入 0 个，已存在 $n 个" <<<"$second"; then echo "::error::第二遍应该写入 0 个、已存在 $n 个（条件写不覆盖）"; exit 1; fi
          counts="$(node supabase/tests/objstore/seed.mjs --check)"; echo "$counts"
          if [ "$(grep -cE '：A [1-9][0-9]* 个，B [1-9][0-9]* 个$' <<<"$counts")" -ne 4 ]; then
            echo "::error::--check 应该列出四个桶，每个桶 A、B 都至少 1 个"; exit 1
          fi

      - name: 从头建库（全部迁移 + seed.sql）
        run: supabase db reset

      - name: 邮箱验证码登录探针（邮箱登录开、禁止注册、6 位码、60 秒限频、600 秒有效、JWT 带 session_id；QA 第二轮 D-14、实测清单 L14）
        # 只打本机 Supabase，用 supabase status 的本地演示值，不用任何 secret；每跑一次发 3 封信到本地 Mailpit
        run: node supabase/tests/auth/login-probe.mjs

      - name: 重新生成 shared/db.types.ts 并和仓库比对（架构 2.5）
        run: |
          supabase gen types typescript --local > "$RUNNER_TEMP/db.types.ts"
          if ! diff -u shared/db.types.ts "$RUNNER_TEMP/db.types.ts"; then
            echo "::error::shared/db.types.ts 和迁移对不上：本机跑 supabase gen types typescript --local 重新生成后提交"
            exit 1
          fi

      - name: RLS（pgTAP，supabase test db supabase/tests/rls）和 D1（deno task d1）；后端
        # B0 集成：test:db = supabase test db supabase/tests/rls && deno task d1；D1 比对不过不能合并
        # 这一步只是正例（库和清单一致）；反例、违规样例在下一步打同一个真库，兼容样例在本任务最后
        run: npm run test:db

      - name: D1 反例和违规样例（真库：清单少登记一张表、supabase/tests/d1-fixtures/*.psql 逐个在事务里改一处，都必须报错，跑完回滚）
        # 和 unit.yml 的 test:db:offline（PGlite）是同一套样例、同一个 runD1；这里证明在真 Supabase 上也拦得住
        # 连接串只取 supabase status 的 DB_URL（CLI 本次的本地值），不读 SUPABASE_DB_URL
        run: |
          eval "$(supabase status -o env | grep -E '^DB_URL=')"
          D1_DB_URL="$DB_URL" node build/ci/d1_negative.mjs

      - name: shared 在 Deno 下再跑一遍（deno task test），服务器函数和 D1 入口过 deno check（deno task check）
        # deno.json 用 nodeModulesDir=manual，npm 包取 npm ci 装好的 node_modules（测试一侧版本由 package-lock.json 锁定；函数源码另由 supabase/functions/deno.lock 核对，见下一步）
        # deno task test 的权限按最小给：只读仓库、只读五个替身变量、只连 127.0.0.1:4566（B0 代码审查中 2）；
        # 本任务设了替身变量，objstore.test.ts 的真替身组必须真跑并通过，有用例报 ignored（跳过）或没跑到就失败
        # 垫片把 describe.skipIf / it.skip 登记成 Deno.test({ ignore: true })，Deno 报告里逐条显示“... ignored”、汇总行“N ignored”（B1 接手清单 C1）
        env:
          NO_COLOR: '1'
        # 显式写 shell: bash，GitHub 就用 bash --noprofile --norc -eo pipefail：deno 失败不会被 tee 的退出码吞掉（B1 代码审查）
        shell: bash
        run: |
          # GitHub 上 NO_COLOR 不一定管用（第一次 CI 实测 “... ok” 中间夹着颜色码），先去掉颜色码再查
          deno task test 2>&1 | tee "$RUNNER_TEMP/deno-test.raw.log"
          sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/deno-test.raw.log" > "$RUNNER_TEMP/deno-test.log"
          if grep -qE ' \.\.\. ignored|\| [1-9][0-9]* ignored' "$RUNNER_TEMP/deno-test.log"; then
            echo '::error::Deno 下有用例报 ignored（跳过：缺环境或缺权限），CI 里不许'; exit 1
          fi
          if ! grep -qE '条件写回 exists.* \.\.\. ok' "$RUNNER_TEMP/deno-test.log"; then
            echo "::error::Deno 下 objstore 打真替身的那一组没跑或没通过"; exit 1
          fi
          # 函数 import 的 _shared/gen/ 不进仓库（.gitignore），deno check 前先生成（_shared/objstore.ts 等引 _shared/gen/）
          npm run copy:shared
          deno task check

      - name: 服务器函数的依赖锁（supabase/functions 下 deno install --frozen，含 _shared/gen/ 在内的全部源码作入口）
        # 架构 0.33 第 7 条、B0 安全审查低 10。必须在上一步 copy:shared 之后：gen/ 不进仓库，先生成才扫得到。
        # 第一行核 deno.json 和 deno.lock；第二行把每个源码文件当入口解析整张依赖图：源码里有锁外的 npm 包、不带版本的 npm:、
        # jsr: / https: 远程模块（含模板字符串的动态 import），锁都要变，--frozen 就失败（B1 S8 代码审查实测）。
        # 变量拼出来的动态 import Deno 看不见：gen/ 由 copy_shared 拦，其余源码由 check_backend F7 和 tests/build/deno-config.test.ts 拦。
        # --no-check：类型检查由上一步 deno task check 管（用根目录 deno.json 的严格设置）。
        # 只装进 Deno 全局缓存，不建 node_modules；Deno 默认不跑 npm 的安装脚本。
        # 这里只证明“仓库里的源码和锁对得上”；部署（functions deploy --use-api）读不读这份锁待第一次预览部署函数时实测（接手清单 P-deno-lock）
        working-directory: supabase/functions
        shell: bash
        run: |
          deno install --frozen
          mapfile -t entries < <(find . -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.mts' -o -name '*.cts' -o -name '*.js' -o -name '*.jsx' -o -name '*.mjs' -o -name '*.cjs' \) -not -path '*/node_modules/*' | sort)
          if [ "${#entries[@]}" -eq 0 ]; then echo "::error::supabase/functions 下一个源码文件都没有（copy:shared 没跑？）"; exit 1; fi
          if ! find _shared/gen -name '*.ts' 2>/dev/null | grep -q .; then echo "::error::_shared/gen/ 是空的：先跑 npm run copy:shared"; exit 1; fi
          deno install --frozen --no-check --entrypoint "${entries[@]}"

      - name: 找旧版契约测试的基线
        id: compat
        run: python -I build/compat_baseline.py resolve

      - name: 取出基线的 tests/compat/
        if: steps.compat.outputs.ref != ''
        env:
          BASE_REF: ${{ steps.compat.outputs.ref }}
        run: python -I build/compat_baseline.py extract "$BASE_REF" "$RUNNER_TEMP/compat-base"

      - name: 旧版契约测试（上线前只报告、不拦；有 4.x 发布 tag 后必须通过）
        if: steps.compat.outputs.ref != ''
        # strict 为 false 时这一步失败只标黄，不让整个任务失败（0.28 第 4 点、TC-B0-57）
        continue-on-error: ${{ steps.compat.outputs.strict != 'true' }}
        # 契约用例要本地 Supabase 的 API_URL、ANON_KEY（.test.ts 用例）和 DB_URL（.sql 用例）：只取这三项，都是 CLI 本次随机生成的本地值
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|DB_URL)=')"
          export API_URL ANON_KEY DB_URL
          npm run test:compat -- "$RUNNER_TEMP/compat-base/tests/compat"

      - name: 兼容样例（test:compat --sample，TC-B0-57：每个样例先重新建库再叠上去，旧版契约的结果必须和样例头上的 expect-old-client 一致）
        # 样例会改库，所以放在最后，每个样例前 db reset；契约用当前分支的 tests/compat（验证“契约测试拦得住破坏性改动”这个机制，
        # 和 unit.yml 离线版第 4 段同一套样例；离线版只跑 SQL 用例，这里 .test.ts 用例也打真 API）。不受基线和 strict 影响，必须通过
        run: |
          shopt -s nullglob
          n=0
          for f in supabase/tests/compat/*.psql; do
            case "$(basename "$f")" in _*) continue ;; esac
            n=$((n + 1))
            echo "::group::$f"
            supabase db reset
            eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|DB_URL)=')"
            export API_URL ANON_KEY DB_URL
            npm run test:compat -- tests/compat --sample "$f"
            echo "::endgroup::"
          done
          if [ "$n" -eq 0 ]; then
            echo "::error::supabase/tests/compat/ 里没有兼容样例"
            exit 1
          fi

      - name: 停掉本地 Supabase
        if: always()
        run: supabase stop --no-backup || true

      - name: 停掉 S3 替身
        if: always()
        run: node build/objstore.mjs down || true

  e2e:
    name: 端到端（Playwright，带 CSP）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖（不跑任何安装脚本）
        run: |
          npm ci --ignore-scripts
          bash build/ci/rebuild-allowlist.sh

      - name: 安装浏览器（chromium、webkit）
        run: npx --no-install playwright install --with-deps chromium webkit

      # 不单独构建：playwright.config.ts 的 webServer 自己先 npm run build -- --mode e2e 再起 wrangler pages dev（CI 下不复用已有服务），
      # 这里再构建一次 preview 模式会被覆盖掉，白花时间
      - name: Playwright（e2e 模式构建 + wrangler pages dev dist/web，控制台出现 CSP 报错就算失败）
        run: npm run e2e

      - name: 失败时上传报告（只有本地测试数据，不含任何密钥）
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
