# deploy-preview：main 每次更新（架构 8.3 分支模型：只有 main，没有 develop），部署到预览环境 preview.lemomemo.com（架构 8.3 “deploy-preview.yml” 一行，R-206）
#
# 两个任务，密钥只在第二个：
#   build：拿不到任何密钥（不引用 secrets），npm ci --ignore-scripts → 构建 → 复制 shared 到函数目录 → 打包 Pages Functions 成 _worker.js → 上传产物
#   deploy：只下载产物、不装项目依赖、不跑项目脚本；用 tools/ci-tools.lock 锁定的 Supabase CLI
#           和 tools/deploy/package-lock.json 锁定的 wrangler → 预览项目暂停就恢复 → db push → functions deploy → pages deploy → 核对线上版本
#
# GitHub 免费版私有仓库没有 Environments（环境密钥、审批人、分支限制都用不了，已查官方文档），
# 所以预览的令牌放在 repository secrets（R-206）。它们对本仓库所有分支的工作流都可见：
#   - Supabase 令牌必须是“只管预览项目”的项目级令牌（2026-10-06 起 Supabase 可以发，环境清单第四节）；
#   - Cloudflare 令牌只给 “Cloudflare Pages: Edit”（能发到正式 Pages 项目，R-110 已接受）。
# 正式环境的令牌不放 GitHub：正式发布由负责人本机运行 tools/release/publish.ps1（R-206）。
#
# 本文件只写 secret 和 variable 的名字，值由负责人在 GitHub 网页上填（负责人B0网页操作清单）。
#   secrets：PREVIEW_SUPABASE_ACCESS_TOKEN、PREVIEW_SUPABASE_DB_PASSWORD、PREVIEW_CLOUDFLARE_API_TOKEN
#   variables（公开值）：PREVIEW_SUPABASE_PROJECT_REF、PREVIEW_PAGES_PROJECT、PREVIEW_SITE_ORIGIN、CLOUDFLARE_ACCOUNT_ID、
#                        PREVIEW_SUPABASE_ANON_KEY、PREVIEW_VAPID_PUBLIC_KEY、PREVIEW_TURNSTILE_SITE_KEY、
#                        PREVIEW_R2_READY（架构 0.32：R2 开通并写好令牌后设成 true，打开“R2 配置核对”一步）
# R2（照片和附件，架构 0.32）不加任何 GitHub secret：/files 用的令牌和 FILES_URL_SECRET 在 Cloudflare Pages 项目的加密变量里，
# 服务器函数用的在 Supabase secrets 里，都由负责人运行 tools/keys/set-r2-tokens.ps1 写入；本文件只核对 Pages 那边的名字。
# 预览 E2E 经 preview.lemomemo.com/files 跑（任务单 O-4、第五节第 9 项）等前端 B 牵头联调时接在 deploy 后面（环境清单第七节第 2 条）。
name: deploy-preview

on:
  push:
    branches: [main]
  # 手动重跑用；只有选 main 时才部署（见 deploy 任务的 if）
  workflow_dispatch:

permissions: {}

# 同一时间只部署一次；后来的排队，不打断正在进行的 db push
concurrency:
  group: deploy-preview
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  FORCE_COLOR: '0'

jobs:
  build:
    name: 构建（无密钥）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 版本号（架构 8.5：预览版写成 X.Y.Z-preview.<运行号>）
        id: ver
        run: |
          base="$(tr -d ' \r\n' < VERSION)"
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION 文件的内容不是 X.Y.Z：$base"
            exit 1
          fi
          echo "version=$base-preview.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: 安装依赖（不跑任何安装脚本）
        run: |
          npm ci --ignore-scripts
          bash build/ci/rebuild-allowlist.sh

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # 和 ci.yml、本机同一版（架构 8.6）
          deno-version: 2.9.8

      - name: 构建（preview 模式）
        env:
          # 只有 VITE_PUBLIC_ 前缀进前端（架构 8.1、A14）；这几个都是公开值，放在 repository variables
          VITE_PUBLIC_ENV: preview
          VITE_PUBLIC_SUPABASE_URL: ${{ vars.PREVIEW_SITE_ORIGIN }}/sb
          VITE_PUBLIC_ANON_KEY: ${{ vars.PREVIEW_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_VAPID_KEY: ${{ vars.PREVIEW_VAPID_PUBLIC_KEY }}
          VITE_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PREVIEW_TURNSTILE_SITE_KEY }}
          # 带 -preview.N 的完整版本号；vite.config 和 app/version.json 都读它（build/assemble_web.mjs 的 buildVersion，B0 集成确认）
          LEMO_BUILD_VERSION: ${{ steps.ver.outputs.version }}
        run: npm run build -- --mode preview

      - name: 复制 shared 给服务器函数（架构 2.5）
        # B0 集成：改用 build/copy_shared.mjs —— 'zod' 改写成 npm:zod@<版本>（函数部署时没有 import map），相对 import 必须带 .ts
        run: npm run copy:shared

      - name: 服务器函数的依赖锁（supabase/functions 下 deno install --frozen，含 _shared/gen/ 在内的全部源码作入口）
        # 架构 0.33 第 7 条、B0 安全审查低 10。必须在上一步 copy:shared 之后：gen/ 不进仓库，先生成才扫得到；锁对不上就不出产物。
        # 第一行核 deno.json 和 deno.lock；第二行把每个源码文件当入口解析整张依赖图：源码里有锁外的 npm 包、不带版本的 npm:、
        # jsr: / https: 远程模块（含模板字符串的动态 import），锁都要变，--frozen 就失败（B1 S8 代码审查实测）。
        # 变量拼出来的动态 import Deno 看不见：gen/ 由上一步 copy_shared 拦，其余源码由下面一步的 check_backend F7 和 unit 的 tests/build/deno-config.test.ts 拦。
        # --no-check：类型检查在 ci.yml 的 deno task check 里做。
        # 只装进 Deno 全局缓存，不建 node_modules；Deno 默认不跑 npm 的安装脚本。
        # 这里只证明“仓库里的源码和锁对得上”；部署（functions deploy --use-api）读不读这份锁待第一次预览部署函数时实测（接手清单 P-deno-lock）
        working-directory: supabase/functions
        shell: bash
        run: |
          deno install --frozen
          mapfile -t entries < <(find . -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.mts' -o -name '*.cts' -o -name '*.js' -o -name '*.jsx' -o -name '*.mjs' -o -name '*.cjs' \) -not -path '*/node_modules/*' | sort)
          if [ "${#entries[@]}" -eq 0 ]; then echo "::error::supabase/functions 下一个源码文件都没有（copy:shared 没跑？）"; exit 1; fi
          if ! find _shared/gen -name '*.ts' 2>/dev/null | grep -q .; then echo "::error::_shared/gen/ 是空的：先跑 npm run copy:shared"; exit 1; fi
          deno install --frozen --no-check --entrypoint "${entries[@]}"

      - name: 预览专用函数（supabase/functions/_preview/<名>/，只在这里生成入口；正式发布不带，架构 6.2 末尾预览专用一行）
        # supabase functions deploy 不带函数名时，部署的是 supabase/functions/ 下名字合规（不以下划线开头）的函数目录，
        # 再加上 config.toml 里 [functions.<名>] 声明的函数（声明可以把入口指到任何地方）。所以 _preview/ 下的源码在正式发布
        # （tools/release/publish.ps1）里不会被部署，前提是仓库里没有同名顶层目录、配置里没有声明、别处没有引用——这三条由
        # build/check_backend.py F6 管，这一步先跑一遍，不过就停；publish.ps1 部署前也另查一遍。
        # 这里只在预览的产物里给名单（check_backend 的 PREVIEW_FUNCS，--print-preview-funcs 读出，不在这里另写一份）里的
        # 每个 _preview/<名>/ 生成一个一行的入口 supabase/functions/<名>/index.ts（import 源码），并在产物的 config.toml 末尾
        # 给它 verify_jwt = false（按“任何人都能调用”设计，防护在函数里：自带环境判断（只认预览项目）、写死的过期时间、
        # 只收 POST、限频、总预算）。
        # r2-probe（B0 实测清单 P12，一次性）已于 10-28 下线，源码已删（docs/09-路线图/B0-R2探测函数.md）。
        # 现在名单里是 db-probe（B0 实测清单 P6，一次性；只认 SUPABASE_URL 是预览 ref；docs/09-路线图/B0-P6数据库探测函数.md）。
        # 名单为空、_preview/ 不存在时这一步什么都不做（glob 不匹配时 [ -d ] 不成立直接跳过）；
        # 以后有人在 _preview/ 下放目录而不进名单，这里和 check_backend F6 都会让构建失败。
        run: |
          python3 -I build/check_backend.py
          mapfile -t allowed < <(python3 -I build/check_backend.py --print-preview-funcs | tr -d '\r')
          for d in supabase/functions/_preview/*/; do
            [ -d "$d" ] || continue
            name="$(basename "$d")"
            # 名字先过格式再打印；不合规时不回显目录名（审查低 5）
            if ! [[ "$name" =~ ^[a-z][a-z0-9-]{0,62}$ ]]; then
              echo "::error::supabase/functions/_preview/ 下有名字不合规的目录"; exit 1
            fi
            listed=0
            for a in "${allowed[@]}"; do [ "$a" = "$name" ] && listed=1; done
            if [ "$listed" -ne 1 ]; then
              echo "::error::预览专用函数 $name 不在 check_backend 的 PREVIEW_FUNCS 名单里"; exit 1
            fi
            if [ ! -f "$d/index.ts" ]; then
              echo "::error::预览专用函数 $name 没有 index.ts"; exit 1
            fi
            if [ -e "supabase/functions/$name" ]; then
              echo "::error::supabase/functions/$name 已经存在：预览专用函数的入口只许这一步生成（check_backend F6）"; exit 1
            fi
            mkdir "supabase/functions/$name"
            printf '// 由 deploy-preview.yml 在预览产物里生成，不进仓库。源码在 ../_preview/%s/\nimport '"'"'../_preview/%s/index.ts'"'"';\n' "$name" "$name" > "supabase/functions/$name/index.ts"
            printf '\n[functions.%s]\nverify_jwt = false\n' "$name" >> supabase/config.toml
            echo "预览专用函数：$name（入口已生成，verify_jwt = false）" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: 打包 Pages Functions（_worker.js，在无密钥任务里打包）
        # functions/ 引用 shared/ 和 zod、aws4fetch；deploy 任务不装项目依赖，所以在这里打包成 dist/web/_worker.js/，
        # deploy 只上传（10-28 第一次预览部署实测：在 deploy 里打包找不到 shared/）。dist/web/_routes.json 照旧决定哪些路径进 Functions
        run: npx --no-install wrangler pages functions build functions --outdir dist/web/_worker.js

      - name: 产物指纹
        # 显式写 shell: bash，GitHub 才用 -eo pipefail，指纹脚本失败不会被 tee 吞掉（10-29 代码审查）
        shell: bash
        run: python3 -I build/ci/dist_hash.py dist/web | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-bundle
          # dist/web：静态页面 + _worker.js/（打包好的 Pages Functions：/ 的分流、/sb/* 转发、/files/*）；supabase/：迁移、函数、config.toml
          path: |
            dist/web/
            supabase/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: 部署到预览环境
    needs: build
    # 只部署 main（B0 安全审查低 6）：workflow_dispatch 能选任意分支手动跑，选了别的分支时 build 照跑、这一步跳过，带密钥的任务不会在 main 以外运行
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PROJECT_REF: ${{ vars.PREVIEW_SUPABASE_PROJECT_REF }}
      PAGES_PROJECT: ${{ vars.PREVIEW_PAGES_PROJECT }}
      SITE_ORIGIN: ${{ vars.PREVIEW_SITE_ORIGIN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: 检查公开配置都填了
        run: |
          for v in PROJECT_REF PAGES_PROJECT SITE_ORIGIN CLOUDFLARE_ACCOUNT_ID EXPECTED_VERSION; do
            if [ -z "${!v}" ]; then echo "::error::$v 是空的：去仓库 Settings › Secrets and variables › Actions › Variables 填"; exit 1; fi
          done
          case "$SITE_ORIGIN" in
            https://preview.lemomemo.com) ;;
            *) echo "::error::PREVIEW_SITE_ORIGIN 必须是 https://preview.lemomemo.com，现在是 $SITE_ORIGIN"; exit 1 ;;
          esac

      # 只取部署要用的两个目录：锁文件和安装脚本。项目代码不在这个任务里执行
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            build/ci
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 Supabase CLI（tools/ci-tools.lock）
        run: bash build/ci/install-tool.sh supabase

      - name: 安装 wrangler（tools/deploy/package-lock.json，不跑安装脚本）
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/deploy
          echo "$GITHUB_WORKSPACE/tools/deploy/node_modules/.bin" >> "$GITHUB_PATH"

      - name: 下载产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-bundle
          path: .

      - name: 预览项目暂停了就恢复（架构 8.3、M13）
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PREVIEW_SUPABASE_ACCESS_TOKEN }}
        run: |
          # 令牌经 stdin 交给 curl，不出现在命令行参数里
          api() {
            printf 'header = "Authorization: Bearer %s"\n' "$SUPABASE_ACCESS_TOKEN" |
              curl --config - --fail --silent --show-error --proto '=https' "$@"
          }
          status="$(api "https://api.supabase.com/v1/projects/$PROJECT_REF" | jq -r '.status')"
          echo "预览项目状态：$status"
          if [ "$status" = "INACTIVE" ]; then
            echo "预览项目已暂停，发起恢复"
            api -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/restore" > /dev/null
          fi
          for _ in $(seq 1 60); do
            [ "$status" = "ACTIVE_HEALTHY" ] && exit 0
            sleep 10
            status="$(api "https://api.supabase.com/v1/projects/$PROJECT_REF" | jq -r '.status')"
            echo "等待恢复：$status"
          done
          echo "::error::预览项目 10 分钟内没恢复到 ACTIVE_HEALTHY（现在是 $status）"
          exit 1

      - name: 数据库迁移（db push）
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PREVIEW_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PREVIEW_SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --linked --yes

      - name: 服务器函数（functions deploy，在服务器端打包，不用 Docker）
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PREVIEW_SUPABASE_ACCESS_TOKEN }}
        # B0 还没有函数（只有 _shared），CLI 找不到函数会报错退出（10-28 实测），没有就跳过
        run: |
          if ! find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -not -path 'supabase/functions/_*' | grep -q .; then
            echo "::notice::supabase/functions 下还没有函数，跳过 functions deploy"
            exit 0
          fi
          supabase functions deploy --project-ref "$PROJECT_REF" --use-api --yes

      - name: R2 配置核对（R2 开通、负责人运行 set-r2-tokens.ps1 以后；仓库变量 PREVIEW_R2_READY 设成 true 才跑）
        # 架构 0.32、8.4：/files 函数要的变量在 Cloudflare Pages 项目的生产环境里（不在 GitHub），这里只查名字和类型、不读值：
        #   文本：R2_ENDPOINT（https://<账号 ID>.r2.cloudflarestorage.com）、R2_BUCKET_PREFIX（preview-）
        #   加密：R2_FILES_ACCESS_KEY_ID、R2_FILES_SECRET_ACCESS_KEY、FILES_URL_SECRET
        # 服务器函数的 R2_ENDPOINT、R2_BUCKET_PREFIX、R2_FN_ACCESS_KEY_ID、R2_FN_SECRET_ACCESS_KEY 在 Supabase secrets 里；
        # 预览的 Supabase 令牌没有“读 secrets”的权限，这里不查（要查得加一项权限，先过安全审查员），由 set-r2-tokens.ps1 写完当场核对。
        # 没设变量就跳过：R2 开通前（最晚 11-10）部署照常。缺了就失败，不部署网页。
        if: vars.PREVIEW_R2_READY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
        run: |
          cfg="$(printf 'header = "Authorization: Bearer %s"\n' "$CLOUDFLARE_API_TOKEN" |
            curl --config - --fail --silent --show-error --proto '=https' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" |
            jq -c '.result.deployment_configs.production.env_vars // {} | with_entries(.value |= {type, value: (if .type == "plain_text" then .value else null end)})')"
          bad=0
          for n in R2_FILES_ACCESS_KEY_ID R2_FILES_SECRET_ACCESS_KEY FILES_URL_SECRET; do
            t="$(jq -r --arg n "$n" '.[$n].type // "缺"' <<<"$cfg")"
            if [ "$t" != "secret_text" ]; then echo "::error::Pages 生产环境的 $n 应是加密变量，现在是：$t"; bad=1; fi
          done
          ep="$(jq -r '.R2_ENDPOINT.value // ""' <<<"$cfg")"
          if [ "$ep" != "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" ]; then
            echo "::error::Pages 生产环境的 R2_ENDPOINT 不对（应是 https://<CLOUDFLARE_ACCOUNT_ID>.r2.cloudflarestorage.com），现在是：${ep:-缺}"; bad=1
          fi
          pf="$(jq -r '.R2_BUCKET_PREFIX.value // ""' <<<"$cfg")"
          if [ "$pf" != "preview-" ]; then echo "::error::Pages 生产环境的 R2_BUCKET_PREFIX 应是 preview-，现在是：${pf:-缺}"; bad=1; fi
          if [ "$bad" -ne 0 ]; then echo "负责人照负责人B0网页操作清单第 ⑫ 节 C 重新运行 set-r2-tokens.ps1 -Target preview"; exit 1; fi
          echo "Pages 生产环境的 R2 变量齐全（只核对名字、类型和两个公开值）" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 网页（wrangler pages deploy，含打包好的 _worker.js）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
        run: |
          test -f dist/web/_worker.js/index.js || { echo "::error::产物里没有 _worker.js/index.js"; exit 1; }
          wrangler pages deploy dist/web \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=true

      - name: 核对线上版本
        run: |
          for _ in $(seq 1 20); do
            got="$(curl --fail --silent --proto '=https' "$SITE_ORIGIN/app/version.json" | jq -r '.version' || true)"
            if [ "$got" = "$EXPECTED_VERSION" ]; then
              echo "预览环境已是 $got" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "线上是 ${got:-（取不到）}，等 6 秒再看（期望 $EXPECTED_VERSION）"
            sleep 6
          done
          echo "::error::2 分钟后线上版本仍不是 $EXPECTED_VERSION"
          exit 1

      # 接手清单 SW-update ①：Cloudflare“浏览器缓存 TTL”不是“遵循现有标头”时，sw.js 会被改写成 max-age=14400（10-29 负责人已改，此步防回退）
      - name: 核对 sw.js 缓存头（no-cache）
        run: python3 -I build/ci/check_live_headers.py "$SITE_ORIGIN"

      - name: 清掉 supabase link 留下的本地文件
        if: always()
        run: rm -rf supabase/.temp
