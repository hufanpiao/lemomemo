# release-build：打正式 tag（vX.Y.Z）时在 CI 里构建一次正式产物，只构建和测试、不部署（R-206）
#
# 正式发布由负责人在自己电脑上运行 tools/release/publish.ps1，部署的就是本工作流上传的产物（架构 0.31 第 24 条定方案 A、8.3a 第 2、3 步）：
# publish.ps1 不在本机重新构建、不跑 npm，只用一把只读令牌经 GitHub REST API 下载这个 tag 的产物 zip，
# 逐个文件按 SHA256SUMS 核对，再算总指纹；负责人用 iPhone 打开本次运行的 Summary 页，和总指纹、提交 SHA 对一遍，一致才继续。
# 三个任务：
#   ① build：tag 和 VERSION 一致、tag 对应的提交在 main 上，跑检查、构建 dist/web，上传 release-<tag>（publish.ps1 现在下载部署的就是它），
#      Summary 写“正式产物指纹”（负责人现在核这一段），页面总指纹作为任务输出交给 bundle；
#   ② desktop（B6-exe F9）：needs build，以 workflow_call 调用 desktop.yml，输入 web_artifact = release-<tag>、expect_env = production——
#      正式 tag 走 workflow_call、复用 release-<tag> 装进 exe，desktop.yml 不再另外构建网页（代码审查 M1、安全审查 W-2）；
#      输出页面总指纹、安装包和 latest.json 的 SHA-256；
#   ③ bundle：把 release-<tag> 和 desktop-production-<tag> 放进同一个整包，用 build、desktop 两个任务的输出交叉比对
#      （页面总指纹三方一致、安装包和 latest.json 的 SHA-256 和 desktop 任务算的一致，不只信产物自带的 SHA256SUMS，安全审查 W-3），
#      再出整包 SHA256SUMS 和总指纹，Summary 分三段写（网页总指纹 / exe SHA-256 / 整包总指纹，标题写明负责人什么时候核哪一段），
#      上传 release-bundle-<tag>。
# 还没做的：publish.ps1 改成下载整包、给 exe 签名（F10、F11）；函数和迁移文件进整包（随 F11 一起做，B7a 前审查冻结，0.31 第 24 条）。
# 4.0.0 正式 tag 之前 package.json 必须已经有 @tauri-apps/cli（前端 B），否则 desktop、bundle 失败（build 和 release-<tag> 照常出）。
# 不要加工作流级 concurrency：desktop.yml 被调用时 github.workflow、github.ref 和这里相同，同名组会互相排队或取消（代码审查 S5）。
#
# 不引用任何 secrets。正式环境的公开配置放在 repository variables（PROD_ 开头，都是公开值）。
name: release-build

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

env:
  NODE_VERSION: '24'
  FORCE_COLOR: '0'

jobs:
  build:
    name: 正式产物构建（无密钥、不部署）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      web_hash: ${{ steps.hash.outputs.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 要拿到 origin/main 判断 tag 对应的提交在不在 main 上
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: tag 和 VERSION 一致（架构 8.3 release-build 第一步）
        env:
          TAG: ${{ github.ref_name }}
        run: |
          base="$(tr -d ' \r\n' < VERSION)"
          if [ "v$base" != "$TAG" ]; then
            echo "::error::tag 是 $TAG，VERSION 文件是 $base，对不上"
            exit 1
          fi

      - name: tag 对应的提交必须在 main 上（安全审查 S-2：没合并、没审过的提交打 tag 不出包）
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::提交 $GITHUB_SHA 不在 main 上：只许在 main 已有的提交上打 tag"
            exit 1
          fi
          echo "提交 $GITHUB_SHA 在 main 上"

      - name: 安装依赖（不跑任何安装脚本）
        run: |
          npm ci --ignore-scripts
          bash build/ci/rebuild-allowlist.sh

      - name: 类型检查、规范、单元测试（发布前再跑一遍）
        run: |
          npm run typecheck
          npm run lint
          python3 -I build/check_arch.py
          # 后端静态检查（含 F6：正式发布不带预览专用函数，B0-R2探测函数 第二轮审查低 4）
          python3 -I build/check_backend.py
          npm test

      - name: VAPID 公钥核对（接手清单 VAPID-prod-format：仓库变量 PROD_VAPID_PUBLIC_KEY → VITE_PUBLIC_VAPID_KEY）
        # 和 deploy-preview.yml 的“VAPID 公钥核对”（B2 O-2）同一写法，正式构建没有开关：为空、格式不对、像私钥 JWK 都失败。
        # 格式：0x04‖x‖y 的 base64url，87 个字符，以 B 开头、第二个字符在 A～P（首字节 0x04），最后一个字符只能是 AEIMQUYcgkosw048 之一
        # （set-vapid-keys.ps1、tests/build/set-vapid-keys.test.ts 同一写法）。脚本输出里不回显变量的值。注意 GitHub 会在步骤日志的 Run 表头展开 env: 的值，vars 不遮：公钥本身是公开值，但误填进来的私钥 JWK 也会照样进日志，所以误填后一律按私钥已暴露处理、换钥匙。格式不对时只报长度。
        env:
          VAPID_PUBLIC_KEY: ${{ vars.PROD_VAPID_PUBLIC_KEY }}
        shell: bash
        run: |
          # 正则的字符区间按字节比较，不受运行环境的语言设置影响（代码审查复核建议 ③）
          export LC_ALL=C
          if [ -z "$VAPID_PUBLIC_KEY" ]; then
            echo "::error::仓库变量 PROD_VAPID_PUBLIC_KEY 是空的：负责人照 docs/00-团队/负责人-VAPID密钥-步骤.md 运行 set-vapid-keys.ps1 -Target prod，把打印的公钥填进去"
            exit 1
          fi
          # 先核格式（B2 代码审查复核 M1）：真 P-256 公钥的 base64url 里也可能恰好含 kty（实测约 0.025%），格式合格就放行；
          # 不合格时才看像不像私钥 JWK（有 {、"、kty），像就按私钥已暴露处理，否则只报格式不对
          if [[ "$VAPID_PUBLIC_KEY" =~ ^B[A-P][A-Za-z0-9_-]{84}[AEIMQUYcgkosw048]$ ]]; then
            echo "VAPID 公钥：已填（87 个字符，格式对）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$VAPID_PUBLIC_KEY" in
            *'{'*|*'"'*|*kty*) echo "::error::PROD_VAPID_PUBLIC_KEY 看起来是私钥 JWK，不是公钥：立刻到仓库 Variables 删掉它，并重跑 set-vapid-keys.ps1 换一对钥匙（私钥已经暴露）"; exit 1 ;;
          esac
          # 正好 43 个字符：P-256 私钥 d 的 base64url 长度（安全复核建议），按私钥已经暴露处理
          if [ "${#VAPID_PUBLIC_KEY}" -eq 43 ]; then
            echo "::error::PROD_VAPID_PUBLIC_KEY 只有 43 个字符：这可能是私钥的 d，按私钥已经暴露处理：立刻到仓库 Variables 删掉它，并重跑 set-vapid-keys.ps1 换一对钥匙"
            exit 1
          fi
          echo "::error::PROD_VAPID_PUBLIC_KEY 格式不对（应为 87 个字符的 base64url、以 B 开头；现在 ${#VAPID_PUBLIC_KEY} 个字符）：照 set-vapid-keys.ps1 打印的那一行重新填，不要带空格和换行"
          exit 1

      - name: 构建（production 模式）
        env:
          VITE_PUBLIC_ENV: production
          VITE_PUBLIC_SUPABASE_URL: https://lemomemo.com/sb
          VITE_PUBLIC_ANON_KEY: ${{ vars.PROD_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_VAPID_KEY: ${{ vars.PROD_VAPID_PUBLIC_KEY }}
          VITE_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PROD_TURNSTILE_SITE_KEY }}
        run: |
          for v in VITE_PUBLIC_ANON_KEY VITE_PUBLIC_VAPID_KEY VITE_PUBLIC_TURNSTILE_SITE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v 是空的：去仓库 Variables 填 PROD_ 开头的那几项"; exit 1; fi
          done
          npm run build -- --mode production
          node build/check_size.mjs
          # 构建以后 A14 连 dist/web 一起扫
          python3 -I build/check_arch.py

      - name: 正式产物里不能有 R-68 探测页和 voice-probe（B3 Q1 ⑧；和 voice-probe 同一个 PR 删）
        run: node build/check_no_probe.mjs --dir dist/web

      - name: 发布包里不能有 source map（上线与回滚手册 第二节）
        run: |
          if find dist/web -name '*.map' | grep -q . || grep -rl 'sourceMappingURL' dist/web --include='*.js' | grep -q .; then
            echo "::error::dist/web 里有 source map"
            exit 1
          fi

      - name: 产物指纹（负责人现在发布时在 iPhone 上核这一段，和 publish.ps1 下载核对后显示的核对）
        id: hash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          out="$(python3 -I build/ci/dist_hash.py dist/web)"
          total="$(printf '%s\n' "$out" | sed -n 's/^总指纹：\([0-9a-f]\{64\}\)$/\1/p')"
          if [ -z "$total" ]; then echo "::error::算不出页面总指纹"; exit 1; fi
          echo "total=$total" >> "$GITHUB_OUTPUT"
          {
            echo "## $TAG 正式产物指纹（负责人现在核这一段：publish.ps1 部署的网页）"
            echo
            echo '```'
            echo "$out"
            echo '```'
            echo
            echo "提交：$GITHUB_SHA"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 要上传的 dist/web 里不许有点开头的文件（upload-artifact 默认不传它们，会被悄悄漏掉）
        run: |
          # -L：跟进符号链接查（upload-artifact 会跟进链接上传）；链接成环等 find 出错时，bash -e 让这一步失败
          hidden="$(find -L dist/web -name '.*' -print)"
          if [ -n "$hidden" ]; then
            echo '点开头的文件或目录（每行一个，以 dist/web/ 开头）：'
            printf '%s\n' "$hidden"
            count="$(find -L dist/web -name '.*' -print0 | tr -cd '\0' | wc -c)"
            echo "::error::dist/web 里有 $count 个点开头的文件或目录，upload-artifact 默认不传（include-hidden-files 默认 false），上传后会少文件；列表见上面的日志"
            exit 1
          fi

      - name: 上传产物（publish.ps1 下载部署的就是这一份，方案 A；保留 90 天）
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.ref_name }}
          path: dist/web/
          if-no-files-found: error
          retention-days: 90

  desktop:
    name: 正式版 exe（调用 desktop.yml，装 release-<tag> 的页面，无密钥、不签名）
    needs: build
    uses: ./.github/workflows/desktop.yml
    with:
      web_artifact: release-${{ github.ref_name }}
      expect_env: production
    permissions:
      contents: read

  bundle:
    name: 整包交叉比对、SHA256SUMS 和总指纹（网页 + exe）
    needs: [build, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 下载网页产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.ref_name }}
          path: bundle/web/

      - name: 下载 exe 产物（未签名安装包、latest.json 草稿、SHA256SUMS）
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-production-${{ github.ref_name }}
          path: bundle/desktop/

      - name: 交叉比对（安全审查 W-3：用 build、desktop 两个任务的输出核对，不只信产物自带的 SHA256SUMS）
        id: check
        env:
          BUILD_WEB_HASH: ${{ needs.build.outputs.web_hash }}
          DESKTOP_WEB_HASH: ${{ needs.desktop.outputs.web_hash }}
          EXE_NAME: ${{ needs.desktop.outputs.exe_name }}
          EXE_SHA256: ${{ needs.desktop.outputs.exe_sha256 }}
          LATEST_SHA256: ${{ needs.desktop.outputs.latest_sha256 }}
        run: |
          hex='^[0-9a-f]{64}$'
          for v in BUILD_WEB_HASH DESKTOP_WEB_HASH EXE_SHA256 LATEST_SHA256; do
            if ! [[ "${!v}" =~ $hex ]]; then echo "::error::$v 不是 64 位十六进制：${!v}"; exit 1; fi
          done
          if ! [[ "$EXE_NAME" =~ ^lemomemo_[0-9]+\.[0-9]+\.[0-9]+_x64-setup\.exe$ ]]; then
            echo "::error::安装包文件名不对：$EXE_NAME"
            exit 1
          fi
          # ① 页面：下载下来的 release-<tag>、build 任务算的、desktop 任务装进 exe 前算的，三者同一个总指纹
          web="$(python3 -I build/ci/dist_hash.py bundle/web | sed -n 's/^总指纹：\([0-9a-f]\{64\}\)$/\1/p')"
          if [ "$web" != "$BUILD_WEB_HASH" ] || [ "$web" != "$DESKTOP_WEB_HASH" ]; then
            echo "::error::页面总指纹对不上：下载的 $web，build 任务 $BUILD_WEB_HASH，desktop 任务 $DESKTOP_WEB_HASH"
            exit 1
          fi
          # ② exe 产物：文件恰好是安装包、latest.json、SHA256SUMS 三个；SHA-256 和 desktop 任务算的一致
          actual="$(cd bundle/desktop && find . -type f -printf '%P\n' | LC_ALL=C sort)"
          expected="$(printf '%s\n' "$EXE_NAME" SHA256SUMS latest.json | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::exe 产物里的文件不对，应为：$expected，实际：$actual"
            exit 1
          fi
          got_exe="$(sha256sum -b -- "bundle/desktop/$EXE_NAME" | cut -d' ' -f1)"
          got_latest="$(sha256sum -b -- bundle/desktop/latest.json | cut -d' ' -f1)"
          if [ "$got_exe" != "$EXE_SHA256" ] || [ "$got_latest" != "$LATEST_SHA256" ]; then
            echo "::error::exe 产物的 SHA-256 和 desktop 任务算的对不上"
            exit 1
          fi
          # 产物自带的 SHA256SUMS 也要对（多一道），核完删掉，整包另出一份
          ( cd bundle/desktop && sha256sum --strict -c SHA256SUMS )
          rm bundle/desktop/SHA256SUMS
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "交叉比对通过"

      - name: 整包 SHA256SUMS 和总指纹，Summary 分三段写（总指纹不含 SHA256SUMS 本身）
        env:
          TAG: ${{ github.ref_name }}
          WEB_HASH: ${{ steps.check.outputs.web }}
          EXE_NAME: ${{ needs.desktop.outputs.exe_name }}
          EXE_SHA256: ${{ needs.desktop.outputs.exe_sha256 }}
          LATEST_SHA256: ${{ needs.desktop.outputs.latest_sha256 }}
        run: |
          cd bundle
          find . -type f -printf '%P\n' | LC_ALL=C sort | while IFS= read -r f; do sha256sum -b -- "$f"; done | sed 's/ \*/  /' > "$RUNNER_TEMP/SHA256SUMS"
          total="$(python3 -I ../build/ci/dist_hash.py .)"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          {
            echo "## $TAG 整包核对 ①：网页总指纹（和上面「正式产物指纹」是同一个值，build、desktop、下载三方比对已通过；现在不用另外核）"
            echo
            echo '```'
            echo "总指纹：$WEB_HASH"
            echo '```'
            echo
            echo "## $TAG 整包核对 ②：电脑版安装包 SHA-256（未签名；F10 起负责人签名前核这一段，现在不用核）"
            echo
            echo '```'
            echo "$EXE_SHA256  desktop/$EXE_NAME"
            echo "$LATEST_SHA256  desktop/latest.json"
            echo '```'
            echo
            echo "## $TAG 整包核对 ③：整包总指纹（网页 + exe；F11 起 publish.ps1 下载整包后核这一段，现在不用核）"
            echo
            echo '```'
            echo "$total"
            echo '```'
            echo
            echo "清单见整包里的 SHA256SUMS。提交：$GITHUB_SHA"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 要上传的 bundle 里不许有点开头的文件（upload-artifact 默认不传它们，会被悄悄漏掉）
        run: |
          # -L：跟进符号链接查（upload-artifact 会跟进链接上传）；链接成环等 find 出错时，bash -e 让这一步失败
          hidden="$(find -L bundle -name '.*' -print)"
          if [ -n "$hidden" ]; then
            echo '点开头的文件或目录（每行一个，以 bundle/ 开头）：'
            printf '%s\n' "$hidden"
            count="$(find -L bundle -name '.*' -print0 | tr -cd '\0' | wc -c)"
            echo "::error::bundle 里有 $count 个点开头的文件或目录，upload-artifact 默认不传（include-hidden-files 默认 false），上传后会少文件；列表见上面的日志"
            exit 1
          fi

      - name: 上传整包（保留 90 天）
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle-${{ github.ref_name }}
          path: bundle/
          if-no-files-found: error
          retention-days: 90
