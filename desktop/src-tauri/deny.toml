# cargo deny 的配置（架构 8.3 依赖供应链第 ② 条；B6-exe F9、A14：audit / deny 0 高危）。由运维维护，desktop.yml 在编译前跑：
#   cargo deny --locked check advisories bans licenses sources
#
# 只看 Windows 目标：exe 只编 x86_64-pc-windows-msvc，Cargo.lock 里 Linux、macOS 才用的包（gtk 一族等）不进安装包，不算
[graph]
targets = ["x86_64-pc-windows-msvc"]
# preview 这个 feature 不带额外依赖，打开它是为了两套环境的依赖图都在检查范围里
all-features = true

[advisories]
# 11-03 安全审查条件：
# ① 漏洞（vulnerability）一律失败，**不加任何豁免**（条件 ③）；不健全（unsound）不分直接、间接一律报；
#    “没人维护”只对我们自己直接依赖的包报错（tauri 依赖树里没人维护的间接依赖只能等上游换）；被撤回（yanked）的版本失败。
# ② 只按 Windows 依赖树判断（上面 [graph] targets）。按这个口径本机实测（cargo-deny 0.20.2，11-03）一条都不剩，所以 ignore 是空的：
#    cargo audit 不分目标平台，它报的 5 条警告都只在 Linux 的 GTK / D-Bus 依赖链上，
#    cargo tree --target x86_64-pc-windows-msvc -i <包> 全是 nothing to print（对照 -i webview2-com 正常打印），不进 Windows exe：
#      RUSTSEC-2024-0370  proc-macro-error 1.0.4 没人维护（glib-macros、gtk3-macros 引入，编译期过程宏）
#      RUSTSEC-2026-0370  zvariant 5.15.1 没人维护（zbus 一系，Linux D-Bus）
#      RUSTSEC-2026-0371  zbus_names 4.3.5 没人维护（同上）
#      RUSTSEC-2026-0372  zvariant_derive 5.15.1 没人维护（同上）
#      RUSTSEC-2024-0429  glib 0.18.5 不健全（VariantStrIter；Tauri 2 在 Linux 上锁 gtk 0.18）
#    这 5 条和 osv-scanner.toml 里 glib 的三条豁免一起在 2026-11-30 复查。以后哪条进了 Windows 依赖树，cargo deny 会报出来，
#    那时再按“一条一个编号、附一句理由”加进 ignore（漏洞照旧不豁免）。
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = []

[bans]
# tauri 依赖树里同一个包多个版本很常见（windows-sys 等），不拦
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# 只许从 crates.io 拉，不许 git 依赖和别的源
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
# 允许名单（11-03 主持人定）：名单是允许范围，不要求每项都已出现，license-not-encountered 警告可以接受；
# 新依赖带来名单外的许可证就失败，要加先问主持人
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  "Unlicense",
  "0BSD",
  "CC0-1.0",
  "MIT-0",
]
confidence-threshold = 0.8

[licenses.private]
# 我们自己的包（Cargo.toml 里 publish = false）不编许可证，不查
ignore = true
