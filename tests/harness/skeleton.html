<!-- 测试页骨架：模拟 claude.ai 发布平台给单文件页面补上的外壳（doctype、charset、viewport、基础样式）。
     @banner 处放环境提示条（tests/harness/banner.html），@stub 处放示例数据和可选的 window.claude 桩脚本，
     @app 处放构建好的页面；三处由 build/build.py 替换。
     依赖：无。本注释在构建时去掉（否则 doctype 前有注释会进怪异模式）。 -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><!-- @banner --><!-- @stub --><!-- @app --></body></html>
