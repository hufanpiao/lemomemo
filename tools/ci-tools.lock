# localstack：S3 替身的容器镜像（架构 8.6、0.32 第 4 条；B0 R2 任务单 O-1）。只在 ci.yml 的 db 任务和本机测试里用，不进部署任务、不进 publish.ps1。
#   这一行的列含义不同于上面：平台写 oci，“文件名”一列是镜像名:标签，SHA-256 一列是多架构清单（manifest list）的 digest（去掉 sha256: 前缀），
#   下载地址一列是 Docker Hub 的标签页（只供人核对，脚本不从这里下载）。install-tool.sh 不装它；docker-compose.objstore.yml 的 image
#   必须等于“镜像名:标签@sha256:digest”，build/objstore.mjs pin 比对，CI 里不一致就失败。
#   为什么不是 MinIO：官方镜像（Docker Hub minio/minio、quay.io/minio/minio）10-28 实测都不能匿名拉取，上游只发源码；
#   为什么是 4.14.0：LocalStack 2026.03 起的新版本启动要 auth token（要注册、CI 要放 secret），4.14.0（2026-02-26）是之前最后一版社区版。
#   代价：这一版不会再有安全更新（只在 runner 和本机回环地址上跑、没有真数据，可以接受，交安全审查员确认）；对请求头里的 SigV4 签名默认不校验。
