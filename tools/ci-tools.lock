# 部署和扫描用的命令行工具：版本和 SHA-256 锁定（架构 8.3 依赖供应链第 ⑤ 条）
#
# 谁读它：
#   - CI：build/ci/install-tool.sh <名称> <平台>（unit.yml、ci.yml、deploy-preview.yml）
#   - 本机正式发布：tools/release/publish.ps1（只读 windows_amd64 那几行）
# 规则：
#   - 每行一个文件，按空白分 6 列：名称 版本 平台 文件名 SHA-256 下载地址；# 开头是注释。
#   - SHA-256 抄自该版本官方发布页的 checksums 文件（下面每段写了出处），不是自己算的。
#   - 升级：只升到发布满两周的正式版（不用 beta、next）；同一个提交里改版本、文件名、哈希、地址四项，
#     由代码审查员对照官方 checksums 文件核对，再由安全审查员会签（人员名单：运维脚本）。
#   - wrangler 没有官方单文件二进制，不在这里锁，见 tools/deploy/package-lock.json（偏离架构 8.3，见环境清单第七节）。
