(function(){
// 职责：底部提示条队列：show(文案, 按钮字, 按钮动作, 显示毫秒) 新增一条，可叠放，最多 TOAST_MAX 条（超出时最早的先走），
//       每条有自己的计时器；带按钮的“撤销”类提示由调用方传 TOAST_UNDO_MS。点按钮执行动作并收起这一条。
// 依赖：core/const.js、ui/dom.js
App.ui = App.ui || {};

const C = App.core.C;

const live = [];   // 当前显示中的提示：{el, timer}

function dismiss(t){
  const i = live.indexOf(t); if (i < 0) return;
  live.splice(i, 1);
  clearTimeout(t.timer);
  t.el.classList.remove("on");
  setTimeout(() => t.el.remove(), C.TOAST_LEAVE_MS);
}
function show(msg, btnText, action, ms){
  while (live.length >= C.TOAST_MAX) dismiss(live[0]);
  const t = {el:null, timer:null};
  const btn = btnText ? h("button",{type:"button",onclick:() => { dismiss(t); if (action) action(); }}, btnText) : null;
  t.el = h("div",{class:"toast"}, h("span",null,msg), btn);
  $("toasts").append(t.el);
  live.push(t);
  requestAnimationFrame(() => t.el.classList.add("on"));
  t.timer = setTimeout(() => dismiss(t), ms || C.TOAST_MS);
  return t;
}

App.ui.toast = {show, dismiss};
})();

(function(){
// 职责：今天视图里的时间轴：只显示“现在前后 + 有安排的时段”，重叠的日程分列并排，全天日程放上方胶囊，红线标出现在。
// 依赖：core/const.js、core/date.js、logic/items.js、logic/projects.js、logic/sort.js、data/state.js、ui/dom.js
// 运行时调用：ui/sheet.js
App.ui = App.ui || {};

const C = App.core.C;
const {pad, m2hm} = App.core.date;
const {startMin, endMin} = App.logic.items;
const {projColor} = App.logic.projects;
const {byTime} = App.logic.sort;
const S = App.data.state, visEv = App.data.visEv, ready = App.data.ready;
const {$, h} = App.ui.dom;
const openSheet = (...a) => App.ui.sheet.open(...a);

// 把同时段重叠的日程分到并排的几列：给每项写上 k（第几列）和 n（这一簇共几列）
function layoutLanes(items){
  let cluster = [], cEnd = -1;
  const flush = () => {
    const lanes = [];
    for (const it of cluster){ let k = lanes.findIndex(end => end <= it.s); if (k < 0){ k = lanes.length; lanes.push(0); } lanes[k] = it.en; it.k = k; }
    for (const it of cluster) it.n = lanes.length;
    cluster = []; cEnd = -1;
  };
  for (const it of items){ if (it.s >= cEnd && cluster.length) flush(); cluster.push(it); cEnd = Math.max(cEnd, it.en); }
  if (cluster.length) flush();
  return items;
}
function renderTimeline(t, nm){
  const tl = $("tl"), ad = $("tl-allday");
  tl.textContent = ""; ad.textContent = "";
  const evs = visEv().filter(e => e.date === t);
  const timed = evs.filter(e => e.time).sort(byTime);
  evs.filter(e => !e.time).forEach(e => ad.append(h("button",{class:"ad",type:"button",style:"background:"+projColor(e.project),onclick:()=>openSheet("event",e)},"全天  "+e.title)));
  $("tl-meta").textContent = timed.length ? timed.length+" 项" : "";
  // 只显示“现在前后 + 有安排的时段”，避免大段空白
  let sH = Math.max(0, Math.floor(nm/60) - C.TL_HOURS_BEFORE), eH = Math.min(24, Math.floor(nm/60) + C.TL_HOURS_AFTER);
  for (const e of timed){ sH = Math.min(sH, Math.floor(startMin(e)/60)); eH = Math.max(eH, Math.ceil(endMin(e)/60)); }
  eH = Math.min(24, eH); if (eH - sH < C.TL_MIN_HOURS) sH = Math.max(0, eH - C.TL_MIN_HOURS);
  const PX = C.TL_PX_PER_HOUR, H = (eH - sH) * PX;
  const hours = h("div",{class:"hours",style:"height:"+H+"px"}), lane = h("div",{class:"lane",style:"height:"+H+"px"});
  for (let i = sH; i <= eH; i++){
    const y = (i - sH) * PX;
    hours.append(h("span",{style:"top:"+Math.min(H-6,Math.max(6,y))+"px"},pad(i)+":00"));

const V = App.ui.view;
const RECOG_DEBOUNCE_MS = 250;
const ICON_LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

// kind：当前类型；origKind：编辑时原来的类型（切换类型时用来转换）；remind：undefined＝没动过（按默认规则）
const F = {kind:"todo", origKind:null, editing:null, locks:new Set(), remind:undefined};
let debounce = null;
const today = () => App.clock.today();
const hasTime = () => F.kind === "event" && !!$("f-time").value;

function setKind(k){
  F.kind = k;
  document.querySelectorAll("#seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k ? "true" : "false"));
  document.querySelectorAll("#sheet .ev-only").forEach(el => el.hidden = k !== "event");
  document.querySelectorAll("#sheet .td-only").forEach(el => el.hidden = k !== "todo");
  $("push-1h").hidden = !(k === "event" && F.editing && F.origKind === "event");
  $("f-date-lab").textContent = k === "event" ? "日期" : "截止日期";
  $("date-chips-lab").textContent = k === "event" ? "日期" : "截止";
  $("f-note-lab").textContent = k === "event" ? "地点或备注" : "备注";
  $("f-date").required = k === "event";
  if (k === "event" && !$("f-date").value) $("f-date").value = V.selDay || today();
  refresh();
}
// 表单当前内容，按条目的样子组装（给提醒规则算默认值、标签用）
function draft(){
  const d = {date:$("f-date").value, time: F.kind === "event" ? $("f-time").value : "", due:$("f-date").value,
    important:$("f-imp").checked, done:false, deletedAt:null, durationMin:Number($("f-dur").value) || 60};
  if (F.remind !== undefined){ if (hasTime()) d.remindMin = F.remind; else d.remindDays = F.remind; }
  else if (F.editing){ d.remindMin = F.editing.remindMin; d.remindDays = F.editing.remindDays; }
  return d;
}

// —— 快捷日期（#22）——
function dateChoices(){
  const t = today(), dow = parse(t).getDay();
  const list = [["今天", t], ["明天", addDays(t, 1)], ["周六", addDays(t, (6 - dow + 7) % 7)], ["下周一", addDays(mondayOf(t), 7)]];
  if (F.kind === "todo") list.push(["不设", ""]);
  return list;
}
function renderDateChips(){
  const box = $("date-chips"); box.textContent = "";
  const cur = $("f-date").value;
  box.append(h("button",{type:"button",class:"opt",onclick:() => { const el = $("f-date"); el.focus(); try { el.showPicker && el.showPicker(); } catch(e){} }},"选日期…"));
  for (const [label, val] of dateChoices()){
    box.append(h("button",{type:"button",class:"opt","aria-pressed": cur === val ? "true" : "false",
      onclick:() => { $("f-date").value = val; F.locks.add("date"); refresh(); }}, label));
  }
}

// —— 提醒选项 ——
function renderRemind(){
  const box = $("remind-chips"); box.textContent = "";
  const opts = R.options(F.kind, hasTime());
  if (F.remind !== undefined && !opts.some(o => o.value === F.remind)) F.remind = undefined;   // 换了类型，原选项不适用
  const noDate = !$("f-date").value;
  const cur = noDate && F.kind === "todo" ? null : (F.remind !== undefined ? F.remind : R.currentValue(draft(), F.kind));
  for (const o of opts){
    box.append(h("button",{type:"button",class:"opt",role:"radio","aria-checked": o.value === cur ? "true" : "false", disabled: noDate && F.kind === "todo" ? true : null,
      onclick:() => { F.remind = o.value; F.locks.add("remind"); refresh(); }}, o.label));
  }
}

// —— 识别结果胶囊：每项是按钮，点了展开对应字段；锁住的加锁形图标 ——
function chip(field, text, focusId){
  const locked = F.locks.has(field);
  return h("button",{type:"button",class:"v" + (locked ? " lock" : ""),
    "aria-label": text + (locked ? "，已手动修改，不会被识别结果覆盖" : "，点按修改"),
    onclick:() => { App.ui.sheet.openDetails(); const el = $(focusId); if (el) el.focus(); }},
    locked ? h("span",{class:"lock-ico", html:ICON_LOCK}) : null, text);
}
function renderRecog(){
  const box = $("recog");
  const show = !F.editing && !!$("q").value.trim();
  box.hidden = !show; box.textContent = "";
  if (!show) return;
  const d = draft(), t = today();
  box.append(chip("kind", F.kind === "event" ? "日程" : "待办", "seg"));
  if ($("f-date").value) box.append(chip("date", (F.kind === "todo" ? "截止 " : "") + relDay($("f-date").value, t), "f-date"));
  if (F.kind === "event") box.append(chip("time", $("f-time").value || "全天", "f-time"));
  if ($("f-proj").value.trim()) box.append(chip("project", $("f-proj").value.trim(), "f-proj"));
  if (F.kind === "todo" && $("f-imp").checked) box.append(chip("important", "重要", "f-imp"));
  const lab = R.label(d, F.kind);
  if (lab || F.remind === null) box.append(chip("remind", lab ? "提醒：" + lab : "不提醒", "remind-chips"));
}
function fillProjChips(){
  const c = $("proj-chips"); c.textContent = "";
  const dl = $("proj-list"); dl.textContent = "";
  App.data.projects().forEach(p => {
    dl.append(h("option",{value:p}));
    c.append(h("button",{class:"f",type:"button","aria-pressed":$("f-proj").value===p?"true":"false",
      onclick:()=>{ $("f-proj").value = $("f-proj").value === p ? "" : p; F.locks.add("project"); refresh(); }},
      h("span",{class:"sw",style:"background:"+projColor(p)}), p));
  });
}
function refresh(){ renderDateChips(); renderRemind(); renderRecog(); fillProjChips(); }

// —— 一句话识别：停顿 250ms 后填表，锁住的字段不动 ——
function applyParse(){
  const s = $("q").value;
  if (!s.trim()){ refresh(); return; }
  const p = App.logic.parseQuick(s, today(), App.data.projects());
  const L = F.locks;
  if (!L.has("kind") && p.kind !== F.kind){ F.kind = p.kind; setKind(p.kind); }
  if (!L.has("title")) $("f-title").value = p.title;
  if (!L.has("date")) $("f-date").value = p.date || (F.kind === "event" ? today() : "");
  if (!L.has("time")) $("f-time").value = p.time;
  if (!L.has("important")) $("f-imp").checked = p.important;
  if (!L.has("project")) $("f-proj").value = p.project;
  if (!L.has("remind")) F.remind = !p.remind ? undefined : p.remind.off ? null : p.remind.min != null ? p.remind.min : p.remind.days;
  refresh();
}
function onQuickInput(){ clearTimeout(debounce); debounce = setTimeout(applyParse, RECOG_DEBOUNCE_MS); }
function flushParse(){ if (debounce){ clearTimeout(debounce); debounce = null; applyParse(); } }

// 打开弹出层时重置。kind 为 null 表示新建时让识别结果决定
function reset(kind, item, presetDate){
  F.editing = item || null; F.origKind = item ? kind : null; F.locks = new Set(); F.remind = undefined;
  clearTimeout(debounce); debounce = null;
  $("q").value = "";
  $("f-title").value = item ? item.title : "";
  $("f-date").value = item ? (kind === "event" ? item.date : (item.due || "")) : (presetDate || "");
  $("f-time").value = item && item.time || "";
  const dur = String(item && item.durationMin || 60), sel = $("f-dur");
  if (![...sel.options].some(o => o.value === dur)) sel.append(h("option",{value:dur}, dur + " 分钟"));   // 不在选项里的时长也保留（PM-C②）
  sel.value = dur;
  $("f-note").value = item && item.note || "";
  $("f-imp").checked = !!(item && item.important);
  $("f-proj").value = item && item.project || "";
  $("raw").hidden = !(item && item.rawText);
  $("raw").textContent = item && item.rawText ? "原话：" + item.rawText : "";
  // 电脑上不提麦克风（#37）
  const coarse = globalThis.matchMedia && matchMedia("(pointer:coarse)").matches;
  $("q").placeholder = coarse ? "说或写一句话，例如：明天下午3点和 NEOX 对片（点键盘上的麦克风，中文、韩文都能说）" : "写一句话，例如：明天下午3点和 NEOX 对片";
  setKind(kind || (presetDate ? "event" : "todo"));
}
function readForm(){
  flushParse();
  return {title:$("f-title").value.trim(), date:$("f-date").value, time: F.kind === "event" ? $("f-time").value : "", dur:$("f-dur").value,
    project:$("f-proj").value.trim(), note:$("f-note").value.trim(), important:$("f-imp").checked, remind:F.remind, raw:$("q").value.trim()};
}
// 日程“推后 1 小时”：跨过零点时日期加一天（#22）
function pushHour(){
  const t = $("f-time").value; if (!t) return;
  const [hh, mm] = t.split(":").map(Number); let m = hh * 60 + mm + 60, d = $("f-date").value;
  if (m >= 1440){ m -= 1440; d = addDays(d, 1); }
  $("f-time").value = String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
  $("f-date").value = d; refresh();
}
function init(){
  document.querySelectorAll("#seg button").forEach(b => b.onclick = () => { F.locks.add("kind"); setKind(b.dataset.k); });
  $("q").oninput = onQuickInput;
  const lockOn = (id, field, ev) => $(id).addEventListener(ev, () => { F.locks.add(field); refresh(); });
  lockOn("f-title", "title", "input"); lockOn("f-date", "date", "change"); lockOn("f-time", "time", "change");
  lockOn("f-imp", "important", "change"); lockOn("f-proj", "project", "input");
  $("push-1h").onclick = pushHour;
}

App.ui.sheetForm = {state: F, init, reset, readForm, refresh, setKind};
})();
// ==== src/scripts/ui/sheet.js ====
(function(){
// 职责：新建 / 编辑弹出层的开关与操作（v3 T8，界面依据草图第 3 版 ②③）：
//       新建时只显示一句话输入框、右侧的“加入”和识别结果，细节默认折叠在“改细节”里；编辑时直接展开细节，可以切换类型；
//       保存、类型互转、删除都交给 data/write.js；删除后提示“已删除 1 项”加“撤销”（不显示标题，#17）。
//       弹出层打开时焦点困在里面（Tab 循环），Esc 或点遮罩关闭，焦点回到打开它的按钮。表单状态在 ui/sheet-form.js。
// 依赖：core/const.js、core/date.js、logic/format.js、data/state.js、data/write.js、ui/dom.js、ui/view-state.js、ui/toast.js、ui/sheet-form.js
// 运行时调用：ui/nav.js、App.clock
App.ui = App.ui || {};

const C = App.core.C;
const {mondayOf} = App.core.date;
const {relDay} = App.logic.format;
const write = App.data.write;
const {$} = App.ui.dom;
const V = App.ui.view, toast = App.ui.toast, SF = App.ui.sheetForm, F = App.ui.sheetForm.state;
let lastFocus = null;
const isDesktop = () => globalThis.matchMedia && matchMedia("(min-width:960px)").matches;

function openDetails(){
  $("details").hidden = false; $("details-toggle").hidden = true;
  $("details-toggle").setAttribute("aria-expanded", "true");
  $("acts").hidden = false;
}
function openSheet(kind, item, presetDate){
  if (!App.data.isConnected()){ toast.show("数据未连接，暂时不能编辑"); return; }
  lastFocus = document.activeElement;
  SF.reset(kind, item, presetDate);
  const editingMode = !!item;
  $("sh-title").textContent = editingMode ? (kind === "event" ? "编辑日程" : "编辑待办") : "记一件事";
  $("q-wrap").hidden = editingMode;
  $("details").hidden = !editingMode; $("details-toggle").hidden = editingMode;
  $("details-toggle").setAttribute("aria-expanded", editingMode ? "true" : "false");
  $("acts").hidden = !editingMode;
  $("save").textContent = editingMode ? "保存修改" : "加入";
  $("del").hidden = !editingMode;
  $("del").textContent = kind === "event" ? "删除这条日程" : "删除这条待办";
  $("scrim").hidden = false; $("sheet").hidden = false;
  requestAnimationFrame(() => { $("scrim").classList.add("on"); $("sheet").classList.add("on"); (editingMode ? $("f-title") : $("q")).focus(); });
}
function closeSheet(){
  $("scrim").classList.remove("on"); $("sheet").classList.remove("on");
  setTimeout(() => { $("scrim").hidden = true; $("sheet").hidden = true; }, C.SHEET_ANIM_MS);
  if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus();
}
const isClosed = () => $("sheet").hidden;

function setBusy(busy){
  for (const id of ["save", "q-add"]){ const b = $(id); b.disabled = busy; }
  $("save").textContent = busy ? "保存中…" : (F.editing ? "保存修改" : "加入");
  $("q-add").textContent = busy ? "…" : "加入";
}
async function onSubmit(ev){
  ev.preventDefault();
  const v = SF.readForm();
  if (!v.title){ openDetails(); $("f-title").focus(); return; }
  if (F.kind === "event" && !v.date){ openDetails(); $("f-date").focus(); return; }
  setBusy(true);
  const editing = F.editing, converting = editing && F.kind !== F.origKind;
  const r = converting ? await write.convert(F.origKind, editing, v) : await write.saveItem(F.kind, editing, v);
  setBusy(false);
  if (!r.ok) return;
  if (r.coll === "events" && !editing){ V.selDay = r.data.date; V.weekStart = mondayOf(r.data.date); }
  closeSheet();
  if (converting) toast.show(r.coll === "events" ? "已改成日程" : "已改成待办");
  else if (editing) toast.show("已保存");
  else if (r.coll === "events") toast.show("已记下日程，" + relDay(r.data.date, App.clock.today()));
  else if (!v.date && V.view === "today" && !isDesktop()) toast.show("已加入待办", "查看", () => App.ui.nav.go("todo"));   // PM-A⑥
  else toast.show("已加入待办");
}
function onDelete(){
  const it = F.editing, coll = write.collOf(F.origKind || F.kind);
  closeSheet();
  if (!it) return;
  write.softDelete(coll, it);
  toast.show("已删除 1 项", "撤销", () => write.restore(coll, it), C.TOAST_UNDO_MS);
}
// 焦点困在弹出层里：Tab / Shift+Tab 循环
function trapFocus(e){
  if (e.key !== "Tab" || $("sheet").hidden) return;
  const els = [...$("sheet").querySelectorAll("button, input, select, textarea, [tabindex]")].filter(el => !el.disabled && el.offsetParent !== null);
  if (!els.length) return;
  const first = els[0], last = els[els.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}
function init(){
  SF.init();
  $("details-toggle").onclick = openDetails;
  $("cancel").onclick = closeSheet; $("scrim").onclick = closeSheet;
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); trapFocus(e); });
  $("del").onclick = onDelete;
  $("sheet").addEventListener("submit", onSubmit);
  $("plus").onclick = () => openSheet(null, null, V.view === "sched" ? V.selDay : null);
}

App.ui.sheet = {open: openSheet, close: closeSheet, isClosed, init, openDetails};
})();
// ==== src/scripts/ui/nav.js ====
(function(){
// 职责：底部导航与网络提示：go() 切换今天 / 日程 / 待办三页并回到页顶（记住上次的页、移动白色指示块、窄屏只显示当前页文字）；
//       窗口尺寸变化时只重排导航、不滚动（修 v2“resize 跳回顶部”）；断网时顶部显示红条。
// 依赖：core/const.js、platform/prefs.js、ui/dom.js、ui/view-state.js
App.ui = App.ui || {};

const C = App.core.C;
const prefs = App.platform.prefs;
const {$} = App.ui.dom;
const V = App.ui.view;

function placeInd(){
  const b = document.querySelector('#nav button[data-go="'+V.view+'"]'); if (!b) return;
  $("ind").style.left = b.offsetLeft+"px"; $("ind").style.width = b.offsetWidth+"px";
}
// 显示 v 这一页（不滚动）
function applyView(v){
  V.view = v; prefs.set(prefs.KEYS.view, v);
  document.querySelectorAll(".view").forEach(el => el.classList.toggle("on", el.dataset.view === v));
  document.querySelectorAll("#nav button").forEach(b => {
    const on = b.dataset.go === v;
    b.setAttribute("aria-current", on ? "page" : "false");
    b.querySelector(".lab").hidden = !on && innerWidth < C.NARROW_NAV_PX;
  });
  requestAnimationFrame(placeInd);
}
function go(v){ applyView(v); window.scrollTo({top:0}); }
const net = () => { $("netbar").hidden = navigator.onLine !== false; };
function init(){
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
  addEventListener("resize", () => applyView(V.view));
}
function initNet(){
  addEventListener("online", net); addEventListener("offline", net); net();
}

App.ui.nav = {go, applyView, placeInd, init, initNet};
})();
// ==== src/scripts/ui/remind.js ====
(function(){
// 职责：页面开着时的提醒（v3 T6，界面依据草图第 3 版 ①A ①B、采纳结论 #1 #12、需求澄清 #3 #7 #31）。
//       update() 用 logic/remind.js 算出现在该提醒的条目；新出现的响一声提示音、记运行日志。
//       情况 A：被提醒的正好是“下一件事”且今天页看得见 → 由 ui/today.js 把下一件事卡片画成提醒状态（forItem 查询）；
//       情况 B：其余的在抬头下方显示一张反色提醒卡片，只显示最早的一条，右上角标“+N”。
//       “知道了”写 notifiedFor，“10 分钟后”写 snoozeAt（data/write.js）；别的设备确认后这里自动收起，并提示“已在别处确认”。
// 依赖：core/date.js、logic/remind.js、logic/format.js、data/state.js、ui/dom.js、ui/view-state.js、ui/toast.js
// 运行时调用：data/write.js、platform/notify.js、data/log.js、ui/render.js、App.clock
App.ui = App.ui || {};

const R = App.logic.remind;
const {relDay, dueText, startsText} = App.logic.format;
const {hm2m, minOfDay} = App.core.date;
const {$, h} = App.ui.dom;
const V = App.ui.view, toast = App.ui.toast;
const visEv = App.data.visEv, visTd = App.data.visTd, ready = App.data.ready;

const ICON_BELL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>';
const keyOf = d => d.kind + ":" + d.item.id + ":" + d.at;

let current = [];              // 现在该提醒的：[{kind, item, at}]
let shown = new Set();         // 本次打开页面后已经出过的（响过铃、做过入场动画）
const handledHere = new Set(); // 在本机点过“知道了 / 10 分钟后”的
let entering = new Set();      // 这一轮新出现的（做入场动画）

// 每次重绘前调用：重新计算，处理新出现的和被别处确认的
function update(){
  if (!ready()){ current = []; return; }
  const now = App.clock.now();
  const next = R.dueList(visEv(), visTd(), now, 0);
  const keys = new Set(next.map(keyOf));
  const fresh = next.filter(d => !shown.has(keyOf(d)));
  entering = new Set(fresh.map(keyOf));
  if (fresh.length){
    App.platform.notify.chime();
    fresh.forEach(d => App.data.log.run("remind_shown", null, {coll: d.kind === "event" ? "events" : "todos", id: d.item.id}));
  }
  for (const k of shown){
    if (!keys.has(k) && !handledHere.has(k)){
      const [kind, id] = k.split(":");
      const item = (kind === "event" ? visEv() : visTd()).find(x => x.id === id);
      if (item && item.notifiedFor) toast.show("已在别处确认");
    }
  }
  current = next;
  fresh.forEach(d => shown.add(keyOf(d)));
  shown = new Set([...shown].filter(k => keys.has(k)));
}
// 情况 A 用：这一条现在是否在提醒中，是就返回 {at}
function forItem(kind, item){
  const d = current.find(x => x.kind === kind && x.item.id === item.id);
  return d ? {at: d.at} : null;
}
// 提醒卡片上的第一行文字
function headline(d){
  const t = App.clock.today(), x = d.item;
  if (d.kind === "event"){
    if (!x.time) return relDay(x.date, t).split(" ")[0] + " 全天";
    const span = R.eventSpan(x), nowMs = App.clock.now();
    const mins = Math.round((span.start - nowMs) / 60000);
    return x.date === t ? startsText(mins, minOfDay(span.end)) : relDay(x.date, t) + " " + x.time;
  }
  return dueText(x.due, t);
}
function actions(d, cls){
  return h("div",{class:"r-acts " + (cls || "")},
    h("button",{type:"button",class:"ok",onclick: ev => { ev.stopPropagation(); ack(d); }},"知道了"),
    h("button",{type:"button",class:"later",onclick: ev => { ev.stopPropagation(); snooze(d); }},"10 分钟后"));
}
function ack(d){ handledHere.add(keyOf(d)); App.data.write.ackReminder(d.kind, d.item, d.at); }
function snooze(d){ handledHere.add(keyOf(d)); App.data.write.snoozeReminder(d.kind, d.item, d.at); toast.show("10 分钟后再提醒"); }
const offline = () => globalThis.navigator && navigator.onLine === false;

// 下一件事卡片进入提醒状态时要插的两部分（由 ui/today.js 调用）
function decorateNext(kind, item){
  const r = forItem(kind, item);
  if (!r) return null;
  const d = {kind, item, at: r.at};
  return {
    bell: h("span",{class:"bell-row"}, h("span",{class:"bell-ico", html:ICON_BELL}), "提醒：" + headline(d), offline() ? h("span",{class:"offline-tag"},"离线，提醒可能延迟") : null),
    acts: actions(d),
    isNew: entering.has(keyOf(d)),
  };
}

// 情况 B：反色卡片。exclude：已经由下一件事卡片显示的那一条（{kind, id}）
function renderCard(exclude){
  const slot = $("remind"); if (!slot) return;
  const list = current.filter(d => !(exclude && d.kind === exclude.kind && d.item.id === exclude.id));
  slot.textContent = "";
  if (!list.length) return;
  const d = list[0], x = d.item;
  const meta = [x.project, d.kind === "event" ? "日程" : "待办"].filter(Boolean).join("  ");
  const card = h("div",{class:"remind-inv", role:"alert"},
    h("span",{class:"bell-row"}, h("span",{class:"bell-ico", html:ICON_BELL}), headline(d),
      offline() ? h("span",{class:"offline-tag"},"离线，提醒可能延迟") : null,
      list.length > 1 ? h("span",{class:"more-n", "aria-label":"还有 " + (list.length - 1) + " 条提醒"},"+" + (list.length - 1)) : null),
    h("span",{class:"rt"}, x.title),
    meta ? h("span",{class:"rm"}, meta) : null,
    actions(d));
  if (entering.has(keyOf(d)) || slot.dataset.key !== keyOf(d)) card.classList.add("enter");
  slot.dataset.key = keyOf(d);
  slot.append(card);
}

// 今天页看得见吗（手机上在今天页，或者电脑上三栏同时显示）
const todayVisible = () => V.view === "today" || (globalThis.matchMedia && matchMedia("(min-width:960px)").matches);

function init(){
  App.clock.on("wake", () => App.ui.render());
}

App.ui.remind = {init, update, forItem, decorateNext, renderCard, todayVisible, ICON_BELL};
})();
// ==== src/scripts/ui/theme.js ====
(function(){
// 职责：深色 / 浅色切换（ADR-008）。抬头右上角的圆形按钮弹出黑色胶囊三选一（跟随系统 / 浅色 / 深色），浮层盖在内容上；
//       选完立即生效、停 300ms 后收起；点外面或按 Esc 关闭，焦点回到按钮；方向键在三项间移动。
//       两个维度：<html data-theme="light|dark">（跟随系统时不设）和 <html data-skin="bento">；偏好存 pv-theme、pv-skin。
//       切换时给 <html> 临时加 .theme-anim，让颜色过渡 200ms（减少动效时不过渡）。
// 依赖：core/const.js、platform/prefs.js、ui/dom.js
App.ui = App.ui || {};

const C = App.core.C;
const prefs = App.platform.prefs;
const {$} = App.ui.dom;

const NAMES = {system:"跟随系统", light:"浅色", dark:"深色"};
const ICONS = {
  system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
};
let mode = "system", closeTimer = null, animTimer = null;
const root = () => document.documentElement;
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const valid = (v, list, dflt) => list.includes(v) ? v : dflt;

function apply(m, animate){
  mode = valid(m, C.THEMES, "system");
  if (animate && !reduced()){
    root().classList.add("theme-anim");
    clearTimeout(animTimer); animTimer = setTimeout(() => root().classList.remove("theme-anim"), C.THEME_FADE_MS + 50);
  }
  if (mode === "system") root().removeAttribute("data-theme"); else root().setAttribute("data-theme", mode);
  const btn = $("theme-btn");
  if (btn){ btn.innerHTML = ICONS[mode]; btn.setAttribute("aria-label", "外观：" + NAMES[mode]); }
  document.querySelectorAll("#theme-pick [role=radio]").forEach(r => {
    const on = r.dataset.mode === mode;
    r.setAttribute("aria-checked", on ? "true" : "false");
    r.tabIndex = on ? 0 : -1;
  });
}
const isOpen = () => !$("theme-pick").hidden;
function open(){
  clearTimeout(closeTimer);
  const pick = $("theme-pick");
  pick.hidden = false; pick.classList.remove("on");
  $("theme-btn").setAttribute("aria-expanded", "true");
  requestAnimationFrame(() => { pick.classList.add("on"); (pick.querySelector("[aria-checked=true]") || pick.querySelector("[role=radio]")).focus(); });
}
function close(focusBtn){
  clearTimeout(closeTimer);
  const pick = $("theme-pick");
  if (pick.hidden) return;
  pick.classList.remove("on");
  $("theme-btn").setAttribute("aria-expanded", "false");
  closeTimer = setTimeout(() => { pick.hidden = true; }, reduced() ? 0 : C.THEME_CLOSE_MS);
  if (focusBtn) $("theme-btn").focus();
}
function choose(m){
  apply(m, true);
  prefs.set(prefs.KEYS.theme, mode);
  clearTimeout(closeTimer);
  closeTimer = setTimeout(() => close(true), C.THEME_HOLD_MS);
}
function onKey(e){
  if (!isOpen()) return;
  if (e.key === "Escape"){ e.preventDefault(); close(true); return; }
  const radios = [...document.querySelectorAll("#theme-pick [role=radio]")];
  const i = radios.indexOf(document.activeElement);
  if (i < 0) return;
  const step = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
  if (step){ e.preventDefault(); radios[(i + step + radios.length) % radios.length].focus(); }
}

function init(){
  root().setAttribute("data-skin", valid(prefs.get(prefs.KEYS.skin, "bento"), C.SKINS, "bento"));
  apply(prefs.get(prefs.KEYS.theme, "system"), false);
  $("theme-btn").onclick = e => { e.stopPropagation(); isOpen() ? close(true) : open(); };
  document.querySelectorAll("#theme-pick [role=radio]").forEach(r => { r.onclick = e => { e.stopPropagation(); choose(r.dataset.mode); }; });
  document.addEventListener("click", e => { if (isOpen() && !$("theme-pick").contains(e.target)) close(true); });
  document.addEventListener("keydown", onKey);
}

App.ui.theme = {init, apply, open, close, current: () => mode};
})();
// ==== src/scripts/ui/search.js ====
(function(){
// 职责：待办页顶部的搜索：在标题、备注、原话里找，范围包括已完成的待办和过去的日程（不含已删除，不受项目筛选影响）。
//       有结果时显示“N 条”并高亮关键词，结果替换掉原来的列表；没结果时显示“没找到”和“清空”按钮；清空或按 Esc 回到原列表。
// 依赖：core/const.js、logic/search.js、data/state.js、ui/dom.js
// 运行时调用：ui/todos.js、ui/schedule.js
App.ui = App.ui || {};

const C = App.core.C;
const {search} = App.logic.search;
const visEv = App.data.visEv, visTd = App.data.visTd;
const {$, h} = App.ui.dom;

let q = "";
const active = () => !!q.trim();
function clear(){ q = ""; $("search").value = ""; render(); $("search").focus(); }

function render(){
  const box = $("search-res"), main = $("td-main");
  box.textContent = "";
  box.hidden = !active(); main.hidden = active();
  if (!active()) return;
  const res = search(visEv(), visTd(), q, C.SEARCH_MAX);
  if (!res.length){
    box.append(h("div",{class:"empty search-none"}, h("strong",null,"没找到"), "换个词试试，也可以在聊天里让 Claude 帮你找。",
      h("button",{class:"btn-clear",type:"button",onclick:clear},"清空")));
    return;
  }
  box.append(h("div",{class:"res-n",role:"status"}, h("span",null, res.length + " 条"), h("button",{class:"btn-clear",type:"button",onclick:clear},"清空")));
  const ul = h("ul",{class:"todos"}), ev = h("div",{class:"evlist"});
  for (const r of res){
    if (r.kind === "todo") ul.append(App.ui.todos.row(r.item, {q}));
    else ev.append(App.ui.schedule.evBlock(r.item, {q, showDate:true}));
  }
  if (ul.childNodes.length) box.append(ul);
  if (ev.childNodes.length) box.append(ev);
}
function init(){
  $("search").oninput = () => { q = $("search").value; render(); };
  $("search").onkeydown = e => { if (e.key === "Escape" && active()){ e.preventDefault(); e.stopPropagation(); clear(); } };
}

App.ui.search = {init, render, clear, active};
})();
// ==== src/scripts/ui/trash.js ====
(function(){
// 职责：待办页的“最近删除”：默认折叠成一行色块“最近删除 N 件  30 天后自动清理 ›”（采纳结论 #9），展开后每条显示
//       标题、类型、“N 天前删除”和“恢复”按钮；恢复时这一行先淡出，条目回到原位并用 .fresh 短暂高亮（TC-DEL-09）。
//       断网或没连上数据时“恢复”置灰（TC-DEL-19），恢复网络后自动可用。
// 依赖：core/const.js、data/state.js、data/write.js、data/archive.js、ui/dom.js、ui/view-state.js
// 运行时调用：ui/render.js、App.clock
App.ui = App.ui || {};

const C = App.core.C;
const write = App.data.write, archive = App.data.archive;
const {$, h} = App.ui.dom;
const V = App.ui.view;

let open = false;
const online = () => navigator.onLine !== false && App.data.isConnected();
function ago(ms){
  const d = Math.floor((App.clock.now() - ms) / C.DAY_MS);
  return d <= 0 ? "今天删除" : d + " 天前删除";
}
function restore(r, row){
  row.classList.add("leaving");
  setTimeout(() => {
    const id = r.item.id;
    V.flash.add(id);
    setTimeout(() => { V.flash.delete(id); }, C.FRESH_MS);
    write.restore(r.coll, r.item);
  }, 240);   // 与 todo.css 的 .leaving 动画 .24s 一致
}
function render(){
  const btn = $("trash-toggle"), list = $("trash-list"), items = archive.trash();
  btn.hidden = !items.length;
  if (!items.length){ open = false; list.hidden = true; list.textContent = ""; return; }
  btn.textContent = "";
  btn.append(h("span",null, h("b",null,"最近删除 " + items.length + " 件"), "  " + C.TRASH_KEEP_DAYS + " 天后自动清理"), h("span",{class:"chev","aria-hidden":"true"},"›"));
  btn.setAttribute("aria-expanded", open ? "true" : "false");
  list.hidden = !open; list.textContent = "";
  if (!open) return;
  const ok = online();
  if (!ok) list.append(h("p",{class:"trash-off"},"网络断开了，恢复网络后才能恢复条目。"));
  for (const r of items){
    const row = h("div",{class:"trash-row"},
      h("span",{class:"tr-b"}, h("span",{class:"tr-t"}, r.item.title || "（没有标题）"),
        h("span",{class:"tr-m"}, (r.kind === "event" ? "日程" : "待办") + " · " + ago(r.item.deletedAt))),
      h("button",{class:"restore",type:"button",disabled:!ok,"aria-label":"恢复：" + (r.item.title || "没有标题的条目")},"恢复"));
    row.querySelector(".restore").onclick = () => restore(r, row);
    list.append(row);
  }
}
function init(){
  $("trash-toggle").onclick = () => { open = !open; render(); };
  addEventListener("online", render); addEventListener("offline", render);
}

App.ui.trash = {init, render};
})();
// ==== src/scripts/ui/backup.js ====
(function(){
// 职责：待办面板底部的“导出备份（JSON）”和“运行记录”。
//       导出：读出 events、todos、logs 全部数据（含已删除条目，需求澄清 #19），交给 platform/download.js 保存为 .json；
//             用户拒绝或这里不能下载时给出提示，不重试。
//       运行记录（只读）：展开时读取最近 7 天所有设备的日志，列出时间、动作、集合和编号，不显示任何内容（ADR-010）。
// 依赖：core/const.js、core/date.js、data/archive.js、platform/download.js、ui/dom.js、ui/toast.js
// 运行时调用：App.clock
App.ui = App.ui || {};

const C = App.core.C;
const {pad} = App.core.date;
const archive = App.data.archive, download = App.platform.download;
const {$, h} = App.ui.dom;
const toast = App.ui.toast;

const SAVE_ERR = {
  declined: "已取消导出",
  rate_limited: "已经有一个下载在等你确认",
  too_large: "备份太大，暂时导不出来",
  format: "这里不允许下载 JSON 文件",
  unavailable: "这里不能下载文件，可以在 claude.ai 网页里打开再导出",
};
async function exportBackup(){
  const btn = $("export");
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = "正在准备备份…";
  try {
    let data;
    try { data = await archive.backup(App.clock.now()); }
    catch(e){ toast.show("没读到数据，检查网络后再试"); return; }
    const filename = "planner-backup-" + App.clock.today() + ".json";
    try {
      await download.save({filename, data: JSON.stringify(data, null, 2)});
      toast.show("已导出备份：" + data.counts.events + " 项日程、" + data.counts.todos + " 件待办");
    } catch(e){ toast.show(SAVE_ERR[e && e.code] || "没导出成功"); }
  } finally { btn.disabled = false; btn.textContent = "导出备份（JSON）"; }
}

const ACT = {create:"新建", update:"修改", done:"完成", undone:"取消完成", reschedule:"改期", delete:"删除", restore:"恢复",
  purge:"彻底清理", convert:"改类型", ack:"知道了", snooze:"稍后提醒", save_failed:"保存失败", timeout:"超时",
  disconnect:"断线", reconnect:"重新连上", remind_shown:"弹出提醒", remind_ack:"提醒：知道了", remind_snooze:"提醒：10 分钟后"};
const COLL = {events:"日程", todos:"待办", logs:"日志"};
const when = ms => { const d = new Date(ms); return pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };

let logsOpen = false;
async function renderLogs(){
  const list = $("log-list");
  $("log-toggle").setAttribute("aria-expanded", logsOpen ? "true" : "false");
  list.hidden = !logsOpen; list.textContent = "";
  if (!logsOpen) return;
  list.append(h("p",{class:"log-note"},"读取中…"));
  let rows;
  try { rows = await archive.recentLogs(App.clock.today(), C.LOG_VIEW_DAYS); }
  catch(e){ list.textContent = ""; list.append(h("p",{class:"log-note"},"读不到运行记录，检查网络后再试。")); return; }
  if (!logsOpen) return;
  list.textContent = "";
  if (!rows.length){ list.append(h("p",{class:"log-note"},"最近 " + C.LOG_VIEW_DAYS + " 天没有记录。")); return; }
  const ol = h("ol",{class:"log-rows","aria-label":"最近 " + C.LOG_VIEW_DAYS + " 天的运行记录"});
  for (const r of rows){
    ol.append(h("li",{class:"log-row" + (r.kind === "run" ? " run" : "")},
      h("span",{class:"lg-t"}, when(r.t)), h("span",{class:"lg-a"}, ACT[r.act] || r.act),
      h("span",{class:"lg-c"}, COLL[r.coll] || r.coll), h("span",{class:"lg-i"}, r.id ? r.id.slice(0, 10) : "")));
  }
  list.append(ol, h("p",{class:"log-note"},"只记操作类型和编号，不记标题、备注等内容。"));
}
function init(){
  $("export").onclick = exportBackup;
  $("log-toggle").onclick = () => { logsOpen = !logsOpen; renderLogs(); };
}

App.ui.backup = {init, exportBackup};
})();
// ==== src/scripts/app.js ====
(function(){
// 职责：启动入口：选定存储适配器（全项目唯一一处配置）、创建统一时钟、绑定各模块事件、首屏渲染、连接数据、启动时钟。
//       App.BUILD 由 build.py 在包头写入：发布版为 {storage:"claude-db"}，测试页为 {storage:"mock-db"}。
// 依赖：core/clock.js、platform/index.js、platform/env.js、platform/prefs.js、platform/claude-db.js、data/bus.js、data/store.js、data/log.js、data/write.js、data/subscribe.js、
//       ui/view-state.js、ui/render.js、ui/today.js、ui/schedule.js、ui/todos.js、ui/sheet.js、ui/nav.js、ui/remind.js、ui/theme.js、
//       platform/download.js、ui/search.js、ui/trash.js、ui/backup.js

// —— 存储适配器配置 ——
// 可选值：App.platform.storage 里注册过的名字。"claude-db"（claude.ai）、"mock-db"（测试页）；
// 以后独立服务器版加 "rest" 适配器后在这里切换。
const STORAGE = (App.BUILD && App.BUILD.storage) || "claude-db";
App.data.store.use(App.platform.storage[STORAGE]());
// —— 下载适配器配置 ——（"claude"：claude.ai 的 downloads 能力；"mock"：测试页的模拟实现）
App.platform.download.use((App.BUILD && App.BUILD.download) || "claude");

// —— 统一时钟（全页面只有这一个“现在”）——
App.clock = App.core.clock.create(App.platform.env);
App.data.write.init(App.clock);
App.data.log.init({clock: App.clock, device: App.platform.prefs.deviceId(), src: "page"});   // 运行日志（ADR-010）
App.platform.env.onHidden(() => App.data.log.flush());
App.ui.viewState.init(App.clock.today());

// —— 事件绑定 ——
App.ui.render.init();          // 数据事件 → 重绘 / 提示
App.ui.todos.init();
App.ui.sheet.init();
App.ui.nav.init();
App.ui.schedule.init();
App.ui.nav.initNet();
App.ui.theme.init();           // 深浅色（ADR-008）
App.ui.search.init();          // 待办页搜索
App.ui.trash.init();           // 最近删除
App.ui.backup.init();          // 导出备份、运行记录
App.ui.remind.init();          // v3 预留

App.clock.on("daychange", ({prev, day}) => { App.ui.viewState.onDayChange(prev, day); App.ui.render(); });
App.clock.on("tick", () => { if (App.ui.sheet.isClosed()) App.ui.render(); });

// —— 首屏与数据 ——
App.ui.nav.go(App.ui.view.view); App.ui.render();
App.data.subscribe.start();
// 每天最多一次：清理 30 天前删除的条目和 90 天前的日志（等两个集合都加载完再做）
App.data.on("loaded", () => {
  const P = App.platform.prefs, day = App.clock.today();
  if (P.get(P.KEYS.purged, "") === day) return;
  P.set(P.KEYS.purged, day);
  App.data.write.purgeDeleted(); App.data.log.purge();
});
App.clock.start();
})();
})();
