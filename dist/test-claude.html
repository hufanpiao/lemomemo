// 模拟 window.claude（v2 时代的 测试/mock.js 原样迁来）：提供 claude.use("db") 的集合 / 文档接口和一组示例数据，
// 用来在本地验证 platform/claude-db.js 适配器。由 build.py 拼进 dist/test-claude.html（放在页面脚本之前，单独一个 <script>）。
// 依赖：无。
(function(){
  const pad=n=>String(n).padStart(2,"0"); const d=new Date(); const ymd=x=>x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate());
  const off=n=>{const x=new Date(d);x.setDate(x.getDate()+n);return ymd(x)}; const H=d.getHours();
  const store={events:{
    e1:{title:"NEOX 横版对片",date:off(0),time:pad(Math.max(8,H-1))+":00",durationMin:90,project:"NEOX",note:"腾讯会议"},
    e2:{title:"SignPlex 客户反馈会",date:off(0),time:pad(Math.min(22,H+1))+":30",durationMin:60,project:"SignPlex",source:"chat"},
    e3:{title:"SOIL STUDIO 现场踩点",date:off(1),time:"10:00",durationMin:180,project:"SOIL STUDIO",note:"望京"},
    e4:{title:"体检",date:off(3),time:"",project:""}},
   todos:{
    t1:{title:"交 SignPlex 韩文版成片",done:false,due:off(-2),important:true,project:"SignPlex",createdAt:1},
    t2:{title:"NEOX 竖版 4K 导出",done:false,due:off(0),important:false,project:"NEOX",createdAt:2},
    t3:{title:"挑 4 首配乐候选",done:false,due:off(5),important:false,project:"SOIL STUDIO",createdAt:3,source:"chat"},
    t4:{title:"整理素材盘",done:false,due:"",important:false,project:"",createdAt:4},
    t5:{title:"回复报价邮件",done:true,doneAt:Date.now()-3600e3,due:off(0),important:true,project:"",createdAt:5}}};
  const subs={events:[],todos:[]};
  const snap=c=>({docs:Object.entries(store[c]).map(([id,v])=>({id,exists:true,data:()=>v})),docChanges:()=>[]});
  const emit=c=>setTimeout(()=>subs[c].forEach(f=>f(snap(c))),120);
  let n=0;
  const coll=c=>({onSnapshot(f){subs[c].push(f);emit(c);return()=>{}},
    doc(id){id=id||("m"+(++n));return{id,async set(v){store[c][id]=v;emit(c)},async update(v){Object.assign(store[c][id],v);emit(c)},async delete(){delete store[c][id];emit(c)}}}});
  window.claude={use:async()=>({collection:coll})};
})();
</script>
<title>日程与待办</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* 设计变量：颜色、字体、圆角、阴影；浅色为默认，深色有两套写法
   （跟随系统 prefers-color-scheme，以及 data-theme="dark" 强制深色）。
   依赖：无。必须最先拼接。 */
:root{
  --bg:#e6e7ea; --panel:#ffffff; --panel-2:#f2f3f5; --ink:#121316; --muted:#6a6e76; --line:#e3e4e8;
  --dock:#121316; --dock-ink:#f3f3f4; --pill-on:#ffffff; --pill-on-ink:#121316;
  --yellow:#f1df4a; --on-yellow:#121316; --red:#e2372b; --red-soft:#fbe2df; --focus:#3a6cf4;
  --p1:#f3e27a; --p2:#bca8f6; --p3:#f5a5c8; --p4:#95dfa8; --p5:#95d4f2; --p6:#f6a78c; --p7:#d6d7dc; --on-p:#141414;
  --shadow:0 18px 40px -18px rgba(18,19,22,.35);
  --f-num:"Manrope","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --r-panel:26px; --r-block:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0d0f; --panel:#17181b; --panel-2:#212226; --ink:#f1f1f3; --muted:#8d919a; --line:#2a2b30;
  --dock:#202125; --dock-ink:#f1f1f3; --pill-on:#f1f1f3; --pill-on-ink:#121316;
  --red:#ff5a4d; --red-soft:#3a1a17; --focus:#8fb0ff;
  --p1:#e8d56c; --p2:#ad98ee; --p3:#ea93ba; --p4:#86d29a; --p5:#86c6e6; --p6:#ec977c; --p7:#b9bac0;
  --shadow:0 18px 40px -18px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0d0f; --panel:#17181b; --panel-2:#212226; --ink:#f1f1f3; --muted:#8d919a; --line:#2a2b30;
  --dock:#202125; --dock-ink:#f1f1f3; --pill-on:#f1f1f3; --pill-on-ink:#121316;
  --red:#ff5a4d; --red-soft:#3a1a17; --focus:#8fb0ff;
  --p1:#e8d56c; --p2:#ad98ee; --p3:#ea93ba; --p4:#86d29a; --p5:#86c6e6; --p6:#ec977c; --p7:#b9bac0;
  --shadow:0 18px 40px -18px rgba(0,0,0,.8); color-scheme:dark}
/* 基础排版：盒模型、body 底色与安全区留白、表单控件继承字体、焦点框、数字字体、减少动效。
   依赖：tokens.css。 */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px calc(120px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* 页面骨架：.app 容器、三视图网格（手机单页切换，≥960px 三栏并排）、底部浮动导航与黄色＋。
   原注释：便当格面板 + 马卡龙色块条目；手机上分“今天/日程/待办”三页，底部浮动导航加黄色＋；≥960px 三栏同时显示
   依赖：tokens.css、base.css。 */
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
/* 网格 */
.grid{display:grid;grid-template-columns:1fr;gap:16px}
.view{display:none;flex-direction:column;gap:16px;min-width:0}
.view.on{display:flex}
@media (min-width:960px){
  .grid{grid-template-columns:1.1fr 1fr 1fr;align-items:start}
  .view{display:flex}
  .nav{display:none!important}
}
/* 底部浮动导航 */
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:10px;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock > *{pointer-events:auto}
.nav{position:relative;display:flex;background:var(--dock);border-radius:999px;padding:5px;box-shadow:var(--shadow)}
.nav button{position:relative;z-index:1;border:0;background:none;color:var(--dock-ink);border-radius:999px;padding:0 18px;height:46px;font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px;transition:color .25s}
.nav button[aria-current=page]{color:var(--pill-on-ink)}
.nav button svg{width:18px;height:18px;flex:none}
.nav .ind{position:absolute;top:5px;height:46px;border-radius:999px;background:var(--pill-on);transition:left .38s cubic-bezier(.34,1.3,.64,1),width .38s cubic-bezier(.34,1.3,.64,1)}
.nav .lab{overflow:hidden;white-space:nowrap}
.plus{width:56px;height:56px;border-radius:50%;border:0;background:var(--yellow);color:var(--on-yellow);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.plus svg{width:26px;height:26px}
@media (min-width:960px){.dock{justify-content:flex-end}}
/* 组件：页面抬头（大号月日、星期年份、“今天完成 / 没赶上”小胶囊）。
   依赖：tokens.css。 */
/* 抬头 */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 4px 0}
.top h1{margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-weight:500}
.top .md{font-family:var(--f-num);font-weight:800;font-size:clamp(34px,8vw,44px);line-height:1;letter-spacing:-.02em}
.top .md small{font-family:var(--f-body);font-weight:700;font-size:.62em;margin-left:2px}
.top .sub{font-size:16px;color:var(--muted)}
.top-chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:14px;background:var(--panel);border:0}
.chip.late{background:var(--red);color:#fff;font-weight:500}
.chip b{font-family:var(--f-num);font-weight:700}
/* 组件：通用面板 .panel、面板标题行 .ph、文字链接按钮、圆形图标按钮。
   依赖：tokens.css。 */
.panel{background:var(--panel);border-radius:var(--r-panel);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ph h2{margin:0;font-size:20px;font-weight:700;line-height:1.3}
.ph .meta{font-size:14px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.round{width:36px;height:36px;border-radius:50%;border:0;background:var(--panel-2);display:grid;place-items:center;flex:none}
.round svg{width:18px;height:18px}
/* 组件：“下一件事”大卡片（含空闲状态）。
   依赖：tokens.css。 */
/* 下一件事 */
.next{border-radius:var(--r-panel);padding:20px;color:var(--on-p);display:flex;flex-direction:column;gap:6px;position:relative;min-height:168px}
.next .lbl{font-size:14px;font-weight:500;opacity:.75}
.next .big{font-family:var(--f-num);font-weight:800;font-size:56px;line-height:1;letter-spacing:-.03em}
.next .cd{font-size:16px;font-weight:500}
.next .tt{font-size:20px;font-weight:700;line-height:1.35;overflow-wrap:anywhere;padding-right:56px}
.next .proj{font-size:14px;opacity:.75}
.next .act{position:absolute;right:16px;bottom:16px;width:48px;height:48px;border-radius:50%;border:0;background:var(--on-p);color:#fff;display:grid;place-items:center}
.next .act svg{width:22px;height:22px}
.next.empty{background:var(--panel);color:var(--ink)}
.next.empty .big{font-size:40px}
/* 组件：“没赶上”红色面板、行内“今天/明天”小按钮、深色按钮。
   依赖：tokens.css、panel.css。 */
/* 没赶上 */
.late-panel{background:var(--red-soft)}
.late-panel .ph h2{color:var(--red)}
.late-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--red) 18%,transparent)}
.late-row:first-of-type{border-top:0}
.late-row .t{overflow-wrap:anywhere;min-width:0}
.late-row .t small{display:block;font-size:12px;color:var(--red)}
.mini{display:flex;gap:6px}
.mini button{border:0;border-radius:999px;padding:6px 12px;font-size:14px;background:var(--panel);min-height:36px}
.btn-dark{border:0;border-radius:999px;padding:10px 18px;background:var(--ink);color:var(--panel);font-weight:500;min-height:44px}
/* 组件：今天的时间轴（小时刻度、色块、现在红线、全天胶囊）。
   依赖：tokens.css。 */
/* 时间轴（今天） */
.tl{position:relative;display:grid;grid-template-columns:44px 1fr;}
.tl .hours{position:relative}
.tl .hours span{position:absolute;left:0;font-family:var(--f-num);font-size:12px;color:var(--muted);transform:translateY(-50%)}
.tl .lane{position:relative;border-left:1px solid var(--line)}
.tl .lane i{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.blk{position:absolute;border-radius:12px;padding:6px 10px;color:var(--on-p);overflow:hidden;border:0;text-align:left;display:flex;flex-direction:column;gap:0;line-height:1.3}
.blk .bt{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk .bm{font-size:12px;opacity:.75;font-family:var(--f-num);white-space:nowrap}
.blk.past{filter:saturate(.35);opacity:.7}
.now{position:absolute;left:-6px;right:0;height:0;border-top:2px solid var(--red);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-1px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.now span{position:absolute;right:0;top:-12px;background:var(--red);color:#fff;font-family:var(--f-num);font-weight:700;font-size:12px;padding:1px 8px;border-radius:999px}
.allday{display:flex;flex-wrap:wrap;gap:6px}
.allday .ad{border:0;border-radius:999px;padding:4px 12px;font-size:14px;color:var(--on-p);font-weight:500}
/* 组件：日程页的一周日期条（今天描边、选中实心、彩色小圆点）。
   依赖：tokens.css。 */
/* 日期条 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:0;background:none;border-radius:16px;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px}
.day .w{font-size:12px;color:var(--muted)}
.day .n{font-family:var(--f-num);font-weight:700;font-size:16px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.day.today .n{box-shadow:inset 0 0 0 2px var(--ink)}
.day.sel .n{background:var(--ink);color:var(--panel)}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots b{width:6px;height:6px;border-radius:50%}
.day:hover .n{background:var(--panel-2)}
.day.sel:hover .n{background:var(--ink)}
/* 组件：日程色块列表与日期小标题。
   依赖：tokens.css。 */
/* 日程色块 */
.evlist{display:flex;flex-direction:column;gap:8px}
.dhead{font-size:14px;color:var(--muted);font-weight:500;padding:6px 2px 0}
.dhead.is-today{color:var(--ink);font-weight:700}
.ev{border:0;border-radius:var(--r-block);padding:12px 14px;color:var(--on-p);display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;width:100%}
.ev .et{font-family:var(--f-num);font-weight:800;font-size:16px;line-height:1.4}
.ev .et small{display:block;font-weight:600;font-size:12px;opacity:.7}
.ev .eb{min-width:0}
.ev .en{font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.ev .ex{font-size:14px;opacity:.78;overflow-wrap:anywhere}
/* 组件：待办列表（项目筛选胶囊、圆形勾选、划线动画、标签、离开与新到达动画）。
   .f 胶囊也被弹出层的项目选择复用。依赖：tokens.css。 */
/* 待办 */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.f{border:0;border-radius:999px;padding:6px 14px;font-size:14px;background:var(--panel-2);min-height:36px;display:inline-flex;align-items:center;gap:6px}
.f .sw{width:10px;height:10px;border-radius:50%}
.f[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.todos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.td{display:grid;grid-template-columns:44px 1fr;align-items:start;border-top:1px solid var(--line);position:relative}
.td:first-child{border-top:0}
.ck{width:44px;height:48px;border:0;background:none;display:grid;place-items:center;padding:0}
.ck span{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--muted);display:grid;place-items:center;transition:transform .16s cubic-bezier(.34,1.4,.64,1),background .16s}
.ck svg{width:14px;height:14px;opacity:0;color:var(--panel)}
.td.done .ck span{background:var(--ink);box-shadow:none}
.td.done .ck svg{opacity:1}
.ck:active span{transform:scale(.9)}
.tb{border:0;background:none;text-align:left;padding:12px 4px 12px 0;min-width:0;display:flex;flex-direction:column;gap:4px;width:100%}
.tb .tt{line-height:1.45;overflow-wrap:anywhere;background-image:linear-gradient(var(--muted),var(--muted));background-repeat:no-repeat;background-position:0 55%;background-size:0 1.5px;transition:background-size .28s cubic-bezier(.22,1,.36,1),color .2s}
.td.done .tb .tt{background-size:100% 1.5px;color:var(--muted)}
.td.imp .tb .tt{font-weight:700}
.td.imp .tb .tt::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);margin-right:8px;vertical-align:2px}
.td.done.imp .tb .tt::before{background:var(--muted)}
.tags{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px}
.tag .sw{width:8px;height:8px;border-radius:50%}
.tag.due-today{color:var(--ink);font-weight:500}
.tag.over{color:var(--red);font-weight:500}
.tag.ai{border-radius:999px;padding:0 8px;background:var(--panel-2);color:var(--muted)}
.td.leaving{animation:leave .24s cubic-bezier(.4,0,.2,1) forwards}
@keyframes leave{to{opacity:0;transform:translateY(-4px)}}
.fresh{animation:fresh 2.2s ease-out}
@keyframes fresh{0%,70%{box-shadow:inset 3px 0 0 var(--ink),0 0 0 3px color-mix(in srgb,var(--yellow) 70%,transparent)}100%{box-shadow:none}}
.donefold{display:flex;flex-direction:column;gap:0}
/* 组件：空状态提示框与加载骨架。
   依赖：tokens.css。 */
/* 空状态与骨架 */
.empty{border-radius:var(--r-block);background:var(--panel-2);padding:18px;color:var(--muted);font-size:14px}
.empty strong{display:block;color:var(--ink);font-size:16px;font-weight:700;margin-bottom:2px}
.sk{height:56px;border-radius:var(--r-block);background:var(--panel-2)}
@media (prefers-reduced-motion:no-preference){.sk{animation:pulse 1.2s ease-in-out infinite alternate}}
@keyframes pulse{to{opacity:.45}}
/* 组件：底部提示条（带撤销/重试按钮）与顶部断网红条。
   依赖：tokens.css。 */
/* 提示条 */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);opacity:0;background:var(--dock);color:var(--dock-ink);border-radius:999px;padding:6px 6px 6px 18px;display:flex;align-items:center;gap:12px;font-size:14px;transition:opacity .2s ease-out,transform .2s ease-out;pointer-events:none;max-width:calc(100% - 32px);z-index:30;border:1px solid var(--line)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;border-radius:999px;background:var(--yellow);color:var(--on-yellow);padding:6px 14px;font-weight:700;min-height:36px}
.netbar{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--red);color:#fff;font-size:14px;text-align:center;padding:calc(4px + env(safe-area-inset-top,0px)) 16px 4px}
/* 组件：新建/编辑底部弹出层（遮罩、一句话输入框、类型切换、表单字段、操作按钮）。
   依赖：tokens.css、todo.css（.f 胶囊）。 */
/* 底部弹出层 */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.45);z-index:50;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--panel);border-radius:28px 28px 0 0;max-height:92%;overflow-y:auto;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .34s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;gap:14px}
.sheet.on{transform:none}
@media (min-width:720px){.sheet{left:50%;right:auto;width:560px;bottom:24px;border-radius:28px;transform:translate(-50%,calc(100% + 40px))}.sheet.on{transform:translate(-50%,0)}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet h3{margin:0;font-size:20px}
.q{width:100%;border:0;border-radius:18px;background:var(--panel-2);padding:14px 16px;font-size:18px;min-height:56px}
.hint{font-size:12px;color:var(--muted);margin-top:-6px}

<script>
(function(){
const App = {};
App.BUILD = {"target": "claude", "storage": "claude-db"};
// ==== src/scripts/core/date.js ====
(function(){
// 日期与时间工具：以 "YYYY-MM-DD" 字符串表示日期，提供解析、加减天数、相差天数、
// "HH:MM" 与分钟互转、本周一、“10月23日”格式。today()/nowMin() 读当前时间。
// 依赖：无。不碰 document / window，可在 Node 中直接加载（构建时每个文件各包一层函数作用域）。
App.core = App.core || {};

const WK = ["周日","周一","周二","周三","周四","周五","周六"];
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => ymd(new Date());
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const dayDiff = (a,b) => Math.round((parse(a)-parse(b))/86400000);
const hm2m = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const m2hm = m => pad(Math.floor(m/60)%24)+":"+pad(m%60);
const nowMin = () => { const n = new Date(); return n.getHours()*60+n.getMinutes(); };
function mondayOf(s){ const d = parse(s); return addDays(s, -((d.getDay()+6)%7)); }
const md = s => { const d = parse(s); return (d.getMonth()+1)+"月"+d.getDate()+"日"; };

App.core.date = {WK, pad, ymd, parse, today, addDays, dayDiff, hm2m, m2hm, nowMin, mondayOf, md};
})();
// ==== src/scripts/core/dom.js ====
(function(){
// DOM 小工具：$(id) 取元素、h() 一次建好带属性和子节点的元素、对勾图标、骨架和空状态框。
// 只在函数被调用时才访问 document，加载本文件本身不需要页面。
// 依赖：无。
App.core = App.core || {};

const $ = id => document.getElementById(id);
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const k in (attrs||{})){
    const v = attrs[k]; if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el[k] = v; else if (k === "html") el.innerHTML = v; else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; el.append(c.nodeType ? c : String(c)); }
  return el;
}
function skeleton(n){ return Array.from({length:n}, () => h("div",{class:"sk"})); }
function emptyBox(title, text){ return h("div",{class:"empty"}, h("strong",null,title), text); }

App.core.dom = {$, h, ICON_CHECK, skeleton, emptyBox};
})();
// ==== src/scripts/logic/projects.js ====
(function(){
// 项目颜色与项目列表：已知项目用固定马卡龙色，其他项目按名字哈希取色；
// projectList() 汇总已知项目和数据里出现过的项目（保持出现顺序）。纯函数。
// 依赖：无。
App.logic = App.logic || {};

const KNOWN = {"SignPlex":"--p5","NEOX":"--p1","SOIL STUDIO":"--p4"};
const PAL = ["--p2","--p3","--p6","--p5","--p1","--p4"];
function projVar(p){
  if (!p) return "--p7";
  for (const k in KNOWN) if (k.toLowerCase() === p.toLowerCase()) return KNOWN[k];
  let x = 0; for (const c of p) x = (x*31 + c.charCodeAt(0)) >>> 0;
  return PAL[x % PAL.length];
}
const projColor = p => "var(" + projVar(p) + ")";
function projectList(events, todos){
  const set = new Set(Object.keys(KNOWN));
  for (const x of events.concat(todos)) if (x.project) set.add(x.project);
  return [...set];
}

App.logic.projects = {KNOWN, PAL, projVar, projColor, projectList};
})();
// ==== src/scripts/logic/parse-quick.js ====
(function(){
// 一句话解析 parseQuick(s, t, projectNames)：从“下周三下午两点半和 NEOX 对片”里取出
// 日期、时间、是否重要、项目和标题；有时间就判为日程，否则为待办。纯函数：
// “今天”由参数 t（"YYYY-MM-DD"）传入，项目名单由 projectNames 传入。依赖：core/date.js。
App.logic = App.logic || {};

const {pad, ymd, parse, addDays, mondayOf} = App.core.date;
const CN = {"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"日":0,"天":0};

function parseQuick(s, t, projectNames){
  // 中文数字转阿拉伯数字（只处理紧跟“点/月/日/号/分”的，避免误伤“周三”）
  const cnNum = w => {
    const D = {"零":0,"一":1,"二":2,"两":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
    if (w === "十") return 10;
    if (w.includes("十")){ const [a,b] = w.split("十"); return (a ? D[a] : 1)*10 + (b ? D[b] : 0); }
    return D[w];
  };
  s = s.replace(/[零一二两三四五六七八九十]{1,3}(?=[点月日号分])/g, w => { const n = cnNum(w); return n == null ? w : String(n); });
  let text = " " + s + " ", date = "", time = "", important = false, project = "";
  const take = re => { const m = text.match(re); if (m) text = text.replace(m[0], " "); return m; };
  let m;
  if ((m = take(/(大后天|后天|明天|明早|明晚|今天|今晚|今早)/))){
    const w = m[1]; date = addDays(t, w === "大后天" ? 3 : w === "后天" ? 2 : w.startsWith("明") ? 1 : 0);
    if (w === "明晚" || w === "今晚") text = " 晚上" + text;
    if (w === "明早" || w === "今早") text = " 早上" + text;
  }
  else if ((m = take(/(下下|下|这|本)?(?:个)?(?:周|星期|礼拜)([一二三四五六日天1-7])/))){
    let wd = CN[m[2]] != null ? CN[m[2]] : Number(m[2]) % 7;
    const cur = parse(t).getDay();
    const mon = mondayOf(t);
    const idx = (wd + 6) % 7;
    if (m[1] === "下") date = addDays(mon, 7 + idx);
    else if (m[1] === "下下") date = addDays(mon, 14 + idx);
    else if (m[1] === "这" || m[1] === "本") date = addDays(mon, idx);
    else { let diff = (wd - cur + 7) % 7; date = addDays(t, diff); }
  }
  else if ((m = take(/(?:(\d{4})[年\/.-])?(\d{1,2})[月\/.-](\d{1,2})[日号]?/))){
    const y = m[1] ? Number(m[1]) : parse(t).getFullYear();
    let d = new Date(y, Number(m[2])-1, Number(m[3]));
    if (!m[1] && ymd(d) < t) d = new Date(y+1, Number(m[2])-1, Number(m[3]));
    if (!isNaN(d)) date = ymd(d);
  }
  else if ((m = take(/(\d{1,2})[日号]/))){
    const n = parse(t); let d = new Date(n.getFullYear(), n.getMonth(), Number(m[1]));
    if (ymd(d) < t) d = new Date(n.getFullYear(), n.getMonth()+1, Number(m[1]));
    date = ymd(d);
  }
  if ((m = take(/(凌晨|早上|上午|中午|下午|傍晚|晚上)?\s*(\d{1,2})(?:[:：](\d{2})|点(?:钟)?(半|一刻|三刻|(\d{1,2})分?)?)/))){
    let hh = Number(m[2]), mm = m[3] ? Number(m[3]) : m[4] === "半" ? 30 : m[4] === "一刻" ? 15 : m[4] === "三刻" ? 45 : m[5] ? Number(m[5]) : 0;
    const p = m[1] || "";
    if ((p === "下午" || p === "傍晚" || p === "晚上") && hh < 12) hh += 12;
    if (p === "中午" && hh < 6) hh += 12;
    if (hh <= 23 && mm <= 59){ time = pad(hh)+":"+pad(mm); if (!date) date = t; }
  }
  take(/(凌晨|早上|上午|中午|下午|傍晚|晚上)/);
  if (take(/(重要|紧急|[!！]+)/)) important = true;
  for (const p of projectNames.slice().sort((a,b) => b.length - a.length)){
    const i = text.toLowerCase().indexOf(p.toLowerCase());
    if (i >= 0){ project = p; break; }
  }
  let title = text.replace(/\s+/g," ").trim().replace(/^(之前|以前|前)\s*/,"").replace(/^(在|要|得|记得|提醒我|帮我记一下|记一下)\s*/,"").replace(/^[，,。、\s]+|[，,。、\s]+$/g,"");
  if (!title) title = s.trim();
  return {title, date, time, important, project, kind: time ? "event" : "todo"};
}

App.logic.parseQuick = parseQuick;
})();
// ==== src/scripts/logic/sort.js ====
(function(){
// 排序与挑选：日程按日期+时间排序、待办排序（未完成在前、重要在前、截止早的在前），
// 以及“下一件事”的挑选规则 pickNext()。纯函数，“今天”和“现在几分”由参数传入。
// 依赖：core/date.js。
App.logic = App.logic || {};

const {hm2m} = App.core.date;

const byTime = (a,b) => (a.date+(a.time||"00:00")).localeCompare(b.date+(b.time||"00:00"));
function sortTodos(list){
  list.sort((a,b) => {
    if (!!a.done !== !!b.done) return a.done ? 1 : -1;
    if (a.done) return (b.doneAt||0)-(a.doneAt||0);
    if (!!a.important !== !!b.important) return a.important ? -1 : 1;
    const x = a.due || "9999", y = b.due || "9999";
    return x === y ? (a.createdAt||0)-(b.createdAt||0) : x.localeCompare(y);
  });
  return list;
}
// 今天还没结束的第一个定时日程；没有就取最该做的未完成待办
function pickNext(events, todos, t, nm){
  const evs = events.filter(e => e.date === t && e.time).sort((a,b) => a.time.localeCompare(b.time));
  for (const e of evs){
    const s = hm2m(e.time), end = s + (Number(e.durationMin)||60);
    if (end > nm) return {kind:"event", item:e, start:s, end};
  }
  const open = todos.filter(x => !x.done);
  open.sort((a,b) => (b.important?1:0)-(a.important?1:0) || (a.due||"9999").localeCompare(b.due||"9999") || (a.createdAt||0)-(b.createdAt||0));
  return open[0] ? {kind:"todo", item:open[0]} : null;
}

App.logic.sort = {byTime, sortTodos, pickNext};
})();
// ==== src/scripts/logic/format.js ====
(function(){
// 相对日期文案：relDay()“今天 周五 / 明天 周六 / 10月30日 周五”，dueText()“晚了 2 天 / 今天截止 / 还剩 3 天”。
// 以当前日期 today() 为基准。不碰 document / window。
// 依赖：core/date.js。
App.logic = App.logic || {};

const {WK, parse, today, dayDiff, md} = App.core.date;

function relDay(s){
  const n = dayDiff(s, today());
  const w = WK[parse(s).getDay()];
  if (n === 0) return "今天 "+w; if (n === 1) return "明天 "+w; if (n === 2) return "后天 "+w;
  if (n === -1) return "昨天 "+w;
  return md(s)+" "+w;
}
function dueText(due){
  const n = dayDiff(due, today());
  if (n < 0) return "晚了 "+(-n)+" 天";
  if (n === 0) return "今天截止"; if (n === 1) return "明天截止";
  if (n <= 7) return "还剩 "+n+" 天";
  return md(due)+" 截止";
}

App.logic.format = {relDay, dueText};
})();

(function(){
// 平台能力入口：所有依赖运行环境（claude.ai / 以后的独立服务器 PWA）的能力都注册在 App.platform 下，
// UI 代码不直接调用 window.claude 等平台接口。目前只有 storage（存储适配器）。

App.platform = App.platform || {};
App.platform.storage = App.platform.storage || {};   // 存储适配器工厂：{"claude-db": fn, "mock-db": fn, ...}

/*

 *   App.platform.download = { saveFile(name, blob) }

})();
// ==== src/scripts/platform/claude-db.js ====
(function(){
// claude.ai 存储适配器：把 window.claude.use("db") 的集合 / 文档接口包装成 data/store.js 定义的统一接口。
// 这是全项目唯一直接访问 window.claude 的地方；以后的下载、提醒推送等平台能力也放在 platform/ 下。
// 依赖：无（注册到 App.platform.storage["claude-db"]，由 app.js 选用）。
App.platform = App.platform || {};
App.platform.storage = App.platform.storage || {};

App.platform.storage["claude-db"] = function createClaudeDb(){
  let db = null;
  const refs = new Map();   // newId 生成的文档引用，add 时沿用同一个引用
  const doc = (coll, id) => {
    const key = coll + "/" + id, r = refs.get(key);
    if (r){ refs.delete(key); return r; }
    return db.collection(coll).doc(id);
  };
  return {
    async connect(){
      db = window.claude && window.claude.use ? await window.claude.use("db") : null;
      return !!db;
    },
    subscribe(coll, onData, onError){
      return db.collection(coll).onSnapshot(s => onData({
        items: s.docs.map(d => Object.assign({id:d.id}, d.data())),
        changes: () => s.docChanges().map(c => ({type:c.type, id:c.doc.id})),
      }), onError);
    },
    newId(coll){ const r = db.collection(coll).doc(); refs.set(coll + "/" + r.id, r); return r.id; },
    add: (coll, id, data) => doc(coll, id).set(data),
    update: (coll, id, patch) => db.collection(coll).doc(id).update(patch),
    remove: (coll, id) => db.collection(coll).doc(id).delete(),
  };
};
})();
// ==== src/scripts/data/store.js ====
(function(){
// 统一存储接口（适配器模式）：页面和 UI 只调用 App.data.store，不直接碰 window.claude 或任何后端。
// 具体实现放在 platform/（claude-db）或 tests/mock/（mock-db），由 app.js 一处配置选用。
// 依赖：无（适配器在启动时通过 use() 注入）。
App.data = App.data || {};

/*
 * 适配器需要实现的方法（一个普通对象即可）：
 *
 *   connect(): Promise<boolean>
 *     连接存储。能用返回 true；当前环境没有这个存储（例如不在 claude.ai 里打开）返回 false。
 *
 *   subscribe(collection, onData, onError): () => void
 *     collection：集合名，目前只有 "events"（日程）和 "todos"（待办）。
 *     onData(snapshot)：每次集合有变化都调用一次，首次订阅也要调用一次（全量）。
 *       snapshot.items    —— 数组，集合里全部记录，每条是 {id, ...字段}
 *       snapshot.changes() —— 返回本次变化 [{type:"added"|"modified"|"removed", id}]，首次可为空数组
 *     onError(err)：连接中断等错误。
 *     返回值：取消订阅的函数。
 *
 *   newId(collection): string
 *     同步生成一个新记录的 id（写入前就要知道 id，用来识别“自己刚加的”记录，不做高亮）。
 *
 *   add(collection, id, data): Promise<void>      用 newId 得到的 id 新建一条记录
 *   update(collection, id, patch): Promise<void>  合并更新部分字段
 *   remove(collection, id): Promise<void>         删除一条记录
 *     三个写入方法失败时 reject，错误对象可带 code：
 *       "invalid_argument" —— 没有写权限；"quota_exceeded" —— 存储已满；其他视为网络问题。
 *
 * 以后要加的 REST / 自建服务器适配器（这次不实现），建议对应关系：
 *   connect   → GET /api/me 校验登录（未登录返回 false 或跳转登录）
 *   subscribe → 先 GET /api/{collection} 拉全量，再用 WebSocket / SSE（或定时轮询）收增量，
 *               每次变化把本地缓存整理成 {items, changes()} 回调；断线时调用 onError
 *   newId     → 客户端生成（crypto.randomUUID()），服务器接受客户端 id
 *   add       → PUT  /api/{collection}/{id}   body: data
 *   update    → PATCH /api/{collection}/{id}  body: patch
 *   remove    → DELETE /api/{collection}/{id}
 *   HTTP 403 映射为 code "invalid_argument"，507/413 映射为 "quota_exceeded"。
 *   离线时可先写入 IndexedDB 队列，恢复网络后补发（配合 Service Worker）。
 */

let adapter = null;
const store = {
  connected: false,
  use(a){ adapter = a; },
  async connect(){ store.connected = !!(adapter && await adapter.connect()); return store.connected; },
  subscribe: (coll, onData, onError) => adapter.subscribe(coll, onData, onError),
  newId: coll => adapter.newId(coll),
  add: (coll, id, data) => adapter.add(coll, id, data),
  update: (coll, id, patch) => adapter.update(coll, id, patch),
  remove: (coll, id) => adapter.remove(coll, id),
};

App.data.store = store;
})();

(function(){
// 字段整理：把弹出层表单的值整理成要写入存储的日程 / 待办记录（字段和顺序与 v2 一致），

}

// ==== src/scripts/data/write.js ====
(function(){
// 写入操作：勾选完成/撤销、改期、全部改到今天、延迟 5 秒的可撤销删除；先改本地再写存储，失败回滚并提示重试。
// 页面隐藏或关闭时立即提交待删除项。
// 依赖：core/date.js、data/store.js、data/state.js；调用时用到 ui/toast.js、ui/render.js。
App.data = App.data || {};

const {ymd, today, addDays} = App.core.date;
const store = App.data.store, S = App.data.state;
const toast = (...a) => App.ui.toast.show(...a);
const render = () => App.ui.render();

function errMsg(e){ return e && e.code === "invalid_argument" ? "你没有修改权限，只能查看。" : e && e.code === "quota_exceeded" ? "存储已满，删掉一些旧条目再试。" : "没保存上，检查网络后再试。"; }
async function write(fn, onFail){
  try { await fn(); return true; }
  catch(e){ if (onFail) onFail(); toast(errMsg(e), "重试", () => write(fn, onFail), 6000); render(); return false; }
}
function toggleDone(x, done, li){
  const prev = {done:x.done, doneAt:x.doneAt};
  x.done = done; x.doneAt = done ? Date.now() : 0;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (li){
    li.classList.toggle("done", done);
    S.holdUntil = Date.now() + (done ? (reduce ? 800 : 960) : 0);
  }
  if (!li) render(); else setTimeout(render, done ? (reduce ? 800 : 960) : 0);
  write(() => store.update("todos", x.id, {done, doneAt:x.doneAt, updatedAt:Date.now()}), () => { x.done = prev.done; x.doneAt = prev.doneAt; S.holdUntil = 0; });
  if (done) {
    const n = App.data.visTd().filter(y => y.done && y.doneAt && ymd(new Date(y.doneAt)) === today()).length;
    toast("完成了，今天第 "+n+" 件", "撤销", () => toggleDone(x, false, null), 3500);
  }
}
function reschedule(x, d){
  const prev = x.due; x.due = d; render();
  write(() => store.update("todos", x.id, {due:d, updatedAt:Date.now()}), () => { x.due = prev; });
  toast("已改到"+(d === today() ? "今天" : "明天"));
}
async function moveAll(list){
  const t = today(), prev = list.map(x => [x, x.due]);
  list.forEach(x => x.due = t); render();
  for (const [x] of prev) await write(() => store.update("todos", x.id, {due:t, updatedAt:Date.now()}), () => { x.due = prev.find(p => p[0]===x)[1]; });
  toast(list.length+" 件已改到今天");
}
function scheduleDelete(coll, item){
  const timer = setTimeout(() => commitDelete(item.id), 5000);
  S.pendingDel.set(item.id, {coll, timer});
  render();
  toast("已删除“"+(item.title.length > 12 ? item.title.slice(0,12)+"…" : item.title)+"”", "撤销", () => {
    const p = S.pendingDel.get(item.id); if (p){ clearTimeout(p.timer); S.pendingDel.delete(item.id); render(); }
  }, 5000);
}
function commitDelete(id){
  const p = S.pendingDel.get(id); if (!p) return;
  clearTimeout(p.timer);
  write(() => store.remove(p.coll, id).then(() => S.pendingDel.delete(id)), () => { S.pendingDel.delete(id); });
}
function flushDeletes(){ for (const id of [...S.pendingDel.keys()]) commitDelete(id); }
function init(){
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushDeletes(); });
  window.addEventListener("pagehide", flushDeletes);
}

App.data.write = {write, toggleDone, reschedule, moveAll, scheduleDelete, commitDelete, flushDeletes, init};
})();
// ==== src/scripts/data/subscribe.js ====
(function(){
// 订阅：连接存储后订阅 events / todos 两个集合，收到快照就更新状态并重绘；
// 别处新加的记录短暂高亮（自己刚加的不高亮）；连不上时显示提示；断线时提示刷新。
// 依赖：data/store.js、data/state.js；调用时用到 ui/render.js、ui/toast.js。
App.data = App.data || {};

const store = App.data.store, S = App.data.state;

async function start(){
  const ok = await store.connect();
  if (!ok){
    App.ui.render.showNoData();
    S.loaded.ev = S.loaded.td = true; App.ui.render(); return;
  }
  const lost = () => App.ui.toast.show("和云端的连接断了，刷新页面即可恢复", "刷新", () => location.reload(), 60000);
  const mark = (snap, key) => {
    if (S.loaded[key]){
      for (const c of snap.changes()){
        if (c.type === "added" && !S.localIds.has(c.id)){ S.fresh.add(c.id); setTimeout(() => S.fresh.delete(c.id), 2400); }
      }
    }
  };
  store.subscribe("events", s => { mark(s,"ev"); S.events = s.items; S.loaded.ev = true; App.ui.render(); }, lost);
  store.subscribe("todos", s => { mark(s,"td"); S.todos = s.items; S.loaded.td = true; App.ui.render(); }, lost);
}

App.data.subscribe = {start};
})();

(function(){
// 底部提示条：show(文案, 按钮字, 按钮动作, 显示毫秒)，默认 3 秒后自动消失；按钮用于撤销 / 重试 / 刷新。

function show(msg, btnText, action, ms){

  const b = $("toast-btn"); b.hidden = !btnText; b.textContent = btnText || "";
  toastAction = action || null;

  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").classList.remove("on"), ms || 3000);
}

}

App.ui.toast = {show, init};

(function(){
// 渲染调度与抬头：render() 依次重绘抬头、今天、日程、待办（勾选动画期间暂缓）；
// 抬头显示月日、星期年份和“今天完成 / 没赶上”胶囊；showNoData() 显示数据未连接提示。
// 依赖：core/date.js、core/dom.js、data/state.js；调用时用到 ui/today、schedule、todos、nav。
App.ui = App.ui || {};

const {WK, ymd, parse, today} = App.core.date;
const {$, h} = App.core.dom;
const S = App.data.state, visTd = App.data.visTd;

function render(){
  const wait = S.holdUntil - Date.now();
  if (wait > 0){ clearTimeout(S.holdTimer); S.holdTimer = setTimeout(render, wait + 10); return; }
  renderHead(); App.ui.today.render(); App.ui.schedule.render(); App.ui.todos.render();
}

function renderHead(){
  const t = today(), d = parse(t);
  $("hd-md").innerHTML = ""; $("hd-md").append((d.getMonth()+1)+"", h("small",null,"月"), d.getDate()+"", h("small",null,"日"));
  $("hd-sub").textContent = WK[d.getDay()] + "  " + d.getFullYear() + "年";
  const chips = $("hd-chips"); chips.textContent = "";
  const doneToday = visTd().filter(x => x.done && x.doneAt && ymd(new Date(x.doneAt)) === t).length;
  const late = visTd().filter(x => !x.done && x.due && x.due < t).length;
  if (doneToday) chips.append(h("span",{class:"chip"},"今天完成 ",h("b",null,doneToday)," 件"));
  if (late) chips.append(h("button",{class:"chip late",type:"button",onclick:()=>{ App.ui.nav.go("today"); $("late").scrollIntoView({behavior:"smooth",block:"center"}); }},h("b",null,late)," 件没赶上"));
}

function showNoData(){
  const n = $("notice"); n.hidden = false; n.textContent = "";
  n.append(h("strong",null,"数据没有连上。"), " 请在 claude.ai 登录同一个账号后再打开这个页面。");
}

render.head = renderHead;
render.showNoData = showNoData;
App.ui.render = render;
})();
// ==== src/scripts/ui/today.js ====
(function(){
// “今天”视图：下一件事大卡片、没赶上面板、今天的时间轴（重叠分列、现在红线）、今天要做、晚上 6 点后预告明天。
// 依赖：core/date.js、core/dom.js、logic/projects.js、logic/sort.js、logic/format.js、data/state.js、data/write.js；
//       调用时用到 ui/sheet.js、ui/todos.js、ui/schedule.js。
App.ui = App.ui || {};

const {pad, ymd, today, addDays, dayDiff, hm2m, m2hm, nowMin, md} = App.core.date;
const {$, h, ICON_CHECK, skeleton, emptyBox} = App.core.dom;
const {projColor} = App.logic.projects;
const {byTime, sortTodos, pickNext} = App.logic.sort;
const {relDay, dueText} = App.logic.format;
const S = App.data.state, visEv = App.data.visEv, visTd = App.data.visTd, ready = App.data.ready;
const {toggleDone, reschedule, moveAll} = App.data.write;
const openSheet = (...a) => App.ui.sheet.open(...a);
const todoRow = x => App.ui.todos.row(x);
const evBlock = e => App.ui.schedule.evBlock(e);

const nextThing = () => pickNext(visEv(), visTd(), today(), nowMin());

function renderToday(){
  const box = $("next"); box.textContent = "";
  if (!ready()){ box.append(h("div",{class:"next empty"}, ...skeleton(2))); }
  else {
    const n = nextThing(), nm = nowMin();
    if (!n){
      box.append(h("div",{class:"next empty"}, h("span",{class:"lbl"},"下一件事"), h("span",{class:"big"},"空闲"),
        h("span",{class:"cd"},"今天没有别的安排了。点右下角的＋记一件新的事。")));
    } else if (n.kind === "event"){
      const e = n.item, mins = n.start - nm;
      const cd = mins > 0 ? (mins >= 60 ? Math.floor(mins/60)+" 小时 "+(mins%60 ? mins%60+" 分钟" : "")+"后开始" : mins+" 分钟后开始") : "进行中，"+m2hm(n.end)+" 结束";
      box.append(h("button",{class:"next",type:"button",style:"background:"+projColor(e.project)+";border:0;text-align:left;width:100%",onclick:()=>openSheet("event",e)},
        h("span",{class:"lbl"},"下一件事"), h("span",{class:"big"},e.time), h("span",{class:"cd"},cd),
        h("span",{class:"tt"},e.title), e.project || e.note ? h("span",{class:"proj"},[e.project,e.note].filter(Boolean).join("  ")) : null));
    } else {
      const x = n.item;
      const card = h("div",{class:"next",style:"background:"+projColor(x.project)},
        h("span",{class:"lbl"},"下一件事"), h("span",{class:"big",style:"font-size:40px"}, x.due ? dueText(x.due).replace("截止","") : "待办"),
        h("span",{class:"tt"},x.title), x.project ? h("span",{class:"proj"},x.project) : null,
        h("button",{class:"act",type:"button","aria-label":"完成："+x.title,html:ICON_CHECK,onclick:()=>toggleDone(x,true,null)}));
      card.querySelector(".tt").onclick = () => openSheet("todo", x);
      box.append(card);
    }
  }
  // 没赶上
  const lb = $("late"); lb.textContent = "";
  const t = today();
  const late = visTd().filter(x => !x.done && x.due && x.due < t).sort((a,b) => a.due.localeCompare(b.due));
  if (late.length){
    const p = h("section",{class:"panel late-panel","aria-labelledby":"h-late"},
      h("div",{class:"ph"}, h("h2",{id:"h-late"},late.length+" 件没赶上"),
        late.length > 1 ? h("button",{class:"btn-dark",type:"button",onclick:()=>moveAll(late)},"全部改到今天") : null));
    for (const x of late){
      p.append(h("div",{class:"late-row"},
        h("div",{class:"t"}, x.title, h("small",null,"原定 "+md(x.due)+"，晚了 "+(-dayDiff(x.due,t))+" 天")),
        h("div",{class:"mini"},
          h("button",{type:"button",onclick:()=>reschedule(x,t)},"今天"),
          h("button",{type:"button",onclick:()=>reschedule(x,addDays(t,1))},"明天"))));
    }
    lb.append(p);
  }
  renderTimeline();
  // 今天要做
  const ul = $("today-todos"); ul.textContent = "";
  if (!ready()){ ul.append(...skeleton(2)); }
  else {
    const soon = addDays(t,2);
    const list = visTd().filter(x => (!x.done && (!x.due || x.due >= t) && ((x.due && x.due <= soon) || x.important)) ||
      (x.done && x.doneAt && ymd(new Date(x.doneAt)) === t && (x.important || (x.due && x.due <= soon))));
    sortTodos(list);
    if (!list.length){
      const anyOpen = visTd().some(x => !x.done);
      ul.append(h("li",null, emptyBox(anyOpen ? "最近两天没有到期的事" : "没有待办", anyOpen ? "其他待办在“全部待办”里。" : "点右下角的＋，写一句话就能记下。")));
    } else list.forEach(x => ul.append(todoRow(x)));
  }
  // 晚上预告明天
  const tm = $("tomorrow");
  const showTm = new Date().getHours() >= 18;
  tm.hidden = !showTm || !ready();
  if (showTm && ready()){
    const tmr = addDays(t,1);
    const evs = visEv().filter(e => e.date === tmr).sort(byTime);
    $("tm-meta").textContent = relDay(tmr);
    const l = $("tm-list"); l.textContent = "";
    if (!evs.length) l.append(emptyBox("明天还没有安排", "可以早点休息。"));
    else evs.forEach(e => l.append(evBlock(e)));
  }
}

function renderTimeline(){
  const t = today(), tl = $("tl"), ad = $("tl-allday");
  tl.textContent = ""; ad.textContent = "";
  const evs = visEv().filter(e => e.date === t);
  const timed = evs.filter(e => e.time).sort(byTime);
  evs.filter(e => !e.time).forEach(e => ad.append(h("button",{class:"ad",type:"button",style:"background:"+projColor(e.project),onclick:()=>openSheet("event",e)},"全天  "+e.title)));
  $("tl-meta").textContent = timed.length ? timed.length+" 项" : "";
  const nm = nowMin();
  // 只显示“现在前后 + 有安排的时段”，避免大段空白
  let sH = Math.max(0, Math.floor(nm/60) - 1), eH = Math.min(24, Math.floor(nm/60) + 3);
  for (const e of timed){ const s = hm2m(e.time), en = s+(Number(e.durationMin)||60); sH = Math.min(sH, Math.floor(s/60)); eH = Math.max(eH, Math.ceil(en/60)); }
  eH = Math.min(24, eH); if (eH - sH < 4) sH = Math.max(0, eH - 4);
  const PX = 52, H = (eH - sH) * PX;
  const hours = h("div",{class:"hours",style:"height:"+H+"px"}), lane = h("div",{class:"lane",style:"height:"+H+"px"});
  for (let i = sH; i <= eH; i++){
    const y = (i - sH) * PX;
    if (i < eH || i === eH) hours.append(h("span",{style:"top:"+Math.min(H-6,Math.max(6,y))+"px"},pad(i)+":00"));
    lane.append(h("i",{style:"top:"+y+"px"}));
  }
  // 重叠分列
  const items = timed.map(e => ({e, s:hm2m(e.time), en:hm2m(e.time)+(Number(e.durationMin)||60)}));
  let cluster = [], cEnd = -1;
  const flush = () => {
    const lanes = [];
    for (const it of cluster){ let k = lanes.findIndex(end => end <= it.s); if (k < 0){ k = lanes.length; lanes.push(0); } lanes[k] = it.en; it.k = k; }
    for (const it of cluster) it.n = lanes.length;
    cluster = []; cEnd = -1;
  };
  for (const it of items){ if (it.s >= cEnd && cluster.length) flush(); cluster.push(it); cEnd = Math.max(cEnd, it.en); }
  if (cluster.length) flush();
  for (const it of items){
    const top = (it.s - sH*60)/60*PX, ht = Math.max(30, (it.en-it.s)/60*PX - 4);
    const w = 100/it.n;
    const b = h("button",{class:"blk"+(it.en <= nm ? " past":""),type:"button",
      style:"top:"+(top+2)+"px;height:"+ht+"px;left:calc("+(w*it.k)+"% + 6px);width:calc("+w+"% - 8px);background:"+projColor(it.e.project),
      onclick:()=>openSheet("event",it.e)},
      h("span",{class:"bt"},it.e.title), ht > 40 ? h("span",{class:"bm"},it.e.time+"–"+m2hm(it.en)+(it.e.project?"  "+it.e.project:"")) : null);
    if (S.fresh.has(it.e.id)) b.classList.add("fresh");
    lane.append(b);
  }
  if (nm >= sH*60 && nm <= eH*60){
    lane.append(h("div",{class:"now",style:"top:"+((nm - sH*60)/60*PX)+"px"}, h("span",null,m2hm(nm))));
  }
  tl.append(hours, lane);
  if (!timed.length && !evs.length && ready()){
    lane.append(h("div",{style:"position:absolute;left:12px;right:8px;top:8px;color:var(--muted);font-size:14px"},"今天没有定了时间的安排。"));
  }
}

App.ui.today = {render: renderToday, renderTimeline};
})();
// ==== src/scripts/ui/schedule.js ====
(function(){
// “日程”视图：一周日期条（上一周 / 下一周）、选中那天的日程、“接下来”按日期分组的日程；evBlock() 也供今天视图预告明天用。
// 依赖：core/date.js、core/dom.js、logic/projects.js、logic/sort.js、logic/format.js、data/state.js；
//       调用时用到 ui/sheet.js。
App.ui = App.ui || {};

const {WK, parse, today, addDays, hm2m, m2hm, mondayOf} = App.core.date;
const {$, h, skeleton, emptyBox} = App.core.dom;
const {projColor} = App.logic.projects;
const {byTime} = App.logic.sort;
const {relDay} = App.logic.format;
const S = App.data.state, visEv = App.data.visEv, ready = App.data.ready;
const openSheet = (...a) => App.ui.sheet.open(...a);

function evBlock(e){
  const end = e.time ? m2hm(hm2m(e.time)+(Number(e.durationMin)||60)) : "";
  const b = h("button",{class:"ev",type:"button",style:"background:"+projColor(e.project),onclick:()=>openSheet("event",e)},
    h("span",{class:"et"}, e.time || "全天", end ? h("small",null,"至 "+end) : null),
    h("span",{class:"eb"}, h("span",{class:"en"},e.title),
      (e.project || e.note || e.source === "chat") ? h("span",{class:"ex",style:"display:block"},[e.project, e.note, e.source === "chat" ? "Claude 代记" : ""].filter(Boolean).join("  ")) : null));
  if (S.fresh.has(e.id)) b.classList.add("fresh");
  return b;
}
function renderSched(){
  const t = today();
  const d0 = parse(S.weekStart);
  const d6 = parse(addDays(S.weekStart,6));
  $("wk-title").textContent = (d0.getMonth()+1)+"月" + (S.weekStart === mondayOf(t) ? " 本周" : (d0.getDate()+"日–"+(d6.getMonth()+1)+"月"+d6.getDate()+"日"));
  const wk = $("week"); wk.textContent = "";
  const byDay = {};
  for (const e of visEv()) (byDay[e.date] = byDay[e.date] || []).push(e);
  for (let i = 0; i < 7; i++){
    const k = addDays(S.weekStart, i), d = parse(k);
    const dots = h("span",{class:"dots"});
    (byDay[k] || []).slice(0,3).forEach(e => dots.append(h("b",{style:"background:"+projColor(e.project)})));
    wk.append(h("button",{type:"button",class:"day"+(k===t?" today":"")+(k===S.selDay?" sel":""),"aria-label":relDay(k)+((byDay[k]||[]).length?"，"+byDay[k].length+" 项":""),"aria-pressed":k===S.selDay?"true":"false",
      onclick:()=>{ S.selDay = k; renderSched(); }},
      h("span",{class:"w"},WK[d.getDay()].slice(1)), h("span",{class:"n"},d.getDate()), dots));
  }
  const dl = $("day-list"); dl.textContent = "";
  dl.append(h("div",{class:"dhead"+(S.selDay===t?" is-today":"")}, relDay(S.selDay)));
  if (!ready()) dl.append(...skeleton(2));
  else {
    const list = (byDay[S.selDay] || []).slice().sort(byTime);
    if (!list.length) dl.append(emptyBox("这一天还没有安排", h("button",{class:"linkbtn",type:"button",style:"display:block;margin-top:4px",onclick:()=>openSheet("event",null,S.selDay)},"给这天记一件事")));
    else list.forEach(e => dl.append(evBlock(e)));
  }
  const up = $("up-list"); up.textContent = "";
  if (!ready()){ up.append(...skeleton(2)); return; }
  const after = visEv().filter(e => e.date > (S.selDay > t ? S.selDay : t) && e.date !== S.selDay).sort(byTime).slice(0, 30);
  $("up-meta").textContent = after.length ? after.length+" 项" : "";
  if (!after.length){ up.append(emptyBox("后面还没有安排", "以后的日程会按日期排在这里。")); return; }
  let cur = null;
  for (const e of after){
    if (e.date !== cur){ cur = e.date; up.append(h("div",{class:"dhead"}, relDay(cur))); }
    up.append(evBlock(e));
  }
}
function init(){
  $("wk-prev").onclick = () => { S.weekStart = addDays(S.weekStart,-7); S.selDay = S.weekStart; renderSched(); };
  $("wk-next").onclick = () => { S.weekStart = addDays(S.weekStart,7); S.selDay = S.weekStart; renderSched(); };
}

App.ui.schedule = {render: renderSched, evBlock, init};
})();
// ==== src/scripts/ui/todos.js ====
(function(){
// “待办”视图：项目筛选胶囊、未完成 + 今天完成的列表、折叠的更早已完成；row() 生成一行待办（勾选、标签），今天视图也复用。
// 依赖：core/date.js、core/dom.js、logic/projects.js、logic/sort.js、logic/format.js、data/state.js、data/write.js；
//       调用时用到 ui/sheet.js。
App.ui = App.ui || {};

const {ymd, today, dayDiff} = App.core.date;
const {$, h, ICON_CHECK, skeleton, emptyBox} = App.core.dom;
const {projColor} = App.logic.projects;
const {sortTodos} = App.logic.sort;
const {dueText} = App.logic.format;
const S = App.data.state, visTd = App.data.visTd, ready = App.data.ready;
const {toggleDone} = App.data.write;
const openSheet = (...a) => App.ui.sheet.open(...a);

function todoRow(x){
  const t = today();
  const li = h("li",{class:"td"+(x.done?" done":"")+(x.important?" imp":"")+(S.fresh.has(x.id)?" fresh":""),"data-id":x.id});
  const ck = h("button",{class:"ck",type:"button","aria-pressed":x.done?"true":"false","aria-label":(x.done?"标为未完成：":"完成：")+x.title}, h("span",{html:ICON_CHECK}));
  ck.onclick = () => toggleDone(x, !x.done, li);
  const tags = h("span",{class:"tags"});
  if (x.project) tags.append(h("span",{class:"tag"}, h("span",{class:"sw",style:"background:"+projColor(x.project)}), x.project));
  if (x.due && !x.done){
    const n = dayDiff(x.due, t);
    tags.append(h("span",{class:"tag"+(n<0?" over":n===0?" due-today":"")}, dueText(x.due)));
  }
  if (x.source === "chat") tags.append(h("span",{class:"tag ai"},"Claude 代记"));
  const body = h("button",{class:"tb",type:"button",onclick:()=>openSheet("todo",x)}, h("span",{class:"tt"},x.title), tags.childNodes.length ? tags : null);
  li.append(ck, body);
  return li;
}
function renderTodos(){
  const f = $("filters"); f.textContent = "";
  const open = visTd().filter(x => !x.done);
  const ps = [...new Set(visTd().map(x => x.project).filter(Boolean))];
  if (S.projFilter && !ps.includes(S.projFilter)) S.projFilter = null;
  if (ps.length){
    f.append(h("button",{class:"f",type:"button","aria-pressed":!S.projFilter?"true":"false",onclick:()=>{S.projFilter=null;renderTodos();}},"全部"));
    ps.forEach(p => f.append(h("button",{class:"f",type:"button","aria-pressed":S.projFilter===p?"true":"false",onclick:()=>{S.projFilter=p;renderTodos();}},
      h("span",{class:"sw",style:"background:"+projColor(p)}), p)));
  }
  f.hidden = !ps.length;
  const ul = $("todos"); ul.textContent = "";
  const t = today();
  const inScope = x => !S.projFilter || x.project === S.projFilter;
  const list = sortTodos(visTd().filter(x => inScope(x) && (!x.done || (x.doneAt && ymd(new Date(x.doneAt)) === t))));
  $("td-meta").textContent = open.filter(inScope).length ? open.filter(inScope).length+" 件未完成" : "";
  if (!ready()) ul.append(...skeleton(3));
  else if (!list.length){
    const doneAll = visTd().some(x => x.done && inScope(x));
    ul.append(h("li",null, doneAll ? emptyBox("全部做完了", "新的待办点右下角的＋添加。") : emptyBox("没有待办", "点右下角的＋，写一句话，比如“周五前交 NEOX 横版”。")));
  } else list.forEach(x => ul.append(todoRow(x)));
  const old = sortTodos(visTd().filter(x => inScope(x) && x.done && !(x.doneAt && ymd(new Date(x.doneAt)) === t)));
  const tg = $("done-toggle"), dlist = $("done-list");
  tg.hidden = !old.length;
  tg.textContent = S.showDone ? "收起已完成" : "已完成 "+old.length+" 件";
  dlist.hidden = !S.showDone || !old.length; dlist.textContent = "";
  if (S.showDone) old.slice(0,100).forEach(x => dlist.append(todoRow(x)));
}
function init(){
  $("done-toggle").onclick = () => { S.showDone = !S.showDone; renderTodos(); };
}

App.ui.todos = {render: renderTodos, row: todoRow, init};
})();
// ==== src/scripts/ui/sheet.js ====
(function(){
// 新建 / 编辑弹出层：一句话输入实时解析填表、日程 / 待办切换、项目胶囊、保存、取消、删除（可撤销）。
// 依赖：core/date.js、core/dom.js、logic/projects.js、logic/parse-quick.js、logic/format.js、
//       data/store.js、data/state.js、data/fields.js、data/write.js、ui/toast.js。
App.ui = App.ui || {};

const {today, mondayOf} = App.core.date;
const {$, h} = App.core.dom;
const {projColor} = App.logic.projects;
const {relDay} = App.logic.format;
const store = App.data.store, S = App.data.state, fields = App.data.fields;
const {write, scheduleDelete} = App.data.write;
const toast = (...a) => App.ui.toast.show(...a);
const parseQuick = s => App.logic.parseQuick(s, today(), App.data.projects());

let sheetKind = "todo", editing = null, lastFocus = null;
function setKind(k){
  sheetKind = k;
  document.querySelectorAll("#seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k ? "true" : "false"));
  document.querySelectorAll(".ev-only").forEach(el => el.hidden = k !== "event");
  document.querySelectorAll(".td-only").forEach(el => el.hidden = k !== "todo");
  $("f-date-lab").textContent = k === "event" ? "日期" : "截止日期";
  $("f-date").required = k === "event";
}
function fillProjChips(){
  const c = $("proj-chips"); c.textContent = "";
  const dl = $("proj-list"); dl.textContent = "";
  App.data.projects().forEach(p => {
    dl.append(h("option",{value:p}));
    c.append(h("button",{class:"f",type:"button","aria-pressed":$("f-proj").value===p?"true":"false",onclick:()=>{ $("f-proj").value = $("f-proj").value === p ? "" : p; fillProjChips(); }},
      h("span",{class:"sw",style:"background:"+projColor(p)}), p));
  });
}
function openSheet(kind, item, presetDate){
  if (!store.connected){ toast("数据未连接，暂时不能编辑"); return; }
  lastFocus = document.activeElement;
  editing = item || null;
  $("sh-title").textContent = item ? (kind === "event" ? "编辑日程" : "编辑待办") : "新建";
  $("q-wrap").hidden = !!item; $("seg").hidden = !!item;
  $("q").value = "";
  $("f-title").value = item ? item.title : "";
  $("f-date").value = item ? (kind === "event" ? item.date : (item.due || "")) : (presetDate || "");
  $("f-time").value = item && item.time || "";
  $("f-dur").value = String(item && item.durationMin || 60);
  if (![...$("f-dur").options].some(o => o.value === $("f-dur").value)) $("f-dur").value = "60";
  $("f-note").value = item && item.note || "";
  $("f-imp").checked = !!(item && item.important);
  $("f-proj").value = item && item.project || "";
  $("raw").hidden = !(item && item.rawText);
  $("raw").textContent = item && item.rawText ? "原话：" + item.rawText : "";
  $("del").hidden = !item;
  $("save").textContent = item ? "保存修改" : "加入";
  setKind(kind || (presetDate ? "event" : "todo"));
  fillProjChips();
  $("scrim").hidden = false; $("sheet").hidden = false;
  requestAnimationFrame(() => { $("scrim").classList.add("on"); $("sheet").classList.add("on"); (item ? $("f-title") : $("q")).focus(); });
}
function closeSheet(){
  $("scrim").classList.remove("on"); $("sheet").classList.remove("on");
  setTimeout(() => { $("scrim").hidden = true; $("sheet").hidden = true; }, 340);
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
async function onSubmit(ev){
  ev.preventDefault();
  const title = $("f-title").value.trim(); if (!title){ $("f-title").focus(); return; }
  const now = Date.now(), proj = $("f-proj").value.trim(), raw = $("q").value.trim();
  let coll, data;
  if (sheetKind === "event"){
    const date = $("f-date").value; if (!date){ $("f-date").focus(); return; }
    coll = "events";
    data = fields.eventFields({title, date, time:$("f-time").value, dur:$("f-dur").value, project:proj, note:$("f-note").value.trim()}, now);
  } else {
    coll = "todos";
    data = fields.todoFields({title, date:$("f-date").value, important:$("f-imp").checked, project:proj}, now);
  }
  $("save").disabled = true; $("save").textContent = "保存中…";
  let ok;
  if (editing){
    const id = editing.id;
    ok = await write(() => store.update(coll, id, data));
  } else {
    fields.asNew(data, coll, now, raw);
    const id = store.newId(coll);
    S.localIds.add(id);
    ok = await write(() => store.add(coll, id, data));
    if (ok && coll === "events"){ S.selDay = data.date; S.weekStart = mondayOf(data.date); }
  }
  $("save").disabled = false; $("save").textContent = editing ? "保存修改" : "加入";
  if (ok){ closeSheet(); toast(editing ? "已保存" : (coll === "events" ? "已记下日程，"+relDay(data.date) : "已加入待办")); }
}
function init(){
  document.querySelectorAll("#seg button").forEach(b => b.onclick = () => { setKind(b.dataset.k); if (b.dataset.k === "event" && !$("f-date").value) $("f-date").value = S.selDay || today(); });
  $("f-proj").oninput = fillProjChips;
  $("q").oninput = () => {
    const p = parseQuick($("q").value);
    if (!$("q").value.trim()) return;
    setKind(p.kind);
    $("f-title").value = p.title; $("f-date").value = p.date; $("f-time").value = p.time;
    $("f-imp").checked = p.important; $("f-proj").value = p.project; fillProjChips();
  };
  $("q").onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); $("sheet").requestSubmit(); } };
  $("cancel").onclick = closeSheet; $("scrim").onclick = closeSheet;
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
  $("del").onclick = () => { const it = editing, k = sheetKind; closeSheet(); if (it) scheduleDelete(k === "event" ? "events" : "todos", it); };
  $("sheet").addEventListener("submit", onSubmit);
  $("plus").onclick = () => openSheet(null, null, S.view === "sched" ? S.selDay : null);
}

App.ui.sheet = {open: openSheet, close: closeSheet, init};
})();
// ==== src/scripts/ui/nav.js ====
(function(){
// 底部导航与网络提示：go() 切换今天 / 日程 / 待办三页（记住上次的页、移动白色指示块、窄屏只显示当前页文字），
// 断网时顶部显示红条。
// 依赖：core/dom.js、data/state.js。
App.ui = App.ui || {};

const {$} = App.core.dom;
const S = App.data.state;

function placeInd(){
  const b = document.querySelector('#nav button[data-go="'+S.view+'"]'); if (!b) return;
  $("ind").style.left = b.offsetLeft+"px"; $("ind").style.width = b.offsetWidth+"px";
}
function go(v){
  S.view = v; try { localStorage.setItem("pv-view", v); } catch(e){}
  document.querySelectorAll(".view").forEach(el => el.classList.toggle("on", el.dataset.view === v));
  document.querySelectorAll("#nav button").forEach(b => {
    const on = b.dataset.go === v;
    b.setAttribute("aria-current", on ? "page" : "false");
    b.querySelector(".lab").hidden = !on && innerWidth < 380;
  });
  requestAnimationFrame(placeInd);
  window.scrollTo({top:0});
}
const net = () => { $("netbar").hidden = navigator.onLine !== false; };
function init(){
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
  addEventListener("resize", () => { go(S.view); });
}
function initNet(){
  addEventListener("online", net); addEventListener("offline", net); net();
}

App.ui.nav = {go, placeInd, init, initNet};
})();
// ==== src/scripts/app.js ====
(function(){
// 启动入口：选定存储适配器（全项目唯一一处配置）、绑定各模块事件、首屏渲染、连接数据、每分钟刷新。
// 依赖：platform/*、data/*、ui/*（build/manifest.json 保证它最后拼接）。
// App.BUILD 由 build.py 在包头写入：发布版为 {storage:"claude-db"}，测试页为 {storage:"mock-db"}。

// —— 存储适配器配置 ——
// 可选值：App.platform.storage 里注册过的名字。"claude-db"（claude.ai）、"mock-db"（测试页）；
// 以后独立服务器版加 "rest" 适配器后在这里切换。
const STORAGE = (App.BUILD && App.BUILD.storage) || "claude-db";
App.data.store.use(App.platform.storage[STORAGE]());

// 事件绑定（顺序与 v2 一致）
App.ui.todos.init();
App.ui.toast.init();
App.data.write.init();
App.ui.sheet.init();
App.ui.nav.init();
App.ui.schedule.init();
App.ui.nav.initNet();

App.ui.nav.go(App.data.state.view); App.ui.render();

App.data.subscribe.start();

// 每分钟刷新时间轴与倒计时
setInterval(() => { if (App.core.dom.$("sheet").hidden) App.ui.render(); }, 60000);
})();
})();
</script>
