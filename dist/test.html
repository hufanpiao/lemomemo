// ==== src/scripts/ui/toast.js ====
(function(){
// 职责：底部提示条队列：show(文案, 按钮字, 按钮动作, 显示毫秒) 新增一条，可叠放，最多 TOAST_MAX 条（超出时最早的先走），
//       每条有自己的计时器；带按钮的“撤销”类提示由调用方传 TOAST_UNDO_MS。点按钮执行动作并收起这一条。
// 依赖：core/const.js、ui/dom.js
App.ui = App.ui || {};

const C = App.core.C;
const {$, h} = App.ui.dom;
const live = [];   // 当前显示中的提示：{el, timer}

function dismiss(t){
  const i = live.indexOf(t); if (i < 0) return;
  live.splice(i, 1);
  clearTimeout(t.timer);
  t.el.classList.remove("on");
  setTimeout(() => t.el.remove(), C.TOAST_LEAVE_MS);
}
function show(msg, btnText, action, ms){
  while (live.length >= C.TOAST_MAX) dismiss(live[0]);
  const t = {el:null, timer:null};
  const btn = btnText ? h("button",{type:"button",onclick:() => { dismiss(t); if (action) action(); }}, btnText) : null;
  t.el = h("div",{class:"toast"}, h("span",null,msg), btn);
  $("toasts").append(t.el);
  live.push(t);
  requestAnimationFrame(() => t.el.classList.add("on"));
  t.timer = setTimeout(() => dismiss(t), ms || C.TOAST_MS);
  return t;
}

App.ui.toast = {show, dismiss};
})();
// ==== src/scripts/ui/render.js ====
(function(){
// 职责：渲染调度与数据事件的接线：订阅 data 层的 change / error / notice（连不上、断线自动重连中、已重新连上），决定重绘和提示；
//       render() 依次重绘抬头、今天、日程、待办（勾选动画期间暂缓）；抬头显示月日、星期年份和“今天完成 / 没赶上”胶囊。
// 依赖：core/const.js、core/date.js、logic/items.js、data/bus.js、data/state.js、ui/dom.js、ui/view-state.js、ui/toast.js
// 运行时调用：ui/today.js、ui/schedule.js、ui/todos.js、ui/nav.js、App.clock
App.ui = App.ui || {};

const C = App.core.C;
const {WK, parse} = App.core.date;
const {isDoneOn, isLate} = App.logic.items;
const {$, h} = App.ui.dom;
const V = App.ui.view, toast = App.ui.toast, visTd = App.data.visTd;

const ERR_TEXT = {forbidden:"你没有修改权限，只能查看。", quota:"存储已满，删掉一些旧条目再试。"};
const errText = code => ERR_TEXT[code] || "没保存上，检查网络后再试。";

function render(){
  const wait = V.holdUntil - App.clock.now();
  if (wait > 0){ clearTimeout(V.holdTimer); V.holdTimer = setTimeout(render, wait + 10); return; }
  renderHead(); App.ui.today.render(); App.ui.schedule.render(); App.ui.todos.render();
}

function renderHead(){
  const t = App.clock.today(), d = parse(t);
  $("hd-md").innerHTML = ""; $("hd-md").append((d.getMonth()+1)+"", h("small",null,"月"), d.getDate()+"", h("small",null,"日"));
  $("hd-sub").textContent = WK[d.getDay()] + "  " + d.getFullYear() + "年";
  const chips = $("hd-chips"); chips.textContent = "";
  const doneToday = visTd().filter(x => isDoneOn(x, t)).length;
  const late = visTd().filter(x => isLate(x, t)).length;
  if (doneToday) chips.append(h("span",{class:"chip"},"今天完成 ",h("b",null,doneToday)," 件"));
  if (late) chips.append(h("button",{class:"chip late",type:"button",onclick:()=>{ App.ui.nav.go("today"); $("late").scrollIntoView({behavior:"smooth",block:"center"}); }},h("b",null,late)," 件没赶上"));
}

function showNoData(hint){
  const n = $("notice"); n.hidden = false; n.textContent = "";
  n.append(h("strong",null,hint.title), hint.text);
}

function init(){
  App.data.on("change", render);
  App.data.on("error", e => { V.holdUntil = 0; toast.show(errText(e.code), "重试", e.retry, C.TOAST_RETRY_MS); });
  let lostToast = null;   // 断线提示：重新连上时收起
  App.data.on("notice", n => {
    if (n.type === "unavailable") showNoData(n.hint);
    else if (n.type === "lost"){
      if (lostToast) toast.dismiss(lostToast);
      lostToast = toast.show("和云端的连接断了，正在自动重连…", null, null, C.TOAST_LOST_MS);
    } else if (n.type === "reconnected"){
      if (lostToast){ toast.dismiss(lostToast); lostToast = null; }
      toast.show("已重新连上");
    }
  });
}

render.head = renderHead;
render.init = init;
render.errText = errText;
App.ui.render = render;
})();
// ==== src/scripts/ui/today-late.js ====
(function(){
// 职责：今天视图里的“没赶上”红色面板：列出截止日已过、还没完成的待办，每条可改到今天 / 明天，多条时可全部改到今天。
//       改期交给 data/write.js，提示文案在这里。
// 依赖：core/date.js、logic/items.js、data/state.js、data/write.js、ui/dom.js、ui/toast.js
App.ui = App.ui || {};

const {addDays, dayDiff, md} = App.core.date;
const {isLate} = App.logic.items;
const visTd = App.data.visTd, write = App.data.write;
const {$, h} = App.ui.dom;
const toast = App.ui.toast;

function reschedule(x, d, t){
  write.reschedule(x, d);
  toast.show("已改到"+(d === t ? "今天" : "明天"));
}
async function moveAll(list){
  await write.moveAll(list);
  toast.show(list.length+" 件已改到今天");
}
function renderLate(t){
  const lb = $("late"); lb.textContent = "";
  const late = visTd().filter(x => isLate(x, t)).sort((a,b) => a.due.localeCompare(b.due));
  if (!late.length) return;
  const p = h("section",{class:"panel late-panel","aria-labelledby":"h-late"},
    h("div",{class:"ph"}, h("h2",{id:"h-late"},late.length+" 件没赶上"),
      late.length > 1 ? h("button",{class:"btn-dark",type:"button",onclick:()=>moveAll(late)},"全部改到今天") : null));
  for (const x of late){
    p.append(h("div",{class:"late-row"},
      h("div",{class:"t"}, x.title, h("small",null,"原定 "+md(x.due)+"，晚了 "+(-dayDiff(x.due,t))+" 天")),
      h("div",{class:"mini"},
        h("button",{type:"button",onclick:()=>reschedule(x,t,t)},"今天"),
        h("button",{type:"button",onclick:()=>reschedule(x,addDays(t,1),t)},"明天"))));
  }
  lb.append(p);
}

App.ui.todayLate = {render: renderLate};
})();
// ==== src/scripts/ui/today-timeline.js ====
(function(){
// 职责：今天视图里的时间轴：只显示“现在前后 + 有安排的时段”，重叠的日程分列并排，全天日程放上方胶囊，红线标出现在。
// 依赖：core/const.js、core/date.js、logic/items.js、logic/projects.js、logic/sort.js、data/state.js、ui/dom.js
// 运行时调用：ui/sheet.js
App.ui = App.ui || {};

const C = App.core.C;
const {pad, m2hm} = App.core.date;
const {startMin, endMin} = App.logic.items;
const {projColor} = App.logic.projects;
const {byTime} = App.logic.sort;
const S = App.data.state, visEv = App.data.visEv, ready = App.data.ready;
const {$, h} = App.ui.dom;
const openSheet = (...a) => App.ui.sheet.open(...a);

// 把同时段重叠的日程分到并排的几列：给每项写上 k（第几列）和 n（这一簇共几列）
function layoutLanes(items){
  let cluster = [], cEnd = -1;
  const flush = () => {
    const lanes = [];
    for (const it of cluster){ let k = lanes.findIndex(end => end <= it.s); if (k < 0){ k = lanes.length; lanes.push(0); } lanes[k] = it.en; it.k = k; }
    for (const it of cluster) it.n = lanes.length;
    cluster = []; cEnd = -1;
  };
  for (const it of items){ if (it.s >= cEnd && cluster.length) flush(); cluster.push(it); cEnd = Math.max(cEnd, it.en); }
  if (cluster.length) flush();
  return items;
}
function renderTimeline(t, nm){
  const tl = $("tl"), ad = $("tl-allday");
  tl.textContent = ""; ad.textContent = "";
  const evs = visEv().filter(e => e.date === t);
  const timed = evs.filter(e => e.time).sort(byTime);
  evs.filter(e => !e.time).forEach(e => ad.append(h("button",{class:"ad",type:"button",style:"background:"+projColor(e.project),onclick:()=>openSheet("event",e)},"全天  "+e.title)));
  $("tl-meta").textContent = timed.length ? timed.length+" 项" : "";
  // 只显示“现在前后 + 有安排的时段”，避免大段空白
  let sH = Math.max(0, Math.floor(nm/60) - C.TL_HOURS_BEFORE), eH = Math.min(24, Math.floor(nm/60) + C.TL_HOURS_AFTER);
  for (const e of timed){ sH = Math.min(sH, Math.floor(startMin(e)/60)); eH = Math.max(eH, Math.ceil(endMin(e)/60)); }
  eH = Math.min(24, eH); if (eH - sH < C.TL_MIN_HOURS) sH = Math.max(0, eH - C.TL_MIN_HOURS);
  const PX = C.TL_PX_PER_HOUR, H = (eH - sH) * PX;
  const hours = h("div",{class:"hours",style:"height:"+H+"px"}), lane = h("div",{class:"lane",style:"height:"+H+"px"});
  for (let i = sH; i <= eH; i++){
    const y = (i - sH) * PX;
    hours.append(h("span",{style:"top:"+Math.min(H-6,Math.max(6,y))+"px"},pad(i)+":00"));
    lane.append(h("i",{style:"top:"+y+"px"}));
  }
  const items = layoutLanes(timed.map(e => ({e, s:startMin(e), en:endMin(e)})));
  for (const it of items){
    const top = (it.s - sH*60)/60*PX, ht = Math.max(C.TL_BLOCK_MIN_PX, (it.en-it.s)/60*PX - 4);
    const w = 100/it.n;
    const b = h("button",{class:"blk"+(it.en <= nm ? " past":""),type:"button",
      style:"top:"+(top+2)+"px;height:"+ht+"px;left:calc("+(w*it.k)+"% + 6px);width:calc("+w+"% - 8px);background:"+projColor(it.e.project),
      onclick:()=>openSheet("event",it.e)},
      h("span",{class:"bt"},it.e.title), ht > C.TL_META_MIN_PX ? h("span",{class:"bm"},it.e.time+"–"+m2hm(it.en)+(it.e.project?"  "+it.e.project:"")) : null);
    if (S.fresh.has(it.e.id)) b.classList.add("fresh");
    lane.append(b);
  }
  if (nm >= sH*60 && nm <= eH*60){
    lane.append(h("div",{class:"now",style:"top:"+((nm - sH*60)/60*PX)+"px"}, h("span",null,m2hm(nm))));
  }
  tl.append(hours, lane);
  if (!timed.length && !evs.length && ready()){
    lane.append(h("div",{style:"position:absolute;left:12px;right:8px;top:8px;color:var(--muted);font-size:14px"},"今天没有定了时间的安排。"));
  }
}

App.ui.todayTimeline = {render: renderTimeline, layoutLanes};
})();
// ==== src/scripts/ui/today.js ====
(function(){
// 职责：“今天”视图的总装：下一件事大卡片、今天要做、晚上预告明天；没赶上面板和时间轴分别在
//       ui/today-late.js、ui/today-timeline.js 里，这里按顺序调用。
// 依赖：core/const.js、core/date.js、logic/items.js、logic/projects.js、logic/sort.js、logic/format.js、
//       data/state.js、ui/dom.js、ui/today-late.js、ui/today-timeline.js
// 运行时调用：ui/sheet.js、ui/todos.js、ui/schedule.js、App.clock
App.ui = App.ui || {};

const C = App.core.C;
const {addDays} = App.core.date;
const {isDoneOn} = App.logic.items;
const {projColor} = App.logic.projects;
const {byTime, sortTodos, pickNext} = App.logic.sort;
const {relDay, dueText, startsText} = App.logic.format;
const visEv = App.data.visEv, visTd = App.data.visTd, ready = App.data.ready;
const {$, h, ICON_CHECK, skeleton, emptyBox} = App.ui.dom;
const openSheet = (...a) => App.ui.sheet.open(...a);
const todoRow = x => App.ui.todos.row(x);
const evBlock = e => App.ui.schedule.evBlock(e);

function renderNext(t, nm){
  const box = $("next"); box.textContent = "";
  if (!ready()){ box.append(h("div",{class:"next empty"}, ...skeleton(2))); return; }
  const n = pickNext(visEv(), visTd(), t, nm);
  if (!n){
    box.append(h("div",{class:"next empty"}, h("span",{class:"lbl"},"下一件事"), h("span",{class:"big"},"空闲"),
      h("span",{class:"cd"},"今天没有别的安排了。点右下角的＋记一件新的事。")));
  } else if (n.kind === "event"){
    const e = n.item;
    box.append(h("button",{class:"next",type:"button",style:"background:"+projColor(e.project)+";border:0;text-align:left;width:100%",onclick:()=>openSheet("event",e)},
      h("span",{class:"lbl"},"下一件事"), h("span",{class:"big"},e.time), h("span",{class:"cd"},startsText(n.start - nm, n.end)),
      h("span",{class:"tt"},e.title), e.project || e.note ? h("span",{class:"proj"},[e.project,e.note].filter(Boolean).join("  ")) : null));
  } else {
    const x = n.item;
    const card = h("div",{class:"next",style:"background:"+projColor(x.project)},
      h("span",{class:"lbl"},"下一件事"), h("span",{class:"big",style:"font-size:40px"}, x.due ? dueText(x.due, t).replace("截止","") : "待办"),
      h("span",{class:"tt"},x.title), x.project ? h("span",{class:"proj"},x.project) : null,
      h("button",{class:"act",type:"button","aria-label":"完成："+x.title,html:ICON_CHECK,onclick:()=>App.ui.todos.toggle(x,true)}));
    card.querySelector(".tt").onclick = () => openSheet("todo", x);
    box.append(card);
  }
}

function renderTodayTodos(t){
  const ul = $("today-todos"); ul.textContent = "";
  if (!ready()){ ul.append(...skeleton(2)); return; }
  const soon = addDays(t, C.SOON_DAYS);
  const list = visTd().filter(x => (!x.done && (!x.due || x.due >= t) && ((x.due && x.due <= soon) || x.important)) ||
    (isDoneOn(x, t) && (x.important || (x.due && x.due <= soon))));
  sortTodos(list);
  if (!list.length){
    const anyOpen = visTd().some(x => !x.done);
    ul.append(h("li",null, emptyBox(anyOpen ? "最近两天没有到期的事" : "没有待办", anyOpen ? "其他待办在“全部待办”里。" : "点右下角的＋，写一句话就能记下。")));
  } else list.forEach(x => ul.append(todoRow(x)));
}

function renderTomorrow(t){
  const tm = $("tomorrow");
  const showTm = App.clock.hour() >= C.TOMORROW_PREVIEW_HOUR;
  tm.hidden = !showTm || !ready();
  if (!showTm || !ready()) return;
  const tmr = addDays(t,1);
  const evs = visEv().filter(e => e.date === tmr).sort(byTime);
  $("tm-meta").textContent = relDay(tmr, t);
  const l = $("tm-list"); l.textContent = "";
  if (!evs.length) l.append(emptyBox("明天还没有安排", "可以早点休息。"));
  else evs.forEach(e => l.append(evBlock(e)));
}

function renderToday(){
  const t = App.clock.today(), nm = App.clock.nowMin();
  renderNext(t, nm);
  App.ui.todayLate.render(t);
  App.ui.todayTimeline.render(t, nm);
  renderTodayTodos(t);
  renderTomorrow(t);
}

App.ui.today = {render: renderToday};
})();
// ==== src/scripts/ui/schedule.js ====
(function(){
// 职责：“日程”视图：一周日期条（上一周 / 下一周）、选中那天的日程、“接下来”按日期分组的日程；
//       evBlock() 生成一个日程色块，今天视图预告明天时也用。
// 依赖：core/const.js、core/date.js、logic/items.js、logic/projects.js、logic/sort.js、logic/format.js、
//       data/state.js、ui/dom.js、ui/view-state.js
// 运行时调用：ui/sheet.js、App.clock
App.ui = App.ui || {};

const C = App.core.C;
const {WK, parse, addDays, m2hm, mondayOf} = App.core.date;
const {endMin} = App.logic.items;
const {projColor} = App.logic.projects;
const {byTime} = App.logic.sort;
const {relDay} = App.logic.format;
const S = App.data.state, visEv = App.data.visEv, ready = App.data.ready;
const {$, h, skeleton, emptyBox} = App.ui.dom;
const V = App.ui.view;
const openSheet = (...a) => App.ui.sheet.open(...a);

function evBlock(e){
  const end = e.time ? m2hm(endMin(e)) : "";
  const b = h("button",{class:"ev",type:"button",style:"background:"+projColor(e.project),onclick:()=>openSheet("event",e)},
    h("span",{class:"et"}, e.time || "全天", end ? h("small",null,"至 "+end) : null),
    h("span",{class:"eb"}, h("span",{class:"en"},e.title),
      (e.project || e.note || e.source === "chat") ? h("span",{class:"ex",style:"display:block"},[e.project, e.note, e.source === "chat" ? "Claude 代记" : ""].filter(Boolean).join("  ")) : null));
  if (S.fresh.has(e.id)) b.classList.add("fresh");
  return b;
}
function groupByDay(){
  const byDay = {};
  for (const e of visEv()) (byDay[e.date] = byDay[e.date] || []).push(e);
  return byDay;
}
function renderWeek(t, byDay){
  const d0 = parse(V.weekStart), d6 = parse(addDays(V.weekStart,6));
  $("wk-title").textContent = (d0.getMonth()+1)+"月" + (V.weekStart === mondayOf(t) ? " 本周" : (d0.getDate()+"日–"+(d6.getMonth()+1)+"月"+d6.getDate()+"日"));
  const wk = $("week"); wk.textContent = "";
  for (let i = 0; i < 7; i++){
    const k = addDays(V.weekStart, i), d = parse(k);
    const dots = h("span",{class:"dots"});
    (byDay[k] || []).slice(0, C.WEEK_DOTS_MAX).forEach(e => dots.append(h("b",{style:"background:"+projColor(e.project)})));
    wk.append(h("button",{type:"button",class:"day"+(k===t?" today":"")+(k===V.selDay?" sel":""),"aria-label":relDay(k, t)+((byDay[k]||[]).length?"，"+byDay[k].length+" 项":""),"aria-pressed":k===V.selDay?"true":"false",
      onclick:()=>{ V.selDay = k; renderSched(); }},
      h("span",{class:"w"},WK[d.getDay()].slice(1)), h("span",{class:"n"},d.getDate()), dots));
  }
}
function renderDay(t, byDay){
  const dl = $("day-list"); dl.textContent = "";
  dl.append(h("div",{class:"dhead"+(V.selDay===t?" is-today":"")}, relDay(V.selDay, t)));
  if (!ready()){ dl.append(...skeleton(2)); return; }
  const list = (byDay[V.selDay] || []).slice().sort(byTime);
  if (!list.length) dl.append(emptyBox("这一天还没有安排", h("button",{class:"linkbtn",type:"button",style:"display:block;margin-top:4px",onclick:()=>openSheet("event",null,V.selDay)},"给这天记一件事")));
  else list.forEach(e => dl.append(evBlock(e)));
}
function renderUpcoming(t){
  const up = $("up-list"); up.textContent = "";
  if (!ready()){ up.append(...skeleton(2)); return; }
  const after = visEv().filter(e => e.date > (V.selDay > t ? V.selDay : t) && e.date !== V.selDay).sort(byTime).slice(0, C.UPCOMING_MAX);
  $("up-meta").textContent = after.length ? after.length+" 项" : "";
  if (!after.length){ up.append(emptyBox("后面还没有安排", "以后的日程会按日期排在这里。")); return; }
  let cur = null;
  for (const e of after){
    if (e.date !== cur){ cur = e.date; up.append(h("div",{class:"dhead"}, relDay(cur, t))); }
    up.append(evBlock(e));
  }
}
function renderSched(){
  const t = App.clock.today(), byDay = groupByDay();
  renderWeek(t, byDay);
  renderDay(t, byDay);
  renderUpcoming(t);
}
function init(){
  $("wk-prev").onclick = () => { V.weekStart = addDays(V.weekStart,-7); V.selDay = V.weekStart; renderSched(); };
  $("wk-next").onclick = () => { V.weekStart = addDays(V.weekStart,7); V.selDay = V.weekStart; renderSched(); };
}

App.ui.schedule = {render: renderSched, evBlock, init};
})();

(function(){
// 职责：“待办”视图：项目筛选胶囊、未完成 + 今天完成的列表、折叠的更早已完成；row() 生成一行待办（勾选、标签），
//       toggle() 是勾选的统一入口（今天视图的大卡片也用）：写入后提示“今天第 N 件”并可撤销；列表里勾选时先播完划线动画再重排。
// 依赖：core/const.js、core/date.js、logic/items.js、logic/projects.js、logic/sort.js、logic/format.js、
//       data/state.js、data/write.js、ui/dom.js、ui/view-state.js、ui/toast.js
// 运行时调用：ui/sheet.js、App.clock
App.ui = App.ui || {};

const C = App.core.C;
const {isDoneOn} = App.logic.items;
const {projColor} = App.logic.projects;
const {sortTodos} = App.logic.sort;
const {dueText} = App.logic.format;
const S = App.data.state, visTd = App.data.visTd, ready = App.data.ready, write = App.data.write;
const {$, h, ICON_CHECK, skeleton, emptyBox} = App.ui.dom;
const V = App.ui.view, toast = App.ui.toast;
const {dayDiff} = App.core.date;
const openSheet = (...a) => App.ui.sheet.open(...a);

function toggle(x, done){
  write.toggleDone(x, done);
  if (done){
    const t = App.clock.today();
    const n = visTd().filter(y => isDoneOn(y, t)).length;
    toast.show("完成了，今天第 "+n+" 件", "撤销", () => toggle(x, false), C.TOAST_UNDO_MS);
  }
}
// 列表里勾选：先让这一行播完划线动画（holdUntil 期间暂缓重绘），再重排
function toggleInList(x, li){
  const done = !x.done;
  li.classList.toggle("done", done);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  V.holdUntil = App.clock.now() + (done ? (reduce ? C.DONE_ANIM_REDUCED_MS : C.DONE_ANIM_MS) : 0);
  toggle(x, done);
}

function todoRow(x){
  const t = App.clock.today();
  const li = h("li",{class:"td"+(x.done?" done":"")+(x.important?" imp":"")+(S.fresh.has(x.id)?" fresh":""),"data-id":x.id});
  const ck = h("button",{class:"ck",type:"button","aria-pressed":x.done?"true":"false","aria-label":(x.done?"标为未完成：":"完成：")+x.title}, h("span",{html:ICON_CHECK}));
  ck.onclick = () => toggleInList(x, li);
  const tags = h("span",{class:"tags"});
  if (x.project) tags.append(h("span",{class:"tag"}, h("span",{class:"sw",style:"background:"+projColor(x.project)}), x.project));
  if (x.due && !x.done){
    const n = dayDiff(x.due, t);
    tags.append(h("span",{class:"tag"+(n<0?" over":n===0?" due-today":"")}, dueText(x.due, t)));
  }
  if (x.source === "chat") tags.append(h("span",{class:"tag ai"},"Claude 代记"));
  const body = h("button",{class:"tb",type:"button",onclick:()=>openSheet("todo",x)}, h("span",{class:"tt"},x.title), tags.childNodes.length ? tags : null);
  li.append(ck, body);
  return li;
}
function renderFilters(){
  const f = $("filters"); f.textContent = "";
  const ps = [...new Set(visTd().map(x => x.project).filter(Boolean))];
  if (V.projFilter && !ps.includes(V.projFilter)) V.projFilter = null;
  if (ps.length){
    f.append(h("button",{class:"f",type:"button","aria-pressed":!V.projFilter?"true":"false",onclick:()=>{V.projFilter=null;renderTodos();}},"全部"));
    ps.forEach(p => f.append(h("button",{class:"f",type:"button","aria-pressed":V.projFilter===p?"true":"false",onclick:()=>{V.projFilter=p;renderTodos();}},
      h("span",{class:"sw",style:"background:"+projColor(p)}), p)));
  }
  f.hidden = !ps.length;
}
function renderTodos(){
  renderFilters();
  const ul = $("todos"); ul.textContent = "";
  const t = App.clock.today();
  const inScope = x => !V.projFilter || x.project === V.projFilter;
  const open = visTd().filter(x => !x.done && inScope(x));
  const list = sortTodos(visTd().filter(x => inScope(x) && (!x.done || isDoneOn(x, t))));
  $("td-meta").textContent = open.length ? open.length+" 件未完成" : "";
  if (!ready()) ul.append(...skeleton(3));
  else if (!list.length){
    const doneAll = visTd().some(x => x.done && inScope(x));
    ul.append(h("li",null, doneAll ? emptyBox("全部做完了", "新的待办点右下角的＋添加。") : emptyBox("没有待办", "点右下角的＋，写一句话，比如“周五前交 NEOX 横版”。")));
  } else list.forEach(x => ul.append(todoRow(x)));
  const old = sortTodos(visTd().filter(x => inScope(x) && x.done && !isDoneOn(x, t)));
  const tg = $("done-toggle"), dlist = $("done-list");
  tg.hidden = !old.length;
  tg.textContent = V.showDone ? "收起已完成" : "已完成 "+old.length+" 件";
  dlist.hidden = !V.showDone || !old.length; dlist.textContent = "";
  if (V.showDone) old.slice(0, C.OLD_DONE_MAX).forEach(x => dlist.append(todoRow(x)));
}
function init(){
  $("done-toggle").onclick = () => { V.showDone = !V.showDone; renderTodos(); };
}

App.ui.todos = {render: renderTodos, row: todoRow, toggle, init};
})();

(function(){
// 职责：新建 / 编辑弹出层：一句话输入实时解析填表、日程 / 待办切换、项目胶囊；保存、删除都交给 data/write.js，

// 依赖：core/const.js、core/date.js、logic/projects.js、logic/parse-quick.js、logic/format.js、

App.ui = App.ui || {};

const C = App.core.C;
const {mondayOf} = App.core.date;
const {projColor} = App.logic.projects;

const V = App.ui.view, toast = App.ui.toast;
const parseQuick = s => App.logic.parseQuick(s, App.clock.today(), App.data.projects());

let sheetKind = "todo", editing = null, lastFocus = null;
function setKind(k){
  sheetKind = k;
  document.querySelectorAll("#seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k ? "true" : "false"));
  document.querySelectorAll(".ev-only").forEach(el => el.hidden = k !== "event");

  $("f-date-lab").textContent = k === "event" ? "日期" : "截止日期";

function fillProjChips(){

    dl.append(h("option",{value:p}));
    c.append(h("button",{class:"f",type:"button","aria-pressed":$("f-proj").value===p?"true":"false",onclick:()=>{ $("f-proj").value = $("f-proj").value === p ? "" : p; fillProjChips(); }},
      h("span",{class:"sw",style:"background:"+projColor(p)}), p));
  });
}
function openSheet(kind, item, presetDate){
  if (!App.data.isConnected()){ toast.show("数据未连接，暂时不能编辑"); return; }
  lastFocus = document.activeElement;
  editing = item || null;
  $("sh-title").textContent = item ? (kind === "event" ? "编辑日程" : "编辑待办") : "新建";
  $("q-wrap").hidden = !!item; $("seg").hidden = !!item;

  setKind(kind || (presetDate ? "event" : "todo"));
  fillProjChips();

function closeSheet(){
  $("scrim").classList.remove("on"); $("sheet").classList.remove("on");

  if (lastFocus && lastFocus.focus) lastFocus.focus();

function readForm(){
  return {title:$("f-title").value.trim(), date:$("f-date").value, time:$("f-time").value, dur:$("f-dur").value,

  $("save").disabled = true; $("save").textContent = "保存中…";
  const r = await write.saveItem(sheetKind, editing, v);

  $("save").disabled = false; $("save").textContent = editing ? "保存修改" : "加入";

function onDelete(){

function init(){
  document.querySelectorAll("#seg button").forEach(b => b.onclick = () => { setKind(b.dataset.k); if (b.dataset.k === "event" && !$("f-date").value) $("f-date").value = V.selDay || App.clock.today(); });

    $("f-imp").checked = p.important; $("f-proj").value = p.project; fillProjChips();

  $("q").onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); $("sheet").requestSubmit(); } };
  $("cancel").onclick = closeSheet; $("scrim").onclick = closeSheet;
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
  $("del").onclick = onDelete;
  $("sheet").addEventListener("submit", onSubmit);
  $("plus").onclick = () => openSheet(null, null, V.view === "sched" ? V.selDay : null);
}

// ==== tests/mock/mock-db.js ====
(function(){
// 职责：模拟存储适配器 "mock-db"：按 data/store.js 的统一接口实现，数据只在内存里；带 batch（一次写多条只推送一次）。
//       工厂参数 opts：seed 初始数据（默认 plannerSampleData(现在)）、delay 推送延迟毫秒（默认 120）、
//       fail(op, coll, id) 返回错误码就让这次写入失败、hang 为 true 时写入永不返回（测超时）。
// 依赖：platform/index.js（注册表 App.platform.storage、storeError）、tests/mock/sample-data.js（未传 seed 时）
App.platform = App.platform || {};
App.platform.storage = App.platform.storage || {};

App.platform.storage["mock-db"] = function createMockDb(opts){
  opts = opts || {};
  const data = opts.seed || globalThis.plannerSampleData(Date.now());
  const delay = opts.delay == null ? 120 : opts.delay;
  const subs = {events:[], todos:[], logs:[]};
  const bag = c => data[c] || (data[c] = {});
  const snap = c => ({items:Object.entries(bag(c)).map(([id,v]) => Object.assign({}, v, {id})), changes:() => []});
  const emit = c => setTimeout(() => (subs[c] || []).forEach(f => f(snap(c))), delay);
  const check = (op, c, id) => {
    if (opts.hang) return new Promise(() => {});
    const code = opts.fail && opts.fail(op, c, id);
    return code ? Promise.reject(App.platform.storeError(code)) : null;
  };
  const apply = (op, c, id, v) => {
    if (op === "add") bag(c)[id] = v;
    else if (op === "update"){ if (!bag(c)[id]) throw App.platform.storeError("not_found"); Object.assign(bag(c)[id], v); }
    else if (op === "remove") delete bag(c)[id];
  };
  const write = async (op, c, id, v) => { const bad = check(op, c, id); if (bad) return bad; apply(op, c, id, v); emit(c); };
  let n = 0;
  return {
    data,
    async connect(){ return true; },
    async get(c, id){ const v = bag(c)[id]; return v ? Object.assign({}, v, {id}) : null; },
    async list(c){ return snap(c).items; },
    subscribe(c, onData){ (subs[c] = subs[c] || []).push(onData); emit(c); return () => { subs[c] = subs[c].filter(f => f !== onData); }; },
    newId(){ return "m"+(++n); },
    add: (c, id, v) => write("add", c, id, v),
    update: (c, id, v) => write("update", c, id, v),
    remove: (c, id) => write("remove", c, id),
    async batch(ops){
      for (const o of ops){ const bad = check(o.op, o.coll, o.id); if (bad) return bad; }
      ops.forEach(o => apply(o.op, o.coll, o.id, o.data));
      [...new Set(ops.map(o => o.coll))].forEach(emit);
    },
  };
};
})();
// ==== src/scripts/app.js ====
(function(){
// 职责：启动入口：选定存储适配器（全项目唯一一处配置）、创建统一时钟、绑定各模块事件、首屏渲染、连接数据、启动时钟。
//       App.BUILD 由 build.py 在包头写入：发布版为 {storage:"claude-db"}，测试页为 {storage:"mock-db"}。
// 依赖：core/clock.js、platform/index.js、platform/env.js、platform/prefs.js、platform/claude-db.js、data/bus.js、data/store.js、data/log.js、data/write.js、data/subscribe.js、
//       ui/view-state.js、ui/render.js、ui/today.js、ui/schedule.js、ui/todos.js、ui/sheet.js、ui/nav.js、ui/remind.js、ui/theme.js

// —— 存储适配器配置 ——
// 可选值：App.platform.storage 里注册过的名字。"claude-db"（claude.ai）、"mock-db"（测试页）；
// 以后独立服务器版加 "rest" 适配器后在这里切换。
const STORAGE = (App.BUILD && App.BUILD.storage) || "claude-db";
App.data.store.use(App.platform.storage[STORAGE]());

// —— 统一时钟（全页面只有这一个“现在”）——
App.clock = App.core.clock.create(App.platform.env);
App.data.write.init(App.clock);
App.data.log.init({clock: App.clock, device: App.platform.prefs.deviceId(), src: "page"});   // 运行日志（ADR-010）
App.platform.env.onHidden(() => App.data.log.flush());
App.ui.viewState.init(App.clock.today());

// —— 事件绑定 ——
App.ui.render.init();          // 数据事件 → 重绘 / 提示
App.ui.todos.init();
App.ui.sheet.init();
App.ui.nav.init();
App.ui.schedule.init();
App.ui.nav.initNet();
App.ui.theme.init();           // v3 预留
App.ui.remind.init();          // v3 预留

App.clock.on("daychange", ({prev, day}) => { App.ui.viewState.onDayChange(prev, day); App.ui.render(); });
App.clock.on("tick", () => { if (App.ui.sheet.isClosed()) App.ui.render(); });

// —— 首屏与数据 ——
App.ui.nav.go(App.ui.view.view); App.ui.render();
App.data.subscribe.start();
// 每天最多一次：清理 30 天前删除的条目和 90 天前的日志（等两个集合都加载完再做）
App.data.on("loaded", () => {
  const P = App.platform.prefs, day = App.clock.today();
  if (P.get(P.KEYS.purged, "") === day) return;
  P.set(P.KEYS.purged, day);
  App.data.write.purgeDeleted(); App.data.log.purge();
});
App.clock.start();
})();
})();
</script>
