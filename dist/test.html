<title>日程与待办</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* 设计变量：颜色、字体、圆角、阴影；浅色为默认，深色有两套写法
   （跟随系统 prefers-color-scheme，以及 data-theme="dark" 强制深色）。
   依赖：无。必须最先拼接。 */
:root{
  --bg:#e6e7ea; --panel:#ffffff; --panel-2:#f2f3f5; --ink:#121316; --muted:#6a6e76; --line:#e3e4e8;
  --dock:#121316; --dock-ink:#f3f3f4; --pill-on:#ffffff; --pill-on-ink:#121316;
  --yellow:#f1df4a; --on-yellow:#121316; --red:#e2372b; --red-soft:#fbe2df; --focus:#3a6cf4;
  --p1:#f3e27a; --p2:#bca8f6; --p3:#f5a5c8; --p4:#95dfa8; --p5:#95d4f2; --p6:#f6a78c; --p7:#d6d7dc; --on-p:#141414;
  --shadow:0 18px 40px -18px rgba(18,19,22,.35);
  --f-num:"Manrope","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --r-panel:26px; --r-block:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0d0f; --panel:#17181b; --panel-2:#212226; --ink:#f1f1f3; --muted:#8d919a; --line:#2a2b30;
  --dock:#202125; --dock-ink:#f1f1f3; --pill-on:#f1f1f3; --pill-on-ink:#121316;
  --red:#ff5a4d; --red-soft:#3a1a17; --focus:#8fb0ff;
  --p1:#e8d56c; --p2:#ad98ee; --p3:#ea93ba; --p4:#86d29a; --p5:#86c6e6; --p6:#ec977c; --p7:#b9bac0;
  --shadow:0 18px 40px -18px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0d0f; --panel:#17181b; --panel-2:#212226; --ink:#f1f1f3; --muted:#8d919a; --line:#2a2b30;
  --dock:#202125; --dock-ink:#f1f1f3; --pill-on:#f1f1f3; --pill-on-ink:#121316;
  --red:#ff5a4d; --red-soft:#3a1a17; --focus:#8fb0ff;
  --p1:#e8d56c; --p2:#ad98ee; --p3:#ea93ba; --p4:#86d29a; --p5:#86c6e6; --p6:#ec977c; --p7:#b9bac0;
  --shadow:0 18px 40px -18px rgba(0,0,0,.8); color-scheme:dark}
/* 基础排版：盒模型、body 底色与安全区留白、表单控件继承字体、焦点框、数字字体、减少动效。
   依赖：tokens.css。 */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px calc(120px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* 页面骨架：.app 容器、三视图网格（手机单页切换，≥960px 三栏并排）、底部浮动导航与黄色＋。
   原注释：便当格面板 + 马卡龙色块条目；手机上分“今天/日程/待办”三页，底部浮动导航加黄色＋；≥960px 三栏同时显示
   依赖：tokens.css、base.css。 */
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
/* 网格 */
.grid{display:grid;grid-template-columns:1fr;gap:16px}
.view{display:none;flex-direction:column;gap:16px;min-width:0}
.view.on{display:flex}
@media (min-width:960px){
  .grid{grid-template-columns:1.1fr 1fr 1fr;align-items:start}
  .view{display:flex}
  .nav{display:none!important}
}
/* 底部浮动导航 */
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:10px;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock > *{pointer-events:auto}
.nav{position:relative;display:flex;background:var(--dock);border-radius:999px;padding:5px;box-shadow:var(--shadow)}
.nav button{position:relative;z-index:1;border:0;background:none;color:var(--dock-ink);border-radius:999px;padding:0 18px;height:46px;font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px;transition:color .25s}
.nav button[aria-current=page]{color:var(--pill-on-ink)}
.nav button svg{width:18px;height:18px;flex:none}
.nav .ind{position:absolute;top:5px;height:46px;border-radius:999px;background:var(--pill-on);transition:left .38s cubic-bezier(.34,1.3,.64,1),width .38s cubic-bezier(.34,1.3,.64,1)}
.nav .lab{overflow:hidden;white-space:nowrap}
.plus{width:56px;height:56px;border-radius:50%;border:0;background:var(--yellow);color:var(--on-yellow);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.plus svg{width:26px;height:26px}
@media (min-width:960px){.dock{justify-content:flex-end}}
/* 组件：页面抬头（大号月日、星期年份、“今天完成 / 没赶上”小胶囊）。
   依赖：tokens.css。 */
/* 抬头 */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 4px 0}
.top h1{margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-weight:500}
.top .md{font-family:var(--f-num);font-weight:800;font-size:clamp(34px,8vw,44px);line-height:1;letter-spacing:-.02em}
.top .md small{font-family:var(--f-body);font-weight:700;font-size:.62em;margin-left:2px}
.top .sub{font-size:16px;color:var(--muted)}
.top-chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:14px;background:var(--panel);border:0}
.chip.late{background:var(--red);color:#fff;font-weight:500}
.chip b{font-family:var(--f-num);font-weight:700}
/* 组件：通用面板 .panel、面板标题行 .ph、文字链接按钮、圆形图标按钮。
   依赖：tokens.css。 */
.panel{background:var(--panel);border-radius:var(--r-panel);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ph h2{margin:0;font-size:20px;font-weight:700;line-height:1.3}
.ph .meta{font-size:14px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.round{width:36px;height:36px;border-radius:50%;border:0;background:var(--panel-2);display:grid;place-items:center;flex:none}
.round svg{width:18px;height:18px}
/* 组件：“下一件事”大卡片（含空闲状态）。
   依赖：tokens.css。 */
/* 下一件事 */
.next{border-radius:var(--r-panel);padding:20px;color:var(--on-p);display:flex;flex-direction:column;gap:6px;position:relative;min-height:168px}
.next .lbl{font-size:14px;font-weight:500;opacity:.75}
.next .big{font-family:var(--f-num);font-weight:800;font-size:56px;line-height:1;letter-spacing:-.03em}
.next .cd{font-size:16px;font-weight:500}
.next .tt{font-size:20px;font-weight:700;line-height:1.35;overflow-wrap:anywhere;padding-right:56px}
.next .proj{font-size:14px;opacity:.75}
.next .act{position:absolute;right:16px;bottom:16px;width:48px;height:48px;border-radius:50%;border:0;background:var(--on-p);color:#fff;display:grid;place-items:center}
.next .act svg{width:22px;height:22px}
.next.empty{background:var(--panel);color:var(--ink)}
.next.empty .big{font-size:40px}
/* 组件：“没赶上”红色面板、行内“今天/明天”小按钮、深色按钮。
   依赖：tokens.css、panel.css。 */
/* 没赶上 */
.late-panel{background:var(--red-soft)}
.late-panel .ph h2{color:var(--red)}
.late-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--red) 18%,transparent)}
.late-row:first-of-type{border-top:0}
.late-row .t{overflow-wrap:anywhere;min-width:0}
.late-row .t small{display:block;font-size:12px;color:var(--red)}
.mini{display:flex;gap:6px}
.mini button{border:0;border-radius:999px;padding:6px 12px;font-size:14px;background:var(--panel);min-height:36px}
.btn-dark{border:0;border-radius:999px;padding:10px 18px;background:var(--ink);color:var(--panel);font-weight:500;min-height:44px}
/* 组件：今天的时间轴（小时刻度、色块、现在红线、全天胶囊）。
   依赖：tokens.css。 */
/* 时间轴（今天） */
.tl{position:relative;display:grid;grid-template-columns:44px 1fr;}
.tl .hours{position:relative}
.tl .hours span{position:absolute;left:0;font-family:var(--f-num);font-size:12px;color:var(--muted);transform:translateY(-50%)}
.tl .lane{position:relative;border-left:1px solid var(--line)}
.tl .lane i{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.blk{position:absolute;border-radius:12px;padding:6px 10px;color:var(--on-p);overflow:hidden;border:0;text-align:left;display:flex;flex-direction:column;gap:0;line-height:1.3}
.blk .bt{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk .bm{font-size:12px;opacity:.75;font-family:var(--f-num);white-space:nowrap}
.blk.past{filter:saturate(.35);opacity:.7}
.now{position:absolute;left:-6px;right:0;height:0;border-top:2px solid var(--red);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-1px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.now span{position:absolute;right:0;top:-12px;background:var(--red);color:#fff;font-family:var(--f-num);font-weight:700;font-size:12px;padding:1px 8px;border-radius:999px}
.allday{display:flex;flex-wrap:wrap;gap:6px}
.allday .ad{border:0;border-radius:999px;padding:4px 12px;font-size:14px;color:var(--on-p);font-weight:500}
/* 组件：日程页的一周日期条（今天描边、选中实心、彩色小圆点）。
   依赖：tokens.css。 */
/* 日期条 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:0;background:none;border-radius:16px;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px}
.day .w{font-size:12px;color:var(--muted)}
.day .n{font-family:var(--f-num);font-weight:700;font-size:16px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.day.today .n{box-shadow:inset 0 0 0 2px var(--ink)}
.day.sel .n{background:var(--ink);color:var(--panel)}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots b{width:6px;height:6px;border-radius:50%}
.day:hover .n{background:var(--panel-2)}
.day.sel:hover .n{background:var(--ink)}
/* 组件：日程色块列表与日期小标题。
   依赖：tokens.css。 */
/* 日程色块 */
.evlist{display:flex;flex-direction:column;gap:8px}
.dhead{font-size:14px;color:var(--muted);font-weight:500;padding:6px 2px 0}
.dhead.is-today{color:var(--ink);font-weight:700}
.ev{border:0;border-radius:var(--r-block);padding:12px 14px;color:var(--on-p);display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;width:100%}
.ev .et{font-family:var(--f-num);font-weight:800;font-size:16px;line-height:1.4}
.ev .et small{display:block;font-weight:600;font-size:12px;opacity:.7}
.ev .eb{min-width:0}
.ev .en{font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.ev .ex{font-size:14px;opacity:.78;overflow-wrap:anywhere}
/* 组件：待办列表（项目筛选胶囊、圆形勾选、划线动画、标签、离开与新到达动画）。
   .f 胶囊也被弹出层的项目选择复用。依赖：tokens.css。 */
/* 待办 */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.f{border:0;border-radius:999px;padding:6px 14px;font-size:14px;background:var(--panel-2);min-height:36px;display:inline-flex;align-items:center;gap:6px}
.f .sw{width:10px;height:10px;border-radius:50%}
.f[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.todos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.td{display:grid;grid-template-columns:44px 1fr;align-items:start;border-top:1px solid var(--line);position:relative}
.td:first-child{border-top:0}
.ck{width:44px;height:48px;border:0;background:none;display:grid;place-items:center;padding:0}
.ck span{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--muted);display:grid;place-items:center;transition:transform .16s cubic-bezier(.34,1.4,.64,1),background .16s}
.ck svg{width:14px;height:14px;opacity:0;color:var(--panel)}
.td.done .ck span{background:var(--ink);box-shadow:none}
.td.done .ck svg{opacity:1}
.ck:active span{transform:scale(.9)}
.tb{border:0;background:none;text-align:left;padding:12px 4px 12px 0;min-width:0;display:flex;flex-direction:column;gap:4px;width:100%}
.tb .tt{line-height:1.45;overflow-wrap:anywhere;background-image:linear-gradient(var(--muted),var(--muted));background-repeat:no-repeat;background-position:0 55%;background-size:0 1.5px;transition:background-size .28s cubic-bezier(.22,1,.36,1),color .2s}
.td.done .tb .tt{background-size:100% 1.5px;color:var(--muted)}
.td.imp .tb .tt{font-weight:700}
.td.imp .tb .tt::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);margin-right:8px;vertical-align:2px}
.td.done.imp .tb .tt::before{background:var(--muted)}
.tags{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px}
.tag .sw{width:8px;height:8px;border-radius:50%}
.tag.due-today{color:var(--ink);font-weight:500}
.tag.over{color:var(--red);font-weight:500}
.tag.ai{border-radius:999px;padding:0 8px;background:var(--panel-2);color:var(--muted)}
.td.leaving{animation:leave .24s cubic-bezier(.4,0,.2,1) forwards}
@keyframes leave{to{opacity:0;transform:translateY(-4px)}}
.fresh{animation:fresh 2.2s ease-out}
@keyframes fresh{0%,70%{box-shadow:inset 3px 0 0 var(--ink),0 0 0 3px color-mix(in srgb,var(--yellow) 70%,transparent)}100%{box-shadow:none}}
.donefold{display:flex;flex-direction:column;gap:0}
/* 组件：空状态提示框与加载骨架。
   依赖：tokens.css。 */
/* 空状态与骨架 */
.empty{border-radius:var(--r-block);background:var(--panel-2);padding:18px;color:var(--muted);font-size:14px}
.empty strong{display:block;color:var(--ink);font-size:16px;font-weight:700;margin-bottom:2px}
.sk{height:56px;border-radius:var(--r-block);background:var(--panel-2)}
@media (prefers-reduced-motion:no-preference){.sk{animation:pulse 1.2s ease-in-out infinite alternate}}
@keyframes pulse{to{opacity:.45}}
/* 组件：底部提示条（可叠放，最多 3 条，新的在下面；带撤销 / 重试按钮）与顶部断网红条。
   淡出时长 .2s 与 core/const.js 的 TOAST_LEAVE_MS 一致。依赖：tokens.css。 */
/* 提示条 */
.toasts{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:calc(100% - 32px);z-index:30;pointer-events:none}
.toast{transform:translateY(8px);opacity:0;background:var(--dock);color:var(--dock-ink);border-radius:999px;padding:6px 6px 6px 18px;display:flex;align-items:center;gap:12px;font-size:14px;transition:opacity .2s ease-out,transform .2s ease-out;pointer-events:none;max-width:100%;border:1px solid var(--line)}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast button{border:0;border-radius:999px;background:var(--yellow);color:var(--on-yellow);padding:6px 14px;font-weight:700;min-height:36px}
.netbar{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--red);color:#fff;font-size:14px;text-align:center;padding:calc(4px + env(safe-area-inset-top,0px)) 16px 4px}
/* 组件：新建/编辑底部弹出层（遮罩、一句话输入框、类型切换、表单字段、操作按钮）。
   依赖：tokens.css、todo.css（.f 胶囊）。 */
/* 底部弹出层 */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.45);z-index:50;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--panel);border-radius:28px 28px 0 0;max-height:92%;overflow-y:auto;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .34s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;gap:14px}
.sheet.on{transform:none}

.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}

<script>
(function(){
const App = {};
App.BUILD = {"target": "test", "storage": "mock-db"};
// ==== src/scripts/core/const.js ====
(function(){
// 职责：全项目共用的常量（默认值、长度上限、动画时长、提示条时长、时钟间隔等），避免魔法数字散落在各处。
//       改动画时长时要同步检查对应的 CSS（注释里写了是哪一条）。
// 依赖：无
App.core = App.core || {};

App.core.C = {
  // 数据默认值与上限
  DEFAULT_DURATION_MIN: 60,     // 日程没写时长时按 1 小时
  NO_DUE: "9999",               // 排序时“没有截止日”排在最后
  TITLE_MAX: 160,               // 与 index.html 标题输入框 maxlength 一致
  PROJECT_MAX: 40,              // 与项目输入框 maxlength 一致
  NOTE_MAX: 200,                // 与备注输入框 maxlength 一致
  RAW_MAX: 1000,                // 原话最多保留的字数

  // 动画（毫秒）
  DONE_ANIM_MS: 960,            // 勾选后停顿再重排：todo.css .tb .tt 划线 .28s + 停留
  DONE_ANIM_REDUCED_MS: 800,    // 系统开了“减少动态效果”时的停顿
  SHEET_ANIM_MS: 340,           // 弹出层收起：sheet.css .sheet transition .34s
  FRESH_MS: 2400,               // 别处新加的条目高亮：todo.css @keyframes fresh 2.2s + 余量
  TOAST_LEAVE_MS: 200,          // 提示条淡出：toast.css .toast transition .2s

  // 提示条
  TOAST_MS: 3000,               // 普通提示
  TOAST_UNDO_MS: 8000,          // 带“撤销”的提示
  TOAST_RETRY_MS: 6000,         // 保存失败、带“重试”的提示
  TOAST_LOST_MS: 60000,         // 连接中断、带“刷新”的提示
  TOAST_MAX: 3,                 // 最多同时叠放几条
  DELETE_TITLE_CHARS: 12,       // 删除提示里显示标题的前几个字

  // 时间轴
  TL_PX_PER_HOUR: 52,
  TL_HOURS_BEFORE: 1,           // 现在之前至少显示 1 小时
  TL_HOURS_AFTER: 3,            // 现在之后至少显示 3 小时
  TL_MIN_HOURS: 4,              // 至少显示 4 小时
  TL_BLOCK_MIN_PX: 30,          // 色块最小高度
  TL_META_MIN_PX: 40,           // 色块高于这个才显示时间行

  // 列表
  SOON_DAYS: 2,                 // “今天要做”包含两天内到期的
  DUE_COUNTDOWN_DAYS: 7,        // 7 天内显示“还剩 N 天”
  UPCOMING_MAX: 30,             // “接下来”最多列多少项
  OLD_DONE_MAX: 100,            // 折叠的已完成最多显示多少项
  WEEK_DOTS_MAX: 3,             // 日期条每天最多几个小圆点
  TOMORROW_PREVIEW_HOUR: 18,    // 几点以后预告明天
  NARROW_NAV_PX: 380,           // 窄于这个宽度时导航只显示当前页文字

  // 提醒（v3，需求澄清 #1–#5、#28–#30）
  REMIND_EVENT_DEFAULT_MIN: 15,       // 有时间的日程默认提前 15 分钟
  REMIND_EVENT_OPTIONS: [null, 0, 15, 30, 60, 1440],   // 不提醒 / 准时 / 15 / 30 / 1 小时 / 1 天
  REMIND_DAY_MORNING_MIN: 9 * 60,     // 待办、全天日程“当天”提醒在 9:00
  REMIND_ALLDAY_PREV_MIN: 20 * 60,    // 全天日程“前一天”提醒在 20:00
  REMIND_TODO_PREV_MIN: 9 * 60,       // 待办“前一天”提醒在 9:00
  REMIND_STALE_MS: 60 * 60000,        // 提醒时刻过去 60 分钟以上就不再发（#30）
  PUSH_LEAD_MS: 15 * 60000,           // 定时推送宁可提前 15 分钟（#5）
  SNOOZE_MS: 10 * 60000,              // “10 分钟后”

  // 最近删除（v3，ADR-006）
  TRASH_KEEP_DAYS: 30,                // 软删除 30 天后彻底清理

  // 运行日志（v3，ADR-010）
  LOG_MAX_ENTRIES: 500,               // 每台设备每天一条文档，最多 500 条
  LOG_KEEP_DAYS: 90,                  // 保留 90 天
  LOG_FLUSH_MS: 30000,                // 每 30 秒写一次（切到后台时立即写）

  // 时钟、写入与连接
  CLOCK_TICK_MS: 60000,         // 每分钟刷新一次时间轴和倒计时
  CLOCK_ALIGN_MS: 200,          // tick 安排在整分钟后 200 毫秒（要求 1 秒内）
  WRITE_TIMEOUT_MS: 10000,      // 写入超过 10 秒没回应算失败
  RECONNECT_MS: [3000, 10000, 30000, 60000],   // 断线后第 1、2、3、4+ 次重连的等待
};
})();
// ==== src/scripts/core/date.js ====
(function(){
// 职责：日期与时间纯函数。日期用 "YYYY-MM-DD" 字符串，时间用 "HH:MM"；解析、加减天数、相差天数、
//       分钟互转、本周一、“10月23日”格式；todayOf/minOfDay/hourOf 把毫秒时间戳换成当天日期和分钟，msAt 反过来把日期加分钟换成时间戳。
//       “现在”一律由调用方传入（来自 core/clock.js），本文件不读系统时间。
// 依赖：无
App.core = App.core || {};

const WK = ["周日","周一","周二","周三","周四","周五","周六"];
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const dayDiff = (a,b) => Math.round((parse(a)-parse(b))/86400000);
const hm2m = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const m2hm = m => pad(Math.floor(m/60)%24)+":"+pad(m%60);
function mondayOf(s){ const d = parse(s); return addDays(s, -((d.getDay()+6)%7)); }
const md = s => { const d = parse(s); return (d.getMonth()+1)+"月"+d.getDate()+"日"; };
const todayOf = ms => ymd(new Date(ms));
const minOfDay = ms => { const n = new Date(ms); return n.getHours()*60+n.getMinutes(); };
const hourOf = ms => new Date(ms).getHours();
// 本地时间 "YYYY-MM-DD" 当天第 min 分钟的毫秒时间戳（min 可以是负数或超过 1440，会自动跨天）
const msAt = (s, min) => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d, 0, min).getTime(); };

App.core.date = {WK, pad, ymd, parse, addDays, dayDiff, hm2m, m2hm, mondayOf, md, todayOf, minOfDay, hourOf, msAt};
})();
// ==== src/scripts/core/clock.js ====
(function(){
// 职责：统一时钟。create(env) 返回时钟：now()/today()/nowMin()/hour() 读当前时间；
//       start() 后每到整分钟（之后 CLOCK_ALIGN_MS 毫秒内）发一次 "tick"；每次都按当时的时间重新对齐，不会越跑越偏；
//       页面切回前台发 "wake" 并重新对齐；日期变了（跨过零点）先发 "daychange" {prev, day}。
//       时间来源和定时器由 env 注入（正式运行用 platform/env.js，测试用假 env），本文件不直接读系统时间。
// 依赖：core/const.js、core/date.js
App.core = App.core || {};

const C = App.core.C;
const {todayOf, minOfDay, hourOf} = App.core.date;

// 到下一个整分钟还差多少毫秒，再加 CLOCK_ALIGN_MS 的余量（保证触发时已经跨过整分钟）
const msToNextMinute = ms => C.CLOCK_TICK_MS - (ms % C.CLOCK_TICK_MS) + C.CLOCK_ALIGN_MS;

// env：{now(), after(ms, fn) → 句柄, cancel(句柄), onVisible(fn)}
function create(env){
  const subs = {tick:[], wake:[], daychange:[]};
  const emit = (type, payload) => subs[type].slice().forEach(fn => fn(payload));
  let day = todayOf(env.now()), timer = null;
  const checkDay = () => {
    const d = todayOf(env.now());
    if (d !== day){ const prev = day; day = d; emit("daychange", {prev, day:d}); }
  };
  return {
    now: () => env.now(),
    today: () => todayOf(env.now()),
    nowMin: () => minOfDay(env.now()),
    hour: () => hourOf(env.now()),
    on(type, fn){ subs[type].push(fn); },
    start(){
      const schedule = () => {
        if (timer != null) env.cancel(timer);
        timer = env.after(msToNextMinute(env.now()), () => { timer = null; checkDay(); emit("tick"); schedule(); });
      };
      schedule();
      env.onVisible(() => { checkDay(); emit("wake"); schedule(); });
    },
    checkDay,
  };
}

App.core.clock = {create, msToNextMinute};
})();
// ==== src/scripts/logic/items.js ====
(function(){
// 职责：条目的通用判断（纯函数）：日程时长与起止分钟、待办是否“今天完成”、是否过期没做、条目是否已软删除。
//       各处重复的判断都从这里取，改规则只改一处。
// 依赖：core/const.js、core/date.js
App.logic = App.logic || {};

const C = App.core.C;
const {ymd, hm2m} = App.core.date;

const durationOf = e => Number(e.durationMin) || C.DEFAULT_DURATION_MIN;
const startMin = e => hm2m(e.time);
const endMin = e => hm2m(e.time) + durationOf(e);
// 已完成且完成时间落在 t 那天
const isDoneOn = (x, t) => !!(x.done && x.doneAt && ymd(new Date(x.doneAt)) === t);
// 没完成、有截止日且截止日早于 t
const isLate = (x, t) => !!(!x.done && x.due && x.due < t);
// 没有被软删除（deletedAt 为空）
const isLive = x => !x.deletedAt;

App.logic.items = {durationOf, startMin, endMin, isDoneOn, isLate, isLive};
})();
// ==== src/scripts/logic/projects.js ====
(function(){
// 职责：项目颜色与项目列表（纯函数）：已知项目用固定马卡龙色，其他项目按名字哈希取色；
//       projectList() 汇总已知项目和传入条目里出现过的项目（保持出现顺序；调用方传入的应是未删除的条目）。
// 依赖：无
App.logic = App.logic || {};

const KNOWN = {"SignPlex":"--p5","NEOX":"--p1","SOIL STUDIO":"--p4"};
const PAL = ["--p2","--p3","--p6","--p5","--p1","--p4"];
function projVar(p){
  if (!p) return "--p7";
  for (const k in KNOWN) if (k.toLowerCase() === p.toLowerCase()) return KNOWN[k];
  let x = 0; for (const c of p) x = (x*31 + c.charCodeAt(0)) >>> 0;
  return PAL[x % PAL.length];
}
const projColor = p => "var(" + projVar(p) + ")";
function projectList(events, todos){
  const set = new Set(Object.keys(KNOWN));
  for (const x of events.concat(todos)) if (x.project) set.add(x.project);
  return [...set];
}

App.logic.projects = {KNOWN, PAL, projVar, projColor, projectList};
})();
// ==== src/scripts/logic/format.js ====
(function(){
// 职责：界面文案的纯函数：relDay()“今天 周五 / 明天 周六 / 10月30日 周五”，dueText()“晚了 2 天 / 今天截止 / 还剩 3 天”，
//       startsText()“1 小时 20 分钟后开始 / 进行中，19:30 结束”。“今天”由参数 t 传入。
// 依赖：core/const.js、core/date.js
App.logic = App.logic || {};

const C = App.core.C;
const {WK, parse, dayDiff, md, m2hm} = App.core.date;

function relDay(s, t){
  const n = dayDiff(s, t);
  const w = WK[parse(s).getDay()];
  if (n === 0) return "今天 "+w; if (n === 1) return "明天 "+w; if (n === 2) return "后天 "+w;
  if (n === -1) return "昨天 "+w;
  return md(s)+" "+w;
}
function dueText(due, t){
  const n = dayDiff(due, t);
  if (n < 0) return "晚了 "+(-n)+" 天";
  if (n === 0) return "今天截止"; if (n === 1) return "明天截止";
  if (n <= C.DUE_COUNTDOWN_DAYS) return "还剩 "+n+" 天";
  return md(due)+" 截止";
}
// mins：离开始还有几分钟（≤0 表示已开始）；end：结束时刻（当天分钟数）
function startsText(mins, end){
  if (mins <= 0) return "进行中，"+m2hm(end)+" 结束";
  if (mins < 60) return mins+" 分钟后开始";
  return Math.floor(mins/60)+" 小时 "+(mins%60 ? mins%60+" 分钟" : "")+"后开始";
}

App.logic.format = {relDay, dueText, startsText};
})();
// ==== src/scripts/logic/sort.js ====
(function(){
// 职责：排序与挑选（纯函数）：日程按日期+时间排序、待办排序（未完成在前、重要在前、截止早的在前），
//       pickNext() 挑“下一件事”：今天还没结束的第一个定时日程，没有就取最该做的未完成待办。
// 依赖：core/const.js、logic/items.js
App.logic = App.logic || {};

const C = App.core.C;
const {startMin, endMin} = App.logic.items;

const byTime = (a,b) => (a.date+(a.time||"00:00")).localeCompare(b.date+(b.time||"00:00"));
function sortTodos(list){
  list.sort((a,b) => {
    if (!!a.done !== !!b.done) return a.done ? 1 : -1;
    if (a.done) return (b.doneAt||0)-(a.doneAt||0);
    if (!!a.important !== !!b.important) return a.important ? -1 : 1;
    const x = a.due || C.NO_DUE, y = b.due || C.NO_DUE;
    return x === y ? (a.createdAt||0)-(b.createdAt||0) : x.localeCompare(y);
  });
  return list;
}
// events/todos：可见条目；t：今天 "YYYY-MM-DD"；nm：现在是当天第几分钟
function pickNext(events, todos, t, nm){
  const evs = events.filter(e => e.date === t && e.time).sort((a,b) => a.time.localeCompare(b.time));
  for (const e of evs){
    const s = startMin(e), end = endMin(e);
    if (end > nm) return {kind:"event", item:e, start:s, end};
  }
  const open = todos.filter(x => !x.done);
  open.sort((a,b) => (b.important?1:0)-(a.important?1:0) || (a.due||C.NO_DUE).localeCompare(b.due||C.NO_DUE) || (a.createdAt||0)-(b.createdAt||0));
  return open[0] ? {kind:"todo", item:open[0]} : null;
}

App.logic.sort = {byTime, sortTodos, pickNext};
})();
// ==== src/scripts/logic/parse-text.js ====
(function(){
// 职责：一句话解析的文字预处理与公共工具（纯函数）：全角数字和标点转半角、中文星期先改成数字（防止“周五十点”被读成 50）、
//       中文数字转阿拉伯数字（“两点”“二十五分”“十一月”“三点二十”）、韩文固有数词转数字（“세 시”→“3시”）、
//       take()/cut() 从剩余文字里取走一段、cnNum() 中文数字换算。
// 依赖：无
App.logic = App.logic || {};

const CN_DIGIT = {"零":0,"一":1,"二":2,"两":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
const CN_WEEKDAY = {"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"日":7,"天":7};
const KO_NATIVE = {"한":1,"두":2,"세":3,"네":4,"다섯":5,"여섯":6,"일곱":7,"여덟":8,"아홉":9,"열":10,"열한":11,"열두":12};

// “十”“十五”“二十”“两”→ 数字；认不出返回 undefined
function cnNum(w){
  if (/^\d+$/.test(w)) return Number(w);
  if (w === "十") return 10;
  if (w.includes("十")){ const [a,b] = w.split("十"); return (a ? CN_DIGIT[a] : 1)*10 + (b ? CN_DIGIT[b] : 0); }
  return CN_DIGIT[w];
}
// 全角数字、冒号、空格转半角（听写和中文输入法常出全角）
const toHalfWidth = s => s.replace(/[\uFF10-\uFF19]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/：/g, ":").replace(/[　 ]/g, " ");
// 周X / 星期X / 礼拜X 的“X”先换成 1–7（7＝周日），后面的中文数字转换就不会把“周五十点”读成“50 点”
const protectWeekdays = s => s.replace(/(周|星期|礼拜)([一二三四五六日天])/g, (m, a, b) => a + CN_WEEKDAY[b]);
// 中文数字转阿拉伯数字：只处理紧跟“点/月/日/号/分”的，以及“N点”后面的分钟（“三点二十”），避免误伤普通词
function digitize(s){
  const conv = w => { const n = cnNum(w); return n == null ? w : String(n); };
  s = s.replace(/[零一二两三四五六七八九十]{1,3}(?=\s*[点月日号分])/g, conv);
  return s.replace(/点([零一二两三四五六七八九十]{1,3})(?![刻])/g, (m, w) => "点" + conv(w));
}
// 韩文固有数词 + 시：“세 시”“열한 시”→“3시”“11시”（不碰“시간”“시작”）
const koNative = s => s.replace(/(?<![\uAC00-\uD7A3])(열한|열두|다섯|여섯|일곱|여덟|아홉|열|한|두|세|네)\s*시(?![간작])/g, (m, w) => KO_NATIVE[w] + "시");

// 在剩余文字 st.text 里找 re，找到就把那一段换成空格，返回匹配结果
function take(st, re){ const m = st.text.match(re); if (m) st.text = st.text.replace(m[0], " "); return m; }
// 把已经找到的那段文字（字符串）从 st.text 里取走
function cut(st, str){ st.text = st.text.replace(str, " "); }

function prepare(s){ return koNative(digitize(protectWeekdays(toHalfWidth(s)))); }

App.logic.parseText = {cnNum, toHalfWidth, protectWeekdays, digitize, koNative, take, cut, prepare};
})();
// ==== src/scripts/logic/parse-date-zh.js ====
(function(){
// 职责：一句话解析的中文日期（纯函数）：今天/明天/后天/大后天（今晚、明早带出时段提示）、周几（这/下/下下周）、
//       下个月 N 号、带年份的日期、N月N日、M/D、N号/N日。“3号楼”“3.5万”“版本1.5”“第3-5集”都不当日期。
//       “今天”由参数 t 传入。返回 {date, period} 或 null（period 是“今晚”带出的“晚上”这类时段提示）。
// 依赖：core/date.js、logic/parse-text.js
App.logic = App.logic || {};

const {ymd, parse, addDays, mondayOf} = App.core.date;
const {take, cut} = App.logic.parseText;

// 没写年份的月日：已经过去就算明年
function monthDay(t, y, mo, d, hasYear){
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  let x = new Date(y, mo - 1, d);
  if (!hasYear && ymd(x) < t) x = new Date(y + 1, mo - 1, d);
  return ymd(x);
}
// 只写了几号：本月已过就算下个月
function dayOnly(t, d){
  if (d < 1 || d > 31) return null;
  const n = parse(t); let x = new Date(n.getFullYear(), n.getMonth(), d);
  if (ymd(x) < t) x = new Date(n.getFullYear(), n.getMonth() + 1, d);
  return ymd(x);
}
// 周几：wd 为 1–7（7＝周日）；prefix 为 下/下下/这/本 或空（空＝从今天起最近的那一天，今天是周五时“周五”指今天）
function weekday(t, prefix, wd){
  const mon = mondayOf(t), idx = (wd + 6) % 7, js = wd % 7;
  if (prefix === "下") return addDays(mon, 7 + idx);
  if (prefix === "下下") return addDays(mon, 14 + idx);
  if (prefix === "这" || prefix === "本") return addDays(mon, idx);
  return addDays(t, (js - parse(t).getDay() + 7) % 7);
}

function takeDateZh(st, t){
  const y = parse(t).getFullYear();
  let m;
  if ((m = take(st, /(大后天|后天|明天|明早|明晚|今天|今晚|今早)/))){
    const w = m[1];
    const period = w.endsWith("晚") ? "晚上" : w.endsWith("早") ? "早上" : "";
    return {date: addDays(t, w === "大后天" ? 3 : w === "后天" ? 2 : w.startsWith("明") ? 1 : 0), period};
  }
  if ((m = take(st, /(下下|下|这|本)?(?:个)?(?:周|星期|礼拜)([1-7])/))) return {date: weekday(t, m[1], Number(m[2]))};
  if ((m = take(st, /下个?月\s*(\d{1,2})\s*[日号](?![楼栋室])/))){
    const n = parse(t), d = Number(m[1]);
    return d >= 1 && d <= 31 ? {date: ymd(new Date(n.getFullYear(), n.getMonth() + 1, d))} : null;
  }
  if ((m = st.text.match(/(\d{4})\s*[年\/.-]\s*(\d{1,2})\s*[月\/.-]\s*(\d{1,2})\s*[日号]?/))){
    const date = monthDay(t, Number(m[1]), Number(m[2]), Number(m[3]), true);
    if (date){ cut(st, m[0]); return {date}; }
  }
  // N月N日：“十一月三号”在预处理时已变成“11月3号”
  if ((m = st.text.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]?(?![楼栋室])/))){
    const date = monthDay(t, y, Number(m[1]), Number(m[2]), false);
    if (date){ cut(st, m[0]); return {date}; }
  }
  // M/D（12/25）；用“.”“-”分隔的必须带“日/号”，否则“3.5万”“版本1.5”“第3-5集”会被误认
  if ((m = st.text.match(/(?<![\d.\/])(\d{1,2})\/(\d{1,2})(?![\d\/.])/) || st.text.match(/(?<![\d.第])(\d{1,2})[.\-](\d{1,2})[日号]/))){
    const date = monthDay(t, y, Number(m[1]), Number(m[2]), false);
    if (date){ cut(st, m[0]); return {date}; }
  }
  // N号 / N日：“3号楼”“3号线”“5号院”不算
  if ((m = st.text.match(/(?<![\d.第])(\d{1,2})\s*[日号](?![楼栋室线院间])/))){
    const date = dayOnly(t, Number(m[1]));
    if (date){ cut(st, m[0]); return {date}; }
  }
  return null;
}

App.logic.parseDateZh = {takeDateZh, monthDay, dayOnly, weekday};
})();
// ==== src/scripts/logic/parse-date-ko.js ====
(function(){
// 职责：一句话解析的韩文日期（纯函数）：오늘/내일/모레/글피、월요일~일요일（이번 주/다음 주/다다음 주，按周一开头）、
//       N월 N일、N일；后面带的“까지”（截止）和助词“에”一并取走。“今天”由参数 t 传入。返回 {date} 或 null。
// 依赖：core/date.js、logic/parse-text.js、logic/parse-date-zh.js
App.logic = App.logic || {};

const {addDays, parse} = App.core.date;
const {take, cut} = App.logic.parseText;
const {monthDay, dayOnly, weekday} = App.logic.parseDateZh;

const KO_WEEKDAY = {"월":1,"화":2,"수":3,"목":4,"금":5,"토":6,"일":7};
const KO_REL = {"오늘":0,"내일":1,"모레":2,"글피":3};
// 日期后面可以跟“까지”（截止）或助词“에”
const TAIL = "(?:\\s*까지)?(?:에(?![\uAC00-\uD7A3]))?";

function takeDateKo(st, t){
  let m;
  if ((m = take(st, new RegExp("(오늘|내일|모레|글피)" + TAIL)))) return {date: addDays(t, KO_REL[m[1]])};
  if ((m = take(st, new RegExp("(다다음\\s*주|다음\\s*주|담주|이번\\s*주)?\\s*(월|화|수|목|금|토|일)요일" + TAIL)))){
    const p = (m[1] || "").replace(/\s+/g, "");
    const prefix = p === "다음주" || p === "담주" ? "下" : p === "다다음주" ? "下下" : p === "이번주" ? "这" : "";
    return {date: weekday(t, prefix, KO_WEEKDAY[m[2]])};
  }
  if ((m = st.text.match(new RegExp("(\\d{1,2})\\s*월\\s*(\\d{1,2})\\s*일(?![요간])" + TAIL)))){
    const date = monthDay(t, parse(t).getFullYear(), Number(m[1]), Number(m[2]), false);
    if (date){ cut(st, m[0]); return {date}; }
  }
  if ((m = st.text.match(new RegExp("(?<![\\d.])(\\d{1,2})\\s*일(?![요간])" + TAIL)))){
    const date = dayOnly(t, Number(m[1]));
    if (date){ cut(st, m[0]); return {date}; }
  }
  return null;
}

App.logic.parseDateKo = {takeDateKo};
})();
// ==== src/scripts/logic/parse-time.js ====
(function(){
// 职责：一句话解析的时间（纯函数），中文和韩文共用一套规则：
//       时段词（上午/下午/晚上/凌晨…、오전/오후/저녁/밤/새벽/아침/점심）+ N点[半/一刻/三刻/N分] / N:MM / N시[반/N분]；
//       没写时段时 1–6 点按下午（澄清#11，含冒号写法和韩文）；“今晚12点”“밤 12시”是次日 00:00（澄清#9、9.2-10）；
//       “N点前 / N시까지”是截止（澄清#10），返回 deadline 文案，由调用方记成当天截止的待办。
//       认不出的时间（如“25点”）原样留在文字里，不取走。返回 {time, deadline, nextDay}。
// 依赖：core/date.js、logic/parse-text.js
App.logic = App.logic || {};

const {pad} = App.core.date;
const {cut} = App.logic.parseText;

const MORNING = ["凌晨","早上","早晨","上午","오전","새벽","아침"];
const NOON = ["中午","점심","낮"];
const EVENING = ["下午","傍晚","晚上","오후","저녁"];
const NIGHT = ["夜里","半夜","深夜","밤"];
const PERIODS = MORNING.concat(NOON, EVENING, NIGHT);
const TIME_RE = new RegExp(
  "(" + PERIODS.join("|") + ")?\\s*(\\d{1,2})" +
  "(?:\\s*:\\s*(\\d{2})" +                                                  // 8:30
  "|\\s*点(?:钟)?(半|一刻|三刻|(\\d{1,2})\\s*分?)?" +                         // 3点 / 3点半 / 3点20 / 3点25分
  "|\\s*시(?![간작])(?:\\s*(반)|\\s*(\\d{1,2})\\s*분)?)" +                   // 3시 / 3시 반 / 3시 30분
  "(\\s*(?:之前|以前|前|까지))?(?:에(?![\uAC00-\uD7A3]))?");                         // 截止、助词“에”

// period：时段词；hint：日期词带出的时段（“今晚”→“晚上”）。返回 {hh, nextDay}
function applyPeriod(hh, period, hint){
  const p = period || hint || "";
  if (MORNING.includes(p)) return {hh: hh === 12 && (p === "오전" || p === "새벽" || p === "凌晨") ? 0 : hh, nextDay:false};
  if (NOON.includes(p)) return {hh: hh < 6 ? hh + 12 : hh, nextDay:false};
  if (NIGHT.includes(p) || (p === "晚上" && hh === 12)){
    if (hh === 12) return {hh:0, nextDay:true};
    if (hh >= 1 && hh <= 5 && p !== "晚上") return {hh, nextDay:true};
    return {hh: hh < 12 ? hh + 12 : hh, nextDay:false};
  }
  if (EVENING.includes(p)) return {hh: hh < 12 ? hh + 12 : hh, nextDay:false};
  return {hh: hh >= 1 && hh <= 6 ? hh + 12 : hh, nextDay:false};   // 没写时段：1–6 点按下午
}

function takeTime(st, hint){
  const m = st.text.match(TIME_RE);
  if (!m) return {time:"", deadline:"", nextDay:false};
  const raw = Number(m[2]);
  const mm = m[3] ? Number(m[3]) : m[4] === "半" || m[6] ? 30 : m[4] === "一刻" ? 15 : m[4] === "三刻" ? 45 : m[5] ? Number(m[5]) : m[7] ? Number(m[7]) : 0;
  if (raw > 24 || mm > 59) return {time:"", deadline:"", nextDay:false};   // 认不出：不取走，留在标题里
  const {hh, nextDay} = applyPeriod(raw, m[1], hint);
  if (hh > 23) return {time:"", deadline:"", nextDay:false};
  cut(st, m[0]);
  const time = pad(hh) + ":" + pad(mm);
  if (m[8]) return {time:"", deadline: time + (m[8].includes("까지") ? "까지" : "前"), nextDay};
  return {time, deadline:"", nextDay};
}
// 时间之外单独剩下的中文时段词（“下午”）从标题去掉；韩文的“저녁 약속”“점심 미팅”是标题的一部分，保留
function takeStrayPeriod(st){ const m = st.text.match(/(凌晨|早上|上午|中午|下午|傍晚|晚上)/); if (m) cut(st, m[0]); }

App.logic.parseTime = {takeTime, applyPeriod, takeStrayPeriod, TIME_RE};
})();
// ==== src/scripts/logic/parse-marks.js ====
(function(){
// 职责：一句话解析的标记与收尾（纯函数）：提醒说法（“提前半小时提醒”“不用提醒”“30분 전 알림”“알림 없이”）、
//       重要（只认“重要/紧急/중요/급함”这类词，“不重要/안 중요”不算，感叹号不算，澄清#15）、
//       项目匹配（英文项目名前后不能紧挨英文字母或数字）、标题整理（去多余空白、首尾标点、感叹号、“记得/提醒我”等开头）。
// 依赖：logic/parse-text.js
App.logic = App.logic || {};

const {cnNum, take} = App.logic.parseText;

// 提醒说法。返回 {off:true} / {min:N} / {days:N} / null（没提到）
function takeRemind(st){
  let m;
  if (take(st, /(?:不用|不要|无需|不需要|别)\s*提醒|不提醒|알림\s*(?:없이|없음|끄기|안\s*함)/)) return {off:true};
  if ((m = take(st, /提前\s*(半|[\d零一二两三四五六七八九十]+)\s*个?\s*(分钟|分|小时|钟头|天|日)\s*提醒(?:我)?/))){
    const unit = m[2], n = m[1] === "半" ? 0.5 : cnNum(m[1]);
    if (n == null) return null;
    if (unit === "天" || unit === "日") return n >= 1 ? {days: Math.round(n)} : {min: Math.round(n * 1440)};
    return {min: Math.round(unit === "小时" || unit === "钟头" ? n * 60 : n)};
  }
  if ((m = take(st, /(\d+)\s*(분|시간)\s*전(?:에)?\s*알림/))) return {min: Number(m[1]) * (m[2] === "시간" ? 60 : 1)};
  if ((m = take(st, /(하루|이틀|(\d+)\s*일)\s*전(?:에)?\s*알림/))) return {days: m[1] === "하루" ? 1 : m[1] === "이틀" ? 2 : Number(m[2])};
  return null;
}

// 重要。“不重要的事”这类修饰用法：不标重要，标题保留（9.2-12）；单独的“不重要 / 안 중요”：不标重要，从标题去掉
const KEEP = ["不重要的", "不紧急的"];
const MARK = i => "〔保留" + i + "〕";
function takeImportant(st){
  KEEP.forEach((w, i) => { st.text = st.text.split(w).join(MARK(i)); });   // 先藏起来，免得被下面的规则拆掉
  take(st, /不重要|不紧急|안\s*(?:중요|급)(?:함|해|한)?/);
  const hit = !!take(st, /重要的?|紧急的?|중요한|중요(?:함|해)?|급함|급해|긴급/);
  KEEP.forEach((w, i) => { st.text = st.text.split(MARK(i)).join(w); });
  return hit;
}

const isWordChar = c => /[A-Za-z0-9]/.test(c);
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
// 项目：名字长的优先、不分大小写；英文名前后不能紧挨英文字母或数字（“UI”不会命中“GUI”）
function findProject(text, names){
  for (const p of names.slice().sort((a,b) => b.length - a.length)){
    if (!p) continue;
    const re = new RegExp((isWordChar(p[0]) ? "(?<![A-Za-z0-9])" : "") + esc(p) + (isWordChar(p[p.length - 1]) ? "(?![A-Za-z0-9])" : ""), "i");
    if (re.test(text)) return p;
  }
  return "";
}

// 标题：去掉感叹号、多余空白、首尾标点，以及开头的“前/之前”（“周五前交”）和“记得/提醒我”等口头语
const EDGE = /^[\s，,。.、；;:？?]+|[\s，,。.、；;:？?]+$/g;
function cleanTitle(text){
  let s = text.replace(/[!！]+/g, " ").replace(/\s+/g, " ");
  s = s.replace(/\s*([，,。、；;])(?:\s*[，,。、；;])+/g, "$1").replace(EDGE, "");
  s = s.replace(/^(之前|以前|前)\s*/, "").replace(/^(在|要|得|记得|提醒我|帮我记一下|记一下)\s*/, "").replace(EDGE, "");
  return s;
}

App.logic.parseMarks = {takeRemind, takeImportant, findProject, cleanTitle};
})();

(function(){
// 职责：一句话解析 parseQuick(s, t, projectNames)（纯函数）：从“下周三下午两点半和 NEOX 对片”“내일 오후 3시 NEOX 미팅”
//       里取出日期、时间、是否重要、项目、提醒和标题；有时间就判为日程，否则为待办。“今天”由 t（"YYYY-MM-DD"）传入。
//       步骤：预处理 → 提醒说法 → 日期（中文、韩文）→ 时间 → 重要 → 项目 → 标题，每步从剩余文字里“取走”识别到的部分。
// 依赖：core/date.js、logic/parse-text.js、logic/parse-date-zh.js、logic/parse-date-ko.js、logic/parse-time.js、logic/parse-marks.js
App.logic = App.logic || {};

const {addDays} = App.core.date;
const {prepare} = App.logic.parseText;
const {takeDateZh} = App.logic.parseDateZh;
const {takeDateKo} = App.logic.parseDateKo;
const {takeTime, takeStrayPeriod} = App.logic.parseTime;
const {takeRemind, takeImportant, findProject, cleanTitle} = App.logic.parseMarks;

/*
 * 返回 {title, date, time, important, project, kind, remind}
 *   title：什么都没剩下时用原话
 *   kind：有时间为 "event"，否则 "todo"；“N点前 / N시까지”记成当天截止的待办，时间写进标题（“交稿 18:00前”）
 *   remind：null 没提到；{off:true} 不提醒；{min:N} 提前 N 分钟（日程说“提前1天”换成 {min:1440}）；{days:N} 待办提前 N 天
 */
function parseQuick(s, t, projectNames){
  const x = prepare(s);
  const st = {text: " " + x + " "};
  let remind = takeRemind(st);
  const d = takeDateKo(st, t) || takeDateZh(st, t) || {date:"", period:""};
  const tm = takeTime(st, d.period);
  let date = d.date;
  if ((tm.time || tm.deadline) && !date) date = t;
  if (tm.nextDay) date = addDays(date || t, 1);
  takeStrayPeriod(st);
  const important = takeImportant(st);
  const project = findProject(st.text, projectNames);
  const core = cleanTitle(st.text);
  const title = tm.deadline ? (core ? core + " " + tm.deadline : tm.deadline) : (core || s.trim());
  const kind = tm.time ? "event" : "todo";
  if (remind && remind.days != null && kind === "event") remind = {min: remind.days * 1440};
  return {title, date, time: tm.time, important, project, kind, remind};
}

App.logic.parseQuick = parseQuick;
})();
// ==== src/scripts/logic/remind.js ====
(function(){
// 职责：提醒规则（纯函数）。按条目字段算出“实际提醒时刻”，判断现在该不该提醒，给出提醒选项和标签文案。
//       页面（ui/remind.js）和 Claude 定时推送用同一套规则，“现在”一律由调用方传入，本文件不读系统时间。
//       规则依据：docs/02-设计/需求澄清-v3.md #1–#5、#28–#31，数据字典“v3 计划中的规则补充”。
// 依赖：core/const.js、core/date.js
App.logic = App.logic || {};

const C = App.core.C;
const {msAt, hm2m, addDays} = App.core.date;
const MIN = 60000;

// 条目的提醒设置（缺字段时按默认规则，需求澄清 #2）：
//   有时间的日程 → {type:"event-time", min}；全天日程 → {type:"event-allday", days}；有截止日的待办 → {type:"todo", days}
//   不提醒、没有日期、待办没截止日 → null
function setting(item, kind){
  if (!item) return null;
  if (kind === "event"){
    if (!item.date) return null;
    if (item.time){
      const v = item.remindMin === undefined ? C.REMIND_EVENT_DEFAULT_MIN : item.remindMin;
      return v === null ? null : {type:"event-time", min:v};
    }
    const d = item.remindDays === undefined ? 1 : item.remindDays;
    return d === null ? null : {type:"event-allday", days:d};
  }
  if (!item.due) return null;
  const d = item.remindDays === undefined ? (item.important ? 1 : 0) : item.remindDays;
  return d === null ? null : {type:"todo", days:d};
}

// 按规则算出的提醒时刻（毫秒），不考虑 snoozeAt
function baseAt(item, kind){
  const s = setting(item, kind);
  if (!s) return null;
  if (s.type === "event-time") return msAt(item.date, hm2m(item.time)) - s.min * MIN;
  if (s.type === "event-allday") return s.days >= 1 ? msAt(addDays(item.date, -s.days), C.REMIND_ALLDAY_PREV_MIN) : msAt(item.date, C.REMIND_DAY_MORNING_MIN);
  return s.days >= 1 ? msAt(addDays(item.due, -s.days), C.REMIND_TODO_PREV_MIN) : msAt(item.due, C.REMIND_DAY_MORNING_MIN);
}

// 实际提醒时刻 = max(按规则算出的时刻, snoozeAt)；已删除、已完成、不提醒时为 null（需求澄清 #4）
function computeRemindAt(item, kind){
  if (!item || item.deletedAt) return null;
  if (kind === "todo" && item.done) return null;
  const base = baseAt(item, kind);
  if (base == null) return null;
  return item.snoozeAt && item.snoozeAt > base ? item.snoozeAt : base;
}

// 日程的开始和结束时刻（全天日程为当天 0:00–24:00）
function eventSpan(item){
  if (!item.time) return {start: msAt(item.date, 0), end: msAt(item.date, 24 * 60)};
  const start = msAt(item.date, hm2m(item.time));
  return {start, end: start + (Number(item.durationMin) || C.DEFAULT_DURATION_MIN) * MIN};
}

// 现在该不该提醒这一条。lead：提前量（页面为 0；定时推送为 C.PUSH_LEAD_MS，宁可早到）。
// 返回 {at} 或 null。规则：
//   - 实际提醒时刻 ≤ 现在 + lead；
//   - 过了实际提醒时刻 60 分钟以上的不再提醒（#30）；
//   - notifiedFor 等于实际提醒时刻 → 已经提醒过（去重）；
//   - 日程已经结束的不提醒；提醒时刻已过但还没开始的照样提醒（#3）。
function due(item, kind, now, lead){
  const at = computeRemindAt(item, kind);
  if (at == null) return null;
  if (item.notifiedFor === at) return null;
  if (at > now + (lead || 0)) return null;
  if (now - at > C.REMIND_STALE_MS) return null;
  if (kind === "event" && now >= eventSpan(item).end) return null;
  return {at};
}

// 从全部条目里挑出现在要提醒的，按提醒时刻从早到晚排序。
// events/todos：已整理、未删除的条目；返回 [{kind, item, at}]
function dueList(events, todos, now, lead){
  const out = [];
  for (const e of events){ const d = due(e, "event", now, lead); if (d) out.push({kind:"event", item:e, at:d.at}); }
  for (const t of todos){ const d = due(t, "todo", now, lead); if (d) out.push({kind:"todo", item:t, at:d.at}); }
  return out.sort((a, b) => a.at - b.at);
}

// 改了哪些字段时要清空 snoozeAt（#28）：日期、时间、提醒选项
const SNOOZE_RESET_FIELDS = ["date", "time", "due", "remindMin", "remindDays"];
const shouldResetSnooze = (before, patch) => SNOOZE_RESET_FIELDS.some(k => k in patch && patch[k] !== before[k]);

// 弹出层里的提醒选项：[{value, label}]；value 写进 remindMin（有时间的日程）或 remindDays（其他）
function options(kind, hasTime){
  if (kind === "event" && hasTime) return C.REMIND_EVENT_OPTIONS.map(v => ({value:v, label: minLabel(v)}));
  if (kind === "event") return [{value:null, label:"不提醒"}, {value:0, label:"当天 9:00"}, {value:1, label:"前一天 20:00"}];
  return [{value:null, label:"不提醒"}, {value:0, label:"当天 9:00"}, {value:1, label:"前一天 9:00"}];
}
function minLabel(v){
  if (v === null) return "不提醒";
  if (v === 0) return "准时";
  if (v % 1440 === 0) return v / 1440 + " 天";
  if (v % 60 === 0) return v / 60 + " 小时";
  return v + " 分";
}
// 条目上铃铛标签的文字；不提醒时为 ""
function label(item, kind){
  const s = setting(item, kind);
  if (!s) return "";
  if (s.type === "event-time") return s.min === 0 ? "准时提醒" : "提前 " + minLabel(s.min);
  if (s.type === "event-allday") return s.days >= 1 ? "前一天 20:00" : "当天 9:00";
  return s.days >= 1 ? "前一天 9:00" : "当天 9:00";
}
// 当前选中的选项值（缺字段时显示默认值）
function currentValue(item, kind){
  const s = setting(item, kind);
  if (!s) return null;
  return s.type === "event-time" ? s.min : s.days;
}

App.logic.remind = {setting, baseAt, computeRemindAt, eventSpan, due, dueList, shouldResetSnooze, options, label, currentValue};
})();

(function(){
// 职责：平台能力入口。所有依赖运行环境（claude.ai / 以后的独立服务器 PWA / 浏览器本身）的能力都注册在 App.platform 下：

const CODES = ["forbidden", "not_found", "quota", "network", "unauthenticated", "timeout"];

  e.cause = cause;
  return e;
};

(function(){

// 依赖：platform/index.js
App.platform = App.platform || {};

const KEYS = {
  view: "pv-view",     // 上次打开的视图：today / sched / todo（v2 起）
  theme: "pv-theme",   // v3：深浅色 system / light / dark（ADR-008）
  skin: "pv-skin",     // v3：皮肤，目前只有 bento（ADR-008）
  device: "pv-device", // v3：本机设备号，运行日志用（ADR-010）
  purged: "pv-purged", // v3：上次清理过期日志和最近删除的日期（每天最多一次）
};
function get(key, fallback){
  try { const v = localStorage.getItem(key); return v == null || v === "" ? fallback : v; }
  catch(e){ return fallback; }
}
function set(key, value){
  try { localStorage.setItem(key, value); } catch(e){}
}

// 本机设备号：第一次用时随机生成并保存；存不下（隐私模式）时每次打开都是新的，不影响功能
function deviceId(){
  let id = get(KEYS.device, "");
  if (!id){
    const r = (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Math.random()).slice(2);
    id = "d-" + r.replace(/-/g, "").slice(0, 10);
    set(KEYS.device, id);
  }
  return id;
}

App.platform.prefs = {KEYS, get, set, deviceId};
})();

(function(){
// 职责：claude.ai 存储适配器：把 window.claude.use("db") 的集合 / 文档接口包装成 data/store.js 定义的统一接口；
//       把平台错误码映射成中性错误码；记录 id 一律以文档 id 为准（数据里的 id 字段不能覆盖它）。
//       连不上时的提示文案也由这里提供。全项目只有本文件访问 window.claude。
// 依赖：platform/index.js
App.platform = App.platform || {};

const storeError = App.platform.storeError;
const CODE_MAP = {
  invalid_argument: "forbidden", permission_denied: "forbidden", forbidden: "forbidden",
  not_found: "not_found",
  quota_exceeded: "quota", resource_exhausted: "quota",
  unauthenticated: "unauthenticated",
};
const toStoreError = e => storeError(CODE_MAP[e && e.code] || "network", e);

App.platform.storage["claude-db"] = function createClaudeDb(){
  let db = null;
  const refs = new Map();   // newId 生成的文档引用，add 时沿用同一个引用
  const ref = (coll, id) => {
    const key = coll + "/" + id, r = refs.get(key);
    if (r){ refs.delete(key); return r; }
    return db.collection(coll).doc(id);
  };
  const guard = async fn => { try { await fn(); } catch(e){ throw toStoreError(e); } };
  return {
    async connect(){
      db = window.claude && window.claude.use ? await window.claude.use("db") : null;
      return !!db;
    },
    unavailableHint: () => ({title:"数据没有连上。", text:" 请在 claude.ai 登录同一个账号后再打开这个页面。"}),
    subscribe(coll, onData, onError){
      return db.collection(coll).onSnapshot(s => onData({
        items: s.docs.map(d => Object.assign({}, d.data(), {id:d.id})),
        changes: () => s.docChanges().map(c => ({type:c.type, id:c.doc.id})),
      }), e => onError(toStoreError(e)));
    },
    newId(coll){ const r = db.collection(coll).doc(); refs.set(coll + "/" + r.id, r); return r.id; },
    add: (coll, id, data) => guard(() => ref(coll, id).set(data)),
    update: (coll, id, patch) => guard(() => db.collection(coll).doc(id).update(patch)),
    remove: (coll, id) => guard(() => db.collection(coll).doc(id).delete()),
    async get(coll, id){
      try { const s = await db.collection(coll).doc(id).get(); return s.exists ? Object.assign({}, s.data(), {id:s.id || id}) : null; }
      catch(e){ throw toStoreError(e); }
    },
    async list(coll){
      try { const s = await db.collection(coll).get(); return s.docs.map(d => Object.assign({}, d.data(), {id:d.id})); }
      catch(e){ throw toStoreError(e); }
    },
    // 平台没有批量写入接口：不提供 batch，由 data/store.js 逐条写
  };
};
})();

(function(){
// 职责：数据层的事件总线。data 层只发事件，不碰界面；界面用 App.data.on() 订阅后自己决定重绘或提示。
//       事件："change"（数据或加载状态变了，该重绘）、"error" {code, retry}（写入失败，已回滚）、
//             "notice" {type:"unavailable", hint} | {type:"lost"} | {type:"reconnected"}（连接状态）。
// 依赖：无
App.data = App.data || {};

const subs = {};
App.data.on = function on(type, fn){
  (subs[type] = subs[type] || []).push(fn);
  return () => { subs[type] = subs[type].filter(f => f !== fn); };
};
App.data.emit = function emit(type, payload){

};

// ==== src/scripts/data/store.js ====
(function(){
// 职责：统一存储接口（适配器模式）。页面只通过 data/ 层用它，界面代码不直接调用；具体实现放在 platform/（claude-db）
//       或 tests/mock/（mock-db），由 app.js 一处配置选用。适配器没有 batch 时由这里逐条写。
// 依赖：无（适配器在启动时通过 use() 注入）
App.data = App.data || {};

/*
 * 适配器需要实现的方法（一个普通对象即可）：
 *
 *   connect(): Promise<boolean>
 *     连接存储。能用返回 true；当前环境没有这个存储（例如不在 claude.ai 里打开）返回 false。
 *   unavailableHint(): {title, text}   （可选）
 *     connect 返回 false 时页面上显示的提示，例如 {title:"数据没有连上。", text:" 请在 claude.ai 登录……"}。
 *
 *   subscribe(collection, onData, onError): () => void
 *     collection：集合名，目前只有 "events"（日程）和 "todos"（待办）。
 *     onData(snapshot)：每次集合有变化都调用一次，首次订阅也要调用一次（全量）。
 *       snapshot.items     —— 数组，集合里全部记录（含已软删除的），每条是 {...字段, id}；id 必须是文档 id，
 *                             记录数据里自带的 id 字段不能覆盖它
 *       snapshot.changes() —— 返回本次变化 [{type:"added"|"modified"|"removed", id}]，首次可为空数组
 *     onError(err)：连接中断等错误，err.code 为中性错误码。调用后这个订阅视为失效，data 层会重新订阅。
 *     返回值：取消订阅的函数。
 *
 *   newId(collection): string
 *     同步生成一个新记录的 id（写入前就要知道 id，用来识别“自己刚加的”记录，不做高亮）。
 *
 *   add(collection, id, data): Promise<void>      用 newId 得到的 id 新建一条记录
 *   update(collection, id, patch): Promise<void>  合并更新部分字段（值为 null 表示清空该字段）
 *   remove(collection, id): Promise<void>         彻底删除一条记录（页面上的“删除”是软删除，用 update 写 deletedAt）
 *   get(collection, id): Promise<object|null>     （v3）读一条记录，不存在返回 null；运行日志追加前要先读出当天那份
 *   list(collection): Promise<object[]>           （v3）一次读出整个集合（含已删除），用于清理过期的日志和最近删除
 *   batch(ops): Promise<void>                     （可选）一次写多条，ops = [{op:"add"|"update"|"remove", coll, id, data}]
 *     写入失败时 reject，错误对象带中性错误码 code（用 App.platform.storeError 生成）：
 *       forbidden 没有写权限 / not_found 记录不存在 / quota 存储已满 / network 网络或未知 / unauthenticated 未登录
 *
 * 以后要加的 REST / 自建服务器适配器（这次不实现），建议对应关系：
 *   connect   → GET /api/me 校验登录（未登录返回 false，unavailableHint 提示去登录）
 *   subscribe → 先 GET /api/{collection} 拉全量，再用 WebSocket / SSE（或定时轮询）收增量，
 *               每次变化把本地缓存整理成 {items, changes()} 回调；断线时调用 onError
 *   newId     → 客户端生成（crypto.randomUUID()），服务器接受客户端 id
 *   add       → PUT    /api/{collection}/{id}   body: data
 *   update    → PATCH  /api/{collection}/{id}   body: patch
 *   remove    → DELETE /api/{collection}/{id}
 *   get       → GET    /api/{collection}/{id}（404 → null）
 *   list      → GET    /api/{collection}
 *   batch     → POST   /api/batch               body: ops（服务器端用事务）
 *   HTTP 401 → unauthenticated，403 → forbidden，404 → not_found，413/507 → quota，其他 → network。
 *   离线时可先写入 IndexedDB 队列，恢复网络后补发（配合 Service Worker）。
 */

let adapter = null;
const store = {
  connected: false,
  use(a){ adapter = a; store.connected = false; },
  async connect(){ store.connected = !!(adapter && await adapter.connect()); return store.connected; },
  unavailableHint: () => adapter && adapter.unavailableHint ? adapter.unavailableHint() : {title:"数据没有连上。", text:""},
  subscribe: (coll, onData, onError) => adapter.subscribe(coll, onData, onError),
  newId: coll => adapter.newId(coll),
  add: (coll, id, data) => adapter.add(coll, id, data),
  update: (coll, id, patch) => adapter.update(coll, id, patch),
  remove: (coll, id) => adapter.remove(coll, id),
  get: (coll, id) => adapter.get(coll, id),
  list: coll => adapter.list(coll),
  async batch(ops){
    if (adapter.batch) return adapter.batch(ops);
    for (const o of ops) await store[o.op](o.coll, o.id, o.data);
  },
};

App.data.store = store;
})();

(function(){
// 职责：快照进来先整理字段，再进状态：强制类型（字符串、数字、布尔）、日期和时间补零（"2026-1-5" → "2026-01-05"、
//       "9:5" → "09:05"，认不出就置空）、限制长度、deletedAt 统一为毫秒数或 null；id 一律用文档 id。
//       v3 提醒字段：remindMin（日程）/ remindDays 只认合法取值，null 表示“不提醒”，不合法或缺失时去掉该字段（按默认规则提醒，
//       需求澄清 #2）；snoozeAt、notifiedFor、remindAt 统一为毫秒数或 null。待办也有 note（#20）。
//       Claude 写入的不规范数据不会让页面出错。未知字段原样保留。纯函数。
// 依赖：core/const.js、core/date.js
App.data = App.data || {};

const C = App.core.C;
const {pad} = App.core.date;

const str = (v, max) => {
  const s = typeof v === "string" ? v : typeof v === "number" && isFinite(v) ? String(v) : "";
  return max ? s.slice(0, max) : s;
};
const num = (v, dflt) => { const n = Number(v); return v !== null && v !== "" && isFinite(n) ? n : dflt; };
const bool = v => v === true || v === "true" || v === 1;
function date(v){
  const m = typeof v === "string" && v.trim().match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
  if (!m) return "";
  const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  return mo >= 1 && mo <= 12 && d >= 1 && d <= 31 ? y+"-"+pad(mo)+"-"+pad(d) : "";
}
function time(v){
  const m = typeof v === "string" && v.trim().match(/^(\d{1,2})[:：](\d{1,2})$/);
  if (!m) return "";
  const h = Number(m[1]), mi = Number(m[2]);
  return h <= 23 && mi <= 59 ? pad(h)+":"+pad(mi) : "";
}
const deletedAt = v => { const n = num(v, 0); return n > 0 ? n : null; };
const msOrNull = v => { const n = num(v, 0); return n > 0 ? n : null; };
// 提醒选项：raw 里没有这个键、或取值不合法 → 返回 undefined（调用方删掉该键，按默认规则）；null → 不提醒
function remindOpt(raw, key, allowed){
  if (!(key in raw)) return undefined;
  const v = raw[key];
  if (v === null || v === "null" || v === false) return null;
  const n = Number(v);
  return v !== "" && allowed.includes(n) ? n : undefined;
}
function remindFields(out, raw, kind){
  const keys = kind === "event" ? [["remindMin", C.REMIND_EVENT_OPTIONS.filter(x => x !== null)], ["remindDays", [0, 1]]] : [["remindDays", [0, 1]]];
  for (const [k, allowed] of keys){
    const v = remindOpt(raw, k, allowed);
    if (v === undefined) delete out[k]; else out[k] = v;
  }
  if (kind !== "event") delete out.remindMin;
  out.snoozeAt = msOrNull(raw.snoozeAt); out.notifiedFor = msOrNull(raw.notifiedFor); out.remindAt = msOrNull(raw.remindAt);
  return out;
}
const duration = v => { const n = num(v, 0); return n > 0 ? n : C.DEFAULT_DURATION_MIN; };

function common(raw){
  return {
    title: str(raw.title, C.TITLE_MAX), project: str(raw.project, C.PROJECT_MAX),
    source: str(raw.source), rawText: str(raw.rawText, C.RAW_MAX),
    createdAt: num(raw.createdAt, 0), updatedAt: num(raw.updatedAt, 0), deletedAt: deletedAt(raw.deletedAt),
  };
}
function normalizeEvent(raw, id){
  raw = raw || {};
  const out = Object.assign({}, raw, common(raw), {
    date: date(raw.date), time: time(raw.time), durationMin: duration(raw.durationMin), note: str(raw.note, C.NOTE_MAX),
  });
  remindFields(out, raw, "event");
  out.id = String(id);
  return out;
}
function normalizeTodo(raw, id){
  raw = raw || {};
  const out = Object.assign({}, raw, common(raw), {
    done: bool(raw.done), doneAt: num(raw.doneAt, 0), due: date(raw.due), important: bool(raw.important),
  });
  out.note = str(raw.note, C.NOTE_MAX);
  remindFields(out, raw, "todo");
  out.id = String(id);
  return out;
}
// coll："events" | "todos"；raw 为适配器给的记录（其中 id 已是文档 id）
const normalizeItem = (coll, raw) => coll === "events" ? normalizeEvent(raw, raw.id) : normalizeTodo(raw, raw.id);

App.data.normalize = {normalizeEvent, normalizeTodo, normalizeItem, date, time};
})();
// ==== src/scripts/data/fields.js ====
(function(){
// 职责：把弹出层表单的值整理成要写入存储的日程 / 待办记录，新建时补上 createdAt、source、rawText 和待办的 done/doneAt；
//       编辑时 diff() 只留下真正改过的字段（避免把另一台设备期间的修改覆盖掉，PM-C②）。
//       v3：提醒选项 remind（undefined＝没动过，按默认规则；null＝不提醒；数字＝选项值）写进 remindMin 或 remindDays；
//       待办也有 note。纯函数，只被 data/write.js 使用。
// 依赖：core/const.js
App.data = App.data || {};

const C = App.core.C;

// 有时间的日程用 remindMin，全天日程和待办用 remindDays
function remindPatch(kind, hasTime, remind){
  if (remind === undefined) return {};
  return kind === "event" && hasTime ? {remindMin: remind} : {remindDays: remind};
}
// v：{title, date, time, dur, project, note, remind}
function eventFields(v, now){
  const time = v.time || "";
  return Object.assign({title:v.title, date:v.date, time, durationMin:Number(v.dur)||C.DEFAULT_DURATION_MIN,
    project:v.project, note:v.note || ""}, remindPatch("event", !!time, v.remind), {updatedAt:now});
}
// v：{title, date, important, project, note, remind}
function todoFields(v, now){
  return Object.assign({title:v.title, due:v.date || "", important:!!v.important, project:v.project, note:v.note || ""},
    remindPatch("todo", false, v.remind), {updatedAt:now});
}
function asNew(data, coll, now, raw){
  Object.assign(data, {createdAt:now, source:"page", rawText:raw});
  if (coll === "todos") Object.assign(data, {done:false, doneAt:0});
  return data;
}
// 只保留和 before 不同的字段；updatedAt 总是保留
function diff(before, data){
  const out = {};
  for (const k of Object.keys(data)) if (k === "updatedAt" || data[k] !== before[k]) out[k] = data[k];
  return out;
}

App.data.fields = {eventFields, todoFields, asNew, diff, remindPatch};
})();
// ==== src/scripts/data/log.js ====
(function(){
// 职责：运行日志（ADR-010）。op() 记操作、run() 记运行状况，先在内存里攒着，每 LOG_FLUSH_MS 或页面切到后台时
//       写进存储的 logs 集合：每台设备每天一条文档，id 为 "<YYYY-MM-DD>_<设备号>"，最多 LOG_MAX_ENTRIES 条。
//       purge() 每天最多一次，清掉 LOG_KEEP_DAYS 天以前的日志文档。**只记编号、字段名和错误码，不记任何内容。**
//       日志写入失败不影响正常功能：静默丢弃，不发 error 事件。
// 依赖：core/const.js、core/date.js、data/store.js
App.data = App.data || {};

const C = App.core.C;
const {addDays} = App.core.date;
const store = App.data.store;
const ACTS_WITH_FIELDS = ["update"];

let clock = null, device = "unknown", src = "page", timer = null;
let pending = [];             // 还没写进存储的
const days = {};              // 本次打开页面后已写过的那一天：{day: entries 数组}

// opts：{clock, device, src}
function init(opts){
  clock = opts.clock; device = String(opts.device || "unknown").slice(0, 40); src = opts.src || "page";
}
function push(e){
  if (!clock) return;
  e.t = clock.now(); e.src = src;
  pending.push(e);
  if (timer == null) timer = setTimeout(() => { timer = null; flush(); }, C.LOG_FLUSH_MS);
}
// 操作：act 如 create / update / done / undone / reschedule / delete / restore / purge；fields 只在 update 时记
function op(act, coll, id, fields){
  const e = {kind:"op", act, coll, id: id == null ? undefined : String(id)};
  if (fields && ACTS_WITH_FIELDS.includes(act)) e.fields = fields.filter(f => f !== "updatedAt").slice(0, 20);
  push(clean(e));
}
// 运行：act 如 save_failed / timeout / disconnect / reconnect / remind_shown / remind_ack / remind_snooze；code 为中性错误码
function run(act, code, extra){
  push(clean(Object.assign({kind:"run", act, code}, extra && {coll: extra.coll, id: extra.id == null ? undefined : String(extra.id)})));
}
const clean = e => { for (const k of Object.keys(e)) if (e[k] === undefined) delete e[k]; return e; };

// 把攒着的写进存储；按“发生那天”分组，每组读出当天文档（本次第一次写时）后追加
async function flush(){
  if (!pending.length || !store.connected) return;
  const batch = pending; pending = [];
  const byDay = {};
  for (const e of batch){ const d = App.core.date.todayOf(e.t); (byDay[d] = byDay[d] || []).push(e); }
  for (const [day, list] of Object.entries(byDay)){
    const id = day + "_" + device;
    try {
      if (!days[day]){
        const old = await store.get("logs", id);
        days[day] = old && Array.isArray(old.entries) ? old.entries.slice() : [];
      }
      days[day] = days[day].concat(list).slice(-C.LOG_MAX_ENTRIES);
      await store.add("logs", id, {day, device, entries: days[day], updatedAt: clock.now()});
    } catch(e){ /* 日志失败不影响功能，丢弃 */ }
  }
}
// 删除 LOG_KEEP_DAYS 天以前的日志文档（所有设备的，包括 claude / task）；返回删掉的文档数
async function purge(){
  if (!store.connected || !clock) return 0;
  const cutoff = addDays(clock.today(), -C.LOG_KEEP_DAYS);
  let n = 0;
  try {
    for (const doc of await store.list("logs")){
      const day = typeof doc.day === "string" ? doc.day : String(doc.id).slice(0, 10);
      if (day < cutoff){ await store.remove("logs", doc.id); n++; }
    }
  } catch(e){ /* 同上 */ }
  return n;
}
// 测试用：看攒着的条目
const peek = () => pending.slice();

App.data.log = {init, op, run, flush, purge, peek};
})();
// ==== src/scripts/data/state.js ====
(function(){
// 职责：数据状态：整理过的日程 / 待办、加载标记、自己刚加的 id、别处新加的 id（高亮用）；
//       visEv/visTd 只返回没被软删除的条目，projects() 汇总项目名单，ready()/isConnected() 给界面判断加载和连接。
//       界面状态（当前页、选中日期等）不在这里，在 ui/view-state.js。
// 依赖：logic/items.js、logic/projects.js、data/store.js
App.data = App.data || {};

const {isLive} = App.logic.items;
const {projectList} = App.logic.projects;
const store = App.data.store;

const S = {
  events: [], todos: [],
  loaded: {ev:false, td:false},
  localIds: new Set(),   // 本页刚新建的 id：快照里看到它们不做“新到达”高亮
  fresh: new Set(),      // 别处（例如 Claude 在聊天里）刚加的 id：短暂高亮
};

App.data.state = S;
App.data.visEv = () => S.events.filter(isLive);
App.data.visTd = () => S.todos.filter(isLive);
App.data.projects = () => projectList(App.data.visEv(), App.data.visTd());
App.data.ready = () => S.loaded.ev && S.loaded.td;
App.data.isConnected = () => store.connected;
})();
// ==== src/scripts/data/write.js ====
(function(){
// 职责：全部写入的唯一入口：saveItem 新建 / 编辑（编辑只写改过的字段）、convert 日程和待办互转、toggleDone 勾选、
//       reschedule 改期、moveAll 全部改到今天、softDelete 软删除、restore 恢复、purgeDeleted 清理 30 天前删除的、
//       ackReminder“知道了”、snoozeReminder“10 分钟后”。先改本地、发 "change"，再写存储；写入 10 秒没回应或失败
//       就回滚本地，发 "error" {code, retry}，retry 会把整个操作重做一遍。
//       每次写入都顺带更新提醒时刻的缓存 remindAt（logic/remind.js；页面实际以实时推算为准），并记运行日志（data/log.js）。
//       不碰界面，提示文案由界面根据事件决定。时钟由 init(clock) 注入，本文件不读全局时钟。
// 依赖：core/const.js、logic/remind.js、platform/index.js、data/bus.js、data/store.js、data/state.js、data/fields.js、data/log.js
App.data = App.data || {};

const C = App.core.C;
const R = App.logic.remind;
const emit = App.data.emit, store = App.data.store, S = App.data.state, F = App.data.fields, log = App.data.log;
let clock = null;   // {now(), today()}，由 init 注入
function init(c){ clock = c; }
const now = () => clock.now();
const today = () => clock.today();
const collOf = kind => kind === "event" ? "events" : "todos";
const kindOf = coll => coll === "events" ? "event" : "todo";
const DAY_MS = 86400000;
// 快照会整体替换数组；按 id 找到当前那份对象，避免改到旧对象
const live = (coll, x) => S[coll].find(y => y.id === x.id) || x;
// 合并后的条目重新算提醒时刻缓存
const remindAtOf = (kind, merged) => R.computeRemindAt(merged, kind);

function withTimeout(p, ms){
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(App.platform.storeError("timeout")), ms);
    Promise.resolve(p).then(v => { clearTimeout(timer); resolve(v); }, e => { clearTimeout(timer); reject(e); });
  });
}
// op：执行存储写入并返回 Promise；rollback：失败时恢复本地；redo：“重试”时重做整个操作（缺省只重写存储）
async function run(op, rollback, redo){
  try { await withTimeout(op(), C.WRITE_TIMEOUT_MS); return true; }
  catch(e){
    const code = (e && e.code) || "network";
    log.run(code === "timeout" ? "timeout" : "save_failed", code);
    if (rollback) rollback();
    emit("error", {code, retry: redo || (() => run(op, rollback, redo))});
    emit("change");
    return false;
  }
}

// kind："event" | "todo"；item：要编辑的条目，新建时为 null；
// v：表单值 {title, date, time, dur, project, note, important, remind, raw}。返回 {ok, coll, id, data}
async function saveItem(kind, item, v){
  const coll = collOf(kind), t = now();
  let data = kind === "event" ? F.eventFields(v, t) : F.todoFields(v, t);
  if (item){
    const id = item.id, before = live(coll, item);
    data = F.diff(before, data);
    if (before.snoozeAt && R.shouldResetSnooze(before, data)) data.snoozeAt = null;
    const at = remindAtOf(kind, Object.assign({}, before, data));
    if (at !== before.remindAt) data.remindAt = at;
    const ok = await run(() => store.update(coll, id, data));
    if (ok) log.op("update", coll, id, Object.keys(data));
    return {ok, coll, id, data};
  }
  F.asNew(data, coll, t, v.raw || "");
  data.remindAt = remindAtOf(kind, data);
  const id = store.newId(coll);
  S.localIds.add(id);
  const ok = await run(() => store.add(coll, id, data));
  if (ok) log.op("create", coll, id);
  return {ok, coll, id, data};
}
// 编辑时切换类型：新建另一类，旧的软删除（可以在“最近删除”里找回）。返回 {ok, coll, id}
async function convert(fromKind, item, v){
  const res = await saveItem(fromKind === "event" ? "todo" : "event", null, Object.assign({}, v, {raw: item.rawText || ""}));
  if (res.ok) await softDelete(collOf(fromKind), item);
  return res;
}
function toggleDone(x, done){
  x = live("todos", x);
  const prev = {done:x.done, doneAt:x.doneAt};
  x.done = done; x.doneAt = done ? now() : 0;
  emit("change");
  const patch = {done, doneAt:x.doneAt, remindAt: remindAtOf("todo", x), updatedAt:now()};
  return run(() => store.update("todos", x.id, patch).then(() => log.op(done ? "done" : "undone", "todos", x.id)),
    () => { x.done = prev.done; x.doneAt = prev.doneAt; }, () => toggleDone(x, done));
}
function reschedule(x, d){
  x = live("todos", x);
  const prev = {due:x.due, snoozeAt:x.snoozeAt};
  x.due = d; x.snoozeAt = null;
  emit("change");
  const patch = {due:d, snoozeAt:null, remindAt: remindAtOf("todo", x), updatedAt:now()};
  return run(() => store.update("todos", x.id, patch).then(() => log.op("reschedule", "todos", x.id)),
    () => { x.due = prev.due; x.snoozeAt = prev.snoozeAt; }, () => reschedule(x, d));
}
function moveAll(list){
  const t = today();
  list = list.map(x => live("todos", x));
  const prev = list.map(x => [x.due, x.snoozeAt]);
  list.forEach(x => { x.due = t; x.snoozeAt = null; });
  emit("change");
  const ts = now();
  return run(() => store.batch(list.map(x => ({op:"update", coll:"todos", id:x.id, data:{due:t, snoozeAt:null, remindAt: remindAtOf("todo", x), updatedAt:ts}})))
      .then(() => list.forEach(x => log.op("reschedule", "todos", x.id))),
    () => list.forEach((x, i) => { x.due = prev[i][0]; x.snoozeAt = prev[i][1]; }), () => moveAll(list));
}
// coll："events" | "todos"
function softDelete(coll, item){
  const x = live(coll, item), prev = x.deletedAt;
  x.deletedAt = now();
  emit("change");
  return run(() => store.update(coll, x.id, {deletedAt:x.deletedAt, remindAt:null, updatedAt:now()}).then(() => log.op("delete", coll, x.id)),
    () => { x.deletedAt = prev; }, () => softDelete(coll, x));
}
function restore(coll, item){
  const x = live(coll, item), prev = x.deletedAt;
  x.deletedAt = null;
  emit("change");
  const patch = {deletedAt:null, remindAt: remindAtOf(kindOf(coll), x), updatedAt:now()};
  return run(() => store.update(coll, x.id, patch).then(() => log.op("restore", coll, x.id)),
    () => { x.deletedAt = prev; }, () => restore(coll, x));
}
// 彻底删除 30 天前软删除的条目（ADR-006、需求澄清 #18）。由界面每天最多调用一次；失败不打扰用户。返回删除条数
async function purgeDeleted(){
  const cutoff = now() - C.TRASH_KEEP_DAYS * DAY_MS;
  let n = 0;
  for (const coll of ["events", "todos"]){
    for (const x of S[coll].filter(y => y.deletedAt && y.deletedAt < cutoff)){
      try { await store.remove(coll, x.id); log.op("purge", coll, x.id); n++; } catch(e){ /* 下次再清 */ }
    }
  }
  return n;
}
// “知道了”：记下已经提醒过的那个时刻（notifiedFor），其他设备据此收起提醒（需求澄清 #7）
function ackReminder(kind, item, at){
  const coll = collOf(kind), x = live(coll, item), prev = x.notifiedFor;
  x.notifiedFor = at;
  emit("change");
  return run(() => store.update(coll, x.id, {notifiedFor:at, updatedAt:now()}).then(() => log.run("remind_ack", null, {coll, id:x.id})),
    () => { x.notifiedFor = prev; }, () => ackReminder(kind, x, at));
}
// “10 分钟后”：这次算已提醒，snoozeAt 设为现在 + 10 分钟，到时再提醒一次（需求澄清 #4）
function snoozeReminder(kind, item, at){
  const coll = collOf(kind), x = live(coll, item), prev = [x.notifiedFor, x.snoozeAt];
  x.notifiedFor = at; x.snoozeAt = now() + C.SNOOZE_MS;
  emit("change");
  const patch = {notifiedFor:at, snoozeAt:x.snoozeAt, remindAt:x.snoozeAt, updatedAt:now()};
  return run(() => store.update(coll, x.id, patch).then(() => log.run("remind_snooze", null, {coll, id:x.id})),
    () => { x.notifiedFor = prev[0]; x.snoozeAt = prev[1]; }, () => snoozeReminder(kind, x, at));
}

App.data.write = {init, saveItem, convert, toggleDone, reschedule, moveAll, softDelete, restore, purgeDeleted, ackReminder, snoozeReminder, collOf, kindOf};
})();
// ==== src/scripts/data/subscribe.js ====
(function(){
// 职责：连接存储并订阅 events / todos 两个集合：快照先经 normalize 整理再进状态，发 "change"；
//       别处新加的记录记入 fresh 短暂高亮（自己刚加的不算）；连不上发 "notice" unavailable；
//       订阅出错时发 "notice" lost（两个集合一起断也只发一次），并按 RECONNECT_MS 逐步拉长间隔自动重新订阅，
//       断掉的集合全部恢复后发一次 reconnected。两个集合都第一次加载完时发一次 "loaded"（v3：触发每日清理）。
//       断线、重连都记运行日志（ADR-010）。
// 依赖：core/const.js、data/bus.js、data/store.js、data/state.js、data/normalize.js、data/log.js
App.data = App.data || {};

const C = App.core.C;
const emit = App.data.emit, store = App.data.store, S = App.data.state;
const {normalizeItem} = App.data.normalize;
const log = App.data.log;
let loadedOnce = false;
const KEY = {events:"ev", todos:"td"};
const unsubs = {}, fails = {events:0, todos:0};
const down = new Set();   // 当前断着的集合

function markFresh(snap, key){
  if (!S.loaded[key]) return;
  for (const c of snap.changes()){
    if (c.type === "added" && !S.localIds.has(c.id)){ S.fresh.add(c.id); setTimeout(() => S.fresh.delete(c.id), C.FRESH_MS); }
  }
}
function watch(coll){
  const key = KEY[coll];
  if (unsubs[coll]){ try { unsubs[coll](); } catch(e){} }
  unsubs[coll] = store.subscribe(coll, snap => {
    fails[coll] = 0;
    if (down.delete(coll) && !down.size){ log.run("reconnect"); emit("notice", {type:"reconnected"}); }
    markFresh(snap, key);
    S[coll] = snap.items.map(r => normalizeItem(coll, r));
    S.loaded[key] = true;
    emit("change");
    if (!loadedOnce && S.loaded.ev && S.loaded.td){ loadedOnce = true; emit("loaded"); }
  }, err => {
    if (!down.size){ log.run("disconnect", (err && err.code) || "network"); emit("notice", {type:"lost"}); }
    down.add(coll);
    const wait = C.RECONNECT_MS[Math.min(fails[coll], C.RECONNECT_MS.length - 1)];
    fails[coll]++;
    setTimeout(() => watch(coll), wait);
  });
}
async function start(){
  const ok = await store.connect();
  if (!ok){
    emit("notice", {type:"unavailable", hint: store.unavailableHint()});
    S.loaded.ev = S.loaded.td = true; emit("change"); return;
  }
  watch("events"); watch("todos");
}
function stop(){ for (const c in unsubs){ try { unsubs[c](); } catch(e){} delete unsubs[c]; } }

App.data.subscribe = {start, stop};
})();
// ==== src/scripts/ui/dom.js ====
(function(){
// 职责：界面用的 DOM 小工具：$(id) 取元素、h() 一次建好带属性和子节点的元素（子节点文字一律当纯文本插入，
//       html 属性只允许传常量图标）、对勾图标、骨架和空状态框。
// 依赖：无
App.ui = App.ui || {};

const $ = id => document.getElementById(id);
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const k in (attrs||{})){
    const v = attrs[k]; if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el[k] = v; else if (k === "html") el.innerHTML = v; else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; el.append(c.nodeType ? c : String(c)); }
  return el;
}
function skeleton(n){ return Array.from({length:n}, () => h("div",{class:"sk"})); }
function emptyBox(title, text){ return h("div",{class:"empty"}, h("strong",null,title), text); }

App.ui.dom = {$, h, ICON_CHECK, skeleton, emptyBox};
})();
