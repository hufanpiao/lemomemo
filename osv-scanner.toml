# OSV-Scanner 忽略清单（.github/workflows/unit.yml 的 OSV-Scanner 一步读这个文件）。
# 规则：只放确认不受影响的条目，写清原因和复查日期，由安全审查员会签；到期自动失效，到期前复查。
# 全仓共用这一份：unit.yml 用 --config 指定它，所以每条豁免按漏洞编号对仓库里所有锁文件生效，OSV 不能按目录限定。
# 新增锁文件，或者某条豁免的包出现在新位置时，要复查对应理由是否仍然成立，由安全审查员会签（11-03 安全审查）。

[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
ignoreUntil = 2026-11-30
reason = """glib 0.18.5 和 proc-macro-error 1.0.4 只出现在 desktop/turnstile-probe/src-tauri/Cargo.lock 和 desktop/src-tauri/Cargo.lock（正式外壳）的 Linux GTK 依赖链里（Tauri 2 在 Linux 上锁死 gtk 0.18）。GHSA-wrw7-89jp-8q8g / RUSTSEC-2024-0429：glib 的 VariantStrIter 不健全，0.20 修复；RUSTSEC-2024-0370：proc-macro-error 已停止维护（只在编译期用的过程宏）。OSV 按别名分开报，所以三个 id 各写一条。核对过程（安全审查员 11-03，本机 cargo 1.99.1，--offline --locked）：① cargo tree --target x86_64-pc-windows-msvc -i glib、-i proc-macro-error 都输出 nothing to print；正向对照 -i webview2-com 正常打印 tauri 依赖链，说明这个目标的解析是好的；② 按 Cargo.lock 查依赖方：依赖 glib 的只有 atk、cairo-rs、gdk、gdk-pixbuf、gdkx11、gio、gtk、javascriptcore-rs、libappindicator、pango、soup3、webkit2gtk（都是 GTK、WebKitGTK 一系），依赖 proc-macro-error 的只有 glib-macros、gtk3-macros；③ --target x86_64-unknown-linux-gnu 离线跑不起来（atk 0.18.2 从来没下载过），也说明 Windows 构建从来没用到这条链。④ 正式外壳 desktop/src-tauri/Cargo.lock 进仓后重新核对（前端 B 跑、安全审查员 11-03 本机离线复跑一遍，结果相同）：锁文件里同样有 glib 0.18.5、proc-macro-error 1.0.4；在 desktop/src-tauri 下 cargo tree --target x86_64-pc-windows-msvc -i glib、-i proc-macro-error 都输出 nothing to print，-i webview2-com 正常打印出 tauri 2.12.5 的依赖链。结论：探针和正式外壳的 Windows exe 里都没有这两个包；探针只在本机试用、不对外发布，正式外壳只出 Windows 版，不受影响。复查日期：2026-11-30（和上面一条一起复查；看 Tauri 在 Linux 上是否已升到 gtk-rs 0.20 以上，或者探针目录是否已删）。B6-exe F9 的 cargo audit / cargo deny 已经接上（desktop.yml 的 audit 任务，deny.toml 只按 Windows 依赖树判断），但 OSV 不分平台、扫的是整个 Cargo.lock，这三条不删除；2026-11-30 复查（B6-exe 安全审查 S-5）。会签：安全审查员 11-03。"""

