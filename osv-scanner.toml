[[IgnoredVulns]]
id = "GHSA-4r6h-8v6p-xvw6"
ignoreUntil = 2027-02-14
reason = """xlsx 0.20.3 从 SheetJS 官方 CDN 安装（package.json 写 https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz，package-lock.json 带 sha512 完整性值；B4b-1 随手记附件 Excel 本机预览用）。npm 公共仓库的 xlsx 停在 0.18.5，修复版只发在 CDN 上，所以 GHSA 两条通告的受影响范围在 OSV 里写成 introduced 0、没有 fixed，凡是 xlsx 都报。核对（主持人 11-14，查 api.osv.dev 通告原文）：GHSA-4r6h-8v6p-xvw6 / CVE-2023-30533 原型污染写明“through 0.19.2”受影响、0.19.3 修复；GHSA-5pgg-2g8v-p4x9 / CVE-2024-22363 ReDoS 写明“before 0.20.2”受影响、0.20.2 修复；两条都指明修复版从 cdn.sheetjs.com 下载。0.20.3 在两个修复之后，不受影响。复查日期：2027-02-14（看 SheetJS 有没有新的安全通告、CDN 有没有新版）；第三方全仓审查时一并复核。"""

