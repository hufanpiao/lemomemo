# OSV-Scanner 忽略清单（.github/workflows/unit.yml 的 OSV-Scanner 一步读这个文件）。
# 规则：只放确认不受影响的条目，写清原因和复查日期，由安全审查员会签；到期自动失效，到期前复查。
# 全仓共用这一份：unit.yml 用 --config 指定它，所以每条豁免按漏洞编号对仓库里所有锁文件生效，OSV 不能按目录限定。
# 新增锁文件，或者某条豁免的包出现在新位置时，要复查对应理由是否仍然成立，由安全审查员会签（11-03 安全审查）。

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-11-30
reason = """minimatch 的 globparts 放大会导致拒绝服务（影响 11.0.1 以下）。\
命中的是 package-lock.json 里的 node_modules/minimatch 3.1.5（eslint、@eslint/config-array、@eslint/eslintrc、eslint-plugin-react、eslint-plugin-jsx-a11y 引入）\
和 @typescript-eslint/typescript-estree 下的 minimatch 10.2.6，两处都是 dev 依赖，只在开发和 CI 的 lint 时用。\
已核对：dist/ 的产物里没有 minimatch，supabase/functions/deno.lock、tools/deploy/package-lock.json 里也没有；desktop/turnstile-probe/src-tauri/Cargo.lock（11-03 起提交）里也没有。\
匹配模式全部来自仓库自己的 lint 配置，不接受外部输入，不受影响。\
不用 npm overrides 强行升到 11：eslint 一系依赖 3.x 的接口，跨大版本升级可能让 lint 静默失效，等上游升级。\
复查日期：2026-11-30（到期前看 eslint、typescript-eslint 是否已升到修复版本，升了就删掉这一条）。\
会签：安全审查员 10-31。"""

[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
ignoreUntil = 2026-11-30
reason = """glib 0.18.5 和 proc-macro-error 1.0.4 只出现在 desktop/turnstile-probe/src-tauri/Cargo.lock 和 desktop/src-tauri/Cargo.lock（正式外壳）的 Linux GTK 依赖链里（Tauri 2 在 Linux 上锁死 gtk 0.18）。GHSA-wrw7-89jp-8q8g / RUSTSEC-2024-0429：glib 的 VariantStrIter 不健全，0.20 修复；RUSTSEC-2024-0370：proc-macro-error 已停止维护（只在编译期用的过程宏）。OSV 按别名分开报，所以三个 id 各写一条。核对过程（安全审查员 11-03，本机 cargo 1.99.1，--offline --locked）：① cargo tree --target x86_64-pc-windows-msvc -i glib、-i proc-macro-error 都输出 nothing to print；正向对照 -i webview2-com 正常打印 tauri 依赖链，说明这个目标的解析是好的；② 按 Cargo.lock 查依赖方：依赖 glib 的只有 atk、cairo-rs、gdk、gdk-pixbuf、gdkx11、gio、gtk、javascriptcore-rs、libappindicator、pango、soup3、webkit2gtk（都是 GTK、WebKitGTK 一系），依赖 proc-macro-error 的只有 glib-macros、gtk3-macros；③ --target x86_64-unknown-linux-gnu 离线跑不起来（atk 0.18.2 从来没下载过），也说明 Windows 构建从来没用到这条链。④ 正式外壳 desktop/src-tauri/Cargo.lock 进仓后重新核对（前端 B 跑、安全审查员 11-03 本机离线复跑一遍，结果相同）：锁文件里同样有 glib 0.18.5、proc-macro-error 1.0.4；在 desktop/src-tauri 下 cargo tree --target x86_64-pc-windows-msvc -i glib、-i proc-macro-error 都输出 nothing to print，-i webview2-com 正常打印出 tauri 2.12.5 的依赖链。结论：探针和正式外壳的 Windows exe 里都没有这两个包；探针只在本机试用、不对外发布，正式外壳只出 Windows 版，不受影响。复查日期：2026-11-30（和上面一条一起复查；看 Tauri 在 Linux 上是否已升到 gtk-rs 0.20 以上，或者探针目录是否已删）。正式的 desktop/src-tauri/ 落地后，由 B6-exe F9 的 cargo audit / cargo deny 接管，这三条随之删掉。会签：安全审查员 11-03。"""

