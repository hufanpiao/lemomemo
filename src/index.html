  <body>
    <div id="root"></div>

    <div id="lemo-splash" class="lemo-splash" aria-hidden="true">
      <div class="lemo-splash-layer lemo-splash-d">
        <p class="lemo-splash-t lemo-splash-name">柠檬记</p>
        <p class="lemo-splash-t lemo-splash-en">Lemo</p>
        <p class="lemo-splash-t lemo-splash-foot">说一句，清清爽爽记下来</p>
      </div>
      <div class="lemo-splash-layer lemo-splash-l">
        <p class="lemo-splash-t lemo-splash-name">柠檬记</p>
        <p class="lemo-splash-t lemo-splash-en">Lemo</p>
        <p class="lemo-splash-t lemo-splash-foot">说一句，清清爽爽记下来</p>
      </div>
      <!-- markL（src/public/icons/logo-mark.svg）：带模糊的投影和玻璃圆片底换成预模糊小图（build/export_splash_blur.py），其余原样 -->
      <svg class="lemo-splash-mark" viewBox="0 0 1024 1024" overflow="visible" focusable="false">
        <defs><clipPath id="lemo-splash-clip"><circle cx="512" cy="512" r="304" /></clipPath></defs>
        <image href="./styles/splash/splash-shadow.png" x="128" y="672" width="768" height="352" preserveAspectRatio="none" />
        <image href="./styles/splash/splash-disk.png" x="208" y="208" width="608" height="608" preserveAspectRatio="none" clip-path="url(#lemo-splash-clip)" />

        <circle cx="512" cy="512" r="268" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="5" />
        <path d="M300 404 A240 240 0 0 1 430 262" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity=".95" />
        <rect class="lemo-splash-bar" x="320" y="402" width="96" height="220" rx="48" fill="#141518" />
        <rect class="lemo-splash-bar lemo-splash-bar2" x="464" y="322" width="96" height="380" rx="48" fill="#141518" />
        <rect class="lemo-splash-bar lemo-splash-bar3" x="608" y="387" width="96" height="250" rx="48" fill="#141518" />
