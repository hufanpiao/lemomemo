<!-- 页面结构模板：标题、字体链接、三个视图、底部导航、提示条、弹出层。
     下方 @styles、@scripts 两个占位注释由 build/build.py 替换为内联 CSS / JS。
     依赖：build/manifest.json 列出的全部样式和脚本。本注释在构建时去掉。 -->
<title>日程与待办</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<!-- @styles -->

<div class="app">
  <header class="top">
    <h1><span class="md" id="hd-md">--</span><span class="sub" id="hd-sub"></span></h1>
    <button class="theme-btn" type="button" id="theme-btn" aria-haspopup="true" aria-expanded="false" aria-controls="theme-pick" aria-label="外观：跟随系统"></button>
    <div class="theme-pick" id="theme-pick" role="radiogroup" aria-label="外观" hidden>
      <button type="button" role="radio" data-mode="system" aria-checked="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>跟随系统</button>
      <button type="button" role="radio" data-mode="light" aria-checked="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg>浅色</button>
      <button type="button" role="radio" data-mode="dark" aria-checked="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>深色</button>
    </div>
    <div class="top-chips" id="hd-chips"></div>
  </header>
  <div id="notice" hidden class="notice"></div>
  <div id="remind" class="remind-slot" aria-live="polite"></div>

  <div class="grid">
    <!-- 今天 -->
    <div class="view" id="v-today" data-view="today">
      <div id="next"></div>
      <div id="late"></div>
      <section class="panel" aria-labelledby="h-tl">
        <div class="ph"><h2 id="h-tl">今天的时间轴</h2><span class="meta" id="tl-meta"></span></div>
        <div class="allday" id="tl-allday"></div>
        <div class="tl" id="tl"></div>
      </section>
      <section class="panel" aria-labelledby="h-tt">
        <div class="ph"><h2 id="h-tt">今天要做</h2><button class="linkbtn nav-only" type="button" data-go="todo">全部待办</button></div>
        <ul class="todos" id="today-todos"></ul>
      </section>
      <section class="panel" id="tomorrow" hidden aria-labelledby="h-tm">
        <div class="ph"><h2 id="h-tm">明天</h2><span class="meta" id="tm-meta"></span></div>
        <div class="evlist" id="tm-list"></div>
      </section>
    </div>

    <!-- 日程 -->
    <div class="view" id="v-sched" data-view="sched">
      <section class="panel" aria-labelledby="h-wk">
        <div class="ph">
          <h2 id="h-wk"><button type="button" class="wk-title" id="wk-title"></button></h2>
          <div style="display:flex;gap:6px">
            <button class="round" type="button" id="wk-prev" aria-label="上一周"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
            <button class="round" type="button" id="wk-next" aria-label="下一周"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
          </div>
        </div>
        <div class="week" id="week"></div>
        <button class="back-today" type="button" id="wk-today" hidden>回到今天</button>
        <div class="filters" id="sched-filters" role="group" aria-label="按项目筛选"></div>
        <div class="evlist" id="day-list"></div>
      </section>
      <section class="panel" aria-labelledby="h-up">
        <div class="ph"><h2 id="h-up">接下来</h2><span class="meta" id="up-meta"></span></div>
        <div class="evlist" id="up-list"></div>
      </section>
    </div>

    <!-- 待办 -->
    <div class="view" id="v-todo" data-view="todo">
      <section class="panel" aria-labelledby="h-td">
        <div class="ph"><h2 id="h-td">待办</h2><span class="meta" id="td-meta"></span></div>
        <input class="search" id="search" type="search" enterkeyhint="search" autocomplete="off" placeholder="搜索标题、备注、原话" aria-label="搜索标题、备注、原话">
        <div class="search-res" id="search-res" hidden></div>
        <div class="td-main" id="td-main">
          <div class="filters" id="filters" role="group" aria-label="按项目筛选"></div>
          <ul class="todos" id="todos"></ul>
          <button class="linkbtn" type="button" id="done-toggle" hidden></button>
          <ul class="todos" id="done-list" hidden></ul>
        </div>
        <button class="trash" type="button" id="trash-toggle" hidden aria-expanded="false" aria-controls="trash-list"></button>
        <div class="trash-list" id="trash-list" hidden></div>
        <button class="trash" type="button" id="log-toggle" aria-expanded="false" aria-controls="log-list"><span><b>运行记录</b>  最近 7 天，只读</span><span class="chev" aria-hidden="true">›</span></button>
        <div class="log-list" id="log-list" hidden></div>
        <button class="export" type="button" id="export" aria-describedby="export-note">导出备份（JSON）</button>
        <p class="export-note" id="export-note">文件里包含最近删除的条目</p>
      </section>
    </div>
  </div>
</div>

<div class="dock">
  <nav class="nav" id="nav" aria-label="切换页面">
    <span class="ind" id="ind"></span>
    <button type="button" data-go="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span class="lab">今天</span></button>
    <button type="button" data-go="sched"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span class="lab">日程</span></button>
    <button type="button" data-go="todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 7h11M9 12h11M9 17h11"/><path d="M4 7l1 1 2-2M4 12l1 1 2-2M4 17l1 1 2-2"/></svg><span class="lab">待办</span></button>
  </nav>
  <button class="plus" type="button" id="plus" aria-label="新建日程或待办"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="netbar" id="netbar" hidden>网络断开了，恢复后会自动同步</div>

<div class="scrim" id="scrim" hidden></div>
<form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title" hidden>
  <div class="grab"></div>
  <h3 id="sh-title">记一件事</h3>
  <div id="q-wrap" class="q-row">
    <input class="q" id="q" type="text" maxlength="300" autocomplete="off" enterkeyhint="done" aria-label="用一句话描述要记的事" placeholder="写一句话，例如：明天下午3点和 NEOX 对片">
    <button class="q-add" type="submit" id="q-add">加入</button>
  </div>
  <div class="recog" id="recog" aria-live="polite"></div>
  <button class="details-toggle" type="button" id="details-toggle" aria-expanded="false" aria-controls="details"><span>改细节：类型、日期、时间、提醒、备注</span><span aria-hidden="true">›</span></button>
  <div id="details" class="details" hidden>
    <div class="seg" id="seg" role="group" aria-label="类型">
      <button type="button" data-k="event" aria-pressed="false">日程</button>
      <button type="button" data-k="todo" aria-pressed="true">待办</button>
    </div>
    <div class="fields"><label class="wide">标题<input id="f-title" type="text" maxlength="160" required></label></div>
    <div class="row-l" id="date-chips-lab">截止</div>
    <div class="scroller" id="date-chips" role="group" aria-label="快捷日期"></div>
    <div class="fields">
      <label><span id="f-date-lab">截止日期</span><input id="f-date" type="date"></label>
      <label class="ev-only">时间<input id="f-time" type="time"></label>
      <label class="ev-only">时长<select id="f-dur">
        <option value="30">30 分钟</option><option value="60" selected>1 小时</option><option value="90">1.5 小时</option>
        <option value="120">2 小时</option><option value="180">3 小时</option><option value="240">半天</option></select></label>
      <label class="td-only chk"><input id="f-imp" type="checkbox">重要</label>
    </div>
    <button type="button" class="opt ev-only" id="push-1h" hidden>推后 1 小时</button>
    <div class="row-l" id="remind-lab">提醒</div>
    <div class="scroller" id="remind-chips" role="radiogroup" aria-label="提醒"></div>
    <div class="fields">
      <label class="wide">项目<input id="f-proj" type="text" maxlength="40" placeholder="可不填" list="proj-list"></label>
      <div class="projs wide" id="proj-chips"></div>
      <label class="wide"><span id="f-note-lab">备注</span><input id="f-note" type="text" maxlength="200" placeholder="可不填"></label>
    </div>
    <div class="raw" id="raw" hidden></div>
  </div>
  <div class="acts" id="acts" hidden>
    <button class="save" type="submit" id="save">保存修改</button>
    <button class="ghost" type="button" id="cancel">取消</button>
  </div>
  <button class="del-row" type="button" id="del" hidden>删除</button>
</form>
<datalist id="proj-list"></datalist>

<!-- @scripts -->
