<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 柠檬记主图（定稿 icL，R-72，2026-10-24）：原样取自 docs/02-设计/图标与命名/图标与名字-候选.html 的 bgL + markL，不要手改（没有提取脚本；10-29 修投影滤镜 shB 区域 y=-200%/height=500%，与定稿页同步手改，造型未改） -->
  <defs>
    <filter id="blurB1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="blurB2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="120"/></filter>
    <filter id="shB" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="40"/></filter>
    <linearGradient id="gL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F4EE"/><stop offset="1" stop-color="#E3E6EC"/>
    </linearGradient>
    <clipPath id="clipL"><circle cx="512" cy="512" r="304"/></clipPath>
    <clipPath id="frame"><rect width="1024" height="1024"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <!-- bgL -->
    <rect width="1024" height="1024" fill="url(#gL)"/>
    <g filter="url(#blurB1)">
      <circle cx="350" cy="330" r="300" fill="#F2DF4A"/>
      <circle cx="720" cy="720" r="240" fill="#F2DF4A" opacity=".85"/>
      <circle cx="800" cy="270" r="150" fill="#F4A9A0" opacity=".55"/>
      <circle cx="240" cy="820" r="160" fill="#7FBFE4" opacity=".45"/>
    </g>
    <!-- markL -->
    <ellipse cx="512" cy="850" rx="250" ry="40" fill="#3a3418" opacity=".16" filter="url(#shB)"/>
    <g clip-path="url(#clipL)">
      <rect width="1024" height="1024" fill="#f3f2ea"/>
      <g filter="url(#blurB2)" opacity=".9">
        <circle cx="350" cy="330" r="300" fill="#F2DF4A"/>
        <circle cx="720" cy="720" r="240" fill="#F2DF4A" opacity=".85"/>
        <circle cx="800" cy="270" r="150" fill="#F4A9A0" opacity=".5"/>
      </g>
      <rect width="1024" height="1024" fill="#fff" opacity=".40"/>
    </g>
    <circle cx="512" cy="512" r="301" fill="none" stroke="#fff" stroke-opacity=".92" stroke-width="7"/>
    <circle cx="512" cy="512" r="268" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="5"/>
    <path d="M300 404 A240 240 0 0 1 430 262" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity=".95"/>
    <rect x="320" y="402" width="96" height="220" rx="48" fill="#141518"/>
    <rect x="464" y="322" width="96" height="380" rx="48" fill="#141518"/>
    <rect x="608" y="387" width="96" height="250" rx="48" fill="#141518"/>
  </g>
</svg>
