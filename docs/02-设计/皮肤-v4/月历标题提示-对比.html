/* 减少透明效果：玻璃、导航、遮罩全部换成实色，不模糊。
   触发方式（R-84）：iPhone 网页读不到系统“降低透明度”，靠“设置 › 皮肤 › 减少透明效果”开关（默认关），App 在 body 上写 data-rt="1"；
   Windows（exe / Edge）仍自动跟随系统，用下面的媒体查询。本页顶部的勾选框就是模拟 data-rt="1"。 */
@media (prefers-reduced-transparency: reduce){
  body[data-skin="glass"]{--glass-bg:var(--glass-solid);--glass-blur:0px;--glass-sat:100%}
  body[data-skin="simple"][data-mode="light"]{--nav-bg:#141518}body[data-skin="simple"][data-mode="dark"]{--nav-bg:#26272D}body[data-skin="simple"] .tabbar,body[data-skin="glass"] .tabbar.glassy{-webkit-backdrop-filter:none;backdrop-filter:none}body[data-skin="glass"]{--nav-bg:var(--glass-solid)}
  body .scrim{-webkit-backdrop-filter:none;backdrop-filter:none}body .scrim.lite{background:color-mix(in srgb,var(--bg) 96%,transparent)}body .blurbg{filter:none}
}
body[data-rt="1"][data-skin="glass"]{--glass-bg:var(--glass-solid);--glass-blur:0px;--glass-sat:100%}
body[data-rt="1"][data-skin="simple"][data-mode="light"]{--nav-bg:#141518}body[data-rt="1"][data-skin="simple"][data-mode="dark"]{--nav-bg:#26272D}body[data-rt="1"][data-skin="simple"] .tabbar,body[data-rt="1"][data-skin="glass"] .tabbar.glassy{-webkit-backdrop-filter:none;backdrop-filter:none}body[data-rt="1"][data-skin="glass"]{--nav-bg:var(--glass-solid)}
body[data-rt="1"] .scrim{-webkit-backdrop-filter:none;backdrop-filter:none}body[data-rt="1"] .scrim.lite{background:color-mix(in srgb,var(--bg) 96%,transparent)}body[data-rt="1"] .blurbg{filter:none}
/* 减少动态效果（R-93）：去掉位移和缩放，只保留淡入淡出；按下回弹直接取消 */
@media (prefers-reduced-motion: reduce){
  body{--dur-press:0ms}
}

/* ================= 页面外壳（说明文字区，不属于 App） ================= */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--f-zh);background:var(--doc-bg);color:var(--doc-fg);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}
.topbar{position:sticky;top:0;z-index:50;background:var(--doc-bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--doc-line)}
.topbar .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;margin-right:auto}
.brand svg{width:28px;height:28px;border-radius:7px}
.seg{display:inline-flex;background:var(--doc-seg);border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;color:var(--doc-fg2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--doc-fg);color:var(--doc-bg)}
.seg button:focus-visible,.chk:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--doc-fg2);cursor:pointer}
h1.doc{font-size:clamp(28px,5.5vw,44px);line-height:1.15;margin:28px 0 6px;font-weight:800}
h2.doc{font-size:clamp(22px,4vw,30px);line-height:1.2;margin:48px 0 10px;font-weight:800}
.lead{max-width:70ch;color:var(--doc-fg2)}
.dcard{background:var(--doc-card);border-radius:24px;padding:20px 22px;margin-top:14px}
.dcard h3{margin:0 0 6px;font-size:18px}
.dcard p,.dcard li{max-width:72ch}
.dcard ul{margin:6px 0 0;padding-left:1.2em}
.dcard li{margin:4px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.tw{overflow-x:auto;margin-top:8px}
table.t{border-collapse:collapse;font-size:14px;min-width:720px;width:100%}
table.t th,table.t td{border-bottom:1px solid var(--doc-line);padding:6px 8px;text-align:left;vertical-align:middle;white-space:nowrap}
table.t th{font-weight:800;position:sticky;top:0;background:var(--doc-card)}
table.t td.name{font-weight:700}
table.t td{white-space:normal;max-width:240px}
table.t td code{word-break:break-all;font-size:12px}
table.t td.name{white-space:normal;min-width:200px;max-width:300px}table.t td.name code{white-space:nowrap;word-break:normal}
.sw{display:inline-block;width:16px;height:16px;border-radius:5px;vertical-align:-3px;margin-right:6px;border:1px solid rgba(128,128,128,.35)}
.ok{color:var(--doc-ok);font-weight:800}.ng{color:var(--doc-ng);font-weight:800}
.note{font-size:14px;color:var(--doc-fg2)}
.screens{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,406px),1fr));gap:28px 22px;margin-top:18px}
body[data-dev="d"] .screens{grid-template-columns:1fr}
figure.sc{margin:0;min-width:0}
figure.sc figcaption{font-size:14px;font-weight:800;margin:10px 0 2px}
figure.sc .cap2{font-size:13px;color:var(--doc-fg2);font-weight:400;display:block}
.fit{width:100%;overflow:hidden}
.fit > .inner{transform-origin:0 0}

/* ================= App：通用 ================= */
.app{font-family:var(--f-zh);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.35}
.app :lang(ko),.app[lang="ko"]{font-family:var(--f-ko);word-break:keep-all}
.app[lang="ko"] .date{font-size:28px;white-space:nowrap}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app button{all:unset;box-sizing:border-box;cursor:pointer}
.app .muted{color:var(--text-2)}
.ico{width:20px;height:20px;display:block;flex:none}
.ico svg{width:100%;height:100%;display:block}

/* 手机外框 */
.phone{width:406px;border-radius:54px;padding:10px;background:#0c0d10;box-shadow:0 30px 60px rgba(0,0,0,.18),0 0 0 1px var(--doc-frame)}
.scr.pad2{padding-bottom:200px}
.scr{position:relative;border-radius:44px;overflow:hidden;background:var(--scr-bg);min-height:844px;padding-bottom:120px}
.sb{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font-weight:700;font-size:15px}
.sb .isl{width:122px;height:34px;border-radius:20px;background:#000;position:absolute;left:50%;top:11px;margin-left:-61px}
.sb .sig{display:flex;gap:6px;align-items:center;font-size:12px}
.sb .bat{width:24px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative;opacity:.9}
.sb .bat::after{content:"";position:absolute;inset:2px 6px 2px 2px;background:currentColor;border-radius:1px}
.pg{padding:6px 16px 0}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;margin-left:-67px;background:var(--text);opacity:.85}

/* 顶部 */
.hd{display:flex;align-items:flex-start;gap:10px}
.hd .tt{flex:1;min-width:0}
.date.pt{font-size:24px}
.date{font-size:28px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--text-2);margin-top:3px}
.ibtn{width:38px;height:38px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--text);flex:none;box-shadow:var(--shadow-1)}
.av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.annchip{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:var(--panel);border-radius:var(--r-pill);padding:7px 12px;font-size:12px;font-weight:400;box-shadow:var(--shadow-1)}
.dia{width:9px;height:9px;transform:rotate(45deg);background:var(--accent);box-shadow:inset 0 0 0 1.5px var(--text);display:inline-block;border-radius:1.5px;flex:none}

/* “现在”卡 */
.now{margin-top:10px;background:var(--now-bg);color:var(--now-fg);border-radius:20px;padding:14px 16px;position:relative}
.now .k{font-size:12px;color:var(--now-fg2);display:flex;align-items:center;gap:6px}
.now .ti{font-size:21px;font-weight:700;margin:2px 0 0;letter-spacing:-.01em}
.now .me{font-size:13px;color:var(--now-fg2)}
.now .bar{height:6px;border-radius:3px;background:var(--now-track);margin:10px 0 8px;overflow:hidden}
.now .bar i{display:block;height:100%;width:86%;background:var(--now-prog);border-radius:3px}
.now .nx{font-size:13px;border-top:1px solid var(--now-track);padding-top:8px}
.now.alert{box-shadow:0 0 0 4px var(--alert-ring)}
.now.alert .ti{font-size:21px}
.now .k .ico{width:13px;height:13px}

/* 没赶上 */
.od{margin-top:10px;line-height:1.25;background:transparent;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--danger-text) 75%,transparent);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.od .lbl{font-size:12px;font-weight:700;color:var(--danger-text)}
.od .t1{font-weight:700;font-size:14px}
.od .t2{font-size:12px;color:var(--text-2);margin-top:1px}.od em{font-style:normal;color:var(--danger-text);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 16px;border-radius:var(--r-pill);font-weight:600;font-size:15px;white-space:nowrap;transition:transform var(--dur-press) var(--ease-spring)}
.btn.sm{height:32px;padding:0 14px;font-size:12px}
/* 触控区：可点元素最小点击区 44×44（令牌 --hit:44px）。看得见的尺寸小于 44 的，用不可见的伪元素向外扩 */
.app{--hit:44px}
.btn.sm,.mo,.ibtn,.av,.chip,.toast .btn,.segc span,.cat.tap,.tgl{position:relative}
.btn.sm::after,.mo::after,.ibtn::after,.av::after,.chip::after,.toast .btn::after,.segc span::after,.cat.tap::after,.tgl::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,var(--hit));height:max(100%,var(--hit));transform:translate(-50%,-50%)}
body[data-hit="1"] .btn.sm::after,body[data-hit="1"] .mo::after,body[data-hit="1"] .ibtn::after,body[data-hit="1"] .av::after,body[data-hit="1"] .chip::after,body[data-hit="1"] .toast .btn::after,body[data-hit="1"] .segc span::after,body[data-hit="1"] .tgl::after{outline:1.5px dashed #2F7BF5;outline-offset:-1px}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.out{box-shadow:inset 0 0 0 1.5px var(--text);color:var(--text)}
.btn.soft{background:var(--panel-2);color:var(--text)}
.btn.w{display:flex;width:100%}
.fold{font-size:13px;color:var(--text-2);margin:0 4px;padding:6px 0}

/* 时间河 */
.panel{background:var(--panel);border-radius:var(--r-xl);box-shadow:var(--shadow-1)}
.river{margin-top:10px;padding:6px 14px 8px}
.row{display:grid;grid-template-columns:52px 16px 1fr 28px;align-items:center;gap:0 10px;min-height:62px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tm{font-size:13px;font-weight:600}
.row .tm.s{font-size:13px;font-weight:600;color:var(--text-2)}
.row .tx{min-width:0;padding:10px 0}
.row .t1{font-weight:600;font-size:15px;line-height:1.3}
.row .t2{font-size:12px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mo{color:var(--text-2);font-weight:800;letter-spacing:1px;text-align:center}
.mk{width:5px;height:30px;border-radius:3px;background:var(--pc)}
.mc{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--pc)}
.mn{width:16px;height:19px;border-radius:3px;box-shadow:inset 0 0 0 2px var(--text-2);position:relative}
.mn::after{content:"";position:absolute;left:4px;right:4px;top:6px;height:2px;background:var(--text-2);box-shadow:0 4px 0 var(--text-2)}
.nowline{display:flex;align-items:center;gap:8px;margin:2px 0}
.nowline b{font-family:var(--f-num);font-size:12px;background:var(--nowpill-bg);color:var(--nowpill-fg);border-radius:999px;padding:2px 8px}
.nowline i{flex:1;height:2px;background:var(--nowline);border-radius:1px;box-shadow:var(--nowline-glow)}
.secth{display:flex;justify-content:space-between;align-items:baseline;margin:14px 4px 6px;font-size:12px;font-weight:600}
.secth a{font-weight:400;color:var(--text-2)}
.newtag{font-size:11px;font-weight:800;background:var(--accent);color:var(--on-accent);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.row.hl{box-shadow:0 0 0 2.5px var(--text);border-radius:16px;border-bottom-color:transparent;margin:4px -6px;padding:0 6px}

/* 底部贴底元素，位置和定稿线框一致：导航离底 42px（安全区 34 + 8）；“＋”离底 40px（66 高，与 62 高的导航中线对齐）；
   提醒按钮条、提示条离底 118px（42 + 62 + 14），输入行 116px。
   透明效果按现状（R-79、R-80、R-89）：底部导航 70% 不透明＋模糊 6px；“＋”实色柠檬黄；提示条实色（--glass-solid，不模糊）；
   提醒按钮条在磨砂玻璃里保持半透明玻璃（R-89，有意和提示条不同）；弹层、录音面板是玻璃。减少透明效果时全部实色。 */
.glass{background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));box-shadow:inset 0 0 0 1px var(--glass-border),var(--shadow-2)}
.tabbar{position:absolute;left:14px;bottom:42px;right:94px;height:62px;border-radius:var(--r-pill);background:var(--nav-bg);-webkit-backdrop-filter:blur(6px) saturate(140%);backdrop-filter:blur(6px) saturate(140%);display:flex;align-items:center;padding:5px;gap:2px;z-index:5}
.tabbar.glassy{-webkit-backdrop-filter:blur(6px) saturate(var(--glass-sat));backdrop-filter:blur(6px) saturate(var(--glass-sat));box-shadow:inset 0 0 0 1px var(--glass-border),var(--shadow-2)}
.tab{flex:1;height:52px;border-radius:var(--r-pill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--nav-fg);font-size:11px;font-weight:400}
.tab .ico{width:20px;height:20px}
.tab.on{background:var(--nav-active-bg);color:var(--nav-active-fg);font-weight:600}
.fab{position:absolute;right:14px;bottom:40px;width:66px;height:66px;border-radius:50%;background:var(--fab-bg);color:var(--fab-fg);display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:inset 0 0 0 1px var(--glass-border),var(--shadow-2)}
.fab .ico{width:28px;height:28px}
.dock{position:absolute;left:14px;right:14px;z-index:6}

/* 提醒按钮条 */
.abar{bottom:118px;border-radius:var(--r-xl);padding:8px;display:flex;gap:8px;background:var(--abar-bg)}
.abar .btn{flex:1;padding:0 8px;font-size:13px}
.abar .btn.out{box-shadow:inset 0 0 0 1.5px var(--abar-fg);color:var(--abar-fg)}

/* 提示条 */
.toast{box-shadow:var(--shadow-2);bottom:118px;border-radius:var(--r-xl);padding:14px 14px 12px 16px;background:var(--toast-bg);color:var(--toast-fg)}
.toast .r{display:flex;align-items:center;gap:8px}
.toast .t1{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .t2{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--toast-fg2);margin-top:2px}
.toast .btn{height:36px;padding:0 12px;font-size:14px;font-weight:400;box-shadow:inset 0 0 0 1.5px var(--toast-fg);color:var(--toast-fg)}
.toast .pr{height:3px;border-radius:2px;background:var(--toast-track);margin-top:10px;overflow:hidden}
.toast .pr i{display:block;height:100%;width:55%;background:var(--toast-fg)}

/* 弹层、遮罩 */
.scrim{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(var(--scrim-blur));backdrop-filter:blur(var(--scrim-blur));z-index:7}
.blurbg{filter:blur(5px);pointer-events:none}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;border-radius:34px 34px 0 0;background:var(--sheet-bg);padding:18px 20px 40px}
.sheet.glassy,.card-ov.glassy{-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));box-shadow:inset 0 0 0 1px var(--glass-border),var(--shadow-2)}
.card-ov{position:absolute;left:24px;right:24px;z-index:8;border-radius:30px;background:var(--sheet-bg);padding:26px 22px 20px;text-align:center}

/* 录音面板 */
.rec .hdr{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700}
.rec .dot{width:9px;height:9px;border-radius:50%;background:var(--rec-dot);display:inline-block;margin-right:6px;box-shadow:0 0 0 4px var(--rec-dot-halo)}
.rec h4{margin:14px 0 2px;font-size:21px;font-weight:600}
.wave{display:flex;align-items:center;gap:3px;height:56px;margin:14px 0 6px}
.wave i{display:block;width:4px;border-radius:2px;background:var(--wave)}
.zone{border:2px dashed var(--text-2);border-radius:20px;height:62px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--text)}
.micbtn{position:absolute;right:14px;bottom:42px;width:88px;height:88px;border-radius:50%;background:var(--mic-bg);color:var(--mic-fg);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px var(--mic-halo),0 0 0 28px var(--mic-halo2)}
.micbtn .ico{width:36px;height:36px}

/* 胶囊筛选 */
.chips{display:flex;gap:8px;overflow:hidden;margin-top:12px}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--panel);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:400;box-shadow:var(--shadow-1)}
.chip.on{background:var(--chip-on-bg);color:var(--chip-on-fg)}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--pc)}
.grp{font-size:12px;font-weight:600;margin:16px 4px 6px}
.grp.dg{color:var(--danger-text)}
.lst{padding:2px 14px}
.lrow{display:grid;grid-template-columns:24px 1fr auto 28px;align-items:center;gap:10px;min-height:60px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .t1{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .t2{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2);margin-top:2px}
.lrow .mo{color:var(--text-2);font-weight:800;text-align:center}

/* 月历 */
.segc{display:flex;background:var(--panel-2);border-radius:999px;padding:4px;margin-top:12px}
.segc span{flex:1;text-align:center;height:36px;line-height:36px;border-radius:999px;font-size:13px;font-weight:400;color:var(--text-2)}
.segc span.on{background:var(--chip-on-bg);color:var(--chip-on-fg);font-weight:600}
.mgrid{margin-top:12px;padding:10px 6px 8px}
.mgrid .wk,.mgrid .wkr{display:grid;grid-template-columns:repeat(7,1fr)}
.mgrid .wk span{text-align:center;font-size:12px;color:var(--text-2);padding:2px 0 6px}
.cell{min-height:66px;text-align:center;padding:6px 0 4px;border-radius:12px;margin:1px}
.cell.h{background:var(--hol-bg)}
.cell .d{font-family:var(--f-num);font-weight:600;font-size:16px;width:32px;height:32px;line-height:32px;margin:0 auto;border-radius:50%}
.cell.o .d,.cell.o .l{color:var(--text-2);font-weight:600}
.cell .l{font-size:11px;color:var(--text-2);line-height:1.2}
.cell .l.f{color:var(--text);font-weight:700}
.cell .n{font-size:11px;font-weight:600;line-height:1.2}
.cell.td .d{background:var(--today-bg);color:var(--today-fg)}
.legend{font-size:11.5px;color:var(--text-2);padding:8px 8px 2px;display:flex;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:6px}

/* 随手记 */
.vt{display:flex;background:var(--panel);border-radius:14px;padding:3px;box-shadow:var(--shadow-1)}
.vt > span{width:40px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.vt > span.on{background:var(--chip-on-bg);color:var(--chip-on-fg)}
.lockrow{margin-top:12px;display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;font-size:14px}
.merge{margin-top:10px;display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-radius:var(--r-lg);background:var(--panel-2);font-size:12px}
.thumb{width:44px;height:44px;border-radius:12px;flex:none}
.inrow{font-size:14px;position:absolute;left:14px;right:14px;bottom:116px;height:56px;border-radius:var(--r-lg);background:var(--panel);display:flex;align-items:center;padding:0 8px 0 18px;gap:8px;color:var(--text-2);z-index:4;box-shadow:var(--shadow-2)}
.mason{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;align-items:start}
.mcard{border-radius:22px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow-1)}
.mcard .im{aspect-ratio:16/10;position:relative}
.mcard .im b{position:absolute;right:8px;top:8px;background:rgba(20,21,24,.78);color:#fff;font-size:11px;border-radius:8px;padding:1px 6px}
.mcard .bd{padding:10px 12px 10px}
.mcard .t1{font-weight:700;font-size:14px;line-height:1.35}
.mcard .t2{font-size:12px;color:var(--text-2);margin-top:4px;line-height:1.45}
.mcard .ft{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--text-2);white-space:nowrap}
.mcard .ft .cat{flex:none;font-size:11px;padding:0 7px}
.mcard .ft .num{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cat{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--panel-2);color:var(--text);font-size:11px;font-weight:400}

/* 隐私记、设置、引导 */
.lockic{width:44px;height:52px;margin:0 auto;color:var(--text)}
.set{padding:0 16px}
.srow{display:flex;align-items:center;gap:10px;min-height:50px;border-bottom:1px solid var(--line);font-size:13px}
.srow:last-child{border-bottom:0}
.srow .v{margin-left:auto;color:var(--text-2);font-size:13px;text-align:right}
.chev{color:var(--text-2);font-weight:700}
.stepbar{display:flex;gap:6px;justify-content:center;margin:10px 0 0}
.stepbar i{width:28px;height:5px;border-radius:3px;background:var(--step-off)}
.stepbar i.on{background:var(--text)}
.sym{display:grid;grid-template-columns:44px 1fr;gap:2px 12px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line)}
.sym:last-child{border-bottom:0}
.sym .c{display:flex;justify-content:center}


/* 登录与 Safari 引导：沿用图标和启动画面的“柠檬光 + 玻璃圆片” */
.scr.fix{height:844px;min-height:0;padding-bottom:0}
.scr.login{background:var(--login-bg);padding-bottom:40px}
.lhero{text-align:center;padding:34px 0 8px}
.lhero svg{width:96px;height:96px;border-radius:22px;box-shadow:var(--shadow-2)}
.lhero .nm{font-size:34px;font-weight:800;margin-top:14px;letter-spacing:.02em}
.lhero .en{font-family:var(--f-num);font-weight:700;color:var(--text-2);font-size:15px}
.lhero .tag{font-size:15px;margin-top:10px}
.form{margin-top:22px;padding:18px 18px 16px}
.lab{font-size:12.5px;color:var(--text-2);margin:2px 2px 6px}
.inp{height:52px;border-radius:16px;background:var(--panel-2);display:flex;align-items:center;padding:0 16px;font-size:16px;box-shadow:inset 0 0 0 1.5px var(--inp-line)}
.inp.focus{box-shadow:inset 0 0 0 2px var(--text)}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp span{height:56px;border-radius:14px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:24px;font-weight:800;box-shadow:inset 0 0 0 1.5px var(--inp-line)}
.otp span.f{box-shadow:inset 0 0 0 2px var(--text)}
.otp span.cur{box-shadow:inset 0 0 0 2px var(--text),0 0 0 4px var(--accent)}
.okline{font-size:12.5px;color:var(--ok-text);font-weight:700;margin:6px 2px 0}
.stepn{width:28px;height:28px;border-radius:50%;background:var(--chip-on-bg);color:var(--chip-on-fg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.sbar{position:absolute;left:0;right:0;bottom:0;height:92px;background:var(--glass-solid);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding-top:14px;color:var(--text-2);font-size:20px;z-index:3}
.mini{border-radius:16px;background:var(--panel);padding:10px;font-size:12px;box-shadow:var(--shadow-1)}
.mini .bar{display:flex;justify-content:space-around;align-items:center;background:var(--panel-2);border-radius:10px;height:34px;color:var(--text-2);margin-bottom:6px}
.mini .hl{width:26px;height:26px;border-radius:8px;box-shadow:inset 0 0 0 2px var(--text);display:flex;align-items:center;justify-content:center;color:var(--text)}
.web{width:1280px;height:800px;border-radius:14px;overflow:hidden;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.25);background:var(--panel)}
.bchrome{height:78px;background:var(--wbar-solid);border-bottom:1px solid var(--line)}
.bchrome .tabs{height:38px;display:flex;align-items:flex-end;padding:0 10px}
.bchrome .tab1{height:32px;border-radius:10px 10px 0 0;background:var(--panel);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:12px;width:230px}
.bchrome .tab1 svg{width:16px;height:16px;border-radius:4px}
.bchrome .addr{height:40px;display:flex;align-items:center;padding:0 14px;gap:12px;color:var(--text-2);font-size:13px}
.bchrome .addr span.u{flex:1;height:30px;border-radius:15px;background:var(--panel-2);display:flex;align-items:center;padding:0 14px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;height:722px}
.wleft{background:var(--login-bg);padding:72px 64px;position:relative;overflow:hidden}
.wleft .disc{position:absolute;right:-90px;bottom:-110px;width:460px;height:460px;opacity:.9}
.wright{display:flex;align-items:center;justify-content:center;background:var(--scr-bg)}


/* ================= 官网首页 ================= */
.site{background:var(--scr-bg);color:var(--text);font-family:var(--f-zh);line-height:1.5}
.site.ph{width:390px}.site.pc{width:1280px}
.site .sbarw{height:92px;background:var(--wbar-solid);display:flex;flex-direction:column;justify-content:flex-end;padding:0 14px 10px;border-bottom:1px solid var(--line)}
.site .sbarw .u{height:36px;border-radius:12px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text)}
.snav{display:flex;align-items:center;gap:10px;padding:14px 18px}
.snav svg{width:32px;height:32px;border-radius:8px}
.snav b{font-size:17px}
.snav .lk{margin-left:auto;display:flex;gap:18px;align-items:center;font-size:14px;font-weight:700}
.shero{background:var(--login-bg);padding:18px 18px 34px;position:relative;overflow:hidden}
.pc .shero{padding:40px 72px 64px;display:grid;grid-template-columns:1fr 520px;gap:40px;align-items:center}

.split .it .t2{font-size:11.5px;color:var(--text-2);grid-column:2}
.arrow{position:absolute;left:120px;top:96px;width:2px;height:160px;background:repeating-linear-gradient(180deg,var(--text-2) 0 6px,transparent 6px 12px)}
.ssec{padding:34px 18px 8px}

.ssec h3{font-size:26px;font-weight:800;margin:0 0 6px;line-height:1.25}
.pc .ssec h3{font-size:36px}
.ssec .ld{color:var(--text-2);font-size:15px;max-width:560px}
.feats{display:grid;gap:12px;margin-top:18px}
.pc .feats{grid-template-columns:repeat(3,1fr);gap:16px}
.feat{background:var(--panel);border-radius:var(--r-xl);padding:16px;box-shadow:var(--shadow-1);overflow:hidden}
.feat.wide{grid-column:span 2}
.feat .il{border-radius:18px;background:var(--panel-2);padding:12px;min-height:118px;margin-bottom:12px;overflow:hidden;position:relative}
.feat h4{margin:0;font-size:17px;font-weight:800}
.feat p{margin:4px 0 0;font-size:14px;color:var(--text-2)}
.mrow{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:12px;padding:7px 10px;font-size:12.5px;font-weight:700;margin-top:6px}
.mrow:first-child{margin-top:0}
.mrow small{font-weight:400;color:var(--text-2);margin-left:auto;font-size:11px}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:11px}
.mcal span{background:var(--panel);border-radius:7px;padding:3px 0;line-height:1.2}
.mcal span.h{background:var(--hol-bg);font-weight:800}
.mcal span.td{background:var(--today-bg);color:var(--today-fg);font-weight:800}
.mcal span em{display:block;font-style:normal;font-size:9.5px;color:var(--text-2)}
.mcal span.td em{color:inherit}
.steps{display:grid;gap:10px;margin-top:16px}
.pc .steps{grid-template-columns:1fr 1fr;gap:16px}
.inst{background:var(--panel);border-radius:var(--r-xl);padding:18px}
.inst .s{display:flex;gap:12px;align-items:flex-start;margin-top:12px;font-size:14.5px}
.btn.dis{background:var(--panel-2);color:var(--text-2);cursor:not-allowed}
.invite{background:var(--now-bg);color:var(--now-fg);border-radius:var(--r-xl);padding:20px;margin-top:16px}
.invite p{margin:6px 0 0;color:var(--now-fg2);font-size:14px}
.sfoot{padding:28px 18px 34px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:13.5px;color:var(--text-2);border-top:1px solid var(--line);margin-top:30px}
.pc .sfoot{padding:28px 72px 40px}
.lang{display:inline-flex;background:var(--panel-2);border-radius:999px;padding:3px;margin-left:auto}
.lang span{padding:5px 12px;border-radius:999px;font-weight:700;font-size:13px}
.lang span.on{background:var(--chip-on-bg);color:var(--chip-on-fg)}

/* ================= 电脑 1280 ================= */
.desk{width:1280px;height:800px;border-radius:14px;overflow:hidden;background:var(--scr-bg);position:relative;box-shadow:0 30px 60px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.25)}
.wbar{height:36px;display:flex;align-items:center;gap:8px;padding:0 0 0 14px;font-size:12px;color:var(--text-2);background:var(--wbar-bg)}
.wbar svg{width:16px;height:16px;border-radius:4px}
.wbar .ctl{margin-left:auto;display:flex}
.wbar .ctl span{width:46px;height:36px;display:flex;align-items:center;justify-content:center;font-size:13px}
.dgrid{display:grid;grid-template-columns:88px 480px 1fr 352px;height:764px}
.dgrid.two{grid-template-columns:88px 1fr 380px}
.dgrid.one{grid-template-columns:88px 1fr}
.dgrid.zero{grid-template-columns:1fr}
.rail{display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px;background:var(--rail-bg)}
.rail .fabd{width:56px;height:56px;border-radius:50%;background:var(--fab-bg);color:var(--fab-fg);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--glass-border),var(--shadow-2)}
.rail .hint{font-size:10.5px;color:var(--text-2);text-align:center;line-height:1.3;margin:4px 0 10px}
.rail .rt{width:68px;height:58px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--text-2)}
.rail .rt.on{background:var(--nav-active-bg);color:var(--nav-active-fg)}
.rail .sp{flex:1}
.col{padding:20px 22px;overflow:hidden;position:relative}
.col.mid{background:var(--mid-bg)}
.col.ed{background:var(--panel);border-left:1px solid var(--line)}
.fld{margin-top:12px}
.fld .k{font-size:12px;color:var(--text-2);margin-bottom:4px}
.fld .v{background:var(--panel-2);border-radius:12px;padding:10px 12px;font-size:14px}
.wkbars{display:flex;align-items:flex-end;gap:10px;height:96px;padding:12px 14px 0}
.wkbars i{flex:1;border-radius:8px;background:var(--panel-2)}
.wkbars i.on{background:var(--today-bg)}
.wkl{display:flex;gap:10px;padding:6px 14px 12px}
.wkl span{flex:1;text-align:center;font-size:11.5px;color:var(--text-2)}
.wkl span b{display:block;font-family:var(--f-num);color:var(--text);font-size:13px}
.anc{border-radius:20px;padding:12px 14px}
.kbd{display:inline-block;border-radius:6px;box-shadow:inset 0 0 0 1px var(--text-2);padding:0 5px;font-size:11px;color:var(--text)}
.dtoast{position:absolute;left:22px;right:22px;bottom:22px}
.dtoast .r{flex-wrap:wrap}
.dtoast .r > div{flex:1 1 100% !important}
.dtoast .r .btn{height:40px;padding:0 16px;margin-top:8px}
.dtoast .r .btn:first-of-type{margin-left:auto}
.dwin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;border-radius:30px;background:var(--sheet-bg);padding:24px 26px}

/* 对齐定稿线框（R-77）：今天页时间河、待办列表直接铺在底色上 */
.flat{background:transparent;box-shadow:none;padding:0;margin-top:0;border-radius:0}
.flat .row,.flat .lrow{border-bottom:0}
.flat .row.hl{background:var(--panel)}
.btn.soft{font-weight:400}
.alertpg > .secth,.alertpg > .secth + .river{display:none}
/* 左滑示范 */
.swp{position:relative;overflow:hidden}
.swp .acts{position:absolute;right:0;top:0;bottom:0;display:flex}
.swp .acts span{width:56px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;line-height:1.3;background:var(--text-2);color:var(--panel)}
.swp .acts span.del{background:var(--ink);color:var(--on-ink)}
.desk .swp .acts{display:none}.desk .swp .lrow{margin-right:0!important}
/* 隐私记解锁：浅色磨砂遮罩 */
.scrim.lite{background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
body[data-rt="1"] .scrim.lite{background:color-mix(in srgb,var(--bg) 96%,transparent);-webkit-backdrop-filter:none;backdrop-filter:none}

/* ===== 第七轮补画用到的零件 ===== */
/* 开关（设置里的“减少透明效果”等） */
.tgl{width:46px;height:28px;border-radius:999px;background:var(--step-off);flex:none;margin-left:auto}
.tgl::before{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tgl.on{background:var(--ink)}.tgl.on::before{left:21px;background:var(--on-ink)}
body[data-skin="glass"] .tgl.on{background:var(--accent)}body[data-skin="glass"] .tgl.on::before{background:#141518}
.snote{font-size:12px;color:var(--text-2);margin:8px 6px 0;line-height:1.45}
/* 其他页面的提醒：顶部横幅（实色面板，不透明，保证标题清楚） */
.tban{position:absolute;left:10px;right:10px;top:54px;z-index:9;background:var(--panel);border-radius:24px;padding:12px 14px 8px;box-shadow:var(--shadow-2),inset 0 0 0 1.5px var(--text)}
.tban .k{font-size:12px;color:var(--text-2)}
.tban .t{font-size:16px;font-weight:700}
.tban .grab{width:36px;height:4px;border-radius:2px;background:var(--step-off);margin:8px auto 0}
/* 可点的完成圆圈（提醒横幅、整页提醒里的待办；UI-2 第三轮中 1） */
.done-c{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2.5px var(--pc,var(--text));flex:none;position:relative}
.done-c::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
body[data-hit="1"] .done-c::after{outline:1.5px dashed #2F7BF5}
/* 断网横幅、未同步的一条 */
.offban{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--on-ink);border-radius:16px;padding:9px 12px;font-size:12.5px;margin:4px 0 10px}
.offban i{width:8px;height:8px;border-radius:50%;background:var(--rec-dot);flex:none}
.row.sync{border:1.5px dashed var(--text-2);border-radius:14px;padding:0 8px;margin:4px -8px}
/* 空状态“试一句” */
.try{border-radius:14px;padding:11px 14px;margin-top:8px;font-size:15px;box-shadow:inset 0 0 0 1.5px var(--text);background:var(--panel)}
/* 隐私记密码键盘 */
.pdots{display:flex;gap:16px;justify-content:center;margin:20px 0 22px}
.pdots i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--text)}
.pdots i.f{background:var(--text)}.pdots i.e{box-shadow:inset 0 0 0 2px var(--text-2);opacity:.6}
.kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 22px;padding:0 26px}
.kpad span{height:62px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:26px;font-family:var(--f-num);font-weight:600;box-shadow:var(--shadow-1)}
.kpad span.e{background:transparent;box-shadow:none;font-size:15px;font-family:var(--f-zh)}
.abar.four .btn{padding:0 4px;font-size:12.5px}
/* 整页提醒 */
.fa-big{font-family:var(--f-num);font-size:64px;font-weight:700;line-height:1.05;letter-spacing:-.03em}

/* ===== 动效演示（R-93）：只动 transform 和 opacity ===== */
.mdemo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;margin-top:16px;padding:16px;border-radius:20px;background:var(--bg);color:var(--text)}
.mdemo .note{color:var(--text-2)}
.mpress{transition:background-color var(--dur-press) linear}
.mpress:active{filter:brightness(.92)}
@media (prefers-reduced-motion: no-preference){
  .mpress{transition:transform var(--dur-press) var(--ease-spring)}
  .mpress:active{transform:scale(.96)}
}
.mrowd{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer;transition:opacity var(--dur-ui) var(--ease-standard) var(--dur-ui)}
.mrowd input{position:absolute;opacity:0;pointer-events:none}
.mcirc{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--text);position:relative;flex:none}
.mcirc::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--text);opacity:0;transition:opacity var(--dur-ui) var(--ease-standard)}
.mcirc::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.mrowd input:checked + .mcirc::before{opacity:1}
.mrowd:has(input:checked){opacity:.3}
.mrowd input:focus-visible + .mcirc{outline:2px solid var(--focus);outline-offset:3px}
@media (prefers-reduced-motion: no-preference){
  .mcirc::before{transform:scale(.4);transition:opacity var(--dur-ui) var(--ease-standard),transform var(--dur-ui) var(--ease-spring)}
  .mrowd input:checked + .mcirc::before{transform:scale(1)}
}

/* ===== 月历：方案 C 色块标签（R-100）、翻页（R-99） ===== */
.mv-c .cell{min-height:86px}
.mv-c .ev{display:grid;gap:2px;margin:3px 2px 0}
.mv-c .ev i,.lgtag{font-style:normal;display:block;height:15px;line-height:15px;border-radius:4px;padding:0 3px;font-size:9.5px;font-weight:700;color:var(--on-p);text-align:left;white-space:nowrap;overflow:hidden;background:var(--pb);box-shadow:inset 2px 0 0 var(--pc)}
.lgtag{display:inline-block;padding:0 4px 0 5px;margin-right:4px;vertical-align:1px}
.mv-c .ev .more{font-family:var(--f-num);font-size:9.5px;font-weight:700;color:var(--text-2);line-height:1.2;text-align:left;padding-left:3px}
/* 电脑：日期和农历并排，省出高度放 4 个标签 */
.mvd .mgrid{padding:8px 8px 6px}
.mvd .cell{display:grid;grid-template-columns:auto 1fr;align-items:center;align-content:start;text-align:left;padding:4px 6px;min-height:98px;column-gap:4px}
.mvd .cell .d{width:26px;height:26px;line-height:26px;font-size:14px;margin:0;text-align:center}
.mvd .cell .ev{grid-column:1/-1;margin:4px 0 0}
.mvd .cell .ev i{font-size:10.5px;height:17px;line-height:17px}
/* 翻页 A：小箭头贴在标题旁（看得见 28px，点击区 44px） */
.mnav-a{display:inline-flex;gap:2px;margin-left:4px}
.nb{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--text);line-height:1;position:relative}
.mnav-b .nb{width:32px;height:32px;background:var(--panel);box-shadow:var(--shadow-1)}
.backchip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--ink);color:var(--on-ink);font-size:12px;font-weight:600;margin-top:4px;position:relative}
/* 翻页 B：“‹ 今天 ›”在分段控件右侧 */
.mnav-b{display:inline-flex;align-items:center;gap:4px;flex:none}
.tdy{height:32px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;font-size:13px;font-weight:600;background:var(--panel);color:var(--text-2);position:relative;box-shadow:var(--shadow-1)}
.tdy.on{background:var(--ink);color:var(--on-ink)}
.caret{font-size:13px;color:var(--text-2);margin-left:4px;vertical-align:3px}
.nb::after,.tdy::after,.backchip::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
body[data-hit="1"] .nb::after,body[data-hit="1"] .tdy::after,body[data-hit="1"] .backchip::after{outline:1.5px dashed #2F7BF5;outline-offset:-1px}

/* ---- 标题“换年月”提示：3 个方案 ---- */
.tp-chev{display:inline-flex;width:14px;height:14px}
.tp-chev svg{width:100%;height:100%}
.tv-a .tpbtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--panel-2);color:var(--text);margin-left:8px;vertical-align:4px;position:relative}
.tv-a .tpbtn::after{content:"";position:absolute;inset:-8px}
.tv-b .date.pt{display:inline-flex;align-items:center;gap:0;background:var(--panel);border-radius:999px;padding:4px 14px 4px 16px;box-shadow:var(--shadow-1),inset 0 0 0 1.5px var(--line);font-size:22px}
.tv-b .tpbtn{display:inline-flex;color:var(--text-2);margin-left:8px}
.tv-c .calbtn{width:38px;height:38px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--text);flex:none;box-shadow:var(--shadow-1);position:relative}
.tv-c .calbtn .ico{width:19px;height:19px}
.tv-c .calbtn .tp-chev{position:absolute;right:3px;bottom:3px;width:11px;height:11px;background:var(--panel);border-radius:50%}
</style>

/* ---------------- 画面清单 ---------------- */
const LIST = TVLIST;
function render(){
  const d=document.body.dataset.dev;
  document.getElementById('screens').innerHTML = LIST.map(([k,t,c,dt,dc],i)=>`<figure class="sc"><div class="fit"><div class="inner">${(d==='d'?DK:PH)[k]()}</div></div><figcaption>${i+1}　${d==='d'&&dt?dt:t}<span class="cap2">${d==='d'&&dc?dc:c}</span></figcaption></figure>`).join('');
  fit();
}
function fit(){
  document.querySelectorAll('.fit').forEach(f=>{
    const inner=f.firstElementChild, el=inner.firstElementChild; if(!el) return;
    const w=el.scrollWidth, h=el.offsetHeight, s=Math.min(1,f.clientWidth/w);
    inner.style.transform=`scale(${s})`; inner.style.width=w+'px'; f.style.height=(h*s)+'px';
    if(document.body.dataset.dev==='p') f.style.maxWidth='406px';
  });
}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
  const k=b.dataset.k; document.body.dataset[k]=b.dataset.v;
  b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false'));
  try{localStorage.setItem('skin-v4-'+k,b.dataset.v)}catch(e){}
  render();
}));
document.getElementById('rt').addEventListener('change',e=>{document.body.dataset.rt=e.target.checked?'1':'0'});
document.getElementById('hit').addEventListener('change',e=>{document.body.dataset.hit=e.target.checked?'1':'0'});
(function init(){
  const q=new URLSearchParams(location.search);
  ['skin','mode','dev'].forEach(k=>{let v=q.get(k); if(!v){try{v=localStorage.getItem('skin-v4-'+k)}catch(e){}}
    if(v){document.body.dataset[k]=v; document.querySelectorAll(`.seg button[data-k="${k}"]`).forEach(x=>x.setAttribute('aria-pressed', x.dataset.v===v?'true':'false'));}});
  if(q.get('rt')==='1'){document.body.dataset.rt='1';document.getElementById('rt').checked=true;}
  if(q.get('hit')==='1'){document.body.dataset.hit='1';document.getElementById('hit').checked=true;}
  render(); addEventListener('resize',fit);
})();
