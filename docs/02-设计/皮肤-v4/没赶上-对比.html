/* 系统设置“降低透明度”时，玻璃自动换成实色后备值 */
@media (prefers-reduced-transparency: reduce){
  body[data-skin="glass"]{--glass-bg:var(--glass-solid);--glass-blur:0px;--glass-sat:100%}
}
body[data-rt="1"][data-skin="glass"]{--glass-bg:var(--glass-solid);--glass-blur:0px;--glass-sat:100%}
@media (prefers-reduced-motion: reduce){
  body{--dur-press:0ms;--dur-ui:0ms;--dur-sheet:0ms}
}

/* ================= 页面外壳（说明文字区，不属于 App） ================= */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--f-zh);background:var(--doc-bg);color:var(--doc-fg);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}
.topbar{position:sticky;top:0;z-index:50;background:var(--doc-bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--doc-line)}
.topbar .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;margin-right:auto}
.brand svg{width:28px;height:28px;border-radius:7px}
.seg{display:inline-flex;background:var(--doc-seg);border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;color:var(--doc-fg2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--doc-fg);color:var(--doc-bg)}
.seg button:focus-visible,.chk:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--doc-fg2);cursor:pointer}
h1.doc{font-size:clamp(28px,5.5vw,44px);line-height:1.15;margin:28px 0 6px;font-weight:800}
h2.doc{font-size:clamp(22px,4vw,30px);line-height:1.2;margin:48px 0 10px;font-weight:800}
.lead{max-width:70ch;color:var(--doc-fg2)}
.dcard{background:var(--doc-card);border-radius:24px;padding:20px 22px;margin-top:14px}
.dcard h3{margin:0 0 6px;font-size:18px}
.dcard p,.dcard li{max-width:72ch}
.dcard ul{margin:6px 0 0;padding-left:1.2em}
.dcard li{margin:4px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.tw{overflow-x:auto;margin-top:8px}
table.t{border-collapse:collapse;font-size:14px;min-width:720px;width:100%}
table.t th,table.t td{border-bottom:1px solid var(--doc-line);padding:6px 8px;text-align:left;vertical-align:middle;white-space:nowrap}
table.t th{font-weight:800;position:sticky;top:0;background:var(--doc-card)}
table.t td.name{font-weight:700}
table.t td{white-space:normal;max-width:240px}
table.t td code{word-break:break-all;font-size:12px}
table.t td.name,table.t td.name code{white-space:nowrap;word-break:normal}
.sw{display:inline-block;width:16px;height:16px;border-radius:5px;vertical-align:-3px;margin-right:6px;border:1px solid rgba(128,128,128,.35)}
.ok{color:var(--doc-ok);font-weight:800}.ng{color:var(--doc-ng);font-weight:800}
.note{font-size:14px;color:var(--doc-fg2)}
.screens{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,390px),1fr));gap:28px 22px;margin-top:18px}
body[data-dev="d"] .screens{grid-template-columns:1fr}
figure.sc{margin:0;min-width:0}
figure.sc figcaption{font-size:14px;font-weight:800;margin:10px 0 2px}
figure.sc .cap2{font-size:13px;color:var(--doc-fg2);font-weight:400;display:block}
.fit{width:100%;overflow:hidden}
.fit > .inner{transform-origin:0 0}

/* ================= App：通用 ================= */
.app{font-family:var(--f-zh);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.35}
.app :lang(ko),.app[lang="ko"]{font-family:var(--f-ko);word-break:keep-all}
.app[lang="ko"] .date{font-size:27px;white-space:nowrap}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app button{all:unset;box-sizing:border-box;cursor:pointer}
.app .muted{color:var(--text-2)}
.ico{width:20px;height:20px;display:block;flex:none}
.ico svg{width:100%;height:100%;display:block}

/* 手机外框 */
.phone{width:390px;border-radius:54px;padding:10px;background:#0c0d10;box-shadow:0 30px 60px rgba(0,0,0,.18),0 0 0 1px var(--doc-frame)}
.scr.pad2{padding-bottom:200px}
.scr{position:relative;border-radius:44px;overflow:hidden;background:var(--scr-bg);min-height:844px;padding-bottom:120px}
.sb{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font-weight:700;font-size:16px}
.sb .isl{width:122px;height:34px;border-radius:20px;background:#000;position:absolute;left:50%;top:11px;margin-left:-61px}
.sb .sig{display:flex;gap:6px;align-items:center;font-size:13px}
.sb .bat{width:24px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative;opacity:.9}
.sb .bat::after{content:"";position:absolute;inset:2px 6px 2px 2px;background:currentColor;border-radius:1px}
.pg{padding:6px 18px 0}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;margin-left:-67px;background:var(--text);opacity:.85}

/* 顶部 */
.hd{display:flex;align-items:flex-start;gap:10px}
.hd .tt{flex:1;min-width:0}
.date{font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--text-2);margin-top:3px}
.ibtn{width:44px;height:44px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--text);flex:none;box-shadow:var(--shadow-1)}
.av{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.annchip{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:var(--panel);border-radius:var(--r-pill);padding:6px 12px;font-size:13px;font-weight:600;box-shadow:var(--shadow-1)}
.dia{width:9px;height:9px;transform:rotate(45deg);background:var(--p3s);display:inline-block;border-radius:1.5px;flex:none}

/* “现在”卡 */
.now{margin-top:14px;background:var(--now-bg);color:var(--now-fg);border-radius:var(--r-xl);padding:18px 18px 16px;position:relative}
.now .k{font-size:13px;color:var(--now-fg2);display:flex;align-items:center;gap:6px}
.now .ti{font-size:24px;font-weight:800;margin:4px 0 4px;letter-spacing:-.01em}
.now .me{font-size:14px;color:var(--now-fg2)}
.now .bar{height:6px;border-radius:3px;background:var(--now-track);margin:14px 0 12px;overflow:hidden}
.now .bar i{display:block;height:100%;width:86%;background:var(--now-prog);border-radius:3px}
.now .nx{font-size:14px;border-top:1px solid var(--now-track);padding-top:12px}
.now.alert{box-shadow:0 0 0 4px var(--alert-ring)}
.now.alert .ti{font-size:26px}

      <span class="btn dis w" style="margin-top:16px;height:52px">Windows 版即将推出</span>
      <div class="muted" style="font-size:12.5px;margin-top:10px">在这之前，可以先用电脑浏览器打开 lemomemo.com。</div></div>
   </div></div>
   <div class="ssec"><div class="invite"><b style="font-size:20px">现在只对朋友开放</b><p>注册需要邀请码。请已经在用的朋友在“设置 › 邀请朋友”里发一个给你。</p><p>你记的东西只有你自己能看到，邀请你的朋友也看不到。说话记事时，录音会交给 AI 转成文字；免费 AI 的录音和文字可能被谷歌用于改进产品，详见隐私说明。</p></div></div>
   <div class="sfoot"><span>隐私说明</span><span>使用条款</span><span>（内容以后补）</span><div class="lang"><span class="on">中文</span><span lang="ko" style="font-family:var(--f-ko)">한국어</span></div></div>`;
}
function siteFrame(inner, pc){
  return pc ? `<div class="web" style="height:auto"><div class="bchrome"><div class="tabs"><div class="tab1"><svg viewBox="0 0 1024 1024"><use href="#icLs"/></svg>柠檬记 · Lemo</div></div><div class="addr"><span>‹</span><span>›</span><span>↻</span><span class="u">lemomemo.com</span></div></div>${inner}</div>`
            : `<div class="phone"><div class="scr app" style="min-height:0;padding-bottom:0">${status()}${inner}<div class="home"></div></div></div>`;
}
function renderHome(){
  const pc=document.body.dataset.dev==='d';
  const one=(th, full, lang='zh', cap)=>{
    const glass=th.startsWith('glass');
    const inner=`<div class="site app th-${th} ${pc?'pc':'ph'}">${siteTop(lang,pc)}${siteHero(lang,pc,glass)}${full?siteBody(pc):''}</div>`;
    return `<figure class="sc"><div class="fit"><div class="inner"><div class="th-${th}">${siteFrame(inner,pc)}</div></div></div><figcaption>${cap}</figcaption></figure>`;
  };
  document.getElementById('homes').innerHTML = `<div class="screens">${one('simple-light',true,'zh','简洁·浅色：完整一页')}${one('simple-dark',false,'zh','简洁·深色：首屏')}${one('glass-light',false,'zh','磨砂玻璃·浅色：首屏')}${one('glass-dark',false,'zh','磨砂玻璃·深色：首屏')}${one('simple-light',false,'ko','韩文首屏（简洁·浅色）')}</div>`;
}


/* ---------------- “没赶上”变体 ---------------- */
function odBlock(s, v){
  const btns = `<span class="btn sm pri">${s.today}</span><span class="btn sm out">${s.tmr}</span>`;
  const ods = s.ods.replace('晚了 2 天','<em>晚了 2 天</em>');
  const card = cls => `<div class="od ${cls}"><div style="flex:1;min-width:0"><div class="lbl">${s.odl}</div><div class="t1">${s.odt}</div><div class="t2">${cls?ods:s.ods}</div></div>${btns}</div>`;
  if(v==='a') return card('');
  if(v==='b') return card('vb');
  if(v==='c') return card('vc');
  if(v==='d') return `<div class="odg">${s.odl} 1</div><div class="od vd"><div style="flex:1;min-width:0"><div class="t1">${s.odt}</div><div class="t2">${ods}</div></div>${btns}</div>`;
  if(v==='e') return `<div class="odline"><span class="dot"></span><span class="tx">${s.odl}：${s.odt}</span><b style="white-space:nowrap">晚 2 天</b><a>处理 ›</a></div>`;
  if(v==='f') return card('vf');
}
const OD = [
  ['a','A 现在：浅红底','整块浅红，最显眼，也最容易显得“报错”'],
  ['b','B 白卡 ＋ 左侧红竖条','和其他卡片一样是白底，只靠左边一根红线和红字提示'],
  ['c','C 白卡 ＋ 小红点','几乎全中性，红色只剩标签前的小圆点和“晚了 2 天”'],
  ['d','D 分组标题','像待办页的分组：上面一行红字“没赶上 1”，下面是普通白卡'],
  ['e','E 一行提示','不占卡片，只一行字；点“处理”再展开今天 / 明天'],
  ['f','F 红色细描边','透明底 ＋ 淡红描边，比 A 轻，比 B、C 醒目']
];
OD.forEach(([k])=>{
  PH['od_'+k] = () => phone(todayBody('zh',{od:k}), {nav:0});
  DK['od_'+k] = () => { const t=deskToday('zh',{od:k}); return desk(rail(0)+t.main+t.mid+t.ed); };
});
/* ---------------- 画面清单 ---------------- */
const LIST = OD.map(([k,t,c])=>['od_'+k,t,c]);
function render(){
  const d=document.body.dataset.dev;
  document.getElementById('screens').innerHTML = LIST.map(([k,t,c])=>`<figure class="sc"><div class="fit"><div class="inner">${(d==='d'?DK:PH)[k]()}</div></div><figcaption>${t}<span class="cap2">${c}</span></figcaption></figure>`).join('');
  fit();
}
function fit(){
  document.querySelectorAll('.fit').forEach(f=>{
    const inner=f.firstElementChild, el=inner.firstElementChild; if(!el) return;
    const w=el.scrollWidth, h=el.offsetHeight, s=Math.min(1,f.clientWidth/w);
    inner.style.transform=`scale(${s})`; inner.style.width=w+'px'; f.style.height=(h*s)+'px';
    if(document.body.dataset.dev==='p') f.style.maxWidth='390px';
  });
}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
  const k=b.dataset.k; document.body.dataset[k]=b.dataset.v;
  b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false'));
  try{localStorage.setItem('skin-v4-'+k,b.dataset.v)}catch(e){}
  render();
}));
document.getElementById('rt').addEventListener('change',e=>{document.body.dataset.rt=e.target.checked?'1':'0'});
(function init(){
  const q=new URLSearchParams(location.search);
  ['skin','mode','dev'].forEach(k=>{let v=q.get(k); if(!v){try{v=localStorage.getItem('skin-v4-'+k)}catch(e){}}
    if(v){document.body.dataset[k]=v; document.querySelectorAll(`.seg button[data-k="${k}"]`).forEach(x=>x.setAttribute('aria-pressed', x.dataset.v===v?'true':'false'));}});
  if(q.get('rt')==='1'){document.body.dataset.rt='1';document.getElementById('rt').checked=true;}
  render(); addEventListener('resize',fit);
})();
</script>
