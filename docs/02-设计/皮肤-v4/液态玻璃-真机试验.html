<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>液态玻璃真机试验</title>
<style>
/* 液态玻璃真机试验（R-143 正式做法的验证页）：在 iPhone Safari 上真实滑动，看折射跟不跟手、掉不掉帧。
   做法：底栏里放“折射副本”——只复制底栏附近的几行内容（不是整屏），分几圈按离边缘的距离压缩，边缘把栏外的内容弯进来；
   副本随滚动同步移动。所有参数可在页面顶部切换，右上角实时显示帧率。 */
:root{--bg:#E9EAEE;--panel:#FFFFFF;--text:#141518;--text-2:#595C64;--line:#ECEDF0;--accent:#F2DF4A;
  --g-tint:rgba(255,255,255,.34);--g-hi:rgba(255,255,255,.95);--g-hi2:rgba(255,255,255,.55);--g-glow:.35;--g-sheen:.45;--g-drop:.14;--g-fg:#141518;--g-pill:rgba(20,21,24,.09);--g-fab-tint:rgba(242,223,74,.72);
  --safe:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#111215;--panel:#1C1D22;--text:#F2F3F5;--text-2:#A6A9B1;--line:#2A2B31;
    --g-tint:rgba(30,31,36,.44);--g-hi:rgba(255,255,255,.45);--g-hi2:rgba(255,255,255,.18);--g-glow:.10;--g-sheen:.14;--g-drop:.45;--g-fg:#F2F3F5;--g-pill:rgba(255,255,255,.14);--g-fab-tint:rgba(242,223,74,.86)}}
:root[data-theme="dark"]{--bg:#111215;--panel:#1C1D22;--text:#F2F3F5;--text-2:#A6A9B1;--line:#2A2B31;
  --g-tint:rgba(30,31,36,.44);--g-hi:rgba(255,255,255,.45);--g-hi2:rgba(255,255,255,.18);--g-glow:.10;--g-sheen:.14;--g-drop:.45;--g-fg:#F2F3F5;--g-pill:rgba(255,255,255,.14);--g-fab-tint:rgba(242,223,74,.86)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px calc(150px + var(--safe))}
h1{font-size:22px;margin:8px 0 4px}
.lead{font-size:14px;color:var(--text-2);line-height:1.6;margin:0 0 10px}
.ctl{background:var(--panel);border-radius:16px;padding:10px 12px;display:grid;gap:8px;font-size:14px;margin-bottom:14px}
.ctl .r{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctl .r > span{min-width:72px;color:var(--text-2)}
.ctl button{font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.ctl button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
#fps{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:20;font:12px/1.3 ui-monospace,Menlo,monospace;background:rgba(0,0,0,.72);color:#fff;padding:6px 8px;border-radius:10px;pointer-events:none;white-space:pre}
/* 列表：固定行高，方便副本只复制窗口里的几行 */
#list{position:relative}
.row{position:absolute;left:0;right:0;height:64px;display:flex;align-items:center;gap:12px;padding:0 4px;border-bottom:1px solid var(--line)}
.row .tm{width:44px;font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
.row .bar{width:4px;height:36px;border-radius:2px}
.row .tx{flex:1;min-width:0}
.row .t1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:12px;color:var(--text-2);margin-top:2px}
.row .th{width:44px;height:44px;border-radius:10px;flex:none}
.row .chip{font-size:11px;padding:2px 8px;border-radius:999px;color:#141518}
/* 底栏和“＋” */
.tabbar{position:fixed;left:14px;right:94px;bottom:calc(42px + var(--safe) - 34px);height:62px;border-radius:999px;z-index:10;display:flex;align-items:center;padding:5px;gap:2px;
  box-shadow:0 8px 24px rgba(0,0,0,var(--g-drop)),0 1px 3px rgba(0,0,0,calc(var(--g-drop) * .8));-webkit-user-select:none;user-select:none;touch-action:manipulation}
.fab{position:fixed;right:14px;bottom:calc(40px + var(--safe) - 34px);width:66px;height:66px;border-radius:50%;z-index:10;display:flex;align-items:center;justify-content:center;color:#141518;
  box-shadow:0 0 0 4px var(--bg),0 8px 24px rgba(0,0,0,var(--g-drop))}
@media (min-width:481px){.tabbar{left:calc(50% - 226px);right:auto;width:372px}.fab{right:calc(50% - 226px)}}
.tab{flex:1;height:52px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--g-fg);position:relative;z-index:2;cursor:pointer}
.tab svg{width:20px;height:20px}
.tab.on{font-weight:600}
.fab svg{width:28px;height:28px;position:relative;z-index:2}
.lens{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0;isolation:isolate;transform:translateZ(0)}
.lens .lr{position:absolute;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%}
.lens .cp{position:absolute;left:0;top:0;will-change:transform}
.lens .tint{position:absolute;inset:0;background:var(--g-tint)}
.lens .spec{position:absolute;inset:0;border-radius:inherit;box-shadow:inset 1.5px 1.5px 0 -.5px var(--g-hi),inset -1px -1px 0 -.5px var(--g-hi2),inset 0 0 10px rgba(255,255,255,var(--g-glow));
  background:radial-gradient(120% 90% at 22% -30%,rgba(255,255,255,var(--g-sheen)) 0 38%,transparent 60%)}
.fab .lens .tint{background:var(--g-fab-tint)}
@property --dx{syntax:'<length>';inherits:true;initial-value:0px}
.drop{position:absolute;top:5px;height:52px;left:var(--dx);border-radius:999px;z-index:1;pointer-events:none;transition:--dx .55s cubic-bezier(.34,1.45,.5,1)}
.drop.mv{animation:gel .55s cubic-bezier(.3,.9,.4,1)}
.drop .lr{opacity:0;transition:opacity .3s}.drop.mv .lr,.drop.press .lr{opacity:1}
.drop .tint{background:rgba(255,255,255,.18);transition:background .3s}.drop:not(.mv):not(.press) .tint{background:var(--g-pill)}
.drop.press{transform:scale(1.12);transition:--dx .55s cubic-bezier(.34,1.45,.5,1),transform .25s cubic-bezier(.3,1.5,.5,1)}
@keyframes gel{0%{transform:scale(1,1)}35%{transform:scale(1.22,.86)}70%{transform:scale(.96,1.04)}100%{transform:scale(1,1)}}
.drop .lens .spec{box-shadow:inset 1.5px 1.5px 0 -.5px rgba(255,255,255,.9),inset -1px -1px 0 -.5px rgba(255,255,255,.4),inset 0 0 8px rgba(255,255,255,.35),0 2px 8px rgba(0,0,0,.12)}
@media (prefers-reduced-motion: reduce){.drop{transition:none}.drop.mv{animation:none}.drop.press{transform:none}}
/* 底栏下面的渐进模糊带（R-139） */
.pblur{position:fixed;left:0;right:0;bottom:0;height:calc(160px + var(--safe) - 34px);z-index:9;pointer-events:none}
.pblur i{position:absolute;inset:0;-webkit-backdrop-filter:blur(var(--b));backdrop-filter:blur(var(--b));
  -webkit-mask:linear-gradient(to bottom,transparent var(--m0),#000 var(--m1),#000 var(--m2),transparent var(--m3));mask:linear-gradient(to bottom,transparent var(--m0),#000 var(--m1),#000 var(--m2),transparent var(--m3))}
.pblur i:nth-child(1){--b:1px;--m0:0%;--m1:16.7%;--m2:33.3%;--m3:50%}
.pblur i:nth-child(2){--b:2px;--m0:16.7%;--m1:33.3%;--m2:50%;--m3:66.7%}
.pblur i:nth-child(3){--b:4px;--m0:33.3%;--m1:50%;--m2:66.7%;--m3:83.3%}
.pblur i:nth-child(4){--b:8px;--m0:50%;--m1:66.7%;--m2:83.3%;--m3:100%}
.pblur i:nth-child(5){--b:16px;--m0:66.7%;--m1:83.3%;--m2:100%;--m3:100.1%}
.pblur b{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 0%,color-mix(in srgb,var(--bg) 55%,transparent) 70%)}
body.nopb .pblur{display:none}
</style>
</head>
<body>
<div id="fps">帧率 --</div>
<div class="wrap">
  <h1>液态玻璃真机试验</h1>
  <p class="lead">请在 iPhone 的 Safari 里打开，用手指上下滑动列表，看底栏边缘有没有把经过的内容弯进来、跟不跟手。点底栏的按钮看液滴滑过去，按住选中的那一项看它鼓起来。右上角是实时帧率（60 或 120 是满帧）和最近 5 秒掉帧的次数。下面几个开关可以换参数，看哪一组又好看又不卡。</p>
  <div class="ctl">
    <div class="r"><span>折射圈数</span><button data-k="rings" data-v="8">8 圈</button><button data-k="rings" data-v="5">5 圈</button><button data-k="rings" data-v="3">3 圈</button><button data-k="rings" data-v="0">不折射</button></div>
    <div class="r"><span>背后模糊</span><button data-k="blur" data-v="1">轻模糊</button><button data-k="blur" data-v="0">不模糊</button></div>
    <div class="r"><span>渐进模糊带</span><button data-k="pb" data-v="1">开</button><button data-k="pb" data-v="0">关</button></div>
    <div class="r"><span>深浅色</span><button data-k="theme" data-v="auto">跟随系统</button><button data-k="theme" data-v="light">浅色</button><button data-k="theme" data-v="dark">深色</button></div>
  </div>
  <div id="list"></div>
</div>
<div class="pblur" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><b></b></div>
<nav class="tabbar" aria-label="底部导航">
  <div class="tab on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg><span>今天</span></div>
  <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 5v15M15 5v15M4 15h16"/></svg><span>日历</span></div>
  <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>待办</span></div>
  <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l4 4-10 10H5v-4z"/></svg><span>随手记</span></div>
</nav>
<div class="fab" role="button" aria-label="记一句"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></div>
<script>
const H = 64, N = 80, WIN = 3;   // 行高、行数、副本窗口（底栏上下各多复制几行）
const COLORS = ['#F2DF4A','#8CC9E8','#F5B5AC','#C8B9F2','#A6DCB4','#F6C48C'];
const TITLES = ['NEOX 横版对片','SignPlex 客户反馈会','和 지민 吃饭','回复 박 대리 的邮件','交 SignPlex 韩文版成片','妈妈生日','买咖啡豆','NEOX 竖版 4K 导出','整理发票','健身房'];
const SUBS = ['到 14:30 · NEOX · 腾讯会议','提前 15 分提醒','연남동 · 生活','今天截止 · SignPlex','原定 10月22日','阴历十月初八'];
function rowHTML(i){
  const c = COLORS[i % 6], h = 9 + (i % 12), m = (i * 17) % 60;
  const thumb = i % 4 === 1 ? `<span class="th" style="background:linear-gradient(135deg,${COLORS[(i+2)%6]},${COLORS[(i+4)%6]})"></span>` : '';
  const chip = i % 3 === 0 ? `<span class="chip" style="background:${COLORS[(i+1)%6]}">${['NEOX','SignPlex','生活'][i%3===0?(i/3)%3:0]}</span>` : '';
  return `<div class="row" style="top:${i*H}px"><span class="tm">${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}</span><span class="bar" style="background:${c}"></span><span class="tx"><div class="t1">${TITLES[i%10]}</div><div class="t2">${SUBS[i%6]}</div></span>${chip}${thumb}</div>`;
}
const list = document.getElementById('list');
list.style.height = N * H + 'px';
list.innerHTML = Array.from({length:N}, (_, i) => rowHTML(i)).join('');

const RINGS_ALL = {bar:[[22,2],[17,4],[13,7],[10,10],[7.5,14],[5.5,18],[3.5,23],[2,28]], fab:[[18,2],[14,4],[10,7],[7,10],[4.5,14],[2.5,19]], drop:[[12,4],[7,9],[3.5,15]]};
const opt = {rings:8, blur:1, pb:1, theme:'auto'};
try{ Object.assign(opt, JSON.parse(localStorage.getItem('lg-test')||'{}')); }catch(e){}
function pick(kind){ const r = RINGS_ALL[kind]; const n = opt.rings; if(n>=8) return r; if(n===0) return []; return n===5 ? r.filter((_,i)=>[0,2,4,6,7].includes(i)).slice(0,5) : r.filter((_,i)=>[1,4,r.length-1].includes(i)); }
function bandMask(W,H,w){
  const r=H/2, ri=Math.max(r-w,0.5);
  const pill=(x,y,W,H,r)=>`M${x+r},${y}h${W-2*r}a${r},${r} 0 0 1 0,${2*r}h${-(W-2*r)}a${r},${r} 0 0 1 0,${-2*r}z`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><filter id="b" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="${Math.min(1.6,w/3)}"/></filter><path filter="url(#b)" fill="#fff" fill-rule="evenodd" d="${pill(0,0,W,H,r)} ${pill(w,w,W-2*w,H-2*w,ri)}"/></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
let copies = [];   // {el, host, kind, extraX}
function lens(host, kind, W, Hh, uniform){
  const L = document.createElement('div'); L.className = 'lens';
  const fx = opt.blur ? (kind==='drop' ? 'saturate(1.5) brightness(1.06)' : 'blur(2px) saturate(1.8) brightness(1.04)') : 'saturate(1.6)';
  const mk = (d, w, u) => { const R = document.createElement('div'); R.className = 'lr';
    const sx = u || (W/2)/(W/2+d), sy = u || (Hh/2)/(Hh/2+d);
    R.style.transform = `scale(${sx},${sy})`; R.style.transformOrigin = `${W/2}px ${Hh/2}px`;
    if(w){ const m = bandMask(W,Hh,w); R.style.webkitMaskImage = m; R.style.maskImage = m; }
    const cp = document.createElement('div'); cp.className = 'cp'; cp.style.filter = w ? fx + ' brightness(1.06)' : fx;
    R.appendChild(cp); copies.push({el:cp, host, kind}); return R; };
  L.appendChild(mk(0, 0, uniform));
  pick(kind).forEach(([w,d]) => L.appendChild(mk(d, w)));
  L.insertAdjacentHTML('beforeend','<div class="tint"></div><div class="spec"></div>');
  return L;
}
const bar = document.querySelector('.tabbar'), fab = document.querySelector('.fab');
const tabs = [...bar.querySelectorAll('.tab')];
let drop;
function buildGlass(){
  copies = []; document.querySelectorAll('.lens,.drop').forEach(n => n.remove());
  bar.prepend(lens(bar, 'bar', bar.offsetWidth, bar.offsetHeight));
  fab.prepend(lens(fab, 'fab', fab.offsetWidth, fab.offsetHeight));
  const on = bar.querySelector('.tab.on');
  drop = document.createElement('div'); drop.className = 'drop'; drop.style.width = on.offsetWidth + 'px'; drop.style.setProperty('--dx', on.offsetLeft + 'px');
  drop.appendChild(lens(drop, 'drop', on.offsetWidth, 52, 1.16)); bar.appendChild(drop);
  drop.addEventListener('animationend', () => drop.classList.remove('mv'));
  winStart = -1; sync(true);
}
// 每帧：副本里只放底栏附近的几行；按滚动位置整体平移
let winStart = -1, listTop = 0;
function sync(force){
  const sy = window.scrollY, vh = window.innerHeight;
  const bTop = bar.getBoundingClientRect().top;
  const first = Math.max(0, Math.floor((sy + bTop - listTop) / H) - WIN);
  if(first !== winStart || force){
    winStart = first;
    let html = ''; for(let i = first; i < Math.min(N, first + 2*WIN + 3); i++) html += rowHTML(i);
    copies.forEach(c => { c.el.innerHTML = html; c.el.style.width = list.offsetWidth + 'px'; });
  }
  // 先把要读的位置一次读完，再统一写，避免每写一次就重新排版
  const lx = list.getBoundingClientRect().left, rects = new Map();
  copies.forEach(c => { if(!rects.has(c.host)) rects.set(c.host, c.host === drop ? {left: bar.getBoundingClientRect().left + drop.offsetLeft, top: bTop + 5} : c.host.getBoundingClientRect()); });
  copies.forEach(c => { const r = rects.get(c.host); c.el.style.transform = `translate3d(${lx - r.left}px, ${listTop - sy - r.top}px, 0)`; });
}
function measure(){ listTop = list.getBoundingClientRect().top + window.scrollY; }
// 帧率表
let last = performance.now(), frames = [], drops = [];
function loop(now){
  sync(false);
  const dt = now - last; last = now; frames.push(dt); if(frames.length > 60) frames.shift();
  if(dt > 1000/50) drops.push(now); drops = drops.filter(t => now - t < 5000);
  const avg = frames.reduce((a,b)=>a+b,0) / frames.length;
  if(Math.round(now) % 6 === 0) document.getElementById('fps').textContent = `帧率 ${Math.round(1000/avg)}\n5 秒内掉帧 ${drops.length}`;
  requestAnimationFrame(loop);
}
// 交互：液滴
tabs.forEach(t => t.addEventListener('pointerdown', () => { if(t.classList.contains('on')) drop.classList.add('press'); }));
addEventListener('pointerup', () => drop && drop.classList.remove('press'));
addEventListener('pointercancel', () => drop && drop.classList.remove('press'));
tabs.forEach(t => t.addEventListener('click', () => {
  tabs.forEach(x => x.classList.remove('on')); t.classList.add('on');
  drop.classList.remove('mv'); void drop.offsetWidth; drop.classList.add('mv');
  drop.style.setProperty('--dx', t.offsetLeft + 'px');
}));
// 开关
function applyOpt(){
  document.querySelectorAll('.ctl button').forEach(b => b.setAttribute('aria-pressed', String(String(opt[b.dataset.k]) === b.dataset.v)));
  document.body.classList.toggle('nopb', !opt.pb);
  if(opt.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = opt.theme;
  try{ localStorage.setItem('lg-test', JSON.stringify(opt)); }catch(e){}
}
document.querySelectorAll('.ctl button').forEach(b => b.addEventListener('click', () => {
  const k = b.dataset.k; opt[k] = (k === 'theme') ? b.dataset.v : Number(b.dataset.v);
  applyOpt(); if(k === 'rings' || k === 'blur') buildGlass();
}));
addEventListener('resize', () => { measure(); buildGlass(); });
applyOpt(); measure(); buildGlass(); requestAnimationFrame(loop);
</script>
</body>
</html>
