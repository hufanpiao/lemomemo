<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4.0.0 线框</title>
<style>
:root{
  --k:#111;--k2:#333;--g1:#555;--g2:#777;--g3:#999;--g4:#bbb;--g5:#d6d6d6;--g6:#e6e6e6;--g7:#f1f1f1;--w:#fff;
  --page:#e9e9e9;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--k);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.5}
/* 顶部工具条 */
.topbar{position:sticky;top:0;z-index:50;background:var(--w);border-bottom:1px solid var(--g5);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.topbar b{font-size:15px;margin-right:auto}
.tg{display:inline-flex;border:1.5px solid var(--k);border-radius:999px;overflow:hidden}
.tg button{border:0;background:var(--w);padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;color:var(--k)}
.tg button.on{background:var(--k);color:var(--w)}
.toc{padding:8px 16px 0;font-size:12px;color:var(--g1);display:flex;flex-wrap:wrap;gap:4px 10px}
.toc a{color:var(--g1)}
main{padding:16px;max-width:1800px;margin:0 auto}
h1{font-size:22px;margin:8px 0 4px}
h2{font-size:18px;margin:36px 0 10px;padding-top:12px;border-top:2px solid var(--k)}
.lead{color:var(--g1);max-width:820px}
/* 待选项 */
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:12px;margin-top:12px}
.q{background:var(--w);border:1px solid var(--g5);border-radius:12px;padding:12px}
.q h3{margin:0 0 6px;font-size:15px}
.q .ab{display:flex;gap:10px}
.q .ab>div{flex:1;min-width:0}
.q .lab{font-size:12px;font-weight:700;margin-bottom:4px}
.q .rec{margin-top:8px;font-size:13px;background:var(--g7);border-radius:8px;padding:6px 8px}
.mini{height:200px;border:1.5px solid var(--k);border-radius:16px;background:var(--w);padding:8px 7px;position:relative;overflow:hidden;font-size:9px;line-height:1.3}
.mini .bx{background:var(--g6);border-radius:6px;margin-bottom:4px;padding:3px 4px}
.mini .dkb{background:var(--k2);color:var(--w)}
.mini .ln{height:5px;background:var(--g5);border-radius:3px;margin:3px 0}
.mini .nv{position:absolute;left:7px;right:7px;bottom:7px;height:16px;background:var(--k);border-radius:999px}
/* 画面区 */
.shots{display:flex;flex-wrap:wrap;gap:20px 28px;align-items:flex-start}
.shot{margin:0;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;max-width:100%}
.shot.d{flex-direction:column;width:100%}
.shot figcaption{width:230px;font-size:13px;color:var(--k2)}
.shot.d figcaption{width:auto;max-width:900px}
.shot figcaption .st{font-weight:700;color:var(--k);margin-bottom:4px;font-size:14px}
.shot figcaption ol{margin:0;padding-left:18px}
.shot figcaption li{margin-bottom:3px}
.fw{max-width:100%}
body.raw .fw{overflow-x:auto}
.frame{transform-origin:0 0}
body.m-p .shot.d{display:none}
body.m-d .shot.p{display:none}
/* 手机框 */
.ph{width:390px;min-height:844px;background:#fafafa;border:2px solid var(--k);border-radius:46px;position:relative;overflow:hidden;font-size:14px}
.ph .sb{height:48px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;font-size:13px;font-weight:600}
.ph .isl{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:var(--k);border-radius:20px}
.pb{padding:0 16px 120px}
.nav{position:absolute;left:14px;right:14px;bottom:26px;display:flex;gap:10px;align-items:center;z-index:5}
.pill{flex:1;background:var(--k);border-radius:999px;display:flex;padding:5px;gap:2px}
.pill span{flex:1;text-align:center;color:#ccc;padding:10px 0;border-radius:999px;font-size:13px}
.pill span.on{background:var(--w);color:var(--k);font-weight:700}
.fab{width:58px;height:58px;border-radius:50%;background:var(--w);border:2.5px solid var(--k);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:300;position:relative}
.fab small{position:absolute;top:-18px;font-size:10px;color:var(--g1);white-space:nowrap}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--k)}
/* 电脑框 */
.dk{width:1280px;min-height:800px;background:#fafafa;border:2px solid var(--k);border-radius:10px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.tb{height:36px;border-bottom:1px solid var(--g5);display:flex;align-items:center;padding:0 0 0 14px;font-size:12px;color:var(--g1);background:var(--w)}
.tb .wc{margin-left:auto;display:flex}
.tb .wc span{width:46px;text-align:center}
.db{flex:1;display:flex;min-height:0}
.side{width:220px;border-right:1px solid var(--g5);background:var(--w);padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.side.ic{width:72px;align-items:center}
.side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--k2);text-decoration:none;font-size:14px}
.side a.on{background:var(--k);color:var(--w);font-weight:700}
.side a.sub{padding-left:34px;font-size:13px}
.side .sp{flex:1}
.side .kbd{margin-left:auto;font-size:11px;color:var(--g3)}
.side a.on .kbd{color:#bbb}
.newb{border:2px solid var(--k);border-radius:999px;padding:9px 12px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.newb small{margin-left:auto;font-weight:400;font-size:11px;color:var(--g2)}
.dm{flex:1;padding:20px 24px;min-width:0;position:relative}
/* 通用组件 */
.i{display:inline-block;width:16px;height:16px;border-radius:4px;background:var(--g4);flex-shrink:0;vertical-align:-3px}
.ib{width:40px;height:40px;border-radius:50%;background:var(--w);border:1px solid var(--g5);display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.av{background:var(--k);color:var(--w);border:0;font-weight:700}
.hd{display:flex;align-items:flex-start;justify-content:space-between;padding:6px 0 12px}
.h1{font-size:30px;font-weight:800;line-height:1.15}
.h2{font-size:18px;font-weight:700}
.mut{color:var(--g2);font-size:12px}
.mut2{color:var(--g1);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp-b{justify-content:space-between}
.card{background:var(--w);border:1px solid var(--g5);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.card.dk2{background:var(--k);color:var(--w);border-color:var(--k)}
.card.dk2 .mut,.card.dk2 .mut2{color:#bbb}
.card.g{background:var(--g6);border-color:var(--g6)}
.card.dash{border:1.5px dashed var(--g3);background:transparent}
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden;margin:4px 0 12px}
.chip{border:1px solid var(--g4);border-radius:999px;padding:5px 11px;font-size:13px;white-space:nowrap;background:var(--w)}
.chip.on{background:var(--k);color:var(--w);border-color:var(--k)}
.chip.s{padding:2px 8px;font-size:11px}
.chip.dsh{border-style:dashed;color:var(--g2)}
.btn{display:inline-block;border:1.5px solid var(--k);border-radius:999px;padding:7px 14px;font-size:13px;background:var(--w);white-space:nowrap}
.btn.p{background:var(--k);color:var(--w)}
.btn.s{padding:4px 10px;font-size:12px}
.btn.g{border-color:var(--g4);color:var(--g1)}
.btn.w{display:block;text-align:center;padding:12px}
.seg{display:flex;background:var(--g6);border-radius:999px;padding:4px;margin-bottom:12px}
.seg span{flex:1;text-align:center;padding:7px 0;border-radius:999px;font-size:13px;color:var(--g1)}
.seg span.on{background:var(--k);color:var(--w);font-weight:700}
.li{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--g6)}
.li:last-child{border-bottom:0}
.cb{width:22px;height:22px;border-radius:50%;border:2px solid var(--g2);flex-shrink:0;margin-top:1px}
.cb.done{background:var(--k);border-color:var(--k);position:relative}
.cb.done:after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--w);border-width:0 2px 2px 0;transform:rotate(45deg)}
.ttl{font-weight:600}
.del{text-decoration:line-through;color:var(--g2)}
.sec{font-size:12px;font-weight:700;color:var(--g1);margin:12px 0 4px;letter-spacing:.5px}
.ev{border-radius:14px;background:var(--g6);padding:10px 12px;margin-bottom:8px;display:flex;gap:12px;border-left:5px solid var(--g1)}
.ev.b{border-left-color:var(--k)}
.ev.c{border-left-color:var(--g4)}
.ev .tm{font-weight:800;font-size:15px;min-width:46px}
.img{background:linear-gradient(to top right,transparent calc(50% - 1px),var(--g3) 50%,transparent calc(50% + 1px)),linear-gradient(to top left,transparent calc(50% - 1px),var(--g3) 50%,transparent calc(50% + 1px)),var(--g5);border-radius:12px;display:flex;align-items:flex-end;justify-content:flex-end;padding:4px 6px;font-size:11px;color:var(--g1)}
.big{font-size:44px;font-weight:800;line-height:1}
.num{font-size:26px;font-weight:800;line-height:1;text-align:right;min-width:52px}
.num small{font-size:12px;font-weight:600}
.badge{display:inline-block;font-size:10px;border:1px solid var(--k);border-radius:4px;padding:0 3px;line-height:14px;font-weight:700;background:var(--w)}
.badge.f{background:var(--k);color:var(--w)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.38);z-index:8}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--w);border-radius:28px 28px 0 0;padding:10px 18px 34px;z-index:9;box-shadow:0 -6px 24px rgba(0,0,0,.15)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--g4);margin:0 auto 12px}
.toast{position:absolute;left:14px;right:14px;bottom:100px;background:var(--k);color:var(--w);border-radius:16px;padding:12px 14px;z-index:7;display:flex;align-items:center;gap:8px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.toast .a{border:1px solid #888;border-radius:999px;padding:3px 10px;white-space:nowrap}
.field{border:1px solid var(--g4);border-radius:12px;padding:10px 12px;background:var(--w);margin-bottom:10px}
.field .mut{display:block;margin-bottom:2px}
.sw{width:42px;height:24px;border-radius:12px;background:var(--g4);position:relative;flex-shrink:0}
.sw:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:var(--w);top:2px;left:2px}
.sw.on{background:var(--k)}
.sw.on:after{left:20px}
.set{background:var(--w);border:1px solid var(--g5);border-radius:16px;margin-bottom:12px;overflow:hidden}
.set .r{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--g6);font-size:14px}
.set .r:last-child{border-bottom:0}
.set .r .v{margin-left:auto;color:var(--g2);font-size:13px;text-align:right}
.set .r.off{color:var(--g3)}
.gt{font-size:12px;color:var(--g1);font-weight:700;margin:14px 4px 6px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 22px;padding:0 24px}
.pad span{height:64px;border-radius:50%;border:1.5px solid var(--g4);display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--w)}
.pad span.n{border:0;background:transparent;font-size:14px}
.dots{display:flex;gap:16px;justify-content:center;margin:18px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--k)}
.dots i.f{background:var(--k)}
.kb{position:absolute;left:0;right:0;bottom:0;height:290px;background:var(--g6);border-top:1px solid var(--g5);z-index:6;padding:8px 4px;display:grid;grid-template-columns:repeat(10,1fr);gap:8px 5px;align-content:start}
.kb span{height:40px;background:var(--w);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px}
.wave{display:flex;align-items:center;gap:3px;height:60px;justify-content:center}
.wave i{width:4px;border-radius:2px;background:var(--k)}
.hl{background:var(--g5);font-weight:700;border-radius:3px;padding:0 2px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr)}
.mc{border-top:1px solid var(--g6);padding:3px 2px 2px;min-height:72px;text-align:center;position:relative}
.mc .dn{font-size:15px;font-weight:700}
.mc .lu{font-size:10px;color:var(--g2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .lu.hd2{color:var(--k);font-weight:700}
.mc.o .dn,.mc.o .lu{color:var(--g4)}
.mc .dt{display:flex;gap:2px;justify-content:center;align-items:center;height:16px}
.mc .dt i{width:5px;height:5px;border-radius:50%;background:var(--g1)}
.mc .dt i.l{background:var(--g4)}
.mc .bd{position:absolute;top:2px;right:2px}
.mc.sel .dn{background:var(--k);color:var(--w);border-radius:50%;width:26px;height:26px;line-height:26px;margin:0 auto}
.wk{font-size:11px;color:var(--g2);text-align:center;padding:4px 0}
.note{font-size:11px;color:var(--g1);background:var(--g7);border:1px dashed var(--g3);border-radius:8px;padding:4px 8px;margin:6px 0}
.ban{background:var(--g1);color:var(--w);font-size:13px;padding:8px 14px;border-radius:12px;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.ms{columns:2;column-gap:10px}
.ms .card{break-inside:avoid;padding:10px 12px;border-radius:16px;margin-bottom:10px}
.ms3{columns:3;column-gap:12px}
.ms3 .card{break-inside:avoid;padding:12px;border-radius:16px}
.pk{display:flex;gap:6px;background:var(--g7);border-radius:14px;padding:6px;position:relative}
.pk>div{flex:1;text-align:center}
.pk>div div{padding:5px 0;color:var(--g3);font-size:14px}
.pk>div div.on{color:var(--k);font-weight:800;font-size:16px;background:var(--w);border-radius:8px}
.tl{position:relative;border-left:1px solid var(--g5);margin-left:42px;padding-left:10px}
.tl .h{position:absolute;left:-44px;font-size:11px;color:var(--g2)}
.phd{position:absolute;left:-46px;right:0;height:2px;background:var(--k)}
.phd b{position:absolute;right:0;top:-10px;background:var(--k);color:var(--w);font-size:11px;padding:1px 7px;border-radius:999px}
.phd:before{content:"";position:absolute;left:40px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--k)}
.cols{display:flex;gap:16px;align-items:flex-start}
.cols>div{flex:1;min-width:0}
.wg{display:grid;grid-template-columns:56px repeat(7,1fr);border:1px solid var(--g5);border-radius:14px;overflow:hidden;background:var(--w)}
.wg>div{border-right:1px solid var(--g6);border-bottom:1px solid var(--g6);position:relative}
.wg .hc{padding:6px;text-align:center;font-size:12px}
.wg .hc b{display:block;font-size:18px}
.wg .hc.on b{background:var(--k);color:var(--w);border-radius:50%;width:32px;height:32px;line-height:32px;margin:0 auto}
.wg .slot{height:46px}
.wg .tm2{font-size:11px;color:var(--g2);padding:2px 6px;height:46px}
.wev{position:absolute;left:4px;right:4px;background:var(--g6);border-left:4px solid var(--g1);border-radius:8px;padding:3px 6px;font-size:11px;z-index:2;overflow:hidden}
.wev.b{border-left-color:var(--k)}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--w);border-radius:22px;padding:20px 22px;z-index:9;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.kd{display:inline-block;border:1px solid var(--g4);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px;background:var(--w);color:var(--g1)}
.desk-bg{flex:1;background:repeating-linear-gradient(45deg,#e2e2e2 0 12px,#dadada 12px 24px);display:flex;align-items:center;justify-content:center;gap:60px}
.win{width:480px;height:600px;background:var(--w);border:1.5px solid var(--k);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden}
.win .tb{height:32px}
.win .wb{flex:1;padding:26px 36px}
.code{display:flex;gap:8px}
.code span{flex:1;height:52px;border:1.5px solid var(--g4);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;background:var(--w)}
.code span.c{border-color:var(--k)}
.logo{width:64px;height:64px;border-radius:18px;background:var(--k);margin:0 auto 10px}
.ctr{text-align:center}
</style>
</head>
<body class="m-p">
<div class="topbar">
  <b>日程与待办 4.0.0 · 黑白灰线框（讨论用）</b>
  <div class="tg" id="mode"><button data-m="p" class="on">手机 390</button><button data-m="d">电脑 1280</button></div>
  <div class="tg" id="fit"><button data-f="fit" class="on">适应屏宽</button><button data-f="raw">原尺寸</button></div>
</div>
<div class="toc" id="toc"></div>
<main>
<h1>4.0.0 线框（第二轮）</h1>
<p class="lead">按会议纪要第十一至十三节的决定画，只表达“放什么、在哪里、怎么操作”，不代表最终的颜色、字体和皮肤。黑色块＝选中或最重要，灰色＝次要。示例日期固定为 2026 年 10 月 24 日（周六）14:15，人在首尔。点上方按钮可以切换手机版和电脑版，在窄屏上选“适应屏宽”会自动缩放；选“原尺寸”可以横向滚动。</p>

<h2 id="q">拿不准、需要产品负责人选的地方（8 条）</h2>
<p class="lead">每条左边是 A，右边是 B；下面的线框里一律按“推荐”那种画。</p>
<div class="qs" id="qs"></div>

<div id="screens"></div>
</main>

<script>
/* ---------- 小图标 ---------- */
const LOCK='<svg width="14" height="14" viewBox="0 0 14 14" style="vertical-align:-2px"><rect x="2" y="6" width="10" height="7" rx="2" fill="currentColor"/><path d="M4.5 6V4.5a2.5 2.5 0 0 1 5 0V6" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>';
const CAKE='<svg width="12" height="12" viewBox="0 0 12 12" style="vertical-align:-1px"><rect x="1.5" y="6" width="9" height="5" rx="1.2" fill="currentColor"/><rect x="5.3" y="2.5" width="1.4" height="3" fill="currentColor"/><circle cx="6" cy="1.6" r="1" fill="currentColor"/></svg>';
const SRCH='<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.8"/></svg>';
const MIC='<svg width="22" height="22" viewBox="0 0 22 22"><rect x="7.5" y="2" width="7" height="12" rx="3.5" fill="currentColor"/><path d="M4.5 10.5a6.5 6.5 0 0 0 13 0M11 17v3" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>';
const BELL='<svg width="11" height="11" viewBox="0 0 12 12" style="vertical-align:-1px"><path d="M2.5 9h7L8.5 7.5V5a2.5 2.5 0 0 0-5 0v2.5z" fill="currentColor"/><circle cx="6" cy="10.5" r="1" fill="currentColor"/></svg>';

/* ---------- 框 ---------- */
function nav(a){const t=['今天','日历','待办','随手记'];return `<div class="nav"><div class="pill">${t.map(x=>`<span class="${x===a?'on':''}">${x}</span>`).join('')}</div><div class="fab"><small>长按说话</small>＋</div></div>`}
function ph(body,o={}){return `<div class="frame ph" style="${o.h?'min-height:'+o.h+'px':''}"><div class="isl"></div><div class="sb"><span>14:15</span><span>●●● 5G ▮</span></div><div class="pb">${body}</div>${o.nav===false?'':nav(o.nav||'今天')}${o.over||''}<div class="home"></div></div>`}
function hdr(t,sub,extra){return `<div class="hd"><div><div class="h1">${t}</div>${sub?`<div class="mut2">${sub}</div>`:''}</div><div class="row">${extra||''}<span class="ib">${SRCH}</span><span class="ib av">胡</span></div></div>`}
function side(a,ic){const it=[['今天','',''],['日历','',''],['待办','',''],['随手记','',''],['隐私记',LOCK,'sub']];

const lunN=['','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
function monthCells(big){
  const cells=[];
  [28,29,30].forEach((d,i)=>cells.push({d,o:1,lu:lunN[18+i]}));
  for(let d=1;d<=31;d++){let lu=d<=9?lunN[20+d]:(d===10?'九月':lunN[d-9]);cells.push({d,lu})}
  cells.push({d:1,o:1,lu:'廿三'});
  const sp={1:['国庆节','休'],2:[null,'休'],3:['개천절','休韩'],4:[null,'休'],5:['대체공휴일','休韩'],6:[null,'休'],7:[null,'休'],9:['한글날','韩'],18:['重阳',''],23:['霜降','']};
  const dots={6:2,13:1,19:1,20:2,22:1,23:1,24:3,25:1,27:2,29:1,30:1};
  const cake={26:'김지우',31:'妈妈'};
  const titles={20:['14:00 NEOX 脚本评审'],22:['截止 SignPlex 韩文版'],24:['13:00 NEOX 横版对片','15:30 SignPlex 反馈会','截止 NEOX 竖版 4K'],25:['10:00 SOIL 现场踩点'],27:['10:00 SignPlex 周会','16:00 NEOX 调色'],30:['截止 SignPlex 字幕']};
  return cells.map(c=>{
    if(c.o) return `<div class="mc o"${big?' style="min-height:104px;text-align:left;padding:6px"':''}><div class="dn">${c.d}</div><div class="lu">${c.lu}</div></div>`;
    const s=sp[c.d];let lu=c.lu,cls='';let bd='';
    if(s&&s[0]){lu=s[0];cls='hd2'}
    if(s&&s[1]){bd=`<span class="bd">${s[1].includes('休')?'<span class="badge f">休</span>':''}${s[1].includes('韩')?'<span class="badge">韩</span>':''}</span>`}
    const n=dots[c.d]||0;let dt='';
    if(!big){for(let i=0;i<Math.min(n,3);i++)dt+=`<i class="${i===2?'l':''}"></i>`;if(cake[c.d])dt+=CAKE;}
    let tt='';
    if(big){(titles[c.d]||[]).slice(0,2).forEach(t=>tt+=`<div style="font-size:11px;background:#eee;border-radius:4px;padding:0 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t}</div>`);
      if((titles[c.d]||[]).length>2)tt+=`<div class="mut" style="font-size:10px">+${titles[c.d].length-2} 项</div>`;
      if(cake[c.d])tt+=`<div style="font-size:11px">${CAKE} ${cake[c.d]}生日</div>`;}
    const sel=c.d===24?' sel':'';
    if(big) return `<div class="mc${sel}" style="min-height:104px;text-align:left;padding:6px"><div class="row" style="gap:6px"><div class="dn" style="${c.d===24?'margin:0':''}">${c.d}</div><div class="lu ${cls}">${lu}</div>${bd.replace('class="bd"','style="margin-left:auto"')}</div>${tt}</div>`;
    return `<div class="mc${sel}"><div class="dn">${c.d}</div><div class="lu ${cls}">${lu}</div><div class="dt">${bd.replace('class="bd"','')}${dt}</div></div>`;
  }).join('');
}

/* ---------- 切换与缩放 ---------- */
function fit(){
  const raw=document.body.classList.contains('raw');
  document.querySelectorAll('.shot').forEach(sh=>{
    if(getComputedStyle(sh).display==='none')return;
    const fw=sh.querySelector('.fw'),fr=fw.querySelector('.frame');
    fr.style.transform='';fw.style.height='';fw.style.width='';
    if(raw)return;
    const isD=sh.classList.contains('d');
    const avail=isD?sh.parentElement.clientWidth:Math.min(sh.parentElement.clientWidth,document.documentElement.clientWidth-32);
    const w=fr.offsetWidth,h=fr.offsetHeight;
    const s=Math.min(1,avail/w);
    if(s<1){fr.style.transform=`scale(${s})`;fw.style.height=h*s+'px';fw.style.width=w*s+'px'}
  });
}
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b));
  document.body.classList.toggle('m-p',b.dataset.m==='p');document.body.classList.toggle('m-d',b.dataset.m==='d');fit()});
document.querySelectorAll('#fit button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#fit button').forEach(x=>x.classList.toggle('on',x===b));
  document.body.classList.toggle('raw',b.dataset.f==='raw');fit()});
window.addEventListener('resize',fit);
window.addEventListener('load',fit);fit();
